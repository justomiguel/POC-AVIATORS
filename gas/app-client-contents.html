<script>
(function (A) {
  var S = A.state;
  var i18n = A.i18n;
  var i18nFmt = A.i18nFmt;

  function contentsRpcError_(err, scope, options) {
    var o = options || {};
    var msg = A.reportRpcError(err, {
      scope: scope,
      fallbackKey: o.fallbackKey || 'err_generic',
      hideModal: o.hideModal !== false,
      toast: o.toast !== false,
      setStatus: o.setStatus,
    });
    if (o.editorStatus) contentsSetEditorStatus(msg, true);
    return msg;
  }

  var btnGotoAgentsTab = document.getElementById('btn-goto-agents-tab');
  var contentsScreenList = document.getElementById('contents-screen-list');
  var contentsScreenEditor = document.getElementById('contents-screen-editor');
  var contentsEditorReadonlyBanner = document.getElementById('contents-editor-readonly-banner');
  var contentsViewDriveBtn = document.getElementById('contents-view-drive-btn');
  var contentsEditBtn = document.getElementById('contents-edit-btn');
  var contentsReextractBtn = document.getElementById('contents-reextract-btn');
  var contentsBackBtn = document.getElementById('contents-back-btn');

  var contentsEditorSubtitle = document.getElementById('contents-editor-subtitle');
  var contentsStep1 = document.getElementById('contents-step-1');
  var contentsStep2 = document.getElementById('contents-step-2');
  var contentsStep3 = document.getElementById('contents-step-3');
  var contentsBlockType = document.getElementById('contents-block-type');
  var contentsBlockIndustry = document.getElementById('contents-block-industry');
  var contentsEntryIndustry = document.getElementById('contents-entry-industry');

  var contentsMappingBrowseBtn = document.getElementById('contents-mapping-browse-btn');
  var contentsMappingFileInput = document.getElementById('contents-mapping-file-input');
  var contentsMappingStatus = document.getElementById('contents-mapping-status');
  var contentsSimilarReviewModal = document.getElementById('contents-similar-review-modal');
  var contentsSimilarReviewList = document.getElementById('contents-similar-review-list');
  var contentsSimilarReviewKeepAll = document.getElementById('contents-similar-review-keep-all');
  var contentsSimilarReviewDeleteSelected = document.getElementById(
    'contents-similar-review-delete-selected',
  );
  var contentsBlockForm = document.getElementById('contents-block-form');
  var contentsCurrentFileName = document.getElementById('contents-current-file-name');
  var contentsReplaceFileBtn = document.getElementById('contents-replace-file-btn');
  var contentsNewBtn = document.getElementById('contents-new-btn');
  var contentsFilterType = document.getElementById('contents-filter-type');

  var contentsPagination = document.getElementById('contents-pagination');
  var contentsPageInfo = document.getElementById('contents-page-info');
  var contentsPageSizeSelect = document.getElementById('contents-page-size');
  var contentsPrevBtn = document.getElementById('contents-prev-btn');
  var contentsNextBtn = document.getElementById('contents-next-btn');
  var contentsTableBody = document.getElementById('contents-table-body');
  var contentsListStatus = document.getElementById('contents-list-status');
  var contentsListLoader = document.getElementById('contents-list-loader');
  var contentsListLoaderMsg = document.getElementById('contents-list-loader-msg');
  var contentsProgressWrap = document.getElementById('contents-progress-wrap');
  var contentsProgressMsg = document.getElementById('contents-progress-msg');
  var contentsDropzone = document.getElementById('contents-dropzone');
  var contentsUploading = document.getElementById('contents-uploading');
  var contentsUploadingMsg = document.getElementById('contents-uploading-msg');
  var contentsUploadingFile = document.getElementById('contents-uploading-file');
  var contentsCancelUploadBtn = document.getElementById('contents-cancel-upload-btn');
  var contentsContentId = document.getElementById('contents-content-id');
  var contentsType = document.getElementById('contents-type');
  var contentsBrowseBtn = document.getElementById('contents-browse-btn');
  var contentsFileInput = document.getElementById('contents-file-input');
  var contentsTitle = document.getElementById('contents-title');
  var contentsSummary = document.getElementById('contents-summary');
  var contentsCommonClient = document.getElementById('contents-common-client');
  var contentsClient = document.getElementById('contents-client');
  var contentsClientNew = document.getElementById('contents-client-new');
  var contentsClientNewWrap = document.getElementById('contents-client-new-wrap');
  var contentsClientToggleNew = document.getElementById('contents-client-toggle-new');
  var contentsTagsChips = document.getElementById('contents-tags-chips');
  var contentsTagInput = document.getElementById('contents-tag-input');
  var contentsTagSuggestions = document.getElementById('contents-tag-suggestions');
  var contentsAddTagBtn = document.getElementById('contents-add-tag-btn');
  var contentsSpecificProposal = document.getElementById('contents-specific-proposal');
  var contentsSpecificSuccess = document.getElementById('contents-specific-success');
  var contentsSpecificClient = document.getElementById('contents-specific-client');
  var contentsSpecificOnboarding = document.getElementById('contents-specific-onboarding');
  var contentsProposalMaterialKind = document.getElementById('contents-proposal-material-kind');
  var contentsProposalTopic = document.getElementById('contents-proposal-topic');
  var contentsProposalStudioWrap = document.getElementById('contents-proposal-studio-wrap');
  var contentsProposalStudio = document.getElementById('contents-proposal-studio');
  var contentsProposalOfferingWrap = document.getElementById('contents-proposal-offering-wrap');
  var contentsProposalOffering = document.getElementById('contents-proposal-offering');
  var contentsProposalStageWrap = document.getElementById('contents-proposal-stage-wrap');
  var contentsProposalStage = document.getElementById('contents-proposal-stage');
  var contentsProposalPricingWrap = document.getElementById('contents-proposal-pricing-wrap');
  var contentsProposalPricing = document.getElementById('contents-proposal-pricing');
  var contentsProposalEffortWrap = document.getElementById('contents-proposal-effort-wrap');
  var contentsProposalEffort = document.getElementById('contents-proposal-effort');
  var contentsProposalNotes = document.getElementById('contents-proposal-notes');
  var contentsSuccessIndustry = document.getElementById('contents-success-industry');
  var contentsSuccessChallenge = document.getElementById('contents-success-challenge');
  var contentsSuccessSolution = document.getElementById('contents-success-solution');
  var contentsSuccessImpact = document.getElementById('contents-success-impact');
  var contentsSuccessNotes = document.getElementById('contents-success-notes');
  var contentsClientStatus = document.getElementById('contents-client-status');
  var contentsClientProjects = document.getElementById('contents-client-projects');
  var contentsClientHealth = document.getElementById('contents-client-health');
  var contentsClientNotes = document.getElementById('contents-client-notes');
  var contentsOnboardingTopic = document.getElementById('contents-onboarding-topic');
  var contentsOnboardingCategory = document.getElementById('contents-onboarding-category');
  var contentsOnboardingAudience = document.getElementById('contents-onboarding-audience');
  var contentsOnboardingNotes = document.getElementById('contents-onboarding-notes');
  var contentsSaveBtn = document.getElementById('contents-save-btn');
  var contentsDeleteBtn = document.getElementById('contents-delete-btn');

  function contentsSetListBusy(on, msg) {
    var busy = !!on;
    if (contentsListLoader) contentsListLoader.classList.toggle('hidden', !busy);
    if (contentsListLoaderMsg) contentsListLoaderMsg.textContent = busy ? msg || '' : '';
    if (contentsFilterType) contentsFilterType.disabled = busy;
    if (contentsFilterQ) contentsFilterQ.disabled = busy;
    if (contentsPageSizeSelect) contentsPageSizeSelect.disabled = busy;
    contentsUpdatePager_();
  }

  function contentsSetEditorBusy(on, msg) {
    var busy = !!on;
    if (contentsProgressWrap) contentsProgressWrap.classList.toggle('hidden', !busy);
    if (contentsProgressMsg) contentsProgressMsg.textContent = busy ? msg || '' : '';
    if (contentsBackBtn) contentsBackBtn.disabled = busy;
    if (contentsType) contentsType.disabled = busy;
    if (contentsBrowseBtn) contentsBrowseBtn.disabled = busy;
    if (contentsFileInput) contentsFileInput.disabled = busy;
    if (contentsReplaceFileBtn) contentsReplaceFileBtn.disabled = busy;
    if (contentsReextractBtn) contentsReextractBtn.disabled = busy;
    if (contentsSaveBtn) contentsSaveBtn.disabled = busy;
    if (contentsDeleteBtn) contentsDeleteBtn.disabled = busy;
    if (contentsCancelBtn) contentsCancelBtn.disabled = busy;
  }

  function contentsSetEditorStatus(msg, isErr) {
    if (!contentsEditorStatus) return;
    contentsEditorStatus.textContent = msg || '\u00a0';
    contentsEditorStatus.classList.toggle('err', !!isErr);
  }

  function contentsSetListStatus(msg, isErr) {
    if (!contentsListStatus) return;
    contentsListStatus.textContent = msg || '\u00a0';
    contentsListStatus.classList.toggle('err', !!isErr);
  }

  function contentsSetRowBusy(contentId, busy) {
    S.set('contentsRowBusyId', busy ? String(contentId || '').trim() : '');
    contentsRenderTable();
  }

  function contentsSetScreen(mode) {
    var isList = mode === 'list';
    if (contentsScreenList) contentsScreenList.classList.toggle('hidden', !isList);
    if (contentsScreenEditor) contentsScreenEditor.classList.toggle('hidden', isList);
  }

  function contentsScrollListToTop_() {
    var scrollArea = document.querySelector('.app-content-scroll');
    if (scrollArea) scrollArea.scrollTop = 0;
  }

  function contentsReturnToList_(opts) {
    var o = opts || {};
    contentsResetForm();
    contentsSetScreen('list');
    contentsScrollListToTop_();
    if (o.reload !== false) {
      contentsLoadList({ resetSkip: true, skipCache: !!o.skipCache });
    }
    if (o.statusKey) {
      contentsSetListStatus(i18n(o.statusKey), !!o.statusIsErr);
    }
  }

  function contentsCanViewDetail_() {
    return !!S.get('canViewCatalog');
  }

  function contentsIsEditorReadonly_() {
    return contentsCanViewDetail_() && !S.get('canWriteContents');
  }

  function contentsTableColSpan_() {
    if (S.get('canWriteContents')) return 7;
    if (contentsCanViewDetail_()) return 6;
    return 5;
  }

  function contentsSetEditorMode(mode) {
    var isEdit = mode === 'edit';
    var isView = mode === 'view';
    var titleKey = isView
      ? 'contents_editor_title_view'
      : isEdit
        ? 'contents_editor_title_edit'
        : 'contents_editor_title_new';
    var subtitleKey = isView
      ? 'contents_editor_subtitle_view'
      : isEdit
        ? 'contents_editor_subtitle_edit'
        : 'contents_editor_subtitle_new';
    if (contentsEditorTitle) {
      contentsEditorTitle.setAttribute('data-i18n', titleKey);
      contentsEditorTitle.textContent = i18n(titleKey);
    }
    if (contentsEditorSubtitle) {
      contentsEditorSubtitle.setAttribute('data-i18n', subtitleKey);
      contentsEditorSubtitle.textContent = i18n(subtitleKey);
    }
    if (contentsDeleteBtn) contentsDeleteBtn.classList.toggle('hidden', !isEdit || isView);
  }

  function contentsTypeFichaMeta_(type) {
    var t = String(type || '').trim();
    var icons = {
      proposal: 'fa-file-invoice',
      success_case: 'fa-trophy',
      client: 'fa-building',
      onboarding: 'fa-graduation-cap',
    };
    var labels = {
      proposal: i18n('contents_type_proposal'),
      success_case: i18n('contents_type_success_case'),
      client: i18n('contents_type_client'),
      onboarding: i18n('contents_type_onboarding'),
    };
    return {
      icon: icons[t] || 'fa-file-lines',
      label: labels[t] || t || i18n('label_em_dash'),
    };
  }

  function contentsUpdateEditBtn_() {
    if (!contentsEditBtn) return;
    var hasId = !!String(S.get('contentsSelectedId') || '').trim();
    var ro = !!S.get('contentsEditorReadonly');
    var show = !!S.get('canWriteContents') && hasId && ro;
    contentsEditBtn.classList.toggle('hidden', !show);
  }

  function contentsUpdateReextractBtn_() {
    if (!contentsReextractBtn) return;
    var hasId = !!String(S.get('contentsSelectedId') || '').trim();
    var canWrite = !!S.get('canWriteContents');
    var ro = !!S.get('contentsEditorReadonly');
    var common = S.get('contentsCurrentCommon') || {};
    var show = canWrite && hasId && !ro && contentsCanShowPdfBtn_(common);
    contentsReextractBtn.classList.toggle('hidden', !show);
  }

  function contentsSyncFichaReadonlyUi_() {
    var ro = !!S.get('contentsEditorReadonly');
    var hero = document.getElementById('contents-ficha-hero');
    if (hero) hero.classList.toggle('hidden', !ro);
    if (!ro) return;

    var type = contentsType ? contentsType.value : '';
    var meta = contentsTypeFichaMeta_(type);
    var badge = document.getElementById('contents-ficha-type-badge');
    if (badge) {
      badge.dataset.type = type;
      badge.innerHTML =
        '<i class="fa-solid ' +
        meta.icon +
        '" aria-hidden="true"></i><span>' +
        meta.label +
        '</span>';
    }
    var titleEl = document.getElementById('contents-ficha-title');
    if (titleEl) titleEl.textContent = (contentsTitle && contentsTitle.value) || '';
    var summaryEl = document.getElementById('contents-ficha-summary');
    if (summaryEl) {
      var sum = contentsSummary ? String(contentsSummary.value || '').trim() : '';
      summaryEl.textContent = sum;
      summaryEl.classList.toggle('hidden', !sum);
    }
    var metaDl = document.getElementById('contents-ficha-meta');
    if (metaDl) {
      metaDl.innerHTML = '';
      var fr = A.fichaReadonly;
      if (contentsUsesClientFields_(type) && contentsClient) {
        var clientLabel =
          contentsClient.options[contentsClient.selectedIndex];
        var clientVal = clientLabel
          ? String(clientLabel.textContent || '').trim()
          : '';
        if (fr) fr.appendMeta(metaDl, i18n('contents_lbl_client'), clientVal, 'fa-building');
      }
      if (contentsUsesClientFields_(type) && type !== 'success_case') {
        var indVal = String(S.get('contentsDetectedIndustry') || '').trim();
        if (fr && indVal) fr.appendMeta(metaDl, i18n('contents_lbl_industry'), indVal, 'fa-industry');
      }
      if (contentsCurrentFileName) {
        var fn = String(contentsCurrentFileName.textContent || '').trim();
        if (fr) fr.appendMeta(metaDl, i18n('contents_current_file_label'), fn, 'fa-file-pdf');
      }
    }
    var fileChip = document.getElementById('contents-ficha-file-chip');
    if (fileChip) fileChip.classList.add('hidden');
    var tagsWrap = document.getElementById('contents-ficha-tags');
    if (tagsWrap) {
      tagsWrap.innerHTML = '';
      var tags = S.get('contentsCurrentTags') || [];
      if (tags.length) {
        tagsWrap.classList.remove('hidden');
        for (var ti = 0; ti < tags.length; ti++) {
          var tag = String(tags[ti] || '').trim();
          if (!tag) continue;
          var sp = document.createElement('span');
          sp.className = 'contents-ficha-tag';
          sp.textContent = tag;
          tagsWrap.appendChild(sp);
        }
      } else {
        tagsWrap.classList.add('hidden');
      }
    }
    if (hero) {
      hero.classList.remove(
        'ficha-hero--proposal',
        'ficha-hero--success_case',
        'ficha-hero--client',
        'ficha-hero--onboarding',
      );
      if (type) hero.classList.add('ficha-hero--' + type);
    }
    var decoIcon = document.getElementById('contents-ficha-hero-deco-icon');
    if (decoIcon) {
      decoIcon.className = 'fa-solid ' + meta.icon;
    }

    var formRoot = document.getElementById('contents-block-form');
    if (A.fichaReadonly && formRoot) {
      A.fichaReadonly.hideEmptyFields(formRoot);
      A.fichaReadonly.syncTextareas(formRoot);
    }
  }

  function contentsSetEditorReadonly(on) {
    var ro = !!on;
    var canWrite = !!S.get('canWriteContents');
    S.set('contentsEditorReadonly', ro);
    if (contentsScreenEditor) {
      contentsScreenEditor.classList.toggle('contents-editor-readonly', ro);
    }
    if (contentsEditorReadonlyBanner) {
      contentsEditorReadonlyBanner.classList.toggle('hidden', !ro || canWrite);
    }
    var stepper = document.getElementById('contents-stepper');
    if (stepper) stepper.classList.toggle('hidden', ro);
    if (contentsProgressWrap) contentsProgressWrap.classList.add('hidden');
    var writeIds = [
      'contents-save-btn',
      'contents-delete-btn',
      'contents-replace-file-btn',
      'contents-add-tag-btn',
      'contents-client-toggle-new',
      'contents-cancel-btn',
    ];
    for (var wi = 0; wi < writeIds.length; wi++) {
      var el = document.getElementById(writeIds[wi]);
      if (el) el.classList.toggle('hidden', ro);
    }
    if (contentsTagInput) {
      contentsTagInput.disabled = ro;
      contentsTagInput.closest('label') &&
        contentsTagInput.closest('label').classList.toggle('hidden', ro);
    }
    var fields = document.querySelectorAll(
      '#contents-block-form input, #contents-block-form select, #contents-block-form textarea, #contents-block-type input, #contents-block-type select, #contents-block-type textarea',
    );
    for (var fi = 0; fi < fields.length; fi++) {
      fields[fi].disabled = ro;
    }
    if (contentsType && ro) contentsType.disabled = true;
    contentsRenderTagsChips();
    contentsSyncFichaReadonlyUi_();
    contentsUpdateEditBtn_();
    contentsUpdateReextractBtn_();
  }

  function contentsCanShowPdfBtn_(common) {
    var c = common || {};
    var contentId = String(c.content_id || '').trim();
    if (!contentId) return false;
    var driveFileId = String(c.drive_file_id || '').trim();
    var directUrl = String(c.drive_file_url || '').trim();
    if (driveFileId || directUrl) return true;
    var ct = String(c.content_type || '').trim();
    if (ct === 'proposal' || ct === 'success_case') return true;
    var fileName = String(c.file_name || '').trim();
    return /\.pdf$/i.test(fileName);
  }

  function contentsUpdateViewDriveBtn_(common) {
    if (!contentsViewDriveBtn) return;
    var c = common || S.get('contentsCurrentCommon') || {};
    var driveFileId = String(c.drive_file_id || '').trim();
    var directUrl = String(c.drive_file_url || '').trim();
    var show = contentsCanShowPdfBtn_(c);
    contentsViewDriveBtn.classList.toggle('hidden', !show);
    if (!show) return;
    contentsViewDriveBtn.onclick = function () {
      var openDirect = directUrl;
      if (!openDirect && driveFileId) {
        openDirect =
          'https://drive.google.com/open?id=' + encodeURIComponent(driveFileId);
      }
      if (openDirect) {
        window.open(openDirect, '_blank', 'noopener,noreferrer');
        return;
      }
      var contentId = String(
        c.content_id || (contentsContentId && contentsContentId.value) || '',
      ).trim();
      if (A.showBlockingModal) A.showBlockingModal(i18n('chat_ref_resolving_link'));
      google.script.run
        .withSuccessHandler(function (res) {
          if (A.hideBlockingModal) A.hideBlockingModal();
          if (res && res.openUrl) {
            window.open(res.openUrl, '_blank', 'noopener,noreferrer');
            return;
          }
          if (A.toast) A.toast.error(i18n('err_pdf_not_available'));
        })
        .withFailureHandler(function (e) {
          if (A.hideBlockingModal) A.hideBlockingModal();
          A.reportRpcError(e, {
            scope: 'contentsOpenUrl',
            fallbackKey: 'err_pdf_not_available',
            modal: true,
            toast: true,
          });
        })
        .chatReferenceOpenUrl(
          JSON.stringify({
            contentId: contentId,
            driveFileId: driveFileId,
            url: directUrl,
          }),
        );
    };
  }

  function contentsSetStep(activeStep, completedThrough) {
    var steps = [contentsStep1, contentsStep2, contentsStep3];
    for (var i = 0; i < steps.length; i++) {
      var el = steps[i];
      if (!el) continue;
      el.classList.remove('is-active', 'is-done');
      if (i + 1 < (completedThrough || 0) + 1 && i + 1 !== activeStep) el.classList.add('is-done');
      if (i + 1 === activeStep) el.classList.add('is-active');
    }
  }

  function contentsGetExternalUrl_() {
    return contentsExternalUrl ? String(contentsExternalUrl.value || '').trim() : '';
  }

  function contentsNormalizeMappingFileName_(name) {
    return String(name || '')
      .trim()
      .toLowerCase()
      .replace(/\\/g, '/')
      .split('/')
      .pop();
  }

  /**
   * @param {string} text
   * @return {Object<string,string>}
   */
  function contentsParseExternalUrlMappingText_(text) {
    var map = {};
    var data = JSON.parse(String(text || '{}'));
    var cases = [];
    if (data && Array.isArray(data.cases)) cases = data.cases;
    else if (Array.isArray(data)) cases = data;
    var ci;
    for (ci = 0; ci < cases.length; ci++) {
      var row = cases[ci] || {};
      var fileName = String(row.fileName || row.file_name || '').trim();
      var url = String(row.externalUrl || row.external_url || row.url || '').trim();
      if (!fileName || !url) continue;
      var key = contentsNormalizeMappingFileName_(fileName);
      map[key] = url;
    }
    return map;
  }

  function contentsSetExternalUrlMapping_(map) {
    S.set('contentsExternalUrlByFile', map || {});
    var count = 0;
    var k;
    for (k in map) {
      if (Object.prototype.hasOwnProperty.call(map, k)) count++;
    }
    if (contentsMappingStatus) {
      contentsMappingStatus.textContent =
        count > 0 ? i18nFmt('contents_external_url_mapping_loaded', { n: count }) : '';
    }
  }

  function contentsClearExternalUrlMapping_() {
    contentsSetExternalUrlMapping_({});
    if (contentsMappingFileInput) contentsMappingFileInput.value = '';
  }

  function contentsResolveExternalUrlForFile_(fileName) {
    var map = S.get('contentsExternalUrlByFile') || {};
    var key = contentsNormalizeMappingFileName_(fileName);
    return String(map[key] || '').trim() || contentsGetExternalUrl_();
  }

  function contentsLoadExternalUrlMappingFile_(file, done) {
    if (!file) {
      done(null, {});
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var map = contentsParseExternalUrlMappingText_(reader.result);
        var count = 0;
        var k;
        for (k in map) {
          if (Object.prototype.hasOwnProperty.call(map, k)) count++;
        }
        if (!count) {
          done(new Error('empty'), null);
          return;
        }
        done(null, map);
      } catch (eParse) {
        done(eParse, null);
      }
    };
    reader.onerror = function () {
      done(new Error('read'), null);
    };
    reader.readAsText(file);
  }

  function contentsSyncExternalUrlUi_(type) {
    if (!contentsExternalUrlWrap) return;
    var show = String(type || '').trim() === 'success_case';
    contentsExternalUrlWrap.classList.toggle('hidden', !show);
  }

  function contentsShowFileBlock() {
    if (contentsBlockFile) contentsBlockFile.classList.remove('hidden');
    if (contentsBlockForm) contentsBlockForm.classList.add('hidden');
    if (contentsType) contentsSyncExternalUrlUi_(contentsType.value || '');
  }

  function contentsHideFileBlock() {
    if (contentsBlockFile) contentsBlockFile.classList.add('hidden');
  }

  function contentsShowIndustryBlock() {
    if (contentsBlockIndustry) contentsBlockIndustry.classList.remove('hidden');
    if (contentsBlockFile) contentsBlockFile.classList.add('hidden');
    if (contentsBlockForm) contentsBlockForm.classList.add('hidden');
  }

  function contentsHideIndustryBlock() {
    if (contentsBlockIndustry) contentsBlockIndustry.classList.add('hidden');
  }

  function contentsGetIndustry_() {
    if (contentsType && contentsType.value === 'success_case' && contentsSuccessIndustry) {
      var fromSc = String(contentsSuccessIndustry.value || '').trim();
      if (fromSc) return fromSc;
    }
    return (
      String(S.get('contentsEntryIndustry') || '').trim() ||
      String(S.get('contentsDetectedIndustry') || '').trim()
    );
  }

  function contentsSetIndustryValue_(ind) {
    var v = String(ind || '').trim();
    S.set('contentsEntryIndustry', v);
    S.set('contentsDetectedIndustry', v);
    if (contentsEntryIndustry) contentsEntryIndustry.value = v;
    if (contentsSuccessIndustry) contentsSuccessIndustry.value = v;
  }

  function contentsIndustryReady_() {
    return !!contentsGetIndustry_();
  }

  function contentsFillIndustrySelect_(selectEl, placeholder, current, list) {
    if (!selectEl) return;
    selectEl.innerHTML = '';
    var opt0 = document.createElement('option');
    opt0.value = '';
    opt0.textContent = placeholder;
    selectEl.appendChild(opt0);
    var i;
    for (i = 0; i < list.length; i++) {
      var v = String(list[i] || '').trim();
      if (!v) continue;
      var opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      selectEl.appendChild(opt);
    }
    if (current) selectEl.value = current;
  }

  function contentsApplyIndustryOptions_(res) {
    var current = contentsGetIndustry_();
    var placeholder = i18n('clients_industry_placeholder');
    var list = (res && res.industries) || [];
    contentsFillIndustrySelect_(contentsEntryIndustry, placeholder, current, list);
    contentsFillIndustrySelect_(contentsSuccessIndustry, placeholder, current, list);
    var batchInd = document.getElementById('contents-batch-industry');
    contentsFillIndustrySelect_(batchInd, placeholder, '', list);
  }

  function contentsLoadIndustryOptions_() {
    if (A.cache) {
      var cached = A.cache.get('contentsIndustryOptions');
      if (cached) {

  function contentsResolveSuccessSpecific_(sp, common) {
    var raw = sp && typeof sp === 'object' ? sp : {};
    function pick(obj, keys) {
      for (var i = 0; i < keys.length; i++) {
        var v = String(obj[keys[i]] != null ? obj[keys[i]] : '').trim();
        if (v) return v;
      }
      return '';
    }
    var challenge = pick(raw, [
      'challenge',
      'Challenge',
      'desafio',
      'desafío',
      'reto',
      'problem',
      'context',
      'contexto',
      'situation',
    ]);
    var solution = pick(raw, [
      'solution',
      'Solution',
      'solucion',
      'solución',
      'approach',
      'what_we_did',
      'delivery',
    ]);
    var impactMetric = pick(raw, ['impact_metric', 'impactMetric', 'kpi', 'metric', 'metrica', 'métrica']);
    var impactValue = pick(raw, [
      'impact_value',
      'impactValue',
      'impact',
      'impacto',
      'results',
      'resultados',
      'outcome',
      'benefits',
    ]);
    var evidence = pick(raw, ['evidence', 'proof', 'evidencia', 'testimonial', 'quote']);
    var notes = pick(raw, ['notes', 'notas', 'comments', 'other']);
    if (!challenge) {
      challenge = pick(raw, ['summary', 'resumen', 'background']);
    }
    if (impactMetric && impactValue && impactValue.toLowerCase().indexOf(impactMetric.toLowerCase()) < 0) {
      impactValue = impactMetric + ': ' + impactValue;
    } else if (!impactValue && impactMetric) {
      impactValue = impactMetric;
    }
    if (evidence && notes && notes.indexOf(evidence) < 0) {
      notes = notes + '\n\n' + evidence;
    } else if (evidence && !notes) {
      notes = evidence;
    }
    var summary = String((common && common.summary) || '').trim();
    if (!challenge && !solution && summary) {
      challenge = summary;
    }
    return {
      challenge: challenge,
      solution: solution,
      impact_metric: impactMetric,
      impact_value: impactValue,
      evidence: evidence,
      notes: notes,
    };
  }

  /**

   * @param {Object|null} draft

   * @param {string} contentType

  function contentsBuildPayloadFromDraft_(draft, fileWrap, contentType) {
    var d = draft || {};
    var c = d.common || {};

    if (contentType === 'success_case') {

    if (!title && fileWrap && fileWrap.name) {

    }
    var mime = (fileWrap && fileWrap.mimeType) || 'application/pdf';
    var fname = (fileWrap && fileWrap.name) || 'content.pdf';
    return {
      common: {
        content_id: '',
        content_type: contentType,
        title: title,
        summary: String(c.summary || '').trim(),
        client_name: contentType === 'onboarding' ? '' : String(c.client_name || '').trim(),
        industry:
          contentType === 'onboarding'
            ? ''
            : contentType === 'success_case'
              ? String(c.industry || '').trim() || contentsGetIndustry_()

                String(c.industry || '').trim(),
        tags: contentsTagsFromDraftCommon_(c),

  function contentsSplitUploadFiles_(fileList) {

      var okPdf = f.type === 'application/pdf' || /\.pdf$/i.test(name);

      else if (okPdf) pdfs.push(f);
      else badCount++;

  /**
   * @param {Array<{fileName:string,title:string,contentId:string,matches:Array}>} pendingDuplicates
   * @param {{okCount:number,failCount:number}} stats
   */
  function contentsShowSimilarBatchReview_(pendingDuplicates, stats) {
    if (!contentsSimilarReviewModal || !contentsSimilarReviewList) {
      contentsReturnToList_({ skipCache: true });
      return;
    }
    contentsSimilarReviewList.innerHTML = '';
    var pi;
    for (pi = 0; pi < pendingDuplicates.length; pi++) {

      var matches = item.matches || [];

        line.textContent = i18nFmt('contents_similar_item', {
          title: m.title || '',

        });

      }

      var label = document.createElement('label');
      label.className = 'mt-2 inline-flex items-center gap-2 text-xs font-medium text-slate-800';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'rounded border-slate-300';
      cb.dataset.contentId = String(item.contentId || '');
      var span = document.createElement('span');
      span.textContent = i18n('contents_similar_review_item_delete');
      label.appendChild(cb);
      label.appendChild(span);
      card.appendChild(label);
      contentsSimilarReviewList.appendChild(card);
    }

    function finishReview_(deletedCount) {
      contentsCloseSimilarReviewModal_();
      contentsSetEditorBusy(false, '');
      contentsReturnToList_({ skipCache: true });
      var msg =
        stats.failCount === 0
          ? i18nFmt('contents_batch_done_all_ok', { n: stats.okCount })
          : i18nFmt('contents_batch_done_partial', {
              ok: stats.okCount,
              fail: stats.failCount,
            });
      if (deletedCount > 0) {
        msg += ' ' + i18nFmt('contents_similar_review_deleted', { n: deletedCount });
      }
      contentsSetListStatus(msg, stats.failCount > 0);
      if (A.toast) {
        if (stats.failCount === 0 && stats.okCount > 0) A.toast.success(msg);
        else if (stats.okCount === 0 && stats.failCount > 0) A.toast.error(msg);
        else A.toast.info(msg);
      }
    }

    function onKeepAll() {
      finishReview_(0);
    }

    function onDeleteSelected() {
      var checks = contentsSimilarReviewList.querySelectorAll('input[type="checkbox"]:checked');
      var ids = [];
      var ci;
      for (ci = 0; ci < checks.length; ci++) {
        var id = String(checks[ci].dataset.contentId || '').trim();
        if (id) ids.push(id);
      }
      if (!ids.length) {
        onKeepAll();
        return;
      }
      if (contentsSimilarReviewDeleteSelected) contentsSimilarReviewDeleteSelected.disabled = true;
      if (contentsSimilarReviewKeepAll) contentsSimilarReviewKeepAll.disabled = true;
      A.showBlockingModal(i18n('contents_similar_review_delete_busy'));
      var done = 0;
      var deleted = 0;
      function nextDelete() {
        if (done >= ids.length) {
          A.hideBlockingModal();
          contentsInvalidateListCache_();
          finishReview_(deleted);
          return;
        }
        google.script.run
          .withSuccessHandler(function (res) {
            if (res && res.deleted) deleted++;
            done++;
            nextDelete();
          })
          .withFailureHandler(function () {
            done++;
            nextDelete();
          })
          .contentsDelete(ids[done]);
      }
      nextDelete();
    }

    if (contentsSimilarReviewKeepAll) {
      contentsSimilarReviewKeepAll.onclick = onKeepAll;
      contentsSimilarReviewKeepAll.disabled = false;
    }
    if (contentsSimilarReviewDeleteSelected) {
      contentsSimilarReviewDeleteSelected.onclick = onDeleteSelected;
      contentsSimilarReviewDeleteSelected.disabled = false;
    }

    contentsSimilarReviewModal.classList.remove('hidden');
    contentsSimilarReviewModal.setAttribute('aria-hidden', 'false');
    var dialog = document.getElementById('contents-similar-review-dialog');
    if (dialog) dialog.focus();
  }

  function contentsProcessBatch_(pdfFiles, type) {
    var total = pdfFiles.length;
    var idx = 0;
    var okCount = 0;
    var failCount = 0;
    var pendingDuplicates = [];

    function finishBatch() {
      A.hideBlockingModal();
      if (pendingDuplicates.length > 0) {
        contentsShowSimilarBatchReview_(pendingDuplicates, {
          okCount: okCount,
          failCount: failCount,
        });
        return;
      }
      contentsSetEditorBusy(false, '');
      contentsReturnToList_({ skipCache: true });
      var msg =
        failCount === 0
          ? i18nFmt('contents_batch_done_all_ok', { n: okCount })
          : i18nFmt('contents_batch_done_partial', { ok: okCount, fail: failCount });
      contentsSetListStatus(msg, failCount > 0);
      if (A.toast) {
        if (failCount === 0 && okCount > 0) A.toast.success(msg);
        else if (okCount === 0 && failCount > 0) A.toast.error(msg);
        else A.toast.info(msg);
      }
    }

    function processNext() {
      if (idx >= total) {
        finishBatch();
        return;
      }
      var f = pdfFiles[idx];
      var cur = idx + 1;
      var completed = okCount + failCount;
      var batchBase = {
        total: total,
        current: cur,
        fileName: f.name,
        completed: completed,
      };

      function showBatchExtractUi(ev, passDone) {
        var passTotal = ev && ev.passTotal ? ev.passTotal : 1;
        var passIndex = ev && ev.passIndex != null ? ev.passIndex : 0;
        var passWeight = passDone ? passIndex + 1 : passIndex;
        var fileSlot = total > 0 ? (idx + passWeight / passTotal) / total : 0;
        var barPct = total > 0 ? Math.round(fileSlot * 100) : 4;
        if (barPct < 4 && idx < total) barPct = 4;
        contentsShowBatchProgress_({
          step: 'extract',
          analyzed: idx,
          phase: (ev && ev.phaseText) || '',
          barPercent: barPct,
          total: batchBase.total,
          current: batchBase.current,
          fileName: batchBase.fileName,
          completed: batchBase.completed,
        });
      }

      contentsShowBatchProgress_({
        step: 'read',
        analyzed: idx,
        barPercent: total > 0 ? Math.round((idx / total) * 100) || 4 : 4,
        total: batchBase.total,
        current: batchBase.current,
        fileName: batchBase.fileName,
        completed: batchBase.completed,
      });

      contentsReadFileAsBase64_(
        f,
        function (b64) {
          var extractPayload = contentsExtractPayloadJson_(
            f.name,
            f.type || 'application/pdf',
            b64,
          );
          contentsRunExtraction_(extractPayload, type, {
            onPassStart: function (ev) {
              showBatchExtractUi(ev, false);
            },
            onPassDone: function (ev) {
              showBatchExtractUi(ev, true);
            },
            onDone: function (res) {
              var draft = res && res.draft;
              var fileWrap = {
                name: f.name,
                mimeType: f.type || 'application/pdf',
                dataBase64: b64,
              };
              var savePayload = contentsBuildPayloadFromDraft_(draft, fileWrap, type);
              if (!savePayload.common.title) {
                failCount++;
                idx++;
                processNext();
                return;
              }
              function contentsBatchSaveFile_(similarMatches) {
                if (similarMatches && similarMatches.length) {
                  savePayload.forceSave = true;
                }
                contentsShowBatchProgress_({
                  step: 'save',
                  analyzed: idx + 1,
                  completed: completed,
                  barPercent: total > 0 ? Math.round(((idx + 1) / total) * 100) : 100,
                  total: batchBase.total,
                  current: batchBase.current,
                  fileName: batchBase.fileName,
                });
                google.script.run
                  .withSuccessHandler(function (res) {
                    if (similarMatches && similarMatches.length) {
                      var savedItem = res && res.item;
                      var savedCommon = savedItem && savedItem.common;
                      pendingDuplicates.push({
                        fileName: f.name,
                        title:
                          (savedCommon && savedCommon.title) ||
                          (savePayload.common && savePayload.common.title) ||
                          f.name,
                        contentId: savedCommon ? savedCommon.content_id : '',
                        matches: similarMatches,
                      });
                    }
                    okCount++;
                    idx++;
                    processNext();
                  })
                  .withFailureHandler(function () {
                    failCount++;
                    idx++;
                    processNext();
                  })
                  .contentsSaveDraft(JSON.stringify(savePayload));
              }
              if (type !== 'success_case') {
                contentsBatchSaveFile_(null);
                return;
              }
              contentsFindSimilarSuccessCases_(savePayload, function (dupErr, matches) {
                if (dupErr) {
                  failCount++;
                  idx++;
                  processNext();
                  return;
                }
                contentsBatchSaveFile_(matches && matches.length ? matches : null);
              }, { silent: true });
            },
            onFail: function () {
              failCount++;
              idx++;
              processNext();
            },
          });
        },
        function () {
          failCount++;
          idx++;
          processNext();
        },
      );
    }

  /**
   * @param {FileList|Array<File>} files
   * @param {string} type content_type
   */
  function contentsHandleFileList_(files, type) {
    if (!type) {
      contentsSetEditorStatus(i18n('contents_err_pick_type'), true);
      return;
    }
    var arr = [];
    var i;
    for (i = 0; i < files.length; i++) arr.push(files[i]);
    if (!arr.length) return;

    var isEdit = !!(S.get('contentsSelectedId') || (contentsContentId && contentsContentId.value));
    if (isEdit && arr.length > 1) {
      contentsSetEditorStatus(i18n('contents_batch_err_replace_one_file'), true);
      return;
    }

    var filtered = contentsFilterPdfFiles_(arr);
    if (filtered.badCount > 0 && A.toast) {
      A.toast.info(i18nFmt('contents_batch_skipped_non_pdf', { n: filtered.badCount }));
    }
    if (!filtered.pdfs.length) {
      contentsSetEditorStatus(i18n('contents_err_pick_file'), true);
      return;
    }

    if (isEdit) {
      contentsProcessPickedFile_(filtered.pdfs[0], type);
      return;
    }

    if (type === 'success_case' && filtered.pdfs.length === 1 && !contentsIndustryReady_()) {
      contentsSetEditorStatus(i18n('contents_err_industry_required'), true);
      contentsAfterTypeSelected_(type);
      return;
    }

    function startUpload_() {
      if (filtered.pdfs.length === 1) {
        contentsProcessPickedFile_(filtered.pdfs[0], type);
        return;
      }

      if (filtered.pdfs.length > CONTENTS_BATCH_MAX_FILES) {
        contentsSetEditorStatus(i18nFmt('contents_batch_too_many', { max: CONTENTS_BATCH_MAX_FILES }), true);
        return;
      }

      contentsProcessBatch_(filtered.pdfs, type);
    }

    if (filtered.mappingFile) {
      contentsMaybeApplyMappingFromDrop_(filtered.mappingFile, function (mapErr) {
        if (mapErr) return;
        startUpload_();
      });
      return;
    }

    startUpload_();
  }

  function contentsSortRows(rows) {
    var sortKey = S.get('contentsSortKey');
    var sortDir = S.get('contentsSortDir');
    if (!sortKey || !sortDir) return rows;
    var keyMap = { title: 'title', type: 'content_type', client: 'client_name', updated: 'updated_at' };
    var field = keyMap[sortKey];
    if (!field) return rows;
    var dir = sortDir === 'asc' ? 1 : -1;
    return rows.slice().sort(function (a, b) {
      var aVal = ((a.common || {})[field] || '').toString().toLowerCase();
      var bVal = ((b.common || {})[field] || '').toString().toLowerCase();
      if (aVal === '' && bVal !== '') return 1;
      if (bVal === '' && aVal !== '') return -1;
      if (aVal < bVal) return -1 * dir;
      if (aVal > bVal) return 1 * dir;
      return 0;
    });
  }

  function contentsUpdateSortIcons() {

    var headers = document.querySelectorAll('[data-sort-key]');

      var th = headers[h];
      var key = th.getAttribute('data-sort-key');
      var icon = th.querySelector('.contents-sort-icon');
      if (!icon) continue;
      icon.className = 'fa-solid contents-sort-icon';
      if (key === sortKey && sortDir) {
        icon.classList.add(sortDir === 'asc' ? 'fa-sort-up' : 'fa-sort-down', 'text-sky-600');

        icon.classList.add('fa-sort', 'text-slate-400', 'dark:text-slate-400');

  }

  var CONTENTS_PAGE_SIZES = [15, 25, 50];
  var contentsFilterDebounceTimer = null;
  var _contentsListPageCache = {};
  var _contentsListPrefetchToken = 0;

  function contentsGetPageSize_() {
    var n = Number(S.get('contentsPageSize'));
    for (var i = 0; i < CONTENTS_PAGE_SIZES.length; i++) {
      if (CONTENTS_PAGE_SIZES[i] === n) return n;
    }
    return 15;
  }

  function contentsSyncPageSizeSelect_() {

  function contentsGetListFilters_() {
    return {
      contentType: (contentsFilterType && contentsFilterType.value) || '',
      q: ((contentsFilterQ && contentsFilterQ.value) || '').trim(),
    };
  }

  function contentsHasActiveFilters_() {
    var f = contentsGetListFilters_();
    return !!(f.contentType || f.q);
  }

  function contentsListFilterFingerprint_(skipOverride) {
    var f = contentsGetListFilters_();
    var skip =
      typeof skipOverride === 'number' ? skipOverride : S.get('contentsListSkip') || 0;
    return [
      f.contentType,
      f.q,
      String(skip),
      String(contentsGetPageSize_()),
    ].join('\u0001');
  }

  function contentsGetListPageCache_(fingerprint) {
    return _contentsListPageCache[fingerprint] || null;
  }

  function contentsSetListPageCache_(fingerprint, payload) {
    _contentsListPageCache[fingerprint] = payload;
  }

  function contentsApplyListPageCache_(cached) {
    S.set('contentsItemsCache', cached.items);
    S.set('contentsListTotal', cached.total);
    S.set('contentsListHasMore', cached.hasMore);
    contentsRenderTable();
    contentsSetListStatus('\u00a0', false);
  }

  function contentsInvalidateListCache_() {
    _contentsListPageCache = {};
    _contentsListPrefetchToken += 1;
    if (A.cache && A.cache.invalidate) A.cache.invalidate('contentsList');
  }

  function contentsPrefetchNextListPage_() {
    if (!S.get('contentsListHasMore')) return;
    var skip = (S.get('contentsListSkip') || 0) + contentsGetPageSize_();
    var fingerprint = contentsListFilterFingerprint_(skip);
    if (contentsGetListPageCache_(fingerprint)) return;

    var filters = contentsGetListFilters_();
    var token = _contentsListPrefetchToken;
    google.script.run
      .withSuccessHandler(function (res) {
        if (token !== _contentsListPrefetchToken) return;
        var items = (res && res.items) || [];
        var total = (res && res.total) || 0;
        var hasMore = !!(res && res.hasMore);
        contentsSetListPageCache_(fingerprint, {
          items: items,
          total: total,
          hasMore: hasMore,
        });
      })
      .withFailureHandler(function () {
        /* prefetch silencioso */
      })
      .contentsList({
        contentType: filters.contentType,
        q: filters.q,
        skip: skip,
        limit: contentsGetPageSize_(),
      });
  }

  function contentsScheduleFilterReload_() {
    if (contentsFilterDebounceTimer) clearTimeout(contentsFilterDebounceTimer);
    contentsFilterDebounceTimer = setTimeout(function () {
      contentsFilterDebounceTimer = null;
      contentsInvalidateListCache_();
      contentsLoadList({ resetSkip: true, skipCache: true });

  function contentsLoadList(opts) {

    if (!skipCache) {

      if (cached) {
        contentsApplyListPageCache_(cached);

        contentsPrefetchNextListPage_();

    if (S.get('contentsListLoading')) return;
    S.set('contentsListLoading', true);
    contentsSetListBusy(true, i18n('contents_busy_loading'));

      .withSuccessHandler(function (res) {

        var items = (res && res.items) || [];
        var total = (res && res.total) || 0;
        var hasMore = !!(res && res.hasMore);
        S.set('contentsItemsCache', items);

        S.set('contentsListHasMore', hasMore);
        contentsSetListPageCache_(fingerprint, {
          items: items,

          hasMore: hasMore,
        });
        if (!S.get('contentsRowBusyId')) {
          contentsSetListStatus('\u00a0', false);

  function contentsReextractMetadataInEditor_() {
    var id = (contentsContentId && contentsContentId.value) || '';
    if (!id || !S.get('canWriteContents') || contentsIsEditorReadonly_()) return;
    var common = S.get('contentsCurrentCommon') || {};
    if (!contentsCanShowPdfBtn_(common)) {
      contentsSetEditorStatus(i18n('contents_err_reextract_no_file'), true);
      return;
    }
    A.confirmDialog({ message: i18n('contents_confirm_reextract'), danger: false }).then(function (ok) {
      if (!ok) return;
      A.showBlockingModal(i18n('contents_busy_reextracting'));
      contentsSetEditorBusy(true, i18n('contents_busy_reextracting'));
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.file || !res.file.dataBase64) {
            A.hideBlockingModal();
            contentsSetEditorBusy(false);
            contentsSetEditorStatus(i18n('contents_err_reextract_no_file'), true);
            return;
          }
          var type = String(res.contentType || (contentsType && contentsType.value) || '').trim();
          var fileWrap = {
            name: res.file.name,
            mimeType: res.file.mimeType || 'application/pdf',
            dataBase64: res.file.dataBase64,
          };
          var payload = JSON.stringify({
            name: fileWrap.name,
            mimeType: fileWrap.mimeType,
            dataBase64: fileWrap.dataBase64,
          });
          S.set('contentsUploadCancelled', false);

          function contentsReextractModal_(opts) {
            A.showBlockingModal({
              message: i18n('contents_busy_reextracting'),
              progress: true,
              phase: opts.phase || '',
              barPercent: opts.barPercent != null ? opts.barPercent : 8,
              fileName: fileWrap.name,
              stepLabel: i18n('contents_step_analyzing_inline'),
            });
          }

          contentsReextractModal_({ barPercent: 12 });

          contentsRunExtraction_(payload, type, {
            isCancelled: function () {
              return !!S.get('contentsUploadCancelled');
            },
            onPassStart: function (ev) {
              var passTotal = ev && ev.passTotal ? ev.passTotal : 1;
              var passIndex = ev && ev.passIndex != null ? ev.passIndex : 0;
              var barPct =
                passTotal > 1
                  ? 12 + Math.round((passIndex / passTotal) * 78)
                  : 55;
              contentsReextractModal_({
                phase: ev.phaseText,
                barPercent: barPct,
              });
            },
            onPassDone: function (ev) {
              var passTotal = ev && ev.passTotal ? ev.passTotal : 1;
              var passIndex = ev && ev.passIndex != null ? ev.passIndex : 0;
              var barPct =
                passTotal > 1
                  ? 12 + Math.round(((passIndex + 1) / passTotal) * 78)
                  : 88;
              contentsReextractModal_({
                phase: ev.phaseText,
                barPercent: barPct,
              });
            },
            onDone: function (extractRes) {
              A.hideBlockingModal();
              contentsSetEditorBusy(false);
              try {
                contentsApplyDraftToForm_(extractRes && extractRes.draft, type, fileWrap.name);
                contentsToggleSpecificSections();
              } catch (eDraft) {
                if (window.console && console.warn) {
                  console.warn('[contents] reextract draft render failed', eDraft);
                }
              }
              contentsSetEditorStatus(contentsFormatExtractionStatus_(extractRes && extractRes.draft), false);
              if (A.toast) A.toast.success(i18n('contents_reextract_done'));
            },
            onFail: function (e) {
              contentsRpcError_(e, contentsExtractionPassIds_(type) ? 'contentsExtractDraftPass' : 'contentsExtractDraft', {
                fallbackKey: 'contents_err_upload_failed',
                editorStatus: true,
              });
            },
          });
        })
        .withFailureHandler(function (e) {
          A.hideBlockingModal();
          contentsSetEditorBusy(false);
          contentsRpcError_(e, 'contentsReextractMetadata', {
            fallbackKey: 'contents_err_upload_failed',
            editorStatus: true,
          });
        })
        .contentsReextractMetadata(id);
    });
  }

  function contentsFormatExtractionStatus_(draft) {
    var d = draft || {};
    var conf = String(d.confidence || 'low').toLowerCase();
    var confKey =
      conf === 'high'
        ? 'contents_confidence_high'
        : conf === 'medium'
          ? 'contents_confidence_medium'
          : 'contents_confidence_low';
    var msg = i18nFmt('contents_extraction_done_confidence', { confidence: i18n(confKey) });
    var warnings = d.warnings || [];
    if (warnings.length) {
      msg += ' ' + i18n('contents_extraction_warnings_prefix') + ' ' + warnings.join('; ');
    }
    return msg;
  }

  function contentsApplyDraftToForm_(draft, type, fileName) {
    var d = draft || {};
    var c = d.common || {};
    var title = String(c.title || '').trim();
    if (!title && fileName) {
      title = String(fileName.replace(/\.pdf$/i, '').trim() || fileName || '').trim();
    }
    if (contentsTitle) contentsTitle.value = title;
    if (contentsSummary) contentsSummary.value = c.summary || '';
    if (contentsUsesClientFields_(type)) {
      contentsSetClientValue(c.client_name || '');
      var indDraft = String(c.industry || '').trim();
      var indEntry = String(S.get('contentsEntryIndustry') || '').trim();
      contentsSetIndustryValue_(indEntry || indDraft);
    } else {
      contentsClearClientFields_();
    }
    var tags = [];
    if (Array.isArray(c.tags)) {
      tags = c.tags.slice();
    } else if (typeof c.tags === 'string') {
      tags = c.tags
        .split(',')
        .map(function (x) { return String(x || '').trim(); })
        .filter(function (x) { return !!x; });
    }
    S.set('contentsCurrentTags', tags);
    contentsRenderTagsChips();
    var sp = d.specific || {};
    if (type === 'proposal') {
      if (contentsProposalMaterialKind) {
        contentsProposalMaterialKind.value = sp.material_kind || 'COMMERCIAL_PROPOSAL';
      }
      if (contentsProposalTopic) contentsProposalTopic.value = sp.topic || '';
      if (contentsProposalStudio) contentsProposalStudio.value = sp.globant_studio || '';
      if (contentsProposalOffering) contentsProposalOffering.value = sp.offering || '';
      if (contentsProposalStage) contentsProposalStage.value = sp.stage || '';
      if (contentsProposalPricing) contentsProposalPricing.value = sp.pricing_model || '';
      if (contentsProposalEffort) contentsProposalEffort.value = sp.effort_estimate || '';
      if (contentsProposalNotes) contentsProposalNotes.value = sp.notes || '';
      contentsToggleProposalMaterialFields_();
    } else if (type === 'success_case') {
      contentsApplySuccessSpecificToForm_(sp, c);
    } else if (type === 'client') {
      if (contentsClientStatus) contentsClientStatus.value = sp.account_status || '';
      if (contentsClientProjects) contentsClientProjects.value = sp.active_projects || '';
      if (contentsClientHealth) contentsClientHealth.value = sp.health_score || '';
      if (contentsClientNotes) contentsClientNotes.value = sp.notes || '';
    } else if (type === 'onboarding') {
      if (contentsOnboardingTopic) contentsOnboardingTopic.value = sp.topic || '';
      if (contentsOnboardingCategory) contentsOnboardingCategory.value = sp.category || '';
      if (contentsOnboardingAudience) contentsOnboardingAudience.value = sp.audience || '';
      if (contentsOnboardingNotes) contentsOnboardingNotes.value = sp.notes || '';
    }
  }

  /** @const Pasadas success_case (mismo orden que CONTENT_SUCCESS_CASE_PASSES en servidor). */
  var CONTENTS_SUCCESS_CASE_PASS_IDS = ['common', 'challenge', 'solution', 'impact'];

  function contentsExtractionPassIds_(type) {
    if (type === 'success_case') return CONTENTS_SUCCESS_CASE_PASS_IDS.slice();
    return null;
  }

  function contentsPassToPhaseKey_(passId, type) {
    var map = {
      common: 'contents_extract_phase_common',
      challenge: 'contents_extract_phase_challenge',
      solution: 'contents_extract_phase_solution',
      impact: 'contents_extract_phase_impact',
    };
    if (map[passId]) return map[passId];
    if (type === 'proposal') return 'contents_extract_phase_proposal';
    if (type === 'client') return 'contents_extract_phase_client';
    if (type === 'onboarding') return 'contents_extract_phase_onboarding';
    return 'contents_extract_phase_generic';
  }

  function contentsExtractionPhaseText_(passId, type, passIndex, passTotal) {
    var phase = i18n(contentsPassToPhaseKey_(passId, type));
    if (passTotal > 1) {
      return i18nFmt('contents_extract_pass_progress', {
        current: passIndex + 1,
        total: passTotal,
        phase: phase,
      });
    }
    return phase;
  }

  function contentsSetExtractionPhaseUi_(text) {
    var detailEl = document.getElementById('contents-uploading-detail');
    var analyzeLabel = document.getElementById('contents-step-analyze-label');

    if (analyzeLabel) analyzeLabel.textContent = text || i18n('contents_step_analyzing_inline');

  /**
   * Extracción secuencial: una RPC por pasada (success_case) o una RPC única (otros tipos).
   * @param {string} payloadStr JSON {name,mimeType,dataBase64}
   * @param {string} type content_type
   * @param {{isCancelled?:function, onPassStart?:function, onPassDone?:function, onDone?:function, onFail?:function}} handlers
   */
  function contentsRunExtraction_(payloadStr, type, handlers) {
    handlers = handlers || {};
    var passIds = contentsExtractionPassIds_(type);
    var draftJson = '';

    function cancelled() {
      return handlers.isCancelled && handlers.isCancelled();
    }

    function fail(e) {
      if (handlers.onFail) handlers.onFail(e);
    }

    if (!passIds || !passIds.length) {
      var singlePhase = contentsExtractionPhaseText_('__single__', type, 0, 1);
      if (handlers.onPassStart) {
        handlers.onPassStart({
          passId: '__single__',
          passIndex: 0,
          passTotal: 1,
          phaseText: singlePhase,
        });
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (cancelled()) return;
          if (handlers.onPassDone) {
            handlers.onPassDone({
              passId: '__single__',
              passIndex: 0,
              passTotal: 1,
              res: res,
            });
          }
          if (handlers.onDone) handlers.onDone(res);
        })
        .withFailureHandler(fail)
        .contentsExtractDraft(payloadStr, type);
      return;
    }

    var passIndex = 0;

    function runPass() {
      if (cancelled()) return;
      if (passIndex >= passIds.length) return;
      var passId = passIds[passIndex];
      var phaseText = contentsExtractionPhaseText_(passId, type, passIndex, passIds.length);
      if (handlers.onPassStart) {
        handlers.onPassStart({
          passId: passId,
          passIndex: passIndex,
          passTotal: passIds.length,
          phaseText: phaseText,
        });
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (cancelled()) return;
          if (handlers.onPassDone) {
            handlers.onPassDone({
              passId: passId,
              passIndex: passIndex,
              passTotal: passIds.length,
              res: res,
            });
          }
          if (res && res.extractionComplete) {
            if (handlers.onDone) handlers.onDone(res);
            return;
          }
          draftJson = JSON.stringify((res && res.draft) || {});
          passIndex++;
          runPass();
        })
        .withFailureHandler(fail)
        .contentsExtractDraftPass(payloadStr, type, passId, draftJson);
    }

    runPass();
  }

  function contentsShowUploading(on, fileName) {
    if (contentsDropzone) contentsDropzone.classList.toggle('hidden', on);
    if (contentsUploading) contentsUploading.classList.toggle('hidden', !on);
    if (contentsUploadingFile) contentsUploadingFile.textContent = on ? fileName || '' : '';
    if (!on) {
      contentsSetUploadStep('none');
      var bar = document.getElementById('contents-upload-bar');
      if (bar) bar.style.width = '10%';
      var detailEl = document.getElementById('contents-uploading-detail');
      if (detailEl) detailEl.textContent = '';

  }

  function contentsSetUploadStep(step) {
    var steps = ['read', 'analyze'];
    var stepIdx = steps.indexOf(step);
    var bar = document.getElementById('contents-upload-bar');
    var mainMsg = document.getElementById('contents-uploading-msg');
    var mainIcon = document.getElementById('contents-upload-icon');
    var config = {
      read: { bar: '20%', icon: 'fa-solid fa-file-arrow-up text-2xl text-sky-600 animate-pulse', msg: 'contents_step_reading' },
      analyze: { bar: '60%', icon: 'fa-solid fa-brain text-2xl text-violet-600 animate-pulse', msg: 'contents_step_analyzing_inline' },
      done: { bar: '100%', icon: 'fa-solid fa-circle-check text-2xl text-emerald-600', msg: 'contents_extraction_done' },
    };
    var c = config[step] || config.read;
    if (bar) bar.style.width = c.bar;
    if (mainIcon) mainIcon.className = c.icon;
    if (mainMsg) mainMsg.textContent = i18n(c.msg);
    if (step !== 'analyze') {
      var detailEl = document.getElementById('contents-uploading-detail');
      if (detailEl) detailEl.textContent = '';
      var analyzeLabel = document.getElementById('contents-step-analyze-label');
      if (analyzeLabel) analyzeLabel.textContent = i18n('contents_step_analyzing_inline');
    }
    for (var i = 0; i < steps.length; i++) {
      var el = document.getElementById('contents-step-' + steps[i]);
      if (!el) continue;
      var icon = el.querySelector('i');
      if (i < stepIdx) {
        el.className = 'flex items-center gap-2 text-emerald-600 dark:text-emerald-400';
        if (icon) icon.className = 'fa-solid fa-circle-check w-3.5 text-center text-[10px]';
      } else if (i === stepIdx) {
        el.className = 'flex items-center gap-2 text-sky-700 font-medium dark:text-sky-300';
        if (icon) icon.className = 'fa-solid fa-spinner fa-spin w-3.5 text-center text-[10px]';
      } else {
        el.className = 'flex items-center gap-2 text-slate-400 dark:text-slate-400';
        if (icon) icon.className = 'fa-solid fa-circle-notch w-3.5 text-center text-[10px]';
      }
    }
  }

  function contentsProcessPickedFile_(f, type) {
    S.set('contentsUploadCancelled', false);
    contentsShowUploading(true, f.name);
    contentsSetUploadStep('read');
    var reader = new FileReader();
    reader.onload = function () {
      if (S.get('contentsUploadCancelled')) { contentsShowUploading(false, ''); return; }
      var s = reader.result;
      var b64 = typeof s === 'string' && s.indexOf(',') >= 0 ? s.split(',')[1] : '';
      if (!b64) {
        contentsShowUploading(false, '');
        contentsSetEditorStatus(i18n('contents_err_upload_read'), true);
        return;
      }
      var payload = contentsExtractPayloadJson_(f.name, f.type || 'application/pdf', b64);
      contentsSetUploadStep('analyze');

      function contentsUpdateUploadPassBar_(ev, passDone) {
        var bar = document.getElementById('contents-upload-bar');
        if (!bar || !ev || ev.passTotal <= 1) return;
        var passWeight = passDone ? ev.passIndex + 1 : ev.passIndex;
        var pct = 60 + Math.round((passWeight / ev.passTotal) * 35);
        bar.style.width = pct + '%';
      }

      contentsRunExtraction_(payload, type, {
        isCancelled: function () {
          return !!S.get('contentsUploadCancelled');
        },
        onPassStart: function (ev) {
          contentsSetExtractionPhaseUi_(ev.phaseText);
          contentsUpdateUploadPassBar_(ev, false);
        },
        onPassDone: function (ev) {
          contentsSetExtractionPhaseUi_(ev.phaseText);
          contentsUpdateUploadPassBar_(ev, true);
        },
        onDone: function (res) {
          if (S.get('contentsUploadCancelled')) {
            contentsShowUploading(false, '');
            contentsSetEditorStatus(i18n('contents_cancelled'), false);
            return;
          }
          contentsSetUploadStep('done');
          setTimeout(function () {
            contentsShowUploading(false, '');
            function contentsShowDraftForm_() {
              S.set('contentsCurrentFile', {
                name: f.name,
                mimeType: f.type || 'application/pdf',
                dataBase64: b64,
              });
              if (contentsCurrentFileName) contentsCurrentFileName.textContent = f.name || '\u00a0';
              try {
                contentsApplyDraftToForm_(res && res.draft, type, f.name);
                contentsToggleSpecificSections();
              } catch (eDraft) {
                if (window.console && console.warn) {
                  console.warn('[contents] draft render failed, fallback mode', eDraft);
                }
              }
              if (contentsBlockType) contentsBlockType.classList.add('hidden');
              contentsShowFormBlock();
              contentsSetStep(3, 2);
              contentsSetEditorStatus(contentsFormatExtractionStatus_(res && res.draft), false);
            }
            if (type !== 'success_case') {
              contentsShowDraftForm_();
              return;
            }
            var checkPayload = contentsSimilarCheckPayloadFromDraft_(res && res.draft, type, f.name);
            contentsFindSimilarSuccessCases_(checkPayload, function (simErr, matches) {
              if (simErr) {
                contentsShowDraftForm_();
                return;
              }
              if (!matches.length) {
                contentsShowDraftForm_();
                return;
              }
              contentsConfirmSimilarAction_({
                matches: matches,
                mode: 'continue',
                onConfirm: function () {
                  contentsShowDraftForm_();
                },
                onDecline: function () {
                  contentsResetForm();
                  contentsSetScreen('list');
                  contentsSetEditorStatus(i18n('contents_similar_declined'), false);
                },
              });
            }, { silent: true });
          }, 600);
        },
        onFail: function (e) {
          if (S.get('contentsUploadCancelled')) {
            contentsShowUploading(false, '');
            contentsSetEditorStatus(i18n('contents_cancelled'), false);
            return;
          }
          contentsShowUploading(false, '');
          contentsRpcError_(e, contentsExtractionPassIds_(type) ? 'contentsExtractDraftPass' : 'contentsExtractDraft', {
            hideModal: false,
            fallbackKey: 'contents_err_upload_failed',
            editorStatus: true,
          });
        },
      });
    };
    reader.onerror = function () {
      if (S.get('contentsUploadCancelled')) { contentsShowUploading(false, ''); return; }
      contentsShowUploading(false, '');
      contentsSetEditorStatus(i18n('contents_err_upload_read'), true);
    };
    reader.readAsDataURL(f);
  }

  function contentsHandlePickedFile() {

  function contentsSimilarCheckPayloadFromDraft_(draft, type, fileName) {
    var d = draft || {};
    var c = d.common || {};
    return {
      common: {
        content_type: type || 'success_case',
        content_id: '',
        title: c.title,
        summary: c.summary,
        client_name: c.client_name,
        industry: String(S.get('contentsEntryIndustry') || c.industry || '').trim(),
        file_name: c.file_name || fileName || '',
        tags: contentsTagsFromDraftCommon_(c),
      },
      specific: d.specific || {},
    };
  }

  function contentsSimilarMessageFromMatches_(matches, mode) {
    var leadKey =
      mode === 'continue' ? 'contents_similar_lead_continue' : 'contents_similar_lead';
    var confirmKey =
      mode === 'continue' ? 'contents_similar_confirm_continue' : 'contents_similar_confirm';
    var lines = [i18n(leadKey)];
    var i;
    for (i = 0; i < matches.length; i++) {
      var m = matches[i] || {};
      var pct = Math.round((Number(m.similarity) || 0) * 100);
      lines.push(
        i18nFmt('contents_similar_item', {
          title: m.title || m.content_id || '—',
          client: m.client_name || '—',
          pct: pct,
        }),
      );
    }
    lines.push('');
    lines.push(i18n(confirmKey));
    return lines.join('\n');
  }

  /**
   * @param {{matches:Array,mode?:string,fileName?:string,onConfirm:Function,onDecline:Function}} opts
   */
  function contentsConfirmSimilarAction_(opts) {
    var o = opts || {};
    var matches = o.matches || [];
    var mode = o.mode || 'save';
    var msg = contentsSimilarMessageFromMatches_(matches, mode);
    if (o.fileName) {
      msg = i18nFmt('contents_similar_batch_file', { name: o.fileName }) + '\n\n' + msg;
    }
    A.confirmDialog({
      title: i18n('contents_similar_title'),
      message: msg,
    }).then(function (ok) {
      if (ok && o.onConfirm) o.onConfirm();
      else if (!ok && o.onDecline) o.onDecline();
    });
  }

  function contentsFindSimilarSuccessCases_(payload, done, opts) {
    if (!payload || payload.common.content_type !== 'success_case') {
      done(null, []);
      return;
    }
    var silent = !!(opts && opts.silent);
    if (!silent) A.showBlockingModal(i18n('contents_similar_check_busy'));
    google.script.run
      .withSuccessHandler(function (res) {
        if (!silent) A.hideBlockingModal();
        done(null, (res && res.matches) || []);
      })
      .withFailureHandler(function (e) {
        if (!silent) A.hideBlockingModal();
        done(e, []);
      })
      .contentsFindSimilarSuccessCases(
        JSON.stringify({
          common: payload.common,
          specific: payload.specific || {},
          excludeContentId: payload.common.content_id || '',
        }),
      );
  }

    A.showBlockingModal(i18n('contents_busy_saving'));
    contentsInvalidateListCache_();

        A.hideBlockingModal();
        contentsReturnToList_({ skipCache: true, statusKey: 'contents_saved' });
        if (A.toast) A.toast.success(i18n('contents_saved'));

      .withFailureHandler(function (e) {
        contentsRpcError_(e, 'contentsSaveDraft', { editorStatus: true });
      })
      .contentsSaveDraft(JSON.stringify(payload));
  }

  function contentsSaveCurrent() {
    var payload = contentsCollectPayload();
    if (!payload.common.content_type) { contentsSetEditorStatus(i18n('contents_err_pick_type'), true); return; }
    if (
      payload.common.content_type === 'success_case' &&
      !String(payload.common.industry || '').trim()
    ) {
      contentsSetEditorStatus(i18n('contents_err_industry_required'), true);
      return;
    }
    if (!payload.common.title) { contentsSetEditorStatus(i18n('contents_err_title_required'), true); return; }
    if (payload.common.content_type === 'proposal') {
      var spSave = payload.specific || {};
      if (!String(spSave.material_kind || '').trim()) {
        contentsSetEditorStatus(i18n('contents_err_proposal_material_kind'), true);
        return;
      }
      if (spSave.material_kind === 'GLOBANT_STUDIO' && !String(spSave.globant_studio || '').trim()) {
        contentsSetEditorStatus(i18n('contents_err_proposal_studio_required'), true);
        return;
      }
      if (spSave.material_kind === 'GLOBANT_OFFERING' && !String(spSave.offering || '').trim()) {
        contentsSetEditorStatus(i18n('contents_err_proposal_offering_required'), true);
        return;
      }
    }
    var isNew = !payload.common.content_id;
    var hasFile = payload.file && payload.file.dataBase64;
    if (isNew && !hasFile) { contentsSetEditorStatus(i18n('contents_err_extract_first'), true); return; }
    contentsFindSimilarSuccessCases_(payload, function (err, matches) {
      if (err) {
        contentsRpcError_(err, 'contentsFindSimilarSuccessCases', {
          fallbackKey: 'err_generic',
          modal: true,
          editorStatus: true,
        });
        return;
      }
      if (!matches.length) {
        contentsExecuteSave_(payload);
        return;
      }
      contentsConfirmSimilarAction_({
        matches: matches,
        mode: 'save',
        onConfirm: function () {
          payload.forceSave = true;
          contentsExecuteSave_(payload);
        },
        onDecline: function () {},
      });
    });
  }

      var ind = contentsBatchIndustry ? String(contentsBatchIndustry.value || '').trim() : '';
      if (!ind) {
        if (A.toast) A.toast.error(i18n('contents_batch_industry_pick'));
        return;
      }
      A.confirmDialog({
        message: i18nFmt('contents_batch_industry_confirm', { industry: ind, n: scIds.length }),
      }).then(function (ok) {
        if (!ok) return;
        contentsBatchIndustryBtn.disabled = true;
        if (contentsBatchDeleteBtn) contentsBatchDeleteBtn.disabled = true;
        if (contentsBatchClientBtn) contentsBatchClientBtn.disabled = true;
        if (contentsBatchIndustry) contentsBatchIndustry.disabled = true;
        if (contentsBatchClient) contentsBatchClient.disabled = true;
        A.showBlockingModal(i18n('contents_batch_industry_busy'));
        google.script.run
          .withSuccessHandler(function (res) {
            contentsBatchIndustryBtn.disabled = false;
            if (contentsBatchDeleteBtn) contentsBatchDeleteBtn.disabled = false;
            if (contentsBatchClientBtn) contentsBatchClientBtn.disabled = false;
            if (contentsBatchIndustry) contentsBatchIndustry.disabled = false;
            if (contentsBatchClient) contentsBatchClient.disabled = false;
            A.hideBlockingModal();
            if (contentsSelectAll) contentsSelectAll.checked = false;
            contentsBatchUpdateBar();
            contentsInvalidateListCache_();
            contentsLoadList({ resetSkip: true, skipCache: true });
            var updated = (res && res.updated) || 0;
            var skipped = (res && res.skipped) || 0;
            var failed = (res && res.failed) || 0;
            if (skipped > 0 || failed > 0) {
              if (A.toast) {
                A.toast.info(
                  i18nFmt('contents_batch_industry_partial', {
                    ok: updated,
                    skip: skipped,
                    fail: failed,
                  }),
                );
              }
            } else if (A.toast) {
              A.toast.success(i18nFmt('contents_batch_industry_done', { n: updated }));
            }
          })
          .withFailureHandler(function (e) {
            contentsBatchIndustryBtn.disabled = false;
            if (contentsBatchDeleteBtn) contentsBatchDeleteBtn.disabled = false;
            if (contentsBatchClientBtn) contentsBatchClientBtn.disabled = false;
            if (contentsBatchIndustry) contentsBatchIndustry.disabled = false;
            if (contentsBatchClient) contentsBatchClient.disabled = false;
            A.reportRpcError(e, {
              scope: 'contentsBatchSetIndustry',
              fallbackKey: 'err_generic',
              modal: true,
              toast: true,
            });
          })
          .contentsBatchSetIndustry(scIds, ind);
      });
    });
  }

  if (contentsBatchDeleteBtn) {
    contentsBatchDeleteBtn.addEventListener('click', function () {
      var ids = contentsBatchGetSelected();
      if (!ids.length) return;
      A.confirmDialog({
        message: i18nFmt('batch_delete_confirm', { n: ids.length }),
        danger: true,
      }).then(function (ok) {
        if (!ok) return;
        contentsBatchDeleteBtn.disabled = true;
        var done = 0;
        var total = ids.length;
        A.showBlockingModal(i18nFmt('batch_deleting', { done: 1, total: total }));
        function next() {
          if (done >= total) {
            contentsBatchDeleteBtn.disabled = false;
            A.hideBlockingModal();
            if (contentsSelectAll) contentsSelectAll.checked = false;
            contentsBatchUpdateBar();
            contentsInvalidateListCache_();
            contentsLoadList({ resetSkip: true, skipCache: true });
            if (A.toast) A.toast.success(i18nFmt('batch_done', { n: total }));
            return;
          }
          var progMsg = i18nFmt('batch_deleting', { done: done + 1, total: total });
          if (contentsBatchCount) contentsBatchCount.textContent = progMsg;
          A.showBlockingModal(progMsg);
        google.script.run
          .withSuccessHandler(function () { done++; next(); })
          .withFailureHandler(function () { done++; next(); })
          .contentsDelete(ids[done]);
        }
        next();
      });
    });
  }

  function contentsStartNewFromQueue_(opts) {
    var o = opts || {};
    var type = String(o.contentType || '').trim();
    if (!type) return false;
    if (!S.get('canWriteContents')) {
      if (A.toast) A.toast.error(i18n('metrics_queue_upload_denied'));
      return false;
    }
    contentsResetForm();
    contentsSetEditorMode('new');
    if (contentsType) contentsType.value = type;
    contentsAfterTypeSelected_(type);
    var hint = String(o.titleHint || '').trim().slice(0, 120);
    if (hint && contentsTitle) contentsTitle.value = hint;
    contentsSetScreen('editor');
    return true;
  }

  A.contents = {
    loadList: contentsLoadList,
    setScreen: contentsSetScreen,
    toggleSpecificSections: contentsToggleSpecificSections,
    resetForm: contentsResetForm,
    populateClientCombo: contentsPopulateClientCombo,
    selectById: function (id) {
      contentsOpenEditorFromRow(id, { forceReadOnly: true });
    },
    openViewById: function (id) {
      contentsOpenEditorFromRow(id, { forceReadOnly: true });
    },
    openEditById: function (id) {
      contentsOpenEditorFromRow(id, { forceEdit: true });
    },
    startNewFromQueue: contentsStartNewFromQueue_,
    applyWriteAccess: contentsApplyWriteAccess,
  };
})(window.Aviators);
</script>
