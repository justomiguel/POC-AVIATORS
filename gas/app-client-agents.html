<script>
(function (A) {
  var S = A.state;
  var i18n = A.i18n;
  var i18nFmt = A.i18nFmt;

  var adminAgentNavList = document.getElementById('admin-agent-nav-list');
  var adminAgentNewBtn = document.getElementById('admin-agent-new-btn');
  var adminAgentSeedBtn = document.getElementById('admin-agent-seed-btn');
  var adminAgentSeedLoader = document.getElementById('admin-agent-seed-loader');
  var adminAgentSeedLoaderText = document.getElementById('admin-agent-seed-loader-text');
  var adminAgentEditor = document.getElementById('admin-agent-editor');
  var adminAgentDisplayEyebrow = document.getElementById('admin-agent-display-eyebrow');
  var adminAgentDisplayName = document.getElementById('admin-agent-display-name');
  var adminAgentDisplayMeta = document.getElementById('admin-agent-display-meta');
  var agentsSidebarEmptyOnboard = document.getElementById('agents-sidebar-empty-onboard');
  var agentsRoSidebarEmptyOnboard = document.getElementById('agents-ro-sidebar-empty-onboard');
  var agentsAdminLayout = document.getElementById('agents-admin-layout');
  var agentsRoLayout = document.getElementById('agents-ro-layout');
  var agentsRoDisplayName = document.getElementById('agents-ro-display-name');
  var agentsRoDisplayMeta = document.getElementById('agents-ro-display-meta');
  var adminAgentProfile = document.getElementById('admin-agent-profile');
  var adminAgentPrompt = document.getElementById('admin-agent-prompt');
  var adminAgentApiIdOrName = document.getElementById('admin-agent-api-id-or-name');
  var adminAgentApiName = document.getElementById('admin-agent-api-name');
  var adminAgentApiModel = document.getElementById('admin-agent-api-model');
  var adminAgentApiStrategy = document.getElementById('admin-agent-api-strategy');
  var adminAgentApiMaxTokens = document.getElementById('admin-agent-api-max-tokens');
  var adminAgentApiTimeout = document.getElementById('admin-agent-api-timeout');
  var adminAgentApiTemperature = document.getElementById('admin-agent-api-temperature');
  var adminAgentApiAccessScope = document.getElementById('admin-agent-api-access-scope');
  var adminAgentApiSharingScope = document.getElementById('admin-agent-api-sharing-scope');
  var adminAgentApiStatus = document.getElementById('admin-agent-api-status');
  var adminAgentApiAutomaticPublish = document.getElementById('admin-agent-api-automatic-publish');
  var adminAgentApiJobDescription = document.getElementById('admin-agent-api-job-description');
  var adminAgentApiDescription = document.getElementById('admin-agent-api-description');
  var adminAgentApiAvatar = document.getElementById('admin-agent-api-avatar');
  var adminAgentApiPromptContext = document.getElementById('admin-agent-api-prompt-context');
  var adminAgentSources = document.getElementById('admin-agent-sources');
  var adminAgentSaveBtn = document.getElementById('admin-agent-save-btn');
  var adminAgentSyncBtn = document.getElementById('admin-agent-sync-btn');
  var adminAgentDeleteBtn = document.getElementById('admin-agent-delete-btn');
  var adminAgentDeleteModal = document.getElementById('admin-agent-delete-modal');
  var adminAgentDeleteModalCancel = document.getElementById('admin-agent-delete-modal-cancel');
  var adminAgentDeleteModalConfirm = document.getElementById('admin-agent-delete-modal-confirm');
  var adminAgentMeta = document.getElementById('admin-agent-meta');
  var adminAgentDocsRefresh = document.getElementById('admin-agent-docs-refresh');
  var adminAgentDocsBody = document.getElementById('admin-agent-docs-body');
  var adminAgentStatus = document.getElementById('admin-agent-status');
  var adminAgentDropzone = document.getElementById('admin-agent-dropzone');
  var adminAgentBrowseLocalBtn = document.getElementById('admin-agent-browse-local-btn');
  var adminAgentLocalFilesInput = document.getElementById('admin-agent-local-files-input');
  var adminAgentProgressWrap = document.getElementById('admin-agent-progress-wrap');
  var adminAgentProgressMsg = document.getElementById('admin-agent-progress-msg');
  var adminAgentApiCatalog = { models: [], strategies: [] };
  var agentsRoNavList = document.getElementById('agents-ro-nav-list');
  var agentsRoDetail = document.getElementById('agents-ro-detail');
  var agentsRoProfile = document.getElementById('agents-ro-profile');
  var agentsRoLastSync = document.getElementById('agents-ro-last-sync');
  var agentsRoPrompt = document.getElementById('agents-ro-prompt');
  var agentsRoSources = document.getElementById('agents-ro-sources');
  var agentsRoModel = document.getElementById('agents-ro-model');
  var agentsRoStrategy = document.getElementById('agents-ro-strategy');
  var adminAgentSecProfileHeading = document.getElementById('admin-agent-sec-profile-heading');
  var adminAgentSecPromptHeading = document.getElementById('admin-agent-sec-prompt-heading');
  var adminAgentSecApiHeading = document.getElementById('admin-agent-sec-api-heading');
  var adminAgentSecSourcesHeading = document.getElementById('admin-agent-sec-sources-heading');
  var adminAgentSecActionsHeading = document.getElementById('admin-agent-sec-actions-heading');
  var agentsBatchBar = document.getElementById('agents-batch-bar');
  var agentsBatchCount = document.getElementById('agents-batch-count');
  var agentsBatchSyncBtn = document.getElementById('agents-batch-sync-btn');
  var agentsBatchDeleteBtn = document.getElementById('agents-batch-delete-btn');

  var adminAgentTabRoot = document.querySelector('#admin-agent-editor [data-app-tab-group]');
  var agentsRoTabRoot = document.querySelector('#agents-ro-detail [data-app-tab-group]');
  var adminAgentTabs = adminAgentTabRoot ? A.initTabGroup(adminAgentTabRoot) : null;
  var agentsRoTabs = agentsRoTabRoot ? A.initTabGroup(agentsRoTabRoot) : null;

  function agentsActivateDefaultTab() {
    if (adminAgentTabs) adminAgentTabs.activate('admin-agent-tab-general');
    if (agentsRoTabs) agentsRoTabs.activate('agents-ro-tab-general');
  }

  function adminShowBlocking(msg) {
    if (A.showBlockingModal) A.showBlockingModal(msg || i18n('busy_connecting'));
  }
  function adminHideBlocking() {
    if (A.hideBlockingModal) A.hideBlockingModal();
  }

  function adminReportAgentError(err, fallbackKey) {
    if (A.reportRpcError) {
      A.reportRpcError(err, {
        scope: 'agents',
        fallbackKey: fallbackKey || 'err_generic',
        modal: true,
        toast: true,
        setStatus: function (m) {
          setAdminAgentBusy(false, '\u00a0');
          if (adminAgentStatus) {
            var short = m.length > 160 ? m.slice(0, 157) + '\u2026' : m;
            adminAgentStatus.textContent = short;
            adminAgentStatus.classList.add('err');
          }
        },
      });
      return;
    }
    adminHideBlocking();
    setAdminAgentBusy(false, '\u00a0');
    if (adminAgentStatus) {
      adminAgentStatus.textContent =
        err && err.message ? err.message : i18n(fallbackKey || 'err_generic');
      adminAgentStatus.classList.add('err');
    }
  }

  function agentsIsReadOnlyMode() {
    return !!(S.get('canViewAgents') && !S.get('canManageAgents'));
  }

  function agentsCurrentNavList() {
    return agentsIsReadOnlyMode() ? agentsRoNavList : adminAgentNavList;
  }

  function stripIdFromLists(id) {
    var src = S.get('adminSourcesState');
    var f, i, fid = [], fod = [];
    for (i = 0; i < src.folders.length; i++) {
      f = src.folders[i];
      if (f.id !== id) fod.push(f);
    }
    for (i = 0; i < src.files.length; i++) {
      f = src.files[i];
      if (f.id !== id) fid.push(f);
    }
    src.folders = fod;
    src.files = fid;
  }

  function addFolderToState(item) {
    if (!item || !item.id) return;
    stripIdFromLists(item.id);
    var src = S.get('adminSourcesState');
    var k;
    for (k = 0; k < src.folders.length; k++) {
      if (src.folders[k].id === item.id) { renderAgentSourceChips(); return; }
    }
    src.folders.push({ id: item.id, name: item.name || item.id });
    renderAgentSourceChips();
  }

  function addFileToState(item) {
    if (!item || !item.id || item.mimeType === A.MIME_FOLDER) return;
    var sourceKind = item.source === 'rag' ? 'rag' : 'drive';
    stripIdFromLists(item.id);
    var src = S.get('adminSourcesState');
    var k;
    for (k = 0; k < src.files.length; k++) {
      if (src.files[k].id === item.id) { renderAgentSourceChips(); return; }
    }
    var row = { id: item.id, name: item.name || item.id };
    if (sourceKind === 'rag') row.source = 'rag';
    src.files.push(row);
    renderAgentSourceChips();
  }

  function removeFromAdminState(kind, id) {
    var src = S.get('adminSourcesState');
    var arr = kind === 'folder' ? src.folders : src.files;
    for (var i = arr.length - 1; i >= 0; i--) {
      if (arr[i].id === id) arr.splice(i, 1);
    }
    renderAgentSourceChips();
  }

  function renderAgentSourceChips() {
    var src = S.get('adminSourcesState');
    var nf = src.folders.length;
    var na = src.files.length;
    if (!adminAgentSources) return;
    adminAgentSources.innerHTML = '';
    if (nf === 0 && na === 0) {
      adminAgentSources.textContent = i18n('admin_selection_empty');
      adminAgentSources.classList.add('empty');
    } else {
      adminAgentSources.classList.remove('empty');
      var fi;
      for (fi = 0; fi < src.folders.length; fi++) {
        adminAgentSources.appendChild(adminMakeChip('folder', src.folders[fi]));
      }
      for (fi = 0; fi < src.files.length; fi++) {
        adminAgentSources.appendChild(adminMakeChip('file', src.files[fi]));
      }
    }
  }

  function adminMakeChip(kind, entry) {
    var wrap = document.createElement('span');
    wrap.className = 'chip';
    var ty = document.createElement('span');
    ty.className = 'chip-type';
    ty.textContent =
      kind === 'folder'
        ? i18n('chip_folder')
        : entry.source === 'rag'
          ? i18n('chip_file_globant')
          : i18n('chip_file');
    var nm = document.createElement('span');
    nm.textContent = entry.name;
    wrap.appendChild(ty);
    wrap.appendChild(nm);
    if (S.get('canManageAgents')) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'x';
      btn.setAttribute('aria-label', i18n('chip_remove_aria'));
      btn.textContent = '\u00d7';
      (function (k, eid) {
        btn.addEventListener('click', function () { removeFromAdminState(k, eid); });
      })(kind, entry.id);
      wrap.appendChild(btn);
    }
    return wrap;
  }

  var AGENTS_CACHE_TTL = 120000;

  function agentsIsCreatingNew_() {
    return (
      !!S.get('canManageAgents') &&
      adminAgentEditor &&
      !adminAgentEditor.classList.contains('hidden') &&
      !S.get('adminSelectedAgentId')
    );
  }

  function agentsUpdateShellState_() {
    var cache = S.get('adminAgentsCache') || [];
    var hasAgents = cache.length > 0;
    var readOnly = agentsIsReadOnlyMode();
    var creatingNew = agentsIsCreatingNew_();
    var sidebarOnly = !hasAgents && !creatingNew;

    if (agentsAdminLayout) {
      agentsAdminLayout.classList.toggle('agents-layout-empty', sidebarOnly && !readOnly);
    }
    if (agentsRoLayout) {
      agentsRoLayout.classList.toggle('agents-layout-empty', sidebarOnly && readOnly);
    }

    var adminShell = document.getElementById('page-agents');
    var roShell = document.getElementById('page-agents-readonly');
    var adminPageShell = adminShell && adminShell.querySelector('.agents-page-shell');
    var roPageShell = roShell && roShell.querySelector('.agents-page-shell');
    if (adminPageShell) adminPageShell.classList.toggle('agents-shell-empty', sidebarOnly && !readOnly);
    if (roPageShell) roPageShell.classList.toggle('agents-shell-empty', sidebarOnly && readOnly);

    if (agentsSidebarEmptyOnboard) {
      agentsSidebarEmptyOnboard.classList.toggle('hidden', hasAgents || creatingNew || readOnly);
    }
    if (agentsRoSidebarEmptyOnboard) {
      agentsRoSidebarEmptyOnboard.classList.toggle('hidden', hasAgents || !readOnly);
    }
    if (adminAgentNavList) {
      adminAgentNavList.classList.toggle('hidden', !hasAgents);
    }
    if (agentsRoNavList) {
      agentsRoNavList.classList.toggle('hidden', !hasAgents);
    }
  }

  function updateAgentEditorHeader_(ag) {
    var isNew = agentsIsCreatingNew_();
    if (adminAgentDisplayEyebrow) {
      adminAgentDisplayEyebrow.textContent = i18n(isNew ? 'admin_agent_new' : 'admin_agent_editor_selected');
    }
    if (adminAgentDisplayName) {
      if (isNew) {
        var draft = adminAgentProfile && adminAgentProfile.value.trim();
        adminAgentDisplayName.textContent = draft || i18n('admin_agent_editor_new');
      } else if (ag) {
        adminAgentDisplayName.textContent = ag.profileName || ag.id || i18n('label_em_dash');
      }
    }
    if (adminAgentDisplayMeta) {
      if (isNew) {
        adminAgentDisplayMeta.textContent = '\u00a0';
      } else if (ag && ag.lastSync) {
        adminAgentDisplayMeta.textContent = i18nFmt('admin_agent_last_sync', { date: ag.lastSync });
      } else {
        adminAgentDisplayMeta.textContent = '\u00a0';
      }
    }
  }

  function updateAgentReadonlyHeader_(ag) {
    if (!ag) return;
    if (agentsRoDisplayName) {
      agentsRoDisplayName.textContent = ag.profileName || ag.id || i18n('label_em_dash');
    }
    if (agentsRoDisplayMeta) {
      agentsRoDisplayMeta.textContent = ag.lastSync
        ? i18nFmt('admin_agent_last_sync', { date: ag.lastSync })
        : '\u00a0';
    }
  }

  function agentsSelectByProfileName_(profileName) {
    var want = String(profileName || '').trim().toLowerCase();
    if (!want) return false;
    var cache = S.get('adminAgentsCache') || [];
    for (var i = 0; i < cache.length; i++) {
      var ag = cache[i];
      if (!ag) continue;
      var pn = String(ag.profileName || '').trim().toLowerCase();
      var id = String(ag.id || '').trim().toLowerCase();
      if (pn === want || id === want) {
        selectAdminAgent(ag.id);
        return true;
      }
    }
    return false;
  }

  function loadAdminAgentsListBody_(agents, onDone) {
    var selId = S.get('adminSelectedAgentId');
    if (selId) {
      var stillThere = false;
      for (var si = 0; si < agents.length; si++) {
        if (agents[si] && agents[si].id === selId) {
          stillThere = true;
          break;
        }
      }
      if (!stillThere) S.set('adminSelectedAgentId', null);
    }
    S.set('adminAgentsCache', agents);
    applyAgentsWriteAccess();
    renderAdminAgentNav();
    if (!agents.length) {
      if (adminAgentEditor) adminAgentEditor.classList.add('hidden');
      if (agentsRoDetail) agentsRoDetail.classList.add('hidden');
      S.set('adminSelectedAgentId', null);
      agentsUpdateShellState_();
      if (typeof onDone === 'function') onDone();
      return;
    }
    var pendingProfile = S.get('agentsPendingProfileName');
    if (pendingProfile) {
      S.set('agentsPendingProfileName', null);
      if (agentsSelectByProfileName_(pendingProfile)) {
        if (typeof onDone === 'function') onDone();
        return;
      }
      if (A.toast) {
        A.toast.info(i18nFmt('chat_ref_agent_not_in_list', { profile: pendingProfile }));
      }
    }
    selectAdminAgent(S.get('adminSelectedAgentId') || agents[0].id);
    if (typeof onDone === 'function') onDone();
  }

  function loadAdminAgentsList(onDone, skipCache) {
    if (!agentsCurrentNavList()) return;

    if (!skipCache) {
      var cached = A.cache.get('agentsList');
      if (cached) {
        loadAdminAgentsListBody_(cached, onDone);
        return;
      }
    }

    google.script.run
      .withSuccessHandler(function (res) {
        var agents = (res && res.agents) || [];
        A.cache.set('agentsList', agents, AGENTS_CACHE_TTL);
        loadAdminAgentsListBody_(agents, onDone);
      })
      .withFailureHandler(function (e) {
        if (adminAgentStatus) {
          adminAgentStatus.textContent = e && e.message ? e.message : i18n('err_generic');
          adminAgentStatus.classList.add('err');
        }
        if (typeof onDone === 'function') onDone();
      })
      .adminAgentsList();
  }

  function renderAdminAgentNav() {
    var navList = agentsCurrentNavList();
    if (!navList) return;
    var canWrite = !!S.get('canManageAgents');
    navList.innerHTML = '';
    var cache = S.get('adminAgentsCache');
    var selId = S.get('adminSelectedAgentId');
    for (var i = 0; i < cache.length; i++) {
      (function (ag) {
        var li = document.createElement('li');
        li.className = 'flex items-center gap-1';
        if (canWrite) {
          var cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.className = 'agents-batch-cb rounded shrink-0';
          cb.dataset.agentId = ag.id;
          cb.addEventListener('change', agentsBatchUpdateBar);
          li.appendChild(cb);
        }
        var bt = document.createElement('button');
        bt.type = 'button';
        bt.className = 'admin-agent-nav-btn flex-1';
        if (ag.id === selId) bt.classList.add('is-active');
        bt.setAttribute('data-agent-id', ag.id);
        var span = document.createElement('span');
        span.textContent = ag.profileName || ag.id;
        bt.appendChild(span);
        var remoteMissing = ag.ragProfileOnRemote === false;
        if (remoteMissing) {
          var badge = document.createElement('span');
          badge.className =
            'ml-2 inline-flex shrink-0 items-center rounded-full border border-amber-200 bg-amber-50 px-1.5 py-0.5 text-[10px] font-medium uppercase tracking-wide text-amber-800 dark:border-amber-800 dark:bg-amber-950/50 dark:text-amber-300';
          var badgeKey = 'admin_agent_badge_remote_missing';
          badge.setAttribute('title', i18n(badgeKey));
          badge.textContent = '!';
          badge.setAttribute('aria-label', i18n(badgeKey));
          bt.appendChild(badge);
        }
        bt.addEventListener('click', function () { selectAdminAgent(ag.id); });
        li.appendChild(bt);
        navList.appendChild(li);
      })(cache[i]);
    }
    agentsBatchUpdateBar();
  }

  function adminAgentApiDefaults(profileName, systemPrompt) {
    return {
      idOrName: profileName || '',
      automaticPublish: false,
      accessScope: 'private',
      sharingScope: 'organization',
      status: 'active',
      name: profileName || '',
      jobDescription: '',
      avatarImage: '',
      description: '',
      strategyName: 'Chain of Thought',
      promptContext: '',
      promptInstructions: systemPrompt || '',
      modelName: 'openai/gpt-5.5',
      maxTokens: 8000,
      timeout: 120,
      temperature: 0.2,
    };
  }

  function adminSetSelectOptions(selectEl, options, currentValue, placeholderKey) {
    if (!selectEl) return;
    var current = String(currentValue || '').trim();
    var normalized = [];
    var seen = {};
    var i;
    for (i = 0; i < options.length; i++) {
      var v = String(options[i] || '').trim();
      if (!v || seen[v]) continue;
      seen[v] = true;
      normalized.push(v);
    }
    if (current && !seen[current]) normalized.unshift(current);

    selectEl.innerHTML = '';
    var ph = document.createElement('option');
    ph.value = '';
    ph.textContent = i18n(placeholderKey);
    ph.disabled = true;
    ph.selected = !current;
    selectEl.appendChild(ph);
    for (i = 0; i < normalized.length; i++) {
      var op = document.createElement('option');
      op.value = normalized[i];
      op.textContent = normalized[i];
      selectEl.appendChild(op);
    }
    if (current) selectEl.value = current;
  }

  function renderAdminApiCatalog(currentModel, currentStrategy) {
    adminSetSelectOptions(
      adminAgentApiModel,
      adminAgentApiCatalog.models || [],
      currentModel || '',
      'ph_admin_agent_api_model',
    );
    adminSetSelectOptions(
      adminAgentApiStrategy,
      adminAgentApiCatalog.strategies || [],
      currentStrategy || '',
      'ph_admin_agent_api_strategy',
    );
  }

  function loadAdminApiCatalog() {
    google.script.run
      .withSuccessHandler(function (res) {
        adminAgentApiCatalog = {
          models: (res && res.models) || [],
          strategies: (res && res.strategies) || [],
        };
        renderAdminApiCatalog(
          adminAgentApiModel && adminAgentApiModel.value,
          adminAgentApiStrategy && adminAgentApiStrategy.value,
        );
      })
      .withFailureHandler(function () {
        adminAgentApiCatalog = {
          models: [],
          strategies: ['Chain of Thought'],
        };
        renderAdminApiCatalog(
          adminAgentApiModel && adminAgentApiModel.value,
          adminAgentApiStrategy && adminAgentApiStrategy.value,
        );
      })
      .adminAgentsApiCatalog();
  }

  function fillAdminAgentApiForm(ag) {
    var cfg = adminAgentApiDefaults(ag.profileName || '', ag.systemPrompt || '');
    if (ag.globantAgent && typeof ag.globantAgent === 'object') {
      cfg = Object.assign(cfg, ag.globantAgent);
    }
    if (adminAgentApiIdOrName) adminAgentApiIdOrName.value = cfg.idOrName || '';
    if (adminAgentApiName) adminAgentApiName.value = cfg.name || '';
    renderAdminApiCatalog(cfg.modelName || '', cfg.strategyName || '');
    if (adminAgentApiMaxTokens) adminAgentApiMaxTokens.value = String(cfg.maxTokens || 8000);
    if (adminAgentApiTimeout) adminAgentApiTimeout.value = String(cfg.timeout || 0);
    if (adminAgentApiTemperature) {
      adminAgentApiTemperature.value =
        typeof cfg.temperature === 'number' ? String(cfg.temperature) : '0.2';
    }
    if (adminAgentApiAccessScope) adminAgentApiAccessScope.value = cfg.accessScope || 'private';
    if (adminAgentApiSharingScope) {
      adminAgentApiSharingScope.value = cfg.sharingScope || 'organization';
    }
    if (adminAgentApiStatus) adminAgentApiStatus.value = cfg.status || 'active';
    if (adminAgentApiAutomaticPublish) {
      adminAgentApiAutomaticPublish.checked = !!cfg.automaticPublish;
    }
    if (adminAgentApiJobDescription) {
      adminAgentApiJobDescription.value = cfg.jobDescription || '';
    }
    if (adminAgentApiDescription) adminAgentApiDescription.value = cfg.description || '';
    if (adminAgentApiAvatar) adminAgentApiAvatar.value = cfg.avatarImage || '';
    if (adminAgentApiPromptContext) {
      adminAgentApiPromptContext.value = cfg.promptContext || '';
    }
  }

  function fillAdminAgentForm(ag) {
    if (!ag) return;
    if (adminAgentProfile) adminAgentProfile.value = ag.profileName || '';
    if (adminAgentPrompt) adminAgentPrompt.value = ag.systemPrompt || '';
    fillAdminAgentApiForm(ag);
    S.set('adminSourcesState', {
      folders: (ag.sources && ag.sources.folders) || [],
      files: (ag.sources && ag.sources.files) || [],
    });
    renderAgentSourceChips();
    var meta = '';
    if (ag.lastSync && adminAgentMeta) {
      meta = i18nFmt('admin_agent_last_sync', { date: ag.lastSync });
    }
    if (adminAgentMeta) adminAgentMeta.textContent = meta;
  }

  function renderReadonlySources_(ag) {
    if (!agentsRoSources) return;
    agentsRoSources.innerHTML = '';
    var folders = (ag && ag.sources && ag.sources.folders) || [];
    var files = (ag && ag.sources && ag.sources.files) || [];
    var i;
    function appendChip(kind, label) {
      var chip = document.createElement('span');
      chip.className = 'chip';
      var ty = document.createElement('span');
      ty.className = 'chip-type';
      ty.textContent = kind;
      var nm = document.createElement('span');
      nm.textContent = label;
      chip.appendChild(ty);
      chip.appendChild(nm);
      agentsRoSources.appendChild(chip);
    }
    for (i = 0; i < folders.length; i++) {
      appendChip(i18n('chip_folder'), folders[i].name || folders[i].id || i18n('label_em_dash'));
    }
    for (i = 0; i < files.length; i++) {
      var fSrc = files[i];
      var fk =
        fSrc && fSrc.source === 'rag' ? i18n('chip_file_globant') : i18n('chip_file');
      appendChip(fk, fSrc.name || fSrc.id || i18n('label_em_dash'));
    }
    if (!folders.length && !files.length) {
      var empty = document.createElement('p');
      empty.className = 'text-sm text-slate-500 dark:text-slate-400';
      empty.textContent = i18n('admin_selection_empty');
      agentsRoSources.appendChild(empty);
    }
  }

  function fillAgentReadonlyDetail_(ag) {
    if (!ag) return;
    updateAgentReadonlyHeader_(ag);
    var cfg = adminAgentApiDefaults(ag.profileName || '', ag.systemPrompt || '');
    if (ag.globantAgent && typeof ag.globantAgent === 'object') {
      cfg = Object.assign(cfg, ag.globantAgent);
    }
    function resolveModelLabel_() {
      var gg = ag && ag.globantAgent && typeof ag.globantAgent === 'object'
        ? ag.globantAgent
        : {};
      var models = gg && Array.isArray(gg.models) ? gg.models : [];
      var m0 = models.length ? models[0] : null;
      return String(
        cfg.modelName ||
          ag.modelName ||
          gg.modelName ||
          gg.model ||
          gg.model_name ||
          (m0 && m0.name) ||
          '',
      ).trim();
    }
    if (agentsRoProfile) agentsRoProfile.textContent = ag.profileName || i18n('label_em_dash');

  function adminUploadFilterPdfFiles(fileList) {
    var out = [];
    if (!fileList || !fileList.length) return out;
    for (var i = 0; i < fileList.length; i++) {
      var f = fileList[i];
      if (!f) continue;
      var ok = f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '');
      if (ok) out.push(f);
    }
    return out;
  }

  function refreshUploadLimitHint() {
    var el = document.getElementById('admin-agent-upload-size-hint');
    if (!el) return;
    var maxB = S.get('adminUploadMaxBytes') || 50 * 1024 * 1024;
    var mb = Math.floor(maxB / (1024 * 1024));
    el.textContent = i18nFmt('admin_agent_pdf_max_size_hint', { mb: String(mb) });
  }

  function adminUploadMaxBytesOrDefault() {
    return S.get('adminUploadMaxBytes') || 50 * 1024 * 1024;
  }

  function adminUploadFailMessage_(e) {
    if (e && e.message) return e.message;
    return i18nFmt('err_admin_upload_rpc_lost', {
      max_mb: String(Math.floor(adminUploadMaxBytesOrDefault() / (1024 * 1024))),
    });
  }

  function uploadAdminLocalPdfQueue(files, index, successCount, profileName) {
    successCount = successCount || 0;
    if (!files.length) return;
    if (index >= files.length) {
      setAdminAgentBusy(false, '\u00a0');
      if (adminAgentStatus) {
        adminAgentStatus.classList.remove('err');
        adminAgentStatus.textContent =
          successCount > 0
            ? i18nFmt('admin_upload_done_added', { n: successCount })
            : '\u00a0';
      }
      return;
    }
    var f = files[index];
    setAdminAgentBusy(true, i18nFmt('admin_upload_progress_globant', { current: index + 1, total: files.length }));
    var reader = new FileReader();
    reader.onload = function () {
      var s = reader.result;
      var b64 = typeof s === 'string' && s.indexOf(',') >= 0 ? s.split(',')[1] : '';
      var mime = f.type && f.type.indexOf('pdf') >= 0 ? f.type : 'application/pdf';
      var payload = JSON.stringify({
        name: f.name,
        mimeType: mime,
        dataBase64: b64,
        profileName: profileName || '',
        systemPrompt: (adminAgentPrompt && adminAgentPrompt.value) || '',
      });
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.id) {
            addFileToState({ id: res.id, name: res.name || f.name, source: 'rag' });
            uploadAdminLocalPdfQueue(files, index + 1, successCount + 1, profileName);
          } else {
            setAdminAgentBusy(false, '\u00a0');
            if (adminAgentStatus) {
              adminAgentStatus.textContent = i18nFmt('err_admin_upload_failed', { name: f.name });
              adminAgentStatus.classList.add('err');
            }
          }
        })
        .withFailureHandler(function (e) {
          setAdminAgentBusy(false, '\u00a0');
          if (adminAgentStatus) {
            adminAgentStatus.textContent = adminUploadFailMessage_(e);
            adminAgentStatus.classList.add('err');
          }
        })
        .adminAgentsUploadLocalPdf(payload);
    };
    reader.onerror = function () {
      setAdminAgentBusy(false, '\u00a0');
      if (adminAgentStatus) {
        adminAgentStatus.textContent = adminUploadFailMessage_(null);
        adminAgentStatus.classList.add('err');
      }
    };
    reader.readAsDataURL(f);
  }

  function handleAdminLocalFilesChosen(fileList) {
    if (!fileList || !fileList.length) return;
    var emailEl = document.getElementById('email');
    if (!emailEl || !(emailEl.textContent || '').trim()) {
      if (adminAgentStatus) {
        adminAgentStatus.textContent = i18n('admin_need_email_drive');
        adminAgentStatus.classList.add('err');
      }
      return;
    }
    var profile = (adminAgentProfile && adminAgentProfile.value || '').trim();
    if (!profile) {
      if (adminAgentStatus) {
        adminAgentStatus.textContent = i18n('err_admin_upload_profile_required');
        adminAgentStatus.classList.add('err');
      }
      return;
    }
    var valid = adminUploadFilterPdfFiles(fileList);
    if (!valid.length) {
      if (adminAgentStatus) {
        adminAgentStatus.textContent = i18n('err_admin_upload_only_pdf');
        adminAgentStatus.classList.add('err');
      }
      return;
    }
    var maxB = adminUploadMaxBytesOrDefault();
    var zi;
    for (zi = 0; zi < valid.length; zi++) {
      if (valid[zi].size > maxB) {
        if (adminAgentStatus) {
          adminAgentStatus.textContent = i18nFmt('err_admin_upload_too_large', {
            name: valid[zi].name || 'PDF',
            max_mb: String(Math.floor(maxB / (1024 * 1024))),
          });
          adminAgentStatus.classList.add('err');
        }
        return;
      }
    }
    if (adminAgentStatus) adminAgentStatus.classList.remove('err');
    uploadAdminLocalPdfQueue(valid, 0, 0, profile);
  }

  function bindAdminAgentDropzone() {
    if (!adminAgentDropzone) return;
    adminAgentDropzone.addEventListener('click', function (ev) {
      if (!adminAgentBrowseLocalBtn || !adminAgentLocalFilesInput || adminAgentBrowseLocalBtn.disabled)
        return;
      var t = ev.target;
      if (t === adminAgentBrowseLocalBtn ||
          (adminAgentBrowseLocalBtn.contains && adminAgentBrowseLocalBtn.contains(t)))
        return;
      if (t === adminAgentLocalFilesInput) return;
      adminAgentLocalFilesInput.click();
    });
    adminAgentDropzone.addEventListener('dragenter', function (e) {
      e.preventDefault(); e.stopPropagation();
      adminAgentDropzone.classList.add('is-dragover');
    });
    adminAgentDropzone.addEventListener('dragleave', function (e) {
      e.preventDefault(); e.stopPropagation();
      var rect = adminAgentDropzone.getBoundingClientRect();
      var x = e.clientX, y = e.clientY;
      if (x < rect.left || x >= rect.right || y < rect.top || y >= rect.bottom) {
        adminAgentDropzone.classList.remove('is-dragover');
      }
    });
    adminAgentDropzone.addEventListener('dragover', function (e) {
      e.preventDefault(); e.stopPropagation();
      adminAgentDropzone.classList.add('is-dragover');
    });
    adminAgentDropzone.addEventListener('drop', function (e) {
      e.preventDefault(); e.stopPropagation();
      adminAgentDropzone.classList.remove('is-dragover');
      var dt = e.dataTransfer;
      if (!dt || !dt.files) return;
      handleAdminLocalFilesChosen(dt.files);
    });
  }

  function gcRenderRagDocsRows(tbody, pname, list) {
    var canWrite = !!S.get('canManageAgents');
    for (var di = 0; di < list.length; di++) {
      var d = list[di];
      var dr = document.createElement('tr');
      var dn = document.createElement('td');
      dn.textContent = d.name || i18n('label_em_dash');
      var ds = document.createElement('td');
      ds.textContent = d.indexStatus || '';
      var dact = document.createElement('td');
      dact.className = 'flex items-center gap-2';
      if (d.url) {
        var viewLink = document.createElement('a');
        viewLink.href = d.url;
        viewLink.target = '_blank';
        viewLink.rel = 'noopener noreferrer';
        viewLink.className = 'btn btn-sm btn-outline';
        viewLink.innerHTML =
          '<i class="fa-solid fa-eye" aria-hidden="true"></i>' +
          '<span>' + i18n('gc_view_file') + '</span>';
        dact.appendChild(viewLink);
      }
      if (canWrite) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn btn-sm btn-outline';
        b.innerHTML =
          '<i class="fa-solid fa-trash" aria-hidden="true"></i>' +
          '<span>' + i18n('gc_remove') + '</span>';
        b.setAttribute('data-gc-act', 'rag-doc-del');
        b.setAttribute('data-pname', pname);
        b.setAttribute('data-doc', d.id || '');
        dact.appendChild(b);
      }
      dr.appendChild(dn);
      dr.appendChild(ds);
      dr.appendChild(dact);
      tbody.appendChild(dr);
    }
  }

  function gcRenderRagDocsIntoBox(pname, box, docsRes, append) {
    var list = docsRes.documents || [];
    var tot = docsRes.totalDocuments || list.length;
    var tbl, tbody;
    if (!append) {
      box.innerHTML = '';
      if (!list.length) {
        var e = document.createElement('div');
        e.textContent =
          docsRes.totalDocuments === 0
            ? i18n('gc_empty_docs_profile')
            : i18n('gc_empty_docs_page');
        box.appendChild(e);
        return;
      }
      tbl = document.createElement('table');
      tbl.className = 'gc-table';
      var st = document.createElement('thead');
      var sr = document.createElement('tr');
      ['gc_col_file', 'gc_col_index', 'gc_col_id'].forEach(function (hkey) {
        var th = document.createElement('th');
        th.textContent = i18n(hkey);
        sr.appendChild(th);
      });
      st.appendChild(sr);
      tbl.appendChild(st);
      tbody = document.createElement('tbody');
      tbl.appendChild(tbody);
      box.appendChild(tbl);
      gcRenderRagDocsRows(tbody, pname, list);
      gcMaybeAddMoreButton(pname, box, list.length, tot);
      return;
    }
    tbl = box.querySelector('table.gc-table');
    if (!tbl) return;
    tbody = tbl.querySelector('tbody');
    if (!tbody) return;
    gcRenderRagDocsRows(tbody, pname, list);
    var listedSoFar = tbody.querySelectorAll('tr').length;
    gcMaybeAddMoreButton(pname, box, listedSoFar, tot);
  }

      if (!adminAgentLocalFilesInput.disabled) adminAgentLocalFilesInput.click();
    });
  }
  if (adminAgentLocalFilesInput) {
    adminAgentLocalFilesInput.addEventListener('change', function () {
      if (adminAgentLocalFilesInput.files)
        handleAdminLocalFilesChosen(adminAgentLocalFilesInput.files);
      adminAgentLocalFilesInput.value = '';
    });
  }
  bindAdminAgentDropzone();
  applyAgentsWriteAccess();
  refreshUploadLimitHint();
  renderAdminApiCatalog('openai/gpt-5.5', 'Chain of Thought');
  loadAdminApiCatalog();
  if (adminAgentProfile) {
    adminAgentProfile.addEventListener('input', function () {
      var v = (adminAgentProfile.value || '').trim();
      if (agentsIsCreatingNew_()) updateAgentEditorHeader_(null);
      if (!v) return;
      if (adminAgentApiIdOrName && !String(adminAgentApiIdOrName.value || '').trim()) {
        adminAgentApiIdOrName.value = v;
      }
      if (adminAgentApiName && !String(adminAgentApiName.value || '').trim()) {
        adminAgentApiName.value = v;
      }
    });
  }
  if (adminAgentSaveBtn) {
    adminAgentSaveBtn.addEventListener('click', function () {
      if (!S.get('canManageAgents')) return;
      if (!adminAgentStatus) return;
      adminAgentStatus.classList.remove('err');
      setAdminAgentBusy(true, i18n('admin_busy_agent_save'));
      adminShowBlocking(i18n('admin_busy_agent_save'));
      A.cache.invalidate('agentsList');
      google.script.run
        .withSuccessHandler(function (res) {
          adminHideBlocking();
          setAdminAgentBusy(false, i18n('admin_agent_saved'));
          loadAdminAgentsList(null, true);
          if (res && res.agent && res.agent.id) {
            S.set('adminSelectedAgentId', res.agent.id);
            selectAdminAgent(res.agent.id);
          }
        })
        .withFailureHandler(function (e) {
          adminReportAgentError(e, 'err_admin_agent_save');
        })
        .adminAgentsSave(JSON.stringify(collectAdminAgentPayload()));
    });
  }
  if (adminAgentSyncBtn) {
    adminAgentSyncBtn.addEventListener('click', function () {
      if (!S.get('canManageAgents')) return;
      var id = S.get('adminSelectedAgentId');
      if (!id) {
        if (adminAgentStatus) {
          adminAgentStatus.textContent = i18n('err_admin_agent_not_found');
          adminAgentStatus.classList.add('err');
        }
        return;
      }
      A.confirmDialog({ message: i18n('confirm_corpus_resync'), danger: true }).then(function (ok) {
        if (!ok) return;
        var src = S.get('adminSourcesState');
        var nf = src.folders.length;
        var na = src.files.length;
        function runSync() {
          if (adminAgentStatus) adminAgentStatus.classList.remove('err');
          setAdminAgentBusy(true, i18n('admin_busy_agent_sync'));
          adminShowBlocking(i18n('admin_busy_agent_sync'));
          A.cache.invalidate('agentsList');
          google.script.run
            .withSuccessHandler(function (res) {
              adminHideBlocking();
              setAdminAgentBusy(false, '\u00a0');
              var sr = res && res.sync ? res.sync : {};
              var ag = res && res.agent ? res.agent : null;
              if (adminAgentStatus) {
                adminAgentStatus.textContent = i18nFmt('admin_agent_sync_done', {
                  profile: sr.profileName || '',
                  uploaded: sr.uploaded,
                  total: sr.docCount,
                });
              }
              if (ag && ag.lastSync && adminAgentMeta) {
                adminAgentMeta.textContent = i18nFmt('admin_agent_last_sync', { date: ag.lastSync });
              }
              loadAdminAgentsList(null, true);
              if (ag && ag.id) selectAdminAgent(ag.id);
              refreshAdminAgentDocuments(false);
            })
            .withFailureHandler(function (e) {
              adminReportAgentError(e, 'err_admin_sync');
            })
            .adminAgentsSync(id);
        }
        if (nf === 0 && na === 0) {
          A.confirmDialog({ message: i18n('confirm_empty_selection') }).then(function (ok2) {
            if (ok2) runSync();
          });
        } else {
          runSync();
        }
      });
    });
  }
  if (adminAgentDeleteBtn) {
    adminAgentDeleteBtn.addEventListener('click', function () {
      if (!S.get('canManageAgents')) return;
      var id = S.get('adminSelectedAgentId');
      if (!id) { openNewAdminAgent(); return; }
      openAdminAgentDeleteModal();
    });
  }
  if (adminAgentDeleteModal) {
    adminAgentDeleteModal.addEventListener('click', function (ev) {
      if (ev.target === adminAgentDeleteModal) closeAdminAgentDeleteModal();
    });
  }
  if (adminAgentDeleteModalCancel) {
    adminAgentDeleteModalCancel.addEventListener('click', function () { closeAdminAgentDeleteModal(); });
  }
  if (adminAgentDeleteModalConfirm) {
    adminAgentDeleteModalConfirm.addEventListener('click', function () { runAdminAgentDeleteConfirmed(); });
  }
  if (adminAgentDocsRefresh) {
    adminAgentDocsRefresh.addEventListener('click', function () { refreshAdminAgentDocuments(false); });
  }
  if (adminAgentDocsBody) {
    adminAgentDocsBody.addEventListener('click', function (ev) {
      var tgt = /** @type {HTMLElement} */ (ev.target);
      var btnEl = tgt && tgt.closest ? tgt.closest('[data-gc-act]') : null;
      var btn = btnEl instanceof Element ? btnEl : null;
      if (!btn || !adminAgentDocsBody.contains(btn)) return;
      var act = btn.getAttribute('data-gc-act');
      var pnameBtn = btn.getAttribute('data-pname') || '';
      var pname = ((adminAgentProfile && adminAgentProfile.value) || pnameBtn || '').trim();
      if (act === 'rag-docs-more') {
        refreshAdminAgentDocuments(true);
      } else if (act === 'rag-doc-del') {
        if (!S.get('canManageAgents')) return;
        var doc = btn.getAttribute('data-doc') || '';
        var pfrom = pnameBtn || pname;
        A.confirmDialog({
          message: i18nFmt('confirm_rag_doc_remove', { name: pfrom }),
          danger: true,
        }).then(function (ok) {
          if (!ok) return;
          adminShowBlocking(i18n('admin_busy_agent_delete'));
          google.script.run
            .withSuccessHandler(function () {
              adminHideBlocking();
              refreshAdminAgentDocuments(false);
            })
            .withFailureHandler(function (e) {
              adminReportAgentError(e, 'err_globant_profile_doc_required');
            })
            .adminGlobantDeleteRagDocument(pfrom, doc);
        });
      }
    });
  }

  function agentsBatchGetSelected() {
    if (!S.get('canManageAgents')) return [];
    var cbs = adminAgentNavList ? adminAgentNavList.querySelectorAll('.agents-batch-cb:checked') : [];
    var ids = [];
    for (var i = 0; i < cbs.length; i++) ids.push(cbs[i].dataset.agentId);
    return ids;
  }

  function agentsBatchUpdateBar() {
    if (!S.get('canManageAgents')) {
      if (agentsBatchBar) agentsBatchBar.classList.add('hidden');
      return;
    }
    var ids = agentsBatchGetSelected();
    if (agentsBatchBar) agentsBatchBar.classList.toggle('hidden', ids.length === 0);
    if (agentsBatchCount) agentsBatchCount.textContent = i18nFmt('batch_selected', { n: ids.length });
  }

  function agentsBatchClearSelection() {
    var cbs = adminAgentNavList ? adminAgentNavList.querySelectorAll('.agents-batch-cb') : [];
    for (var i = 0; i < cbs.length; i++) cbs[i].checked = false;
    agentsBatchUpdateBar();
  }

  if (agentsBatchSyncBtn) {
    agentsBatchSyncBtn.addEventListener('click', function () {
      if (!S.get('canManageAgents')) return;
      var ids = agentsBatchGetSelected();
      if (!ids.length) return;
      A.confirmDialog({ message: i18nFmt('batch_sync_confirm', { n: ids.length }) }).then(function (ok) {
        if (!ok) return;
        agentsBatchSyncBtn.disabled = true;
        if (agentsBatchDeleteBtn) agentsBatchDeleteBtn.disabled = true;
        var done = 0;
        var total = ids.length;
        adminShowBlocking(i18nFmt('batch_syncing', { done: 1, total: total }));
        function next() {
          if (done >= total) {
            agentsBatchSyncBtn.disabled = false;
            if (agentsBatchDeleteBtn) agentsBatchDeleteBtn.disabled = false;
            adminHideBlocking();
            agentsBatchClearSelection();
            if (A.toast) A.toast.success(i18nFmt('batch_sync_done', { n: total }));
            return;
          }
          var prog = i18nFmt('batch_syncing', { done: done + 1, total: total });
          if (agentsBatchCount) agentsBatchCount.textContent = prog;
          adminShowBlocking(prog);
          google.script.run
            .withSuccessHandler(function () { done++; next(); })
            .withFailureHandler(function () { done++; next(); })
            .adminAgentsSync(ids[done]);
        }
        next();
      });
    });
  }

  if (agentsBatchDeleteBtn) {
    agentsBatchDeleteBtn.addEventListener('click', function () {
      if (!S.get('canManageAgents')) return;
      var ids = agentsBatchGetSelected();
      if (!ids.length) return;
      A.confirmDialog({
        message: i18nFmt('batch_agents_delete_confirm', { n: ids.length }),
        danger: true,
      }).then(function (ok) {
        if (!ok) return;
        A.cache.invalidate('agentsList');
        agentsBatchDeleteBtn.disabled = true;
        if (agentsBatchSyncBtn) agentsBatchSyncBtn.disabled = true;
        var done = 0;
        var okCount = 0;
        var total = ids.length;
        adminShowBlocking(i18nFmt('batch_agents_deleting', { done: 1, total: total }));
        function nextDelete() {
          if (done >= total) {
            agentsBatchDeleteBtn.disabled = false;
            if (agentsBatchSyncBtn) agentsBatchSyncBtn.disabled = false;
            adminHideBlocking();
            agentsBatchClearSelection();
            loadAdminAgentsList(function () {
              if (A.toast) A.toast.success(i18nFmt('batch_agents_delete_done', { done: okCount, total: total }));
              if (A.dashboard && A.dashboard.loadMetrics) A.dashboard.loadMetrics();
            }, true);
            return;
          }
          if (agentsBatchCount) {
            agentsBatchCount.textContent = i18nFmt('batch_agents_deleting', {
              done: done + 1,
              total: total,
            });
          }
          adminShowBlocking(i18nFmt('batch_agents_deleting', { done: done + 1, total: total }));
          google.script.run
            .withSuccessHandler(function () { okCount++; done++; nextDelete(); })
            .withFailureHandler(function () { done++; nextDelete(); })
            .adminAgentsDelete(ids[done]);
        }
        nextDelete();
      });
    });
  }

  A.agents = {
    loadList: loadAdminAgentsList,
    selectAgent: selectAdminAgent,
    selectById: function (id) { selectAdminAgent(id); },
    selectByProfileName: agentsSelectByProfileName_,
    addFolderToState: addFolderToState,
    addFileToState: addFileToState,
    refreshUploadLimitHint: refreshUploadLimitHint,
  };

})(window.Aviators);
</script>
