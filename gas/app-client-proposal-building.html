  var materialsStatus = document.getElementById('pb-materials-status');
  var analyzeMaterialsBtn = document.getElementById('pb-analyze-materials-btn');
  var buildingStatusText = document.getElementById('pb-building-status-text');

  var successCasesBusyPhase = document.getElementById('pb-success-cases-busy-phase');

  ];

    'pb_extract_phase_prepare',

    'pb_extract_phase_analyze',

    'pb_extract_phase_commercial',
    'pb_extract_phase_contacts',

  ];
  var PB_EXTRACT_MERGE_PHASE_KEYS_ = [
    'pb_extract_merge_start',
    'pb_extract_merge_scope',
    'pb_extract_merge_commercial',
    'pb_extract_merge_contacts',

    'pb_extract_merge_finalize',
  ];
  var PB_STUDIOS_LANE_ORDER_ = ['ai_pods', 'digital', 'ai_vertical', 'enterprise', 'merge'];
  var PB_STUDIOS_PIPELINE_ = [
    {
      lane: 'ai_pods',

      detailKey: 'pb_studios_lane_ai_pods_detail',

    },
    {
      lane: 'digital',
      titleKey: 'pb_studios_lane_digital_title',
      detailKey: 'pb_studios_lane_digital_detail',
      icon: 'fa-microchip',
      agent: true,
      agentLabelKey: 'dash_agent_kind_proposals',
    },
    {
      lane: 'ai_vertical',
      titleKey: 'pb_studios_lane_ai_vertical_title',
      detailKey: 'pb_studios_lane_ai_vertical_detail',
      icon: 'fa-brain',
      agent: true,
      agentLabelKey: 'dash_agent_kind_proposals',
    },
    {
      lane: 'enterprise',
      titleKey: 'pb_studios_lane_enterprise_title',
      detailKey: 'pb_studios_lane_enterprise_detail',
      icon: 'fa-building-columns',

    {

  var PB_STUDIO_TYPE_ICONS_ = {

    ai: 'fa-brain',

  };
  var PB_SUCCESS_CASES_PHASE_KEYS_ = [
    'pb_success_cases_phase_search',
    'pb_success_cases_phase_match',
    'pb_success_cases_phase_agent',
    'pb_success_cases_phase_finalize',
  ];
  var PB_DECK_SUBPHASES_ = {
    pb_step_compose_understanding: [
      'pb_deck_sub_u_1',
      'pb_deck_sub_u_2',
      'pb_deck_sub_u_3',
      'pb_deck_sub_u_4',
    ],
    pb_step_copy_deck: ['pb_deck_sub_c_1', 'pb_deck_sub_c_2', 'pb_deck_sub_c_3', 'pb_deck_sub_c_4'],
    pb_step_compose_success_rationales: [
      'pb_deck_sub_r_1',
      'pb_deck_sub_r_2',
      'pb_deck_sub_r_3',
      'pb_deck_sub_r_4',
    ],
    pb_step_customize_slides: [
      'pb_deck_sub_s_1',
      'pb_deck_sub_s_2',
      'pb_deck_sub_s_3',
      'pb_deck_sub_s_4',
    ],
  };
  var PB_LOADER_ROTATE_MS_ = 2800;
  var pbExtractPhaseTimer_ = null;
  var pbMergePhaseTimer_ = null;
  var pbDeckSubphaseTimer_ = null;
  var pbStudiosPhaseTimer_ = null;
  var pbLoaderHintIdx_ = 0;
  var pbDeckCreateStepIndex_ = 0;
  var pbDeckCreateStepKey_ = '';
  var studiosBusyTitle = document.getElementById('pb-studios-busy-title');
  var studiosBusySubtitle = document.getElementById('pb-studios-busy-subtitle');
  var studiosPipelineList = document.getElementById('pb-studios-pipeline-list');
  var studiosBusyHint = document.getElementById('pb-studios-busy-hint');
  var pbStudiosPipelineBuilt_ = false;

  function pbStopExtractProgressTimer_() {
    if (pbExtractPhaseTimer_ != null) {
      clearInterval(pbExtractPhaseTimer_);
      pbExtractPhaseTimer_ = null;
    }
  }

  function pbStopMergeProgressTimer_() {
    if (pbMergePhaseTimer_ != null) {
      clearInterval(pbMergePhaseTimer_);
      pbMergePhaseTimer_ = null;
    }
  }

  function pbStopDeckSubphaseTimer_() {
    if (pbDeckSubphaseTimer_ != null) {
      clearInterval(pbDeckSubphaseTimer_);
      pbDeckSubphaseTimer_ = null;
    }
  }

  function pbStopStudiosProgressTimer_() {
    if (pbStudiosPhaseTimer_ != null) {
      clearInterval(pbStudiosPhaseTimer_);
      pbStudiosPhaseTimer_ = null;
    }
  }

  function pbNextLoaderHint_() {
    var key = PB_LOADER_HINT_KEYS_[pbLoaderHintIdx_ % PB_LOADER_HINT_KEYS_.length];
    pbLoaderHintIdx_ += 1;
    return i18n(key);
  }

  function pbShowBlockingProgress_(opts) {
    var options = opts || {};
    A.showBlockingModal({
      progress: true,
      message: options.message || '',
      counterText: options.counterText || '',
      analyzed: options.analyzed != null ? options.analyzed : 0,
      total: options.total != null ? options.total : 0,
      current: options.current != null ? options.current : 0,
      stepLabel: options.stepLabel || '',
      phase: options.phase || '',
      hint: options.hint || pbNextLoaderHint_(),
      fileName: options.fileName || '',
      barPercent: options.barPercent != null ? options.barPercent : 0,
    });
  }

  function pbFinishExtractUi_() {
    pbStopExtractProgressTimer_();
    pbStopMergeProgressTimer_();
    A.hideBlockingModal();
    if (analyzeMaterialsBtn) analyzeMaterialsBtn.disabled = false;
  }

  function pbGrowBriefTextarea_(el) {
    if (!el) return;
    el.style.overflowY = 'hidden';
    el.style.height = 'auto';
    var minPx = Math.max((Number(el.getAttribute('rows')) || 4) * 24, 88);
    el.style.height = Math.max(el.scrollHeight, minPx) + 'px';
    el.style.overflowY = 'visible';
  }

  function pbGrowAllBriefTextareas_() {
    var nodes = document.querySelectorAll('.pb-brief-textarea');
    for (var i = 0; i < nodes.length; i++) {
      pbGrowBriefTextarea_(nodes[i]);
    }
  }

  function pbScheduleBriefTextareaGrow_() {
    pbGrowAllBriefTextareas_();
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(function () {
        pbGrowAllBriefTextareas_();
        requestAnimationFrame(pbGrowAllBriefTextareas_);
      });
    }
  }

  function pbBindBriefTextarea_(el) {
    if (!el || el.getAttribute('data-pb-textarea-bound') === '1') return;
    el.setAttribute('data-pb-textarea-bound', '1');
    el.addEventListener('input', function () {
      pbGrowBriefTextarea_(el);
    });
    pbGrowBriefTextarea_(el);
  }

  function pbBindAllBriefTextareas_() {
    var nodes = document.querySelectorAll('.pb-brief-textarea');
    for (var i = 0; i < nodes.length; i++) {
      pbBindBriefTextarea_(nodes[i]);
    }
  }

  function pbShowExtractProgress_(fileCurrent, fileTotal, fileName, phaseKey, phaseKeys) {
    var keys = phaseKeys || PB_EXTRACT_RPC_PHASE_KEYS_;
    var phaseIdx = phaseKey ? keys.indexOf(phaseKey) : 0;
    if (phaseIdx < 0) phaseIdx = 0;
    var internalTotal = keys.length;
    var internalStep = phaseIdx + 1;
    var fileBar = fileTotal > 0 ? Math.round(((fileCurrent - 1) / fileTotal) * 100) : 0;
    var phaseBar = internalTotal > 0 ? Math.round((internalStep / internalTotal) * 100) : 0;
    var barPct = Math.round(fileBar * 0.55 + phaseBar * 0.45);
    if (barPct < 8) barPct = 8;
    if (barPct > 96) barPct = 96;
    pbShowBlockingProgress_({
      message: i18n('pb_busy_extracting_title'),
      counterText: i18nFmt('pb_loader_extract_counter', {
        current: String(fileCurrent),
        total: String(fileTotal),
      }),
      analyzed: fileCurrent,
      total: fileTotal,
      current: fileCurrent,
      stepLabel: i18nFmt('pb_extract_file_label', {
        current: String(fileCurrent),
        total: String(fileTotal),
      }),
      phase: i18n(phaseKey || keys[0]),
      fileName: fileName || '',
      barPercent: barPct,
    });
  }

  function pbStartExtractProgressTimer_(fileCurrent, fileTotal, fileName) {
    pbStopExtractProgressTimer_();
    var phaseIdx = 0;
    pbShowExtractProgress_(fileCurrent, fileTotal, fileName, PB_EXTRACT_RPC_PHASE_KEYS_[phaseIdx]);
    pbExtractPhaseTimer_ = setInterval(function () {
      phaseIdx = (phaseIdx + 1) % PB_EXTRACT_RPC_PHASE_KEYS_.length;
      pbShowExtractProgress_(fileCurrent, fileTotal, fileName, PB_EXTRACT_RPC_PHASE_KEYS_[phaseIdx]);
    }, PB_LOADER_ROTATE_MS_);
  }

  function pbStartMergeProgressTimer_(fileTotal) {
    pbStopMergeProgressTimer_();
    var phaseIdx = 0;
    pbShowExtractProgress_(fileTotal, fileTotal, '', PB_EXTRACT_MERGE_PHASE_KEYS_[phaseIdx], PB_EXTRACT_MERGE_PHASE_KEYS_);
    pbMergePhaseTimer_ = setInterval(function () {
      phaseIdx = (phaseIdx + 1) % PB_EXTRACT_MERGE_PHASE_KEYS_.length;
      pbShowExtractProgress_(fileTotal, fileTotal, '', PB_EXTRACT_MERGE_PHASE_KEYS_[phaseIdx], PB_EXTRACT_MERGE_PHASE_KEYS_);
    }, PB_LOADER_ROTATE_MS_);
  }

  function pbIsActivePage_() {
    return S.get('activePage') === 'proposal-building';
  }

  function pbGetSessionId_() {
    return String(S.get('proposalBuildingSessionId') || '').trim();
  }

  function pbSetSessionId_(sessionId) {
    var sid = String(sessionId || '').trim();
    if (sid) S.set('proposalBuildingSessionId', sid);
  }

  function pbCurrentStep_() {
    return S.get('proposalBuildingBuilderStep') || 'materials';
  }

  function pbSetStep_(step, opts) {
    var options = opts || {};
    if (PB_STEPS_.indexOf(step) < 0) step = 'materials';
    S.set('proposalBuildingBuilderStep', step);
    var maxReached = S.get('proposalBuildingMaxStep') || 0;
    var stepIdx = PB_STEP_ORDER_[step];
    if (stepIdx > maxReached) S.set('proposalBuildingMaxStep', stepIdx);

    var si;
    for (si = 0; si < builderPanels.length; si++) {
      var panel = builderPanels[si];
      var panelStep = panel.getAttribute('data-pb-panel');
      panel.classList.toggle('hidden', panelStep !== step);
    }

    if (stepper) {
      var tabs = stepper.querySelectorAll('[data-pb-step]');
      var ti;
      for (ti = 0; ti < tabs.length; ti++) {
        var tab = tabs[ti];
        var tabStep = tab.getAttribute('data-pb-step');
        var tabIdx = PB_STEP_ORDER_[tabStep];
        var isActive = tabStep === step;
        tab.classList.toggle('is-active', isActive);
        tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
        tab.disabled = tabIdx > (S.get('proposalBuildingMaxStep') || 0) && !isActive;
      }
    }

    S.set('proposalBuildingPhase', 'builder');
    if (step === 'studios') {
      var cachedStudios = S.get('proposalBuildingStudioRecommendations');
      if (cachedStudios && cachedStudios.length) {
        pbRenderStudios_(cachedStudios);
      }
    }
    if (step === 'success_cases') {
      var cachedCases = S.get('proposalBuildingSuccessCaseSelections');
      if (cachedCases && cachedCases.length) {
        pbRenderSuccessCases_(cachedCases);
      }
    }
    pbUpdateChrome_();

    if (options.scrollTop && builderRoot) {
      try {
        builderRoot.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (eScroll) {}
    }
  }

  function pbUpdateChrome_() {
    if (!pbIsActivePage_()) return;
    var step = pbCurrentStep_();
    if (pageStatus) {
      if (step === 'materials') {
        pageStatus.textContent = i18n('pb_status_materials');
      } else if (step === 'brief') {
        pageStatus.textContent = i18n('pb_status_brief');
      } else if (step === 'studios') {
        pageStatus.textContent = i18n('pb_status_studios');
      } else if (step === 'success_cases') {
        pageStatus.textContent = i18n('pb_status_success_cases');
      } else if (step === 'configure') {
        pageStatus.textContent = i18n('pb_status_configure');
      } else if (step === 'building') {
        var ctx = S.get('proposalBuildingContext') || {};
        if (ctx.proposalDeckFileId) {
          pageStatus.textContent = i18n('pb_status_deck_ready');
        } else {
          pageStatus.textContent = i18n('pb_status_building_progress');
        }
      }
    }
  }

  function pbEmptyScopeRow_() {
    return { title: '', description: '' };
  }

  function pbEmptyMilestoneRow_() {
    return { label: '', date: '', notes: '' };
  }

  function pbRenumberBriefList_(listEl, attrName, labelKey) {
    if (!listEl) return;
    var nodes = listEl.querySelectorAll('[' + attrName + ']');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].setAttribute(attrName, String(i));
      var idxEl = nodes[i].querySelector('.pb-brief-item-index');
      if (idxEl) {
        idxEl.textContent = i18nFmt(labelKey, { n: String(i + 1) });
      }
    }
  }

  function pbBuildBriefRemoveBtn_(listEl, attrName, labelKey, wrap) {
    var rmBtn = document.createElement('button');
    rmBtn.type = 'button';
    rmBtn.className = 'pb-brief-remove-btn';
    rmBtn.setAttribute('aria-label', i18n('pb_btn_remove_row'));
    rmBtn.innerHTML = '<i class="fa-solid fa-xmark" aria-hidden="true"></i>';
    rmBtn.addEventListener('click', function () {
      wrap.remove();
      pbRenumberBriefList_(listEl, attrName, labelKey);
      if (listEl === stakeholdersList) pbUpdateStakeholdersEmpty_();
    });
    return rmBtn;
  }

  function pbUpdateStakeholdersEmpty_() {
    if (!stakeholdersEmpty || !stakeholdersList) return;
    var hasRows = stakeholdersList.children.length > 0;
    stakeholdersEmpty.classList.toggle('hidden', hasRows);
  }

  function pbBuildScopeRowEl_(row, idx) {
    var wrap = document.createElement('div');
    wrap.className = 'pb-brief-item';
    wrap.setAttribute('data-scope-idx', String(idx));

    var head = document.createElement('div');
    head.className = 'pb-brief-item-head';
    var idxSpan = document.createElement('span');
    idxSpan.className = 'pb-brief-item-index';
    idxSpan.textContent = i18nFmt('pb_brief_item_scope', { n: String(idx + 1) });
    head.appendChild(idxSpan);
    head.appendChild(pbBuildBriefRemoveBtn_(scopeList, 'data-scope-idx', 'pb_brief_item_scope', wrap));

    var body = document.createElement('div');
    body.className = 'space-y-2';

    var titleLbl = document.createElement('label');
    titleLbl.className = 'block text-sm';
    var titleSpan = document.createElement('span');
    titleSpan.className = 'pb-brief-field-label pb-brief-field-label-sm';
    titleSpan.textContent = i18n('pb_lbl_scope_title');
    var titleInput = document.createElement('input');
    titleInput.type = 'text';
    titleInput.className = 'aviators-field w-full text-sm pb-scope-title';
    titleInput.placeholder = i18n('pb_ph_scope_title');
    titleInput.value = row.title || '';
    titleLbl.appendChild(titleSpan);
    titleLbl.appendChild(titleInput);

    var descLbl = document.createElement('label');
    descLbl.className = 'block text-sm';
    var descInput = document.createElement('textarea');
    descInput.rows = 4;
    descInput.className = 'aviators-field pb-brief-textarea w-full text-sm pb-scope-desc';
    descInput.placeholder = i18n('pb_ph_scope_desc');
    descInput.value = row.description || '';
    descLbl.appendChild(descInput);
    pbBindBriefTextarea_(descInput);

    body.appendChild(titleLbl);
    body.appendChild(descLbl);
    wrap.appendChild(head);
    wrap.appendChild(body);
    return wrap;
  }

  function pbBuildMilestoneRowEl_(row, idx) {
    var wrap = document.createElement('div');
    wrap.className = 'pb-brief-item';
    wrap.setAttribute('data-milestone-idx', String(idx));

    var head = document.createElement('div');
    head.className = 'pb-brief-item-head';
    var idxSpan = document.createElement('span');
    idxSpan.className = 'pb-brief-item-index';
    idxSpan.textContent = i18nFmt('pb_brief_item_milestone', { n: String(idx + 1) });
    head.appendChild(idxSpan);
    head.appendChild(pbBuildBriefRemoveBtn_(milestoneList, 'data-milestone-idx', 'pb_brief_item_milestone', wrap));

    var body = document.createElement('div');
    body.className = 'grid gap-2 md:grid-cols-2';

    var labelInput = document.createElement('input');
    labelInput.type = 'text';
    labelInput.className = 'aviators-field w-full text-sm pb-ms-label';
    labelInput.placeholder = i18n('pb_ph_milestone_label');
    labelInput.value = row.label || '';

    var dateInput = document.createElement('input');
    dateInput.type = 'text';
    dateInput.className = 'aviators-field w-full text-sm pb-ms-date';
    dateInput.placeholder = i18n('pb_ph_milestone_date');
    dateInput.value = row.date || '';

    var notesInput = document.createElement('textarea');
    notesInput.rows = 3;
    notesInput.className = 'aviators-field pb-brief-textarea w-full text-sm pb-ms-notes md:col-span-2';
    notesInput.value = row.notes || '';
    pbBindBriefTextarea_(notesInput);

    body.appendChild(labelInput);
    body.appendChild(dateInput);
    body.appendChild(notesInput);
    wrap.appendChild(head);
    wrap.appendChild(body);
    return wrap;
  }

  function pbRenderScopeList_(items) {
    if (!scopeList) return;
    scopeList.innerHTML = '';
    var rows = items && items.length ? items : [pbEmptyScopeRow_()];
    for (var i = 0; i < rows.length; i++) {
      scopeList.appendChild(pbBuildScopeRowEl_(rows[i], i));
    }
  }

  function pbRenderMilestoneList_(items) {
    if (!milestoneList) return;
    milestoneList.innerHTML = '';
    var rows = items && items.length ? items : [pbEmptyMilestoneRow_()];
    for (var j = 0; j < rows.length; j++) {
      milestoneList.appendChild(pbBuildMilestoneRowEl_(rows[j], j));
    }
  }

  function pbEmptyStakeholderRow_() {
    return { name: '', role: '', organization: '', email: '' };
  }

  function pbBuildStakeholderRowEl_(row, idx) {
    var wrap = document.createElement('div');
    wrap.className = 'pb-brief-item';
    wrap.setAttribute('data-stakeholder-idx', String(idx));

    var head = document.createElement('div');
    head.className = 'pb-brief-item-head';
    var idxSpan = document.createElement('span');
    idxSpan.className = 'pb-brief-item-index';
    idxSpan.textContent = i18nFmt('pb_brief_item_contact', { n: String(idx + 1) });
    head.appendChild(idxSpan);
    head.appendChild(
      pbBuildBriefRemoveBtn_(stakeholdersList, 'data-stakeholder-idx', 'pb_brief_item_contact', wrap),
    );

    var body = document.createElement('div');
    body.className = 'grid gap-2 md:grid-cols-2';

    var fields = [
      { cls: 'pb-stk-name', ph: 'pb_ph_stakeholder_name', val: row.name || '' },

  function pbReadAttachmentFile_(file, onOk, onErr) {
    if (!file) {
      onErr(new Error(i18n('err_ephemeral_doc_empty')));
      return;
    }
    var mime = (file.type || '').trim();
    var name = file.name || 'attachment';
    if (!mime && /\.pdf$/i.test(name)) mime = 'application/pdf';
    if (!mime && /\.(txt|md|csv)$/i.test(name)) mime = 'text/plain';
    if (!mime && /\.docx$/i.test(name)) {
      mime = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    }
    if (!mime && /\.(png|jpe?g|webp|gif)$/i.test(name)) {
      mime = 'image/jpeg';
    }

    if (PB_TEXT_RE.test(mime) || /\.(txt|md|csv)$/i.test(name)) {
      var textReader = new FileReader();
      textReader.onload = function () {
        var text = String(textReader.result || '').trim();
        if (!text) {
          onErr(new Error(i18n('err_ephemeral_doc_empty')));
          return;
        }
        onOk({ name: name, mimeType: 'text/plain', textContent: text });
      };
      textReader.onerror = function () {
        onErr(new Error(i18n('err_ephemeral_doc_payload')));
      };
      textReader.readAsText(file, 'UTF-8');
      return;
    }

    if (
      mime === 'application/pdf' ||
      PB_IMAGE_RE.test(mime) ||
      mime === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    ) {
      var binReader = new FileReader();
      binReader.onload = function () {
        var dataUrl = String(binReader.result || '');
        var comma = dataUrl.indexOf(',');
        var b64 = comma >= 0 ? dataUrl.slice(comma + 1) : '';
        if (!b64) {
          onErr(new Error(i18n('err_ephemeral_doc_empty')));
          return;
        }
        onOk({ name: name, mimeType: mime, dataBase64: b64 });
      };
      binReader.onerror = function () {
        onErr(new Error(i18n('err_ephemeral_doc_payload')));
      };
      binReader.readAsDataURL(file);
      return;
    }

    onErr(new Error(i18nFmt('pb_err_attachment_mime', { name: name, mime: mime || '—' })));
  }

  function pbMaterialFileKind_(name) {
    var lower = String(name || '').toLowerCase();
    if (/\.(pdf)$/.test(lower)) return 'pdf';
    if (/\.(docx?|rtf)$/.test(lower)) return 'word';
    if (/\.(csv|tsv)$/.test(lower)) return 'csv';
    if (/\.(txt|md|json)$/.test(lower)) return 'text';
    if (/\.(png|jpe?g|webp|gif|bmp|svg)$/.test(lower)) return 'image';
    return 'generic';
  }

  function pbMaterialFileIcon_(kind) {
    if (kind === 'pdf') return 'fa-file-pdf';
    if (kind === 'word') return 'fa-file-word';
    if (kind === 'csv') return 'fa-file-csv';
    if (kind === 'text') return 'fa-file-lines';
    if (kind === 'image') return 'fa-file-image';
    return 'fa-file';
  }

  function pbMaterialFileKey_(fileOrRow) {
    if (!fileOrRow) return '';
    var file = fileOrRow.file || fileOrRow;
    var name = String(fileOrRow.name || file.name || '');
    var size = file.size != null ? String(file.size) : '0';
    var modified = file.lastModified != null ? String(file.lastModified) : '0';
    return name + '|' + size + '|' + modified;
  }

  function pbHandleMaterialFileList_(fileList) {
    if (!fileList || !fileList.length) return;
    var existing = pbGetMaterials_();
    var seen = {};
    var merged = [];
    var i;
    for (i = 0; i < existing.length; i++) {
      var key = pbMaterialFileKey_(existing[i]);
      if (seen[key]) continue;
      seen[key] = true;
      merged.push(existing[i]);
    }
    for (i = 0; i < fileList.length; i++) {
      var file = fileList[i];
      if (!file) continue;
      var row = {
        name: file.name,
        file: file,
        status: 'pending',
      };
      key = pbMaterialFileKey_(row);
      if (seen[key]) continue;
      seen[key] = true;
      merged.push(row);
    }
    pbSetMaterials_(merged);
  }

  function pbRenderMaterialsList_() {

        : row.status === 'done'
          ? 'pb_material_status_done'

            ? 'pb_material_status_error'

      var statusClass = row.stored
        ? 'pb-materials-item-status--stored'
        : row.status === 'done'
          ? 'pb-materials-item-status--done'
          : row.status === 'error'
            ? 'pb-materials-item-status--error'
            : 'pb-materials-item-status--pending';
      var li = document.createElement('li');
      li.className = 'pb-materials-item';
      var driveLinkHtml = '';
      if (row.stored && row.driveFileUrl) {
        driveLinkHtml =
          '<a class="pb-materials-item-drive" href="' +
          String(row.driveFileUrl).replace(/"/g, '&quot;') +
          '" target="_blank" rel="noopener noreferrer" data-i18n-aria-label="pb_btn_open_material_drive" aria-label="' +
          i18n('pb_btn_open_material_drive') +
          '"><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a>';
      }
      var removeHtml = row.stored
        ? ''
        : '<button type="button" class="pb-materials-item-remove" data-pb-material-remove="' +
          String(i) +
          '" data-i18n-aria-label="pb_btn_remove_material" aria-label="' +

          '"><i class="fa-solid fa-trash" aria-hidden="true"></i></button>';
      li.innerHTML =
        '<span class="pb-materials-item-icon pb-materials-item-icon--' +
        kind +
        '" aria-hidden="true"><i class="fa-solid ' +
        pbMaterialFileIcon_(kind) +
        '"></i></span>' +
        '<span class="pb-materials-item-name" title="' +
        String(row.name || '').replace(/"/g, '&quot;') +
        '">' +
        String(row.name || '') +
        '</span>' +
        driveLinkHtml +
        '<span class="pb-materials-item-status ' +
        statusClass +
        '">' +
        i18n(statusKey) +
        '</span>' +
        removeHtml;
      materialsList.appendChild(li);
    }
    var removeBtns = materialsList.querySelectorAll('[data-pb-material-remove]');
    for (var j = 0; j < removeBtns.length; j++) {
      removeBtns[j].addEventListener('click', function (ev) {

    materialsInput.value = '';
  }

  function pbAnalyzeMaterials_() {
    var materials = pbGetMaterials_();
    var notes = materialsNotes ? String(materialsNotes.value || '').trim() : '';
    var extractable = [];
    var mi;
    for (mi = 0; mi < materials.length; mi++) {
      var candidate = materials[mi];
      if (candidate && candidate.file) {
        extractable.push(candidate);
      }
    }
    if (!extractable.length && !notes) {
      var hasStoredOnly = false;
      for (mi = 0; mi < materials.length; mi++) {
        if (materials[mi] && materials[mi].stored) {
          hasStoredOnly = true;
          break;
        }
      }
      A.showErrorDialog({
        title: i18n('pb_materials_heading'),
        message: i18n(hasStoredOnly ? 'pb_err_extract_reupload_stored' : 'pb_err_extract_empty'),
      });
      return;
    }

    if (extractable.length) {
      pbSetMaterials_(extractable);
      materials = extractable;
    }

    S.set('proposalBuildingDraftBrief', null);
    S.set('proposalBuildingValidatedBrief', null);

    var fileNames = [];
    var extractedBriefs = [];
    var idx = 0;
    var total = extractable.length;

    function finishMerge_() {
      if (!extractedBriefs.length && !notes) {
        pbFinishExtractUi_();
        A.showErrorDialog({
          title: i18n('pb_materials_heading'),
          message: i18n('pb_err_extract_no_materials'),
        });
        return;
      }
      if (!extractedBriefs.length && notes) {
        pbShowExtractProgress_(1, 1, '', 'pb_extract_phase_analyze');
        pbStartExtractProgressTimer_(1, 1, i18n('pb_lbl_materials_notes'));
        google.script.run
          .withSuccessHandler(function (res) {
            pbFinishExtractUi_();
            if (res && res.sessionId) pbSetSessionId_(res.sessionId);
            var extracted = pbEnsureBriefOutputLocale_((res && res.brief) || {});
            S.set('proposalBuildingDraftBrief', extracted);
            pbOpenBriefStep_(extracted);
          })
          .withFailureHandler(function (e) {
            pbFinishExtractUi_();
            A.reportRpcError(e, {
              scope: 'proposalBuildingExtract',
              fallbackKey: 'pb_err_extract',
              modal: true,
            });
          })
          .proposalBuildingExtractBrief(
            JSON.stringify({
              userPrompt: notes,
              chatHistory: [],
              sessionId: pbGetSessionId_(),
              extractBatchStart: true,
              outputLocale: pbOutputLocale_(),
            }),
          );
        return;
      }
      if (extractedBriefs.length === 1) {
        pbFinishExtractUi_();
        S.set('proposalBuildingDraftBrief', extractedBriefs[0]);
        pbOpenBriefStep_(extractedBriefs[0]);
        return;
      }
      pbStartMergeProgressTimer_(total);
      google.script.run
        .withSuccessHandler(function (mergeRes) {
          pbFinishExtractUi_();
          if (mergeRes && mergeRes.sessionId) pbSetSessionId_(mergeRes.sessionId);
          var merged = pbEnsureBriefOutputLocale_((mergeRes && mergeRes.brief) || {});
          S.set('proposalBuildingDraftBrief', merged);
          pbOpenBriefStep_(merged);
        })
        .withFailureHandler(function (e) {
          pbFinishExtractUi_();
          A.reportRpcError(e, {
            scope: 'proposalBuildingMerge',
            fallbackKey: 'pb_err_extract',
            modal: true,
          });
        })
        .proposalBuildingMergeExtractedBriefs(JSON.stringify(extractedBriefs), pbGetSessionId_());
    }

    function extractNext_() {
      if (idx >= total) {
        finishMerge_();
        return;
      }
      var mat = extractable[idx];
      if (!mat) {
        idx++;
        extractNext_();
        return;
      }
      var fileCurrent = idx + 1;
      fileNames.push(mat.name);

      function onExtractSuccess_(res) {
        pbStopExtractProgressTimer_();
        if (res && res.sessionId) pbSetSessionId_(res.sessionId);
        var brief = pbEnsureBriefOutputLocale_((res && res.brief) || {});
        brief.__sourceFile = mat.name;
        extractedBriefs.push(brief);
        mat.status = 'done';
        delete mat.file;
        var matIdx = materials.indexOf(mat);
        if (matIdx >= 0) {
          materials[matIdx] = mat;
          pbSetMaterials_(materials);
        }
        idx++;
        extractNext_();
      }

      function onExtractFailure_(e) {
        pbFinishExtractUi_();
        mat.status = 'error';
        var matIdxErr = materials.indexOf(mat);
        if (matIdxErr >= 0) {
          materials[matIdxErr] = mat;
          pbSetMaterials_(materials);
        }
        A.reportRpcError(e, {
          scope: 'proposalBuildingExtract',
          fallbackKey: 'pb_err_extract',
          modal: true,
        });
      }

      pbShowExtractProgress_(fileCurrent, total, mat.name, 'pb_extract_phase_prepare');
      pbStartExtractProgressTimer_(fileCurrent, total, mat.name);

      if (!mat.file) {
        idx++;
        extractNext_();
        return;
      }

      pbReadAttachmentFile_(
        mat.file,
        function (attachment) {
          pbStartExtractProgressTimer_(fileCurrent, total, mat.name);
          var payload = {
            userPrompt: idx === 0 ? notes : '',
            chatHistory: [],
            attachment: attachment,
            multiDocIndex: fileCurrent,
            multiDocTotal: total,
            sessionId: pbGetSessionId_(),
            extractBatchStart: idx === 0,
            outputLocale: pbOutputLocale_(),
          };
          google.script.run
            .withSuccessHandler(onExtractSuccess_)
            .withFailureHandler(onExtractFailure_)
            .proposalBuildingExtractBrief(JSON.stringify(payload));
        },
        function (err) {
          pbFinishExtractUi_();
          A.showErrorDialog({
            title: i18n('pb_materials_heading'),
            message: String((err && err.message) || i18n('pb_err_extract')),
          });
        },
      );
    }

    if (analyzeMaterialsBtn) analyzeMaterialsBtn.disabled = true;
    pbLoaderHintIdx_ = 0;
    if (!total) {
      finishMerge_();
      return;
    }
    pbShowBlockingProgress_({
      message: i18n('pb_busy_extracting_title'),
      counterText: i18nFmt('pb_loader_extract_counter', { current: '1', total: String(total) }),
      analyzed: 1,
      total: total,
      current: 1,
      stepLabel: i18nFmt('pb_extract_file_label', { current: '1', total: String(total) }),
      phase: i18n('pb_extract_phase_prepare'),
      barPercent: 8,
    });
    extractNext_();
  }

  function pbNormalizeStudioPriority_(rawPriority) {
    var p = String(rawPriority || 'medium').trim().toLowerCase();

  function pbNormalizeStudioType_(rawType, studioName) {
    var t = String(rawType || '').trim().toLowerCase();
    if (t === 'digital' || t === 'ai' || t === 'enterprise') return t;
    var name = String(studioName || '').toLowerCase();
    if (/sap|servicenow|salesforce|oracle|aws|adobe|google cloud|microsoft|process optimization/.test(name)) {
      return 'enterprise';
    }
    if (
      /automotive|media|healthcare|finance|airline|hospitality|games|education|sports|retail|consumer goods|energy|high tech/.test(
        name,
      )
    ) {
      return 'ai';
    }
    return 'digital';
  }

    if (!studiosPipelineList) return;

    var items = studiosPipelineList.querySelectorAll('[data-pb-lane-id]');

    var i;
    for (i = 0; i < items.length; i++) {
      var el = items[i];
      var laneId = el.getAttribute('data-pb-lane-id') || '';
      var status = laneState[laneId] || 'pending';
      el.classList.remove('is-active', 'is-done', 'is-pending', 'is-error');
      if (status === 'running') el.classList.add('is-active');
      else if (status === 'done') {
        el.classList.add('is-done');
        doneCount++;
      } else if (status === 'error') el.classList.add('is-error');
      else el.classList.add('is-pending');
      var statusIcon = el.querySelector('.pb-studios-pipeline-status i');
      if (!statusIcon) continue;
      if (status === 'done') statusIcon.className = 'fa-solid fa-circle-check';
      else if (status === 'running') statusIcon.className = 'fa-solid fa-spinner fa-spin';
      else if (status === 'error') statusIcon.className = 'fa-solid fa-circle-xmark';
      else statusIcon.className = 'fa-regular fa-circle';

      studiosBusyHint.textContent = i18nFmt('pb_studios_lanes_progress_fmt', {
        done: String(doneCount),
        total: String(items.length),

    if (barPct < 12) barPct = 12;

      successCasesBusyStep.textContent = i18nFmt('pb_success_cases_step_label', {

  var PB_CREATE_DECK_STEPS_ = 4;

  function pbShowDeckCreateProgress_(stepIndex, stepKey, subPhaseKey) {
    var total = PB_CREATE_DECK_STEPS_;
    var current = stepIndex + 1;
    var subKeys = PB_DECK_SUBPHASES_[stepKey] || [stepKey];
    var subIdx = 0;
    var si;
    for (si = 0; si < subKeys.length; si++) {
      if (subKeys[si] === subPhaseKey) {
        subIdx = si;
        break;
      }
    }
    var phaseKey = subPhaseKey || subKeys[subIdx] || stepKey;
    var stepBar = total > 0 ? Math.round(((current - 1) / total) * 100) : 0;
    var subBar = subKeys.length > 0 ? Math.round(((subIdx + 1) / subKeys.length) * 100) : 0;
    var barPct = Math.round(stepBar * 0.6 + subBar * 0.4);
    if (barPct < 8) barPct = 8;
    if (barPct > 96) barPct = 96;
    pbShowBlockingProgress_({
      message: i18n('pb_busy_creating_deck_title'),
      counterText: i18nFmt('pb_loader_deck_counter', { current: String(current), total: String(total) }),
      analyzed: current,
      total: total,
      current: current,
      stepLabel: i18nFmt('pb_create_step_label', { current: current, total: total }) + ' · ' + i18n(stepKey),
      phase: i18n(phaseKey),
      barPercent: barPct,
    });
  }

  function pbStartDeckSubphaseTimer_(stepIndex, stepKey) {
    pbStopDeckSubphaseTimer_();
    pbDeckCreateStepIndex_ = stepIndex;
    pbDeckCreateStepKey_ = stepKey;
    var subKeys = PB_DECK_SUBPHASES_[stepKey] || [stepKey];
    var subIdx = 0;
    pbShowDeckCreateProgress_(stepIndex, stepKey, subKeys[subIdx]);
    pbDeckSubphaseTimer_ = setInterval(function () {
      subIdx = (subIdx + 1) % subKeys.length;
      pbShowDeckCreateProgress_(pbDeckCreateStepIndex_, pbDeckCreateStepKey_, subKeys[subIdx]);
    }, PB_LOADER_ROTATE_MS_);
  }

  function pbResolveTargetStep_(session) {

    if (status === 'completed' || session.deckFileUrl) return 'building';
    var step = String(session.builderStep || 'materials').trim();
    if (PB_STEPS_.indexOf(step) >= 0) return step;
    return 'materials';
  }

  function pbResolveMaxStep_(session, targetStep) {
    session = session || {};
    var targetIdx = PB_STEP_ORDER_[targetStep] || 0;
    var savedStep = String(session.builderStep || 'materials');
    var savedIdx = PB_STEP_ORDER_[savedStep];
    if (savedIdx == null || savedIdx < 0) savedIdx = 0;
    return Math.max(targetIdx, savedIdx);
  }

  function pbRestoreConfigureFromSession_(session) {
    session = session || {};
    var ctx = session.context && typeof session.context === 'object' ? session.context : {};
    var industry = String(session.industryKey || ctx.industry || 'Aerolineas').trim();
    var industryRadio = document.querySelector('input[name="pb-industry"][value="' + industry + '"]');
    if (industryRadio) industryRadio.checked = true;
    else {
      var airlinesRadio = document.querySelector('input[name="pb-industry"][value="Aerolineas"]');
      if (airlinesRadio) airlinesRadio.checked = true;
    }

    var brief = session.validatedBrief || session.draftBrief || {};
    var lang =
      A.getLocale && A.getLocale() === 'en'
        ? 'en'
        : String(brief.outputLocale || ctx.language || 'es').trim() === 'en'
          ? 'en'
          : 'es';
    var langRadio = document.querySelector('input[name="pb-proposal-language"][value="' + lang + '"]');
    if (langRadio) langRadio.checked = true;

    var deckOpts = ctx.deckOptions && typeof ctx.deckOptions === 'object' ? ctx.deckOptions : {};
    var globantYes = document.querySelector('input[name="pb-include-globant"][value="yes"]');
    var globantNo = document.querySelector('input[name="pb-include-globant"][value="no"]');
    var studioYes = document.querySelector('input[name="pb-include-airlines-studio"][value="yes"]');
    var studioNo = document.querySelector('input[name="pb-include-airlines-studio"][value="no"]');
    if (deckOpts.includeGlobant === false) {
      if (globantNo) globantNo.checked = true;
    } else if (globantYes) globantYes.checked = true;
    if (deckOpts.includeAirlinesStudio === false) {
      if (studioNo) studioNo.checked = true;
    } else if (studioYes) studioYes.checked = true;

    pbUpdateDeckOptionsChrome_();
    if (deckPreview) {
      var ind = pbSelectedIndustry_();
      var deckLabel =
        ctx.deckLabel ||
        (ind === 'Logistica' ? i18n('pb_deck_logistics') : i18n('pb_deck_airlines'));
      deckPreview.textContent = i18nFmt('pb_deck_selected', { deck: deckLabel });
    }
  }

  function pbUpdateBuildingLinksNested_() {
    if (!buildingLinksNested) return;
    var showNested = false;
    if (buildingDeckLink && !buildingDeckLink.classList.contains('hidden')) showNested = true;
    if (buildingChecklistLink && !buildingChecklistLink.classList.contains('hidden')) showNested = true;
    buildingLinksNested.classList.toggle('hidden', !showNested);
  }

  function pbUpdateBuildingViewProposalBtn_(ready) {
    if (!buildingViewProposalBtn) return;
    var sid = pbGetSessionId_();
    var show = !!ready && !!sid;
    buildingViewProposalBtn.classList.toggle('hidden', !show);
    buildingViewProposalBtn.disabled = !show;
  }

  function pbOpenProposalView_() {
    var sid = pbGetSessionId_();
    if (!sid) return;
    if (A.proposalView && typeof A.proposalView.openSession === 'function') {
      A.proposalView.openSession(sid);
      return;
    }
    A.showErrorDialog({
      title: i18n('page_proposal_view_title'),
      message: i18n('pv_err_load'),
    });
  }

  function pbRestoreBuildingFromSession_(session) {
    session = session || {};
    var ctx = S.get('proposalBuildingContext') || pbBuildContextFromSession_(session);
    var deckName =
      session.deckFileName || ctx.proposalDeckFileName || session.proposalDeckFileName || '';
    var folderUrl =
      session.packageFolderUrl || ctx.proposalPackageFolderUrl || session.proposalPackageFolderUrl || '';
    var deckUrl = session.deckFileUrl || ctx.proposalDeckFileUrl || session.proposalDeckFileUrl || '';
    var checklistUrl =
      session.checklistFileUrl || ctx.checklistFileUrl || session.checklistFileUrl || '';

    if (buildingStatusText) {
      if (deckName || deckUrl) {
        buildingStatusText.textContent = i18nFmt('pb_building_ready_line', {
          name: deckName,
          cases: String(ctx.successCasesApplied || 0),
          checklist: String(ctx.checklistItemCount || 0),
        });
      } else {
        buildingStatusText.textContent = i18n('pb_status_building_progress');
      }
    }
    if (buildingFolderLink) {
      if (folderUrl) {
        buildingFolderLink.href = folderUrl;
        buildingFolderLink.classList.remove('hidden');
      } else {
        buildingFolderLink.classList.add('hidden');
      }
    }
    if (buildingDeckLink) {
      if (deckUrl) {
        buildingDeckLink.href = deckUrl;
        buildingDeckLink.classList.remove('hidden');
      } else {
        buildingDeckLink.classList.add('hidden');
      }
    }
    if (buildingChecklistLink) {
      if (checklistUrl) {
        buildingChecklistLink.href = checklistUrl;
        buildingChecklistLink.classList.remove('hidden');
      } else {
        buildingChecklistLink.classList.add('hidden');
      }
    }
    pbUpdateBuildingLinksNested_();
    pbUpdateBuildingViewProposalBtn_(!!(deckUrl || session.deckFileId || session.status === 'completed'));
  }

  function pbHydrateFromSession_(session) {
    session = session || {};
    if (!session.sessionId) return;

    S.set('proposalBuildingPhase', 'builder');
    S.set('proposalBuildingSessionId', String(session.sessionId || ''));

    var draftBrief = pbEnsureBriefOutputLocale_(
      session.draftBrief && typeof session.draftBrief === 'object' ? session.draftBrief : {},
    );
    var validatedBrief =
      session.validatedBrief && typeof session.validatedBrief === 'object'
        ? pbEnsureBriefOutputLocale_(session.validatedBrief)
        : null;
    S.set('proposalBuildingDraftBrief', draftBrief);
    S.set('proposalBuildingValidatedBrief', validatedBrief);
    S.set('proposalBuildingStudioRecommendations', session.studioRecommendations || null);
    var ctx = pbBuildContextFromSession_(session);
    S.set('proposalBuildingContext', ctx);
    S.set(
      'proposalBuildingSuccessCaseSelections',
      ctx.successCaseSelections || ctx.successCases || null,
    );

    pbSetMaterials_(pbMaterialsFromSession_(session.materials));

    var briefForForm = validatedBrief;
    if (!briefForForm && draftBrief && typeof draftBrief === 'object' && Object.keys(draftBrief).length) {
      briefForForm = draftBrief;
    }
    if (briefForForm) pbApplyBriefToForm_(briefForForm);

    var targetStep = pbResolveTargetStep_(session);
    var maxStep = pbResolveMaxStep_(session, targetStep);
    S.set('proposalBuildingMaxStep', maxStep);

    if (maxStep >= PB_STEP_ORDER_.configure) pbRestoreConfigureFromSession_(session);
    if (targetStep === 'building' || session.deckFileUrl || session.status === 'completed') {
      pbRestoreBuildingFromSession_(session);
    }

    pbSetStep_(targetStep, { scrollTop: true });
    if (
      session.studioRecommendations &&
      session.studioRecommendations.length &&
      (targetStep === 'studios' || maxStep >= PB_STEP_ORDER_.studios)
    ) {
      pbRenderStudios_(session.studioRecommendations);
    }
    var restoredCases = ctx.successCaseSelections || ctx.successCases || [];
    if (
      restoredCases.length &&
      (targetStep === 'success_cases' || maxStep >= PB_STEP_ORDER_.success_cases)
    ) {
      pbRenderSuccessCases_(restoredCases);
    }
  }

  function pbOpenSession_(sessionId) {
    var sid = String(sessionId || '').trim();
    if (!sid) return;
    A.showBlockingModal(i18n('my_proposals_busy_loading'));
    google.script.run
      .withSuccessHandler(function (res) {
        A.hideBlockingModal();
        var session = res && res.session;
        if (!session || !session.sessionId) {
          A.showErrorDialog({
            title: i18n('page_my_proposals_title'),
            message: i18n('my_proposals_err_load'),
          });
          return;
        }
        pbHydrateFromSession_(session);
        if (typeof A.setAppPage === 'function') A.setAppPage('proposal-building');
      })
      .withFailureHandler(function (e) {
        A.hideBlockingModal();
        A.reportRpcError(e, {
          scope: 'myProposalsLoad',
          fallbackKey: 'my_proposals_err_load',
          modal: true,
        });
      })
      .proposalBuildingSessionGet(sid);
  }

  A.proposalBuilding = {
    isActivePage: pbIsActivePage_,
    onEnterPage: function () {
      if (!S.get('proposalBuildingBuilderStep')) {
        pbSetStep_('materials');
      } else {
        var cachedStudios = S.get('proposalBuildingStudioRecommendations');
        if (cachedStudios && cachedStudios.length) {
          pbRenderStudios_(cachedStudios);
        }
        var cachedCases = S.get('proposalBuildingSuccessCaseSelections');
        if (cachedCases && cachedCases.length && pbCurrentStep_() === 'success_cases') {
          pbRenderSuccessCases_(cachedCases);
        }
        if (pbCurrentStep_() === 'building') {
          var ctx = S.get('proposalBuildingContext') || {};
          if (ctx.proposalDeckFileUrl || ctx.proposalPackageFolderUrl || ctx.checklistFileUrl) {
            pbRestoreBuildingFromSession_({ context: ctx });
          }
        }
        pbUpdateChrome_();
      }
    },
    getBuilderStep: pbCurrentStep_,
    readAttachmentFile: pbReadAttachmentFile_,
    getContext: function () {
      return S.get('proposalBuildingContext') || null;
    },
    loadSession: pbHydrateFromSession_,
    openSession: pbOpenSession_,
    resetSession: function () {
      S.set('proposalBuildingPhase', 'builder');
      S.set('proposalBuildingBuilderStep', 'materials');
      S.set('proposalBuildingMaxStep', 0);
      S.set('proposalBuildingDraftBrief', null);
      S.set('proposalBuildingValidatedBrief', null);
      S.set('proposalBuildingContext', null);
      S.set('proposalBuildingMaterials', []);
      S.set('proposalBuildingStudioRecommendations', null);
      S.set('proposalBuildingSessionId', '');
      pbSetMaterials_([]);
      if (materialsInput) materialsInput.value = '';
      if (materialsNotes) materialsNotes.value = '';
      pbSetStep_('materials');
      pbUpdateChrome_();
    },
  };

  pbBindAllBriefTextareas_();
  pbUpdateMaterialsChrome_();

  if (pbIsActivePage_()) {
    pbSetStep_(pbCurrentStep_());
  }
})(window.Aviators);
</script>
