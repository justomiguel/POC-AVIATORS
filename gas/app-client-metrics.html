<script>
(function (A) {
  var S = A.state;
  var i18n = A.i18n;
  var i18nFmt = A.i18nFmt;

  var rangeEl = document.getElementById('metrics-range');
  var refreshBtn = document.getElementById('metrics-refresh-btn');
  var resetBtn = document.getElementById('metrics-reset-btn');
  var statusWrap = document.getElementById('metrics-status');
  var statusLoader = statusWrap ? statusWrap.querySelector('.loader-flight-inline') : null;
  var statusIcon = document.getElementById('metrics-status-icon');
  var statusText = document.getElementById('metrics-status-text');

  var totalQuestionsEl = document.getElementById('metrics-total-questions');
  var totalUnansweredEl = document.getElementById('metrics-total-unanswered');
  var answerRateEl = document.getElementById('metrics-answer-rate');
  var uniqueUsersEl = document.getElementById('metrics-unique-users');
  var moduleVisitsEl = document.getElementById('metrics-module-visits');
  var onboardingQuestionsEl = document.getElementById('metrics-onboarding-questions');
  var offeringQuestionsEl = document.getElementById('metrics-offering-questions');
  var proposalsBuiltEl = document.getElementById('metrics-proposals-built');
  var feedbackSatisfactionEl = document.getElementById('metrics-feedback-satisfaction');

  var trendSectionCanvas = document.getElementById('metrics-trend-section-chart');
  var sectionCanvas = document.getElementById('metrics-section-chart');
  var moduleCanvas = document.getElementById('metrics-module-chart');
  var agentCanvas = document.getElementById('metrics-agent-chart');
  var catalogCanvas = document.getElementById('metrics-catalog-chart');
  var proposalStatusCanvas = document.getElementById('metrics-proposal-status-chart');
  var feedbackCanvas = document.getElementById('metrics-feedback-chart');

  var lbUsersEl = document.getElementById('metrics-lb-users');
  var lbAgentsEl = document.getElementById('metrics-lb-agents');
  var lbSuccessClientEl = document.getElementById('metrics-lb-success-client');
  var lbSuccessIndustryEl = document.getElementById('metrics-lb-success-industry');
  var lbProposalClientEl = document.getElementById('metrics-lb-proposal-client');
  var lbProposalIndustryEl = document.getElementById('metrics-lb-proposal-industry');
  var lbProposalBuildersEl = document.getElementById('metrics-lb-proposal-builders');
  var lbModulesEl = document.getElementById('metrics-lb-modules');
  var lbModuleUsersEl = document.getElementById('metrics-lb-module-users');
  var moduleUsersBody = document.getElementById('metrics-module-users-body');
  var moduleUsersInfo = document.getElementById('metrics-module-users-page-info');
  var moduleUsersPrevBtn = document.getElementById('metrics-module-users-prev');
  var moduleUsersNextBtn = document.getElementById('metrics-module-users-next');

  var unansweredBody = document.getElementById('metrics-unanswered-body');
  var unansweredInfo = document.getElementById('metrics-unanswered-page-info');
  var unansweredPrevBtn = document.getElementById('metrics-unanswered-prev');
  var unansweredNextBtn = document.getElementById('metrics-unanswered-next');
  var queueFilterEl = document.getElementById('metrics-queue-filter');

  var unansweredPage = { skip: 0, limit: 10, total: 0, hasMore: false };
  var moduleUsersPage = { skip: 0, limit: 15, total: 0, hasMore: false };
  var queueCanManage = false;
  var queueAssignees = [];
  var queueRowBusyId = '';
  var trendSectionChart = null;
  var sectionChart = null;
  var moduleChart = null;
  var agentChart = null;
  var catalogChart = null;
  var proposalStatusChart = null;
  var feedbackChart = null;
  var chartJsPromise = null;

  var METRICS_SECTION_KEYS_ = ['home', 'onboarding', 'globant_offering', 'proposal_building', 'other'];
  var METRICS_SECTION_COLORS_ = {
    home: '#0ea5e9',
    onboarding: '#8b5cf6',
    globant_offering: '#14b8a6',
    proposal_building: '#f59e0b',
    other: '#64748b',
  };
  var loadingDashboard = false;
  var loadingUnanswered = false;
  var loadingModuleUsers = false;
  var metricsTabRoot = document.getElementById('metrics-tab-root');
  var metricsLbTabRoot = document.getElementById('metrics-lb-tab-root');
  var metricsMainTabs = metricsTabRoot ? A.initTabGroup(metricsTabRoot) : null;
  var metricsLbTabs = metricsLbTabRoot ? A.initTabGroup(metricsLbTabRoot) : null;

  function metricsResizeCharts_() {
    window.setTimeout(function () {
      var charts = [
        trendSectionChart,
        sectionChart,
        moduleChart,
        agentChart,
        catalogChart,
        proposalStatusChart,
        feedbackChart,
      ];
      for (var ci = 0; ci < charts.length; ci++) {
        if (charts[ci] && typeof charts[ci].resize === 'function') charts[ci].resize();
      }
    }, 60);
  }

  function metricsSectionLabel_(key) {
    return i18n('metrics_section_' + String(key || 'other'));
  }

  function metricsModuleLabel_(key) {
    var k = String(key || '').trim().replace(/-/g, '_');
    return i18n('metrics_module_' + (k || 'other'));
  }

  function metricsEngagementLabel_(level) {
    var lv = String(level || 'inactive').trim().toLowerCase();
    var key = 'metrics_engage_' + lv;
    var txt = i18n(key);
    return txt === key ? i18n('metrics_engage_inactive') : txt;
  }

  function metricsEngagementBadgeClass_(level) {
    var lv = String(level || 'inactive').trim().toLowerCase();
    if (lv === 'high') {
      return 'inline-flex items-center rounded-full border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[11px] font-semibold text-emerald-800 dark:border-emerald-800 dark:bg-emerald-950/50 dark:text-emerald-200';
    }
    if (lv === 'medium') {
      return 'inline-flex items-center rounded-full border border-amber-200 bg-amber-50 px-2 py-0.5 text-[11px] font-semibold text-amber-900 dark:border-amber-800 dark:bg-amber-950/40 dark:text-amber-200';
    }
    if (lv === 'low') {
      return 'inline-flex items-center rounded-full border border-sky-200 bg-sky-50 px-2 py-0.5 text-[11px] font-semibold text-sky-800 dark:border-sky-800 dark:bg-sky-950/40 dark:text-sky-200';
    }
    return 'inline-flex items-center rounded-full border border-slate-200 bg-slate-50 px-2 py-0.5 text-[11px] font-semibold text-slate-600 dark:border-slate-600 dark:bg-slate-800/80 dark:text-slate-300';
  }

  var METRICS_MODULE_COLORS_ = [
    '#0ea5e9',
    '#8b5cf6',
    '#14b8a6',
    '#f59e0b',
    '#ef4444',
    '#6366f1',
    '#22c55e',
    '#ec4899',
    '#06b6d4',
    '#64748b',
    '#a855f7',
    '#84cc16',
    '#f97316',
    '#3b82f6',
  ];

  function metricsFormatPct_(value) {
    if (value == null || isNaN(Number(value))) return '—';
    return String(Math.round(Number(value))) + '%';
  }

  if (metricsTabRoot) {
    metricsTabRoot.addEventListener('click', function (ev) {
      var tab = ev.target && ev.target.closest ? ev.target.closest('[role="tab"]') : null;
      if (!tab || tab.getAttribute('role') !== 'tab') return;
      if (tab.id === 'metrics-tab-overview') metricsResizeCharts_();
    });
  }

  function activeRange() {
    return rangeEl ? String(rangeEl.value || '30d') : '30d';
  }

  function isMetricsBusy() {
    return loadingDashboard || loadingUnanswered || loadingModuleUsers;
  }

  function setStatus(text, busy, opts) {
    if (!statusWrap || !statusText) return;
    var o = opts || {};
    var t = String(text || '').trim();
    if (!t && !busy) {
      statusWrap.classList.add('hidden');
      statusText.textContent = '';
      if (statusLoader) statusLoader.classList.add('hidden');
      if (statusIcon) {
        statusIcon.classList.add('hidden');
        statusIcon.classList.remove(
          'fa-spin',
          'fa-spinner',
          'fa-circle-check',
          'fa-triangle-exclamation',
        );
      }
      return;
    }
    statusWrap.classList.remove('hidden');
    statusText.textContent = t;
    if (statusLoader) statusLoader.classList.toggle('hidden', !busy);
    if (statusIcon) {
      statusIcon.classList.toggle('hidden', !!busy);
      statusIcon.classList.remove(
        'fa-spin',
        'fa-spinner',
        'fa-circle-check',
        'fa-triangle-exclamation',
      );
      if (!busy && t && o.error) {
        statusIcon.classList.add('fa-triangle-exclamation');
      }
    }
  }

  function refreshMetricsStatus() {
    syncBusyControls();
    if (isMetricsBusy()) {
      var msg = loadingDashboard
        ? i18n('metrics_loading_dashboard')
        : i18n('metrics_loading_unanswered');
      setStatus(msg, true);
      return;
    }
    setStatus('', false);
  }

  function syncBusyControls() {
    var busy = loadingDashboard || loadingUnanswered || !!queueRowBusyId;
    if (rangeEl) rangeEl.disabled = busy;
    if (refreshBtn) refreshBtn.disabled = busy;
    if (resetBtn) resetBtn.disabled = busy;
    if (queueFilterEl) queueFilterEl.disabled = busy;
    if (unansweredPrevBtn) unansweredPrevBtn.disabled = busy || unansweredPage.skip <= 0;
    if (unansweredNextBtn) unansweredNextBtn.disabled = busy || !unansweredPage.hasMore;
    if (moduleUsersPrevBtn) {
      moduleUsersPrevBtn.disabled = busy || moduleUsersPage.skip <= 0;
    }
    if (moduleUsersNextBtn) {
      moduleUsersNextBtn.disabled = busy || !moduleUsersPage.hasMore;
    }
  }

  function metricsQueueStatusLabel(status) {
    return status === 'missing_content'
      ? i18n('metrics_queue_status_missing')
      : i18n('metrics_queue_status_open');
  }

  function metricsQueueLoadAssignees(onDone) {
    if (!S.get('canManageUnansweredQueue')) {
      queueAssignees = [];
      if (typeof onDone === 'function') onDone();
      return;
    }
    google.script.run
      .withSuccessHandler(function (res) {
        queueAssignees = (res && res.items) || [];
        if (typeof onDone === 'function') onDone();
      })
      .withFailureHandler(function () {
        queueAssignees = [];
        if (typeof onDone === 'function') onDone();
      })
      .metricsUnansweredAssignees();
  }

  function metricsQueueOpenUpload(row) {
    if (!S.get('canWriteContents')) {
      if (A.toast) A.toast.error(i18n('metrics_queue_upload_denied'));
      return;
    }
    var type = String(row.suggested_content_type || 'proposal').trim() || 'proposal';
    A.setAppPage('contents');
    if (A.contents && A.contents.startNewFromQueue) {
      A.contents.startNewFromQueue({
        contentType: type,
        titleHint: row.question_text || '',
      });
    }
  }

  function metricsQueueRunAssign(eventId, assigneeEmail, onDone) {
    queueRowBusyId = String(eventId || '');
    syncBusyControls();
    A.showBlockingModal(i18n('metrics_queue_busy_assign'));
    google.script.run
      .withSuccessHandler(function (res) {
        A.hideBlockingModal();
        queueRowBusyId = '';
        syncBusyControls();
        if (res && res.ok) {
          if (A.toast) A.toast.success(i18n('metrics_queue_done_assign'));
          loadUnanswered(false);
        } else if (A.toast) A.toast.error(i18n('metrics_load_error'));
        if (typeof onDone === 'function') onDone();
      })
      .withFailureHandler(function (e) {
        A.hideBlockingModal();
        queueRowBusyId = '';
        syncBusyControls();
        if (A.toast) A.toast.error((e && e.message) || i18n('metrics_load_error'));
        if (typeof onDone === 'function') onDone();
      })
      .metricsUnansweredAssign(eventId, assigneeEmail);
  }

  function metricsQueueRunStatus(eventId, status, rowOpt, onDone) {
    if (typeof rowOpt === 'function') {
      onDone = rowOpt;
      rowOpt = null;
    }
    queueRowBusyId = String(eventId || '');
    syncBusyControls();
    A.showBlockingModal(i18n('metrics_queue_busy_status'));
    google.script.run
      .withSuccessHandler(function (res) {
        A.hideBlockingModal();
        queueRowBusyId = '';
        syncBusyControls();
        if (res && res.ok) {
          var msg =
            status === 'resolved'
              ? i18n('metrics_queue_done_resolve')
              : i18n('metrics_queue_done_missing');
          if (A.toast) A.toast.success(msg);
          if (status === 'missing_content' && rowOpt) {
            metricsQueueOpenUpload(rowOpt);
          }
          loadUnanswered(false);
        } else if (A.toast) A.toast.error(i18n('metrics_load_error'));
        if (typeof onDone === 'function') onDone();
      })
      .withFailureHandler(function (e) {
        A.hideBlockingModal();
        queueRowBusyId = '';
        syncBusyControls();
        if (A.toast) A.toast.error((e && e.message) || i18n('metrics_load_error'));
        if (typeof onDone === 'function') onDone();
      })
      .metricsUnansweredSetStatus(eventId, status, '');
  }

  function renderUnansweredTable(rows) {
    if (!unansweredBody) return;
    unansweredBody.innerHTML = '';
    var items = Array.isArray(rows) ? rows : [];
    if (!items.length) {
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = 8;
      td.className = 'metrics-queue-empty px-3 py-8 text-center text-sm text-slate-500 dark:text-slate-400';
      td.textContent = i18n('metrics_empty');
      tr.appendChild(td);
      unansweredBody.appendChild(tr);
      return;
    }
    for (var i = 0; i < items.length; i++) {
      (function (row) {
        var trRow = document.createElement('tr');
        trRow.className =
          'border-b border-slate-100 transition-colors hover:bg-slate-50/80 dark:border-slate-700 dark:hover:bg-slate-800/50';
        var busyRow = queueRowBusyId && queueRowBusyId === String(row.event_id || '');

        function addTextCell(text) {
          var tdCol = document.createElement('td');
          tdCol.className = 'px-3 py-2 align-top text-sm text-slate-700 dark:text-slate-300';
          tdCol.textContent = text;
          trRow.appendChild(tdCol);
        }

        addTextCell(formatDateTime(row.ts_iso));
        addTextCell(String(row.user_display_name || row.user_email || ''));
        addTextCell(String(row.agent_name || row.agent_id || ''));
        addTextCell(String(row.question_text || ''));
        addTextCell(String(row.unanswered_code || ''));

        var tdStatus = document.createElement('td');
        tdStatus.className = 'px-3 py-2 align-top text-sm';
        var badge = document.createElement('span');
        badge.className =
          row.queue_status === 'missing_content'
            ? 'inline-flex rounded-full border border-amber-200 bg-amber-50 px-2 py-0.5 text-[11px] font-medium text-amber-900 dark:border-amber-800 dark:bg-amber-950/40 dark:text-amber-200'
            : 'inline-flex rounded-full border border-sky-200 bg-sky-50 px-2 py-0.5 text-[11px] font-medium text-sky-900 dark:border-sky-800 dark:bg-sky-950/40 dark:text-sky-200';
        badge.textContent = metricsQueueStatusLabel(row.queue_status);
        tdStatus.appendChild(badge);
        trRow.appendChild(tdStatus);

        var tdAssigned = document.createElement('td');
        tdAssigned.className = 'px-3 py-2 align-top text-sm text-slate-700 dark:text-slate-300';
        tdAssigned.textContent =
          String(row.assigned_to_name || row.assigned_to_email || '').trim() ||
          i18n('metrics_queue_unassigned');
        trRow.appendChild(tdAssigned);

        var tdActions = document.createElement('td');
        tdActions.className = 'px-3 py-2 align-top text-sm';
        if (queueCanManage) {
          var wrap = document.createElement('div');
          wrap.className = 'flex min-w-[14rem] flex-col gap-2';

          if (queueAssignees.length) {
            var assignRow = document.createElement('div');
            assignRow.className = 'flex flex-wrap items-center gap-1.5';
            var sel = document.createElement('select');
            sel.className = 'aviators-field min-w-[8rem] flex-1 text-xs';
            sel.disabled = busyRow;
            var ph = document.createElement('option');
            ph.value = '';
            ph.textContent = i18n('metrics_queue_assign_ph');
            sel.appendChild(ph);
            for (var ai = 0; ai < queueAssignees.length; ai++) {
              var opt = document.createElement('option');
              opt.value = queueAssignees[ai].email;
              opt.textContent =
                queueAssignees[ai].displayName || queueAssignees[ai].email;
              if (
                String(row.assigned_to_email || '').toLowerCase() ===
                String(queueAssignees[ai].email || '').toLowerCase()
              ) {
                opt.selected = true;
              }
              sel.appendChild(opt);
            }
            var assignBtn = document.createElement('button');
            assignBtn.type = 'button';
            assignBtn.className = 'btn btn-sm btn-outline inline-flex items-center gap-1.5';
            assignBtn.disabled = busyRow;
            assignBtn.innerHTML =
              '<i class="fa-solid fa-user-check" aria-hidden="true"></i><span>' +
              i18n('metrics_queue_btn_assign') +
              '</span>';
            assignBtn.addEventListener('click', function () {
              var em = String(sel.value || '').trim();
              if (!em) return;
              metricsQueueRunAssign(row.event_id, em);
            });
            assignRow.appendChild(sel);
            assignRow.appendChild(assignBtn);
            wrap.appendChild(assignRow);
          }

          var btnRow = document.createElement('div');
          btnRow.className = 'flex flex-wrap gap-1.5';

          if (S.get('canWriteContents')) {
            var uploadBtn = document.createElement('button');
            uploadBtn.type = 'button';
            uploadBtn.className = 'btn btn-sm btn-primary inline-flex items-center gap-1.5';
            uploadBtn.disabled = busyRow;
            uploadBtn.innerHTML =
              '<i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i><span>' +
              i18n('metrics_queue_btn_upload') +
              '</span>';
            uploadBtn.addEventListener('click', function () {
              metricsQueueOpenUpload(row);
            });
            btnRow.appendChild(uploadBtn);
          }

          if (row.queue_status !== 'missing_content') {
            var missingBtn = document.createElement('button');
            missingBtn.type = 'button';
            missingBtn.className = 'btn btn-sm btn-outline inline-flex items-center gap-1.5';
            missingBtn.disabled = busyRow;
            missingBtn.innerHTML =
              '<i class="fa-solid fa-folder-plus" aria-hidden="true"></i><span>' +
              i18n('metrics_queue_btn_missing') +
              '</span>';
            missingBtn.addEventListener('click', function () {
              metricsQueueRunStatus(row.event_id, 'missing_content', row);
            });
            btnRow.appendChild(missingBtn);
          }

          var resolveBtn = document.createElement('button');
          resolveBtn.type = 'button';
          resolveBtn.className = 'btn btn-sm btn-outline inline-flex items-center gap-1.5';
          resolveBtn.disabled = busyRow;
          resolveBtn.innerHTML =
            '<i class="fa-solid fa-circle-check" aria-hidden="true"></i><span>' +
            i18n('metrics_queue_btn_resolve') +
            '</span>';
          resolveBtn.addEventListener('click', function () {
            A.confirmDialog({
              message: i18n('metrics_queue_confirm_resolve'),
              danger: false,
            }).then(function (ok) {
              if (!ok) return;
              metricsQueueRunStatus(row.event_id, 'resolved');
            });
          });
          btnRow.appendChild(resolveBtn);

          wrap.appendChild(btnRow);
          tdActions.appendChild(wrap);
        } else {
          tdActions.textContent = '—';
        }
        trRow.appendChild(tdActions);
        unansweredBody.appendChild(trRow);
      })(items[i] || {});
    }
  }

  function formatDateTime(value) {
    var ms = Date.parse(String(value || ''));
    if (isNaN(ms)) return String(value || '');
    try {
      return new Intl.DateTimeFormat(navigator.language || 'es', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
      }).format(new Date(ms));
    } catch (eFmt) {
      return new Date(ms).toISOString();
    }
  }

  function renderModuleRankList(el, rows) {
    var mapped = [];
    var items = Array.isArray(rows) ? rows : [];
    for (var mi = 0; mi < items.length; mi++) {
      var row = items[mi] || {};
      mapped.push({
        name: metricsModuleLabel_(row.key),
        count: Number(row.count || 0),
      });
    }
    renderRankList(el, mapped);
  }

  function renderModuleUsersPageInfo() {
    if (!moduleUsersInfo) return;
    if (!moduleUsersPage.total) {
      moduleUsersInfo.textContent = i18n('metrics_pagination_empty');
      return;
    }
    var from = moduleUsersPage.skip + 1;
    var to = Math.min(moduleUsersPage.skip + moduleUsersPage.limit, moduleUsersPage.total);
    moduleUsersInfo.textContent = i18nFmt('metrics_pagination_info', {
      from: from,
      to: to,
      total: moduleUsersPage.total,
    });
  }

  function renderModuleUsersTable(rows) {
    if (!moduleUsersBody) return;
    moduleUsersBody.innerHTML = '';
    var items = Array.isArray(rows) ? rows : [];
    if (!items.length) {
      var trEmpty = document.createElement('tr');
      var tdEmpty = document.createElement('td');
      tdEmpty.colSpan = 6;
      tdEmpty.className =
        'px-3 py-8 text-center text-sm text-slate-500 dark:text-slate-400';
      tdEmpty.textContent = i18n('metrics_empty');
      trEmpty.appendChild(tdEmpty);
      moduleUsersBody.appendChild(trEmpty);
      renderModuleUsersPageInfo();
      return;
    }

    for (var i = 0; i < items.length; i++) {
      var row = items[i] || {};
      var trRow = document.createElement('tr');
      trRow.className =
        'border-b border-slate-100 transition-colors hover:bg-slate-50/80 dark:border-slate-700 dark:hover:bg-slate-800/50';

      function addCell(text, className) {
        var tdCol = document.createElement('td');
        tdCol.className =
          className ||
          'px-3 py-2 align-top text-sm text-slate-700 dark:text-slate-300';
        tdCol.textContent = text;
        trRow.appendChild(tdCol);
      }

      addCell(String(row.name || row.email || ''));
      addCell(String(row.roleKey || '—'));
      addCell(row.lastSeenAt ? formatDateTime(row.lastSeenAt) : '—');

      var tdEngage = document.createElement('td');
      tdEngage.className = 'px-3 py-2 align-top text-sm';
      var engageBadge = document.createElement('span');
      engageBadge.className = metricsEngagementBadgeClass_(row.engagementLevel);
      engageBadge.textContent = metricsEngagementLabel_(row.engagementLevel);
      engageBadge.title = i18nFmt('metrics_engage_score_hint', {
        score: String(row.engagementScore || 0),
        visits: String(row.count || 0),
        modules: String(row.uniqueModules || 0),
        questions: String(row.questions || 0),
      });
      tdEngage.appendChild(engageBadge);
      trRow.appendChild(tdEngage);

      var tdMods = document.createElement('td');
      tdMods.className = 'px-3 py-2 align-top text-sm';
      var modsWrap = document.createElement('div');
      modsWrap.className = 'flex flex-wrap gap-1.5';
      var mods = Array.isArray(row.modules) ? row.modules : [];
      if (!mods.length) {
        var noneSpan = document.createElement('span');
        noneSpan.className = 'text-slate-400 dark:text-slate-500';
        noneSpan.textContent = '—';
        modsWrap.appendChild(noneSpan);
      } else {
        for (var mj = 0; mj < mods.length; mj++) {
          var mod = mods[mj] || {};
          var badge = document.createElement('span');
          badge.className =
            'inline-flex items-center gap-1 rounded-full border border-slate-200 bg-slate-50 px-2 py-0.5 text-[11px] font-medium text-slate-700 dark:border-slate-600 dark:bg-slate-800/80 dark:text-slate-200';
          badge.textContent =
            metricsModuleLabel_(mod.key) + ' · ' + String(mod.count || 0);
          modsWrap.appendChild(badge);
        }
      }
      tdMods.appendChild(modsWrap);
      trRow.appendChild(tdMods);

      addCell(String(row.count || 0), 'px-3 py-2 align-top text-sm font-medium tabular-nums text-slate-900 dark:text-slate-100');
      moduleUsersBody.appendChild(trRow);
    }
    renderModuleUsersPageInfo();
  }

  function loadModuleUsers(reset) {
    if (reset) moduleUsersPage.skip = 0;
    loadingModuleUsers = true;
    refreshMetricsStatus();
    syncBusyControls();
    google.script.run
      .withSuccessHandler(function (res) {
        loadingModuleUsers = false;
        if (res && res.ok) {
          moduleUsersPage.total = Number(res.total || 0);
          moduleUsersPage.hasMore = !!res.hasMore;
          renderModuleUsersTable(res.items || []);
        } else {
          renderModuleUsersTable([]);
        }
        refreshMetricsStatus();
        syncBusyControls();
      })
      .withFailureHandler(function () {
        loadingModuleUsers = false;
        renderModuleUsersTable([]);
        refreshMetricsStatus();
        syncBusyControls();
      })
      .metricsModuleUserList({
        range: activeRange(),
        skip: moduleUsersPage.skip,
        limit: moduleUsersPage.limit,
      });
  }

  function renderRankList(el, rows) {
    if (!el) return;
    el.innerHTML = '';
    var items = Array.isArray(rows) ? rows : [];
    if (!items.length) {
      var emptyLi = document.createElement('li');
      emptyLi.className = 'metrics-rank-empty';
      emptyLi.textContent = i18n('metrics_empty');
      el.appendChild(emptyLi);
      return;
    }
    for (var i = 0; i < items.length; i++) {
      var row = items[i] || {};
      var rank = i + 1;
      var liRow = document.createElement('li');
      liRow.className = 'metrics-rank-row';

      var pos = document.createElement('span');
      pos.className = 'metrics-rank-pos';
      if (rank <= 3) pos.classList.add('metrics-rank-pos-' + rank);
      pos.textContent = String(rank);
      pos.setAttribute('aria-hidden', 'true');

      var nameWrap = document.createElement('span');
      nameWrap.className = 'metrics-rank-name min-w-0';

      var name = document.createElement('span');
      name.className = 'block truncate';
      name.textContent = String(row.name || '');
      name.title = String(row.name || '');
      nameWrap.appendChild(name);

      if (row.engagementLevel || row.lastSeenAt) {
        var meta = document.createElement('span');
        meta.className =
          'mt-0.5 block truncate text-[11px] font-normal text-slate-500 dark:text-slate-400';
        var metaParts = [];
        if (row.engagementLevel) {
          metaParts.push(metricsEngagementLabel_(row.engagementLevel));
        }
        if (row.lastSeenAt) {
          metaParts.push(formatDateTime(row.lastSeenAt));
        }
        meta.textContent = metaParts.join(' · ');
        nameWrap.appendChild(meta);
      }

      var count = document.createElement('span');
      count.className = 'metrics-rank-count';
      count.textContent = String(row.count || 0);

      liRow.appendChild(pos);
      liRow.appendChild(nameWrap);
      liRow.appendChild(count);
      el.appendChild(liRow);
    }
  }

  function renderUnansweredPageInfo() {
    if (!unansweredInfo) return;
    if (!unansweredPage.total) {
      unansweredInfo.textContent = i18n('metrics_pagination_empty');
      return;
    }
    var from = unansweredPage.skip + 1;
    var to = Math.min(unansweredPage.skip + unansweredPage.limit, unansweredPage.total);
    unansweredInfo.textContent = i18nFmt('metrics_pagination_info', {
      from: from,
      to: to,
      total: unansweredPage.total,
    });
  }

  function queueFilterValue() {
    if (!queueFilterEl) return 'all';
    var v = String(queueFilterEl.value || 'all');
    return v === 'open' || v === 'missing_content' ? v : 'all';
  }

  function loadUnanswered(resetPage) {
    if (resetPage) unansweredPage.skip = 0;
    loadingUnanswered = true;
    refreshMetricsStatus();
    var filters = {
      skip: unansweredPage.skip,
      limit: unansweredPage.limit,
    };
    var qf = queueFilterValue();
    if (qf !== 'all') filters.status = qf;

    google.script.run
      .withSuccessHandler(function (res) {
        loadingUnanswered = false;
        queueCanManage = !!(res && res.canManage);
        unansweredPage.total = Number((res && res.total) || 0);
        unansweredPage.hasMore = !!(res && res.hasMore);
        unansweredPage.limit = Number((res && res.limit) || unansweredPage.limit);
        unansweredPage.skip = Number((res && res.skip) || unansweredPage.skip);
        metricsQueueLoadAssignees(function () {
          renderUnansweredTable((res && res.items) || []);
          renderUnansweredPageInfo();
          refreshMetricsStatus();
        });
      })
      .withFailureHandler(function (e) {
        loadingUnanswered = false;
        setStatus((e && e.message) || i18n('metrics_load_error'), false, { error: true });
        syncBusyControls();
      })
      .metricsUnansweredList(filters);
  }

  function ensureChartJs() {
    if (typeof Chart !== 'undefined') return Promise.resolve();
    if (chartJsPromise) return chartJsPromise;
    chartJsPromise = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
      s.crossOrigin = 'anonymous';
      s.referrerPolicy = 'no-referrer';
      s.onload = function () { resolve(); };
      s.onerror = function () {
        chartJsPromise = null;
        reject(new Error('Chart.js load failed'));
      };
      document.head.appendChild(s);
    });
    return chartJsPromise;
  }

  function destroyCharts() {
    var charts = [
      trendSectionChart,
      sectionChart,
      moduleChart,
      agentChart,
      catalogChart,
      proposalStatusChart,
      feedbackChart,
    ];
    for (var ci = 0; ci < charts.length; ci++) {
      if (charts[ci] && typeof charts[ci].destroy === 'function') charts[ci].destroy();
    }
    trendSectionChart = null;
    sectionChart = null;
    moduleChart = null;
    agentChart = null;
    catalogChart = null;
    proposalStatusChart = null;
    feedbackChart = null;
  }

  function metricsIsDark_() {
    return document.documentElement.classList.contains('dark');
  }

  function metricsChartTheme_() {
    return metricsIsDark_()
      ? {
          text: '#cbd5e1',
          tick: '#94a3b8',
          grid: 'rgba(148, 163, 184, 0.22)',
        }
      : {
          text: '#334155',
          tick: '#64748b',
          grid: 'rgba(148, 163, 184, 0.35)',
        };
  }

  function metricsChartOptions(extra) {
    var theme = metricsChartTheme_();
    var opts = {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: true,
          labels: { color: theme.text, boxWidth: 12, usePointStyle: true },
        },
        tooltip: {
          backgroundColor: metricsIsDark_() ? '#0f172a' : '#ffffff',
          titleColor: theme.text,
          bodyColor: theme.tick,
          borderColor: metricsIsDark_() ? '#334155' : '#e2e8f0',
          borderWidth: 1,
          padding: 10,
        },
      },
      scales: {
        x: {
          ticks: { color: theme.tick, maxRotation: 0, autoSkip: true },
          grid: { color: theme.grid },
          stacked: !!(extra && extra.stacked),
        },
        y: {
          ticks: { color: theme.tick, precision: 0 },
          grid: { color: theme.grid },
          stacked: !!(extra && extra.stacked),
          beginAtZero: true,
        },
      },
    };
    if (extra) {
      if (extra.plugins) opts.plugins = Object.assign({}, opts.plugins, extra.plugins);
      if (extra.scales === false) {
        delete opts.scales;
      } else if (extra.scales) {
        opts.scales = Object.assign({}, opts.scales || {}, extra.scales);
      }
      if (extra.indexAxis) opts.indexAxis = extra.indexAxis;
      if (extra.stacked === false && opts.scales) {
        opts.scales.x.stacked = false;
        opts.scales.y.stacked = false;
      }
    }
    return opts;
  }

  function metricsAgentBarColors_(count) {
    var palette = ['#2563eb', '#0ea5e9', '#8b5cf6', '#14b8a6', '#f59e0b', '#f97316', '#ec4899', '#64748b'];
    var out = [];
    for (var i = 0; i < count; i++) out.push(palette[i % palette.length]);
    return out;
  }

  function renderCharts(data) {
    destroyCharts();
    if (typeof Chart === 'undefined') return;

    var trendBySection = (data && data.trendBySection) || [];
    var trendLabels = [];
    var sectionDatasets = [];
    var sk;
    for (sk = 0; sk < METRICS_SECTION_KEYS_.length; sk++) {
      var secKey = METRICS_SECTION_KEYS_[sk];
      sectionDatasets.push({
        label: metricsSectionLabel_(secKey),
        data: [],
        backgroundColor: METRICS_SECTION_COLORS_[secKey] + 'cc',
        borderColor: METRICS_SECTION_COLORS_[secKey],
        borderWidth: 1,
        borderRadius: 4,
        stack: 'sections',
      });
    }
    for (var i = 0; i < trendBySection.length; i++) {
      var row = trendBySection[i] || {};
      trendLabels.push(String(row.date || ''));
      for (sk = 0; sk < METRICS_SECTION_KEYS_.length; sk++) {
        var k = METRICS_SECTION_KEYS_[sk];
        sectionDatasets[sk].data.push(Number(row[k] || 0));
      }
    }
    if (trendSectionCanvas) {
      trendSectionChart = new Chart(trendSectionCanvas, {
        type: 'bar',
        data: { labels: trendLabels, datasets: sectionDatasets },
        options: metricsChartOptions({ stacked: true }),
      });
    }

    var sections = (data && data.sections) || {};
    var sectionLabels = [];
    var sectionCounts = [];
    var sectionColors = [];
    for (sk = 0; sk < METRICS_SECTION_KEYS_.length; sk++) {
      var sKey = METRICS_SECTION_KEYS_[sk];
      var sCount = Number(sections[sKey] || 0);
      if (!sCount) continue;
      sectionLabels.push(metricsSectionLabel_(sKey));
      sectionCounts.push(sCount);
      sectionColors.push(METRICS_SECTION_COLORS_[sKey]);
    }
    if (sectionCanvas) {
      sectionChart = new Chart(sectionCanvas, {
        type: 'doughnut',
        data: {
          labels: sectionLabels.length ? sectionLabels : [i18n('metrics_empty')],
          datasets: [
            {
              data: sectionCounts.length ? sectionCounts : [1],
              backgroundColor: sectionColors.length ? sectionColors : ['#cbd5e1'],
              borderWidth: 2,
              borderColor: metricsIsDark_() ? '#1e293b' : '#ffffff',
              hoverOffset: 6,
            },
          ],
        },
        options: metricsChartOptions({
          plugins: { legend: { position: 'bottom' } },
          scales: false,
          stacked: false,
        }),
      });
      if (!sectionCounts.length) {
        sectionChart.options.plugins.legend.display = false;
      }
    }

    var byModule = (data && data.moduleUsage && data.moduleUsage.byModule) || [];
    var moduleLabels = [];
    var moduleCounts = [];
    var moduleColors = [];
    for (var mk = 0; mk < byModule.length; mk++) {
      var modRow = byModule[mk] || {};
      var modCount = Number(modRow.count || 0);
      if (!modCount) continue;
      moduleLabels.push(metricsModuleLabel_(modRow.key));
      moduleCounts.push(modCount);
      moduleColors.push(METRICS_MODULE_COLORS_[mk % METRICS_MODULE_COLORS_.length]);
    }
    if (moduleCanvas) {
      moduleChart = new Chart(moduleCanvas, {
        type: 'doughnut',
        data: {
          labels: moduleLabels.length ? moduleLabels : [i18n('metrics_empty')],
          datasets: [
            {
              data: moduleCounts.length ? moduleCounts : [1],
              backgroundColor: moduleColors.length ? moduleColors : ['#cbd5e1'],
              borderWidth: 2,
              borderColor: metricsIsDark_() ? '#1e293b' : '#ffffff',
              hoverOffset: 6,
            },
          ],
        },
        options: metricsChartOptions({
          plugins: { legend: { position: 'bottom' } },
          scales: false,
          stacked: false,
        }),
      });
      if (!moduleCounts.length) {
        moduleChart.options.plugins.legend.display = false;
      }
    }

    var byAgent = (data && data.leaderboard && data.leaderboard.agents) || [];
    var agentLabels = [];
    var agentCounts = [];
    for (var j = 0; j < byAgent.length; j++) {
      agentLabels.push(String(byAgent[j].name || ''));
      agentCounts.push(Number(byAgent[j].count || 0));
    }
    if (agentCanvas) {
      agentChart = new Chart(agentCanvas, {
        type: 'bar',
        data: {
          labels: agentLabels,
          datasets: [
            {
              label: i18n('metrics_agent_usage_heading'),
              data: agentCounts,
              backgroundColor: metricsAgentBarColors_(agentCounts.length),
              borderRadius: 6,
              borderSkipped: false,
            },
          ],
        },
        options: metricsChartOptions({
          indexAxis: 'y',
          plugins: { legend: { display: false } },
          stacked: false,
        }),
      });
    }

    var catalog = (data && data.catalog) || {};
    var catalogLabels = [
      i18n('metrics_catalog_success'),
      i18n('metrics_catalog_proposals'),
      i18n('metrics_catalog_onboarding'),
      i18n('metrics_catalog_clients'),
      i18n('metrics_catalog_kg_nodes'),
    ];
    var catalogCounts = [
      Number(catalog.successCases || 0),
      Number(catalog.proposals || 0),
      Number(catalog.onboarding || 0),
      Number(catalog.clients || 0),
      Number(catalog.kgNodes || 0),
    ];
    if (catalogCanvas) {
      catalogChart = new Chart(catalogCanvas, {
        type: 'bar',
        data: {
          labels: catalogLabels,
          datasets: [
            {
              label: i18n('metrics_catalog_heading'),
              data: catalogCounts,
              backgroundColor: ['#22c55e', '#3b82f6', '#8b5cf6', '#f59e0b', '#06b6d4'],
              borderRadius: 6,
              borderSkipped: false,
            },
          ],
        },
        options: metricsChartOptions({
          indexAxis: 'y',
          plugins: { legend: { display: false } },
          stacked: false,
        }),
      });
    }

    var pb = (data && data.proposalBuilding) || {};
    if (proposalStatusCanvas) {
      proposalStatusChart = new Chart(proposalStatusCanvas, {
        type: 'doughnut',
        data: {
          labels: [
            i18n('metrics_proposal_status_completed'),
            i18n('metrics_proposal_status_in_progress'),
            i18n('metrics_proposal_status_failed'),
          ],
          datasets: [
            {
              data: [
                Number(pb.completed || 0),
                Number(pb.inProgress || 0),
                Number(pb.failed || 0),
              ],
              backgroundColor: ['#22c55e', '#3b82f6', '#ef4444'],
              borderWidth: 2,
              borderColor: metricsIsDark_() ? '#1e293b' : '#ffffff',
              hoverOffset: 6,
            },
          ],
        },
        options: metricsChartOptions({
          plugins: { legend: { position: 'bottom' } },
          scales: false,
          stacked: false,
        }),
      });
    }

    var fb = (data && data.feedback) || {};
    if (feedbackCanvas) {
      feedbackChart = new Chart(feedbackCanvas, {
        type: 'doughnut',
        data: {
          labels: [i18n('chat_feedback_up'), i18n('chat_feedback_down')],
          datasets: [
            {
              data: [Number(fb.up || 0), Number(fb.down || 0)],
              backgroundColor: ['#22c55e', '#ef4444'],
              borderWidth: 2,
              borderColor: metricsIsDark_() ? '#1e293b' : '#ffffff',
              hoverOffset: 6,
            },
          ],
        },
        options: metricsChartOptions({
          plugins: { legend: { position: 'bottom' } },
          scales: false,
          stacked: false,
        }),
      });
    }
  }

  var lastDashboardData = null;

  function renderDashboard(data) {
    lastDashboardData = data;
    var summary = (data && data.summary) || {};
    if (totalQuestionsEl) totalQuestionsEl.textContent = String(summary.questions || 0);
    if (totalUnansweredEl) totalUnansweredEl.textContent = String(summary.unanswered || 0);
    if (answerRateEl) answerRateEl.textContent = metricsFormatPct_(summary.answerRatePct);
    if (uniqueUsersEl) uniqueUsersEl.textContent = String(summary.uniqueUsers || 0);
    if (moduleVisitsEl) moduleVisitsEl.textContent = String(summary.moduleVisits || 0);
    if (onboardingQuestionsEl) {
      onboardingQuestionsEl.textContent = String(summary.onboardingQuestions || 0);
    }
    if (offeringQuestionsEl) {
      offeringQuestionsEl.textContent = String(summary.globantOfferingQuestions || 0);
    }
    if (proposalsBuiltEl) proposalsBuiltEl.textContent = String(summary.proposalsBuilt || 0);
    if (feedbackSatisfactionEl) {
      feedbackSatisfactionEl.textContent = metricsFormatPct_(summary.feedbackSatisfactionPct);
    }

    var lb = (data && data.leaderboard) || {};
    renderRankList(lbUsersEl, lb.users);
    renderRankList(lbAgentsEl, lb.agents);
    renderRankList(lbSuccessClientEl, lb.successByClient);
    renderRankList(lbSuccessIndustryEl, lb.successByIndustry);
    renderRankList(lbProposalClientEl, lb.proposalByClient);
    renderRankList(lbProposalIndustryEl, lb.proposalByIndustry);
    renderRankList(lbProposalBuildersEl, lb.proposalBuilders);
    var moduleUsage = (data && data.moduleUsage) || {};
    renderModuleRankList(lbModulesEl, moduleUsage.byModule);
    renderRankList(lbModuleUsersEl, moduleUsage.topUsers);
    ensureChartJs()
      .then(function () {
        renderCharts(data);
        metricsResizeCharts_();
      })
      .catch(function () { setStatus(i18n('metrics_load_error'), false, { error: true }); });
  }

  function loadDashboard() {
    loadingDashboard = true;
    refreshMetricsStatus();
    google.script.run
      .withSuccessHandler(function (res) {
        loadingDashboard = false;
        if (res && res.ok) {
          renderDashboard(res);
          refreshMetricsStatus();
        } else {
          setStatus(i18n('metrics_load_error'), false, { error: true });
          syncBusyControls();
        }
      })
      .withFailureHandler(function (e) {
        loadingDashboard = false;
        setStatus((e && e.message) || i18n('metrics_load_error'), false, { error: true });
        syncBusyControls();
      })
      .metricsDashboard(activeRange(), 8);
    loadUnanswered(false);
  }

  function loadAll(resetUnanswered) {
    if (resetUnanswered) {
      unansweredPage.skip = 0;
      moduleUsersPage.skip = 0;
    }
    loadDashboard();
    loadModuleUsers(false);
  }

  if (refreshBtn) {
    refreshBtn.addEventListener('click', function () {
      loadAll(true);
    });
  }
  if (resetBtn) {
    resetBtn.addEventListener('click', function () {
      A.confirmDialog({ message: i18n('metrics_reset_confirm'), danger: true }).then(function (ok) {
        if (!ok) return;
        A.showBlockingModal(i18n('metrics_reset_busy'));
        loadingDashboard = true;
        loadingUnanswered = true;
        syncBusyControls();
        google.script.run
          .withSuccessHandler(function () {
            A.hideBlockingModal();
            loadingDashboard = false;
            loadingUnanswered = false;
            loadAll(true);
          })
          .withFailureHandler(function (e) {
            A.hideBlockingModal();
            loadingDashboard = false;
            loadingUnanswered = false;
            setStatus((e && e.message) || i18n('metrics_reset_error'), false, { error: true });
            syncBusyControls();
          })
          .metricsResetAll();
      });
    });
  }
  if (rangeEl) {
    rangeEl.addEventListener('change', function () {
      loadAll(true);
    });
  }
  if (queueFilterEl) {
    queueFilterEl.addEventListener('change', function () {
      loadUnanswered(true);
    });
  }
  if (unansweredPrevBtn) {
    unansweredPrevBtn.addEventListener('click', function () {
      if (unansweredPage.skip <= 0) return;
      unansweredPage.skip = Math.max(0, unansweredPage.skip - unansweredPage.limit);
      loadUnanswered(false);
    });
  }
  if (unansweredNextBtn) {
    unansweredNextBtn.addEventListener('click', function () {
      if (!unansweredPage.hasMore) return;
      unansweredPage.skip += unansweredPage.limit;
      loadUnanswered(false);
    });
  }
  if (moduleUsersPrevBtn) {
    moduleUsersPrevBtn.addEventListener('click', function () {
      if (moduleUsersPage.skip <= 0) return;
      moduleUsersPage.skip = Math.max(0, moduleUsersPage.skip - moduleUsersPage.limit);
      loadModuleUsers(false);
    });
  }
  if (moduleUsersNextBtn) {
    moduleUsersNextBtn.addEventListener('click', function () {
      if (!moduleUsersPage.hasMore) return;
      moduleUsersPage.skip += moduleUsersPage.limit;
      loadModuleUsers(false);
    });
  }
  if (metricsLbTabRoot) {
    metricsLbTabRoot.addEventListener('click', function (ev) {
      var tab = ev.target && ev.target.closest ? ev.target.closest('[role="tab"]') : null;
      if (!tab || tab.getAttribute('role') !== 'tab') return;
      if (tab.id === 'metrics-lb-tab-modules') loadModuleUsers(false);
    });
  }

  A.metrics = {
    loadDashboard: function () {
      var isAdmin = !!S.get('canResetMetrics');
      if (resetBtn) resetBtn.classList.toggle('hidden', !isAdmin);
      if (metricsMainTabs) metricsMainTabs.activate('metrics-tab-overview');
      if (metricsLbTabs) metricsLbTabs.activate('metrics-lb-tab-usage');
      loadAll(false);
    },
    onThemeChange: function () {
      if (!lastDashboardData) return;
      ensureChartJs()
        .then(function () {
          renderCharts(lastDashboardData);
          metricsResizeCharts_();
        })
        .catch(function () {});
    },
  };
})(window.Aviators);
</script>
