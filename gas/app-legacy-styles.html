    <style>
      :root {
        --ring: #2b5da3;
        --text: #16181d;
        --muted: #5f6368;
        --primary: #2b5da3;
        --danger: #b3261e;
        --radius: 1rem;
      }
      .hidden {
        display: none !important;
      }
      .status-msg.err {
        color: var(--danger);
      }
      .app-nav-item.is-active {
        border: 1px solid rgb(125 211 252);
        background: rgb(224 242 254);
        color: rgb(12 74 110);
        box-shadow: inset 0 0 0 1px rgb(186 230 253);
      }
      .app-nav-item.is-active i {
        color: rgb(3 105 161);
      }
      ul.files {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 0.9375rem;
      }
      ul.files li {
        margin: 0.35rem 0;
        padding: 0.35rem 0;
        border-bottom: 1px solid rgb(230 232 239);
      }
      ul.files label {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        cursor: pointer;
      }
      .admin-app-shell .btn-admin,
      .app-content-panel .btn-admin {
        font-family: inherit;
        font-weight: 600;
        font-size: 0.8125rem;
        padding: 0.55rem 0.95rem;
        border-radius: 0.875rem;
        border: 2px solid var(--primary);
        background: #fff;
        color: var(--primary);
        box-shadow: 0 1px 2px rgb(15 23 42 / 0.06);
        transition:
          box-shadow 0.15s ease,
          transform 0.1s ease,
          background-color 0.15s ease,
          border-color 0.15s ease;
      }
      .admin-app-shell .btn-admin:hover,
      .app-content-panel .btn-admin:hover {
        box-shadow: 0 4px 14px rgb(42 93 163 / 0.14);
      }
      .admin-app-shell .btn-admin:active,
      .app-content-panel .btn-admin:active {
        transform: scale(0.99);
      }
      .admin-app-shell .btn-admin.primary,
      .app-content-panel .btn-admin.primary {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
        box-shadow: 0 2px 8px rgb(42 93 163 / 0.28);
      }
      .admin-app-shell .btn-admin.primary:hover,
      .app-content-panel .btn-admin.primary:hover {
        filter: brightness(1.06);
        box-shadow: 0 4px 16px rgb(42 93 163 / 0.35);
      }
      .admin-app-shell .btn-admin.danger,
      .app-content-panel .btn-admin.danger {
        border-color: var(--danger);
        color: var(--danger);
        box-shadow: 0 1px 2px rgb(179 38 30 / 0.12);
      }
      .admin-app-shell .btn-admin.danger:hover,
      .app-content-panel .btn-admin.danger:hover {
        box-shadow: 0 4px 14px rgb(179 38 30 / 0.2);
      }
      .admin-chips .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.25rem 0.5rem;
        margin: 0.2rem 0.35rem 0.2rem 0;
        border-radius: 999px;
        background: rgb(239 243 250);
        font-size: 0.78rem;
      }
      .admin-chips .chip button.x {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 1rem;
        line-height: 1;
        color: var(--muted);
      }
      .globant-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-top: 0.5rem;
      }
      .globant-panel-spinner.is-visible {
        opacity: 1;
        animation: gc-spin 0.7s linear infinite;
      }
      @keyframes gc-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .gc-table-wrap {
        overflow-x: auto;
        border-radius: calc(var(--radius) - 6px);
        border: 1px solid rgb(218 226 239);
      }
      .gc-table-wrap table.gc-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.78rem;
      }
      .gc-table-wrap th,
      .gc-table-wrap td {
        text-align: left;
        padding: 0.35rem 0.45rem;
        border-bottom: 1px solid rgb(235 238 243);
      }
      .drive-exp-breadcrumb {
        font-size: 0.8125rem;
        color: var(--muted);
      }
      ul.drive-exp-list {
        list-style: none;
        margin: 0.35rem 0 0;
        padding: 0;
      }
      ul.drive-exp-list li {
        padding: 0.35rem 0;
        border-bottom: 1px solid rgb(230 232 239);
      }
      .drive-exp-folder-btn {
        display: flex;
        gap: 0.5rem;
        width: 100%;
        text-align: left;
        border: none;
        background: none;
        cursor: pointer;
        font: inherit;
        padding: 0.25rem 0;
      }
      .drive-exp-file-row {
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .admin-agent-dropzone.is-dragover {
        border-color: rgb(14 165 233);
        background-color: rgb(240 249 255);
      }
      .admin-app-sidebar-title {
        margin-top: 0;
      }
      .admin-root-hint-micro {
        font-size: 0.78rem;
        margin: 0.35rem 0 0.5rem;
      }
      .label-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .ask-status-mt {
        margin-top: 0.75rem;
      }
      @keyframes admin-seed-indeterminate {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      .admin-agent-seed-loader .admin-seed-progress-indeterminate {
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          rgb(14 165 233),
          rgb(56 189 248),
          rgb(14 165 233)
        );
        animation: admin-seed-indeterminate 1.15s ease-in-out infinite;
      }
      .contents-stepper {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .contents-step {
        color: rgb(100 116 139);
      }
      .contents-step .contents-step-num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.4rem;
        height: 1.4rem;
        border-radius: 999px;
        background: rgb(226 232 240);
        color: rgb(71 85 105);
        font-weight: 600;
        font-size: 0.7rem;
      }
      .contents-step.is-active {
        color: rgb(15 23 42);
        font-weight: 600;
      }
      .contents-step.is-active .contents-step-num {
        background: rgb(14 165 233);
        color: white;
      }
      .contents-step.is-done .contents-step-num {
        background: rgb(16 185 129);
        color: white;
      }
      .contents-row-busy {
        opacity: 0.6;
        pointer-events: none;
      }
      .blocking-modal-card {
        min-width: 19rem;
      }
      .blocking-flight {
        position: relative;
        width: 7.5rem;
        height: 3.8rem;
        overflow: hidden;
      }
      .blocking-flight-contrail {
        position: absolute;
        left: 0.2rem;
        top: 50%;
        width: 100%;
        height: 0.22rem;
        transform: translateY(-50%);
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          rgb(14 165 233 / 0.2),
          rgb(14 165 233 / 0.65),
          rgb(14 165 233 / 0.2)
        );
        animation: blocking-contrail 2.1s ease-in-out infinite;
      }
      .blocking-flight-plane {
        position: absolute;
        width: 4.2rem;
        height: auto;
        top: 0.85rem;
        left: -4.4rem;
        color: rgb(2 132 199);
        transform: rotate(-8deg);
        filter: drop-shadow(0 4px 8px rgb(14 165 233 / 0.28));
        animation: blocking-plane-fly 2.45s cubic-bezier(0.42, 0, 0.24, 1)
          infinite;
      }
      @keyframes blocking-plane-fly {
        0% {
          left: -4.4rem;
          transform: translateY(0.24rem) rotate(-10deg);
        }
        50% {
          transform: translateY(-0.18rem) rotate(-5deg);
        }
        100% {
          left: 7.7rem;
          transform: translateY(0.22rem) rotate(-10deg);
        }
      }
      @keyframes blocking-contrail {
        0% {
          opacity: 0.45;
          transform: translateY(-50%) scaleX(0.92);
        }
        50% {
          opacity: 1;
          transform: translateY(-50%) scaleX(1.02);
        }
        100% {
          opacity: 0.45;
          transform: translateY(-50%) scaleX(0.92);
        }
      }

      /* Dark mode overrides for legacy CSS-var surfaces */
      .dark .app-sidebar-footer {
        background-color: rgb(30 41 59);
        border-color: rgb(51 65 85);
      }
      .dark .nav-link {
        color: rgb(203 213 225);
      }
      .dark .nav-link:hover,
      .dark .nav-link.active {
        background: rgb(30 41 59);
        color: rgb(224 242 254);
      }
      .dark .admin-table th {
        background: rgb(30 41 59);
        color: rgb(203 213 225);
        border-color: rgb(51 65 85);
      }
      .dark .admin-table td {
        border-color: rgb(51 65 85);
        color: rgb(203 213 225);
      }
      .dark .admin-table tr:hover td {
        background: rgb(30 41 59 / 0.5);
      }
      .dark .btn-admin {
        background: rgb(51 65 85);
        color: rgb(203 213 225);
        border-color: rgb(71 85 105);
      }
      .dark .btn-admin:hover {
        background: rgb(71 85 105);
      }
      .dark .dashboard-card {
        background: rgb(30 41 59);
        border-color: rgb(51 65 85);
        color: rgb(203 213 225);
      }
      .dark .contents-step {
        color: rgb(148 163 184);
      }
      .dark .contents-step.is-active {
        color: rgb(224 242 254);
      }
      .dark .contents-step .contents-step-num {
        background: rgb(51 65 85);
        color: rgb(148 163 184);
      }
      .dark .blocking-modal-card {
        background: rgb(15 23 42);
        border-color: rgb(51 65 85);
      }
      .dark .blocking-flight-plane {
        color: rgb(56 189 248);
        filter: drop-shadow(0 5px 10px rgb(56 189 248 / 0.35));
      }
      .dark #blocking-modal-msg {
        color: rgb(226 232 240);
      }
    </style>
