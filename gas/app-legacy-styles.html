    <style>
      :root {
        --ring: #2b5da3;
        --text: #16181d;
        --muted: #5f6368;
        --primary: #2b5da3;
        --danger: #b3261e;
        --radius: 1rem;
      }
      .hidden {
        display: none !important;
      }
      .status-msg.err {
        color: var(--danger);
      }
      .app-nav-item.is-active {
        border: 1px solid rgb(125 211 252);
        background: rgb(224 242 254);
        color: rgb(12 74 110);
        box-shadow: inset 0 0 0 1px rgb(186 230 253);
      }
      .app-nav-item.is-active i {
        color: rgb(3 105 161);
      }
      .dark .app-nav-item.is-active {
        border-color: rgb(56 189 248);
        background: rgb(12 74 110 / 0.52);
        color: rgb(224 242 254);
        box-shadow: inset 0 0 0 1px rgb(14 165 233 / 0.35);
      }
      .dark .app-nav-item.is-active i {
        color: rgb(125 211 252);
      }
      .app-nav-group-summary.is-active {
        border: 1px solid rgb(186 230 253);
        background: rgb(240 249 255);
        color: rgb(12 74 110);
      }
      .app-nav-group-summary.is-active i {
        color: rgb(3 105 161);
      }
      .dark .app-nav-group-summary.is-active {
        border-color: rgb(14 116 144);
        background: rgb(12 74 110 / 0.35);
        color: rgb(224 242 254);
      }
      .dark .app-nav-group-summary.is-active i {
        color: rgb(125 211 252);
      }
      .app-nav-group-summary:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      ul.files {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 0.9375rem;
      }
      ul.files li {
        margin: 0.35rem 0;
        padding: 0.35rem 0;
        border-bottom: 1px solid rgb(230 232 239);
      }
      ul.files label {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        cursor: pointer;
      }
      .app-nav-item:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .btn-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 0.375rem;
        border: none;
        background: transparent;
        color: var(--primary);
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .btn-icon:hover {
        background: rgb(239 243 250);
      }
      .btn-icon-warn {
        color: #b45309;
      }
      .btn-icon-warn:hover {
        background: #fef3c7;
      }
      .btn-icon-danger {
        color: #b91c1c;
      }
      .btn-icon-danger:hover {
        background: #fee2e2;
      }
      .admin-chips .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.25rem 0.5rem;
        margin: 0.2rem 0.35rem 0.2rem 0;
        border-radius: 999px;
        background: rgb(239 243 250);
        font-size: 0.78rem;
      }
      .admin-chips .chip button.x {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 1rem;
        line-height: 1;
        color: var(--muted);
      }
      .globant-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-top: 0.5rem;
      }
      .globant-panel-spinner.is-visible {
        opacity: 1;
        animation: gc-spin 0.7s linear infinite;
      }
      @keyframes gc-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .gc-table-wrap {
        overflow-x: auto;
        border-radius: calc(var(--radius) - 6px);
        border: 1px solid rgb(218 226 239);
      }
      .gc-table-wrap table.gc-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.78rem;
      }
      .gc-table-wrap th,
      .gc-table-wrap td {
        text-align: left;
        padding: 0.35rem 0.45rem;
        border-bottom: 1px solid rgb(235 238 243);
      }
      .drive-exp-breadcrumb {
        font-size: 0.8125rem;
        color: var(--muted);
      }
      ul.drive-exp-list {
        list-style: none;
        margin: 0.35rem 0 0;
        padding: 0;
      }
      ul.drive-exp-list li {
        padding: 0.35rem 0;
        border-bottom: 1px solid rgb(230 232 239);
      }
      .drive-exp-folder-btn {
        display: flex;
        gap: 0.5rem;
        width: 100%;
        text-align: left;
        border: none;
        background: none;
        cursor: pointer;
        font: inherit;
        padding: 0.25rem 0;
      }
      .drive-exp-file-row {
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .admin-agent-dropzone.is-dragover {
        border-color: rgb(14 165 233);
        background-color: rgb(240 249 255);
      }
      .dark .admin-agent-dropzone.is-dragover {
        border-color: rgb(56 189 248);
        background-color: rgb(12 74 110 / 0.35);
      }
      .contents-dropzone.is-dragover {
        border-color: rgb(14 165 233);
        background-color: rgb(240 249 255);
      }
      .dark .contents-dropzone.is-dragover {
        border-color: rgb(56 189 248);
        background-color: rgb(12 74 110 / 0.35);
      }
      .admin-app-sidebar-title {
        margin-top: 0;
      }
      .admin-root-hint-micro {
        font-size: 0.78rem;
        margin: 0.35rem 0 0.5rem;
      }
      .label-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .ask-status-mt {
        margin-top: 0.75rem;
      }
      @keyframes admin-seed-indeterminate {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      .admin-agent-seed-loader .admin-seed-progress-indeterminate {
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          rgb(14 165 233),
          rgb(56 189 248),
          rgb(14 165 233)
        );
        animation: admin-seed-indeterminate 1.15s ease-in-out infinite;
      }
      .contents-stepper {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .contents-step {
        color: rgb(100 116 139);
      }
      .contents-step .contents-step-num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.4rem;
        height: 1.4rem;
        border-radius: 999px;
        background: rgb(226 232 240);
        color: rgb(71 85 105);
        font-weight: 600;
        font-size: 0.7rem;
      }
      .contents-step.is-active {
        color: rgb(15 23 42);
        font-weight: 600;
      }
      .contents-step.is-active .contents-step-num {
        background: rgb(14 165 233);
        color: white;
      }
      .contents-step.is-done .contents-step-num {
        background: rgb(16 185 129);
        color: white;
      }
      .contents-row-busy {
        opacity: 0.6;
        pointer-events: none;
      }
      .loader-flight-inline {
        position: relative;
        width: 100%;
        height: 1.45rem;
        overflow: hidden;
      }
      .loader-flight-inline-contrail {
        position: absolute;
        left: 0;
        top: 50%;
        width: 100%;
        height: 0.18rem;
        border-radius: 999px;
        transform: translateY(-50%);
        background: linear-gradient(
          90deg,
          rgb(14 165 233 / 0.2),
          rgb(14 165 233 / 0.7),
          rgb(14 165 233 / 0.2)
        );
        animation: loader-inline-contrail 2.1s ease-in-out infinite;
      }
      .loader-flight-inline-plane {
        position: absolute;
        left: -2rem;
        top: 50%;
        transform: translateY(-50%) rotate(12deg);
        color: rgb(2 132 199);
        font-size: 1.15rem;
        filter: drop-shadow(0 3px 8px rgb(14 165 233 / 0.28));
        animation: loader-inline-plane 4.8s cubic-bezier(0.42, 0, 0.24, 1)
          infinite;
      }
      @keyframes loader-inline-plane {
        0% {
          left: -2rem;
          transform: translateY(-50%) rotate(14deg);
        }
        50% {
          transform: translateY(calc(-50% - 0.08rem)) rotate(10deg);
        }
        100% {
          left: calc(100% + 2rem);
          transform: translateY(-50%) rotate(14deg);
        }
      }
      @keyframes loader-inline-contrail {
        0% {
          opacity: 0.45;
          transform: translateY(-50%) scaleX(0.96);
        }
        50% {
          opacity: 1;
          transform: translateY(-50%) scaleX(1);
        }
        100% {
          opacity: 0.45;
          transform: translateY(-50%) scaleX(0.96);
        }
      }

      /* Startup loader — radar ATC mientras llega el pack i18n */
      #app-startup-loader-card.is-i18n-loading {
        max-width: 18.5rem;
        padding-top: 1.85rem;
        padding-bottom: 1.65rem;
      }
      .loader-startup-visual-i18n {
        display: flex;
        justify-content: center;
        width: 100%;
      }
      .loader-i18n-orbit {
        position: relative;
        width: 8.75rem;
        height: 8.75rem;
      }
      .loader-i18n-radar {
        position: absolute;
        inset: 1.15rem;
        border-radius: 999px;
        overflow: hidden;
        background: radial-gradient(
          circle at center,
          rgb(240 249 255 / 0.95) 0%,
          rgb(224 242 254 / 0.88) 42%,
          rgb(186 230 253 / 0.55) 100%
        );
        box-shadow:
          inset 0 0 0 1px rgb(14 165 233 / 0.22),
          0 10px 24px rgb(14 165 233 / 0.14);
      }
      .loader-i18n-radar-ring {
        position: absolute;
        left: 50%;
        top: 50%;
        border-radius: 999px;
        border: 1px solid rgb(14 165 233 / 0.18);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .loader-i18n-radar-ring--outer {
        width: 96%;
        height: 96%;
      }
      .loader-i18n-radar-ring--mid {
        width: 64%;
        height: 64%;
      }
      .loader-i18n-radar-ring--inner {
        width: 34%;
        height: 34%;
        border-color: rgb(14 165 233 / 0.28);
      }
      .loader-i18n-radar-sweep {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          transparent 300deg,
          rgb(14 165 233 / 0.08) 318deg,
          rgb(56 189 248 / 0.42) 360deg
        );
        animation: loader-i18n-sweep 2.8s linear infinite;
        transform-origin: center center;
      }
      .loader-i18n-radar-plane {
        position: absolute;
        left: 50%;
        top: 50%;
        margin-left: -0.42rem;
        margin-top: -0.42rem;
        font-size: 0.84rem;
        color: rgb(2 132 199);
        transform: rotate(18deg);
        filter: drop-shadow(0 2px 6px rgb(14 165 233 / 0.35));
        animation: loader-i18n-plane-orbit 2.8s linear infinite;
        transform-origin: 0.42rem 0.42rem;
      }
      .loader-i18n-blip {
        position: absolute;
        width: 0.42rem;
        height: 0.42rem;
        border-radius: 999px;
        background: rgb(14 165 233 / 0.22);
        box-shadow: 0 0 0 0 rgb(56 189 248 / 0);
        opacity: 0.35;
        transition:
          opacity 0.45s ease,
          transform 0.45s ease,
          background-color 0.45s ease,
          box-shadow 0.45s ease;
      }
      .loader-i18n-blip--1 {
        left: 68%;
        top: 24%;
      }
      .loader-i18n-blip--2 {
        left: 22%;
        top: 58%;
      }
      .loader-i18n-blip--3 {
        left: 62%;
        top: 72%;
      }
      .loader-i18n-orbit-tag {
        position: absolute;
        left: 50%;
        top: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.65rem;
        height: 1.35rem;
        padding: 0 0.35rem;
        border-radius: 0.35rem;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: rgb(3 105 161);
        background: linear-gradient(180deg, rgb(255 255 255), rgb(224 242 254));
        border: 1px solid rgb(125 211 252);
        box-shadow:
          0 4px 10px rgb(14 165 233 / 0.18),
          inset 0 1px 0 rgb(255 255 255 / 0.9);
        transform-origin: 0 0;
        animation: loader-i18n-tag-orbit 5.6s ease-in-out infinite;
      }
      .loader-i18n-orbit-tag--es {
        animation-delay: 0s;
        margin-left: -0.82rem;
        margin-top: -0.67rem;
      }
      .loader-i18n-orbit-tag--en {
        animation-delay: -1.85s;
        margin-left: -0.82rem;
        margin-top: -0.67rem;
      }
      .loader-i18n-orbit-tag--glyph {
        animation-delay: -3.7s;
        margin-left: -0.67rem;
        margin-top: -0.67rem;
        min-width: 1.35rem;
        font-size: 0.72rem;
      }
      .loader-i18n-orbit[data-i18n-part='1'] .loader-i18n-blip--1,
      .loader-i18n-orbit[data-i18n-part='2'] .loader-i18n-blip--1,
      .loader-i18n-orbit[data-i18n-part='2'] .loader-i18n-blip--2,
      .loader-i18n-orbit[data-i18n-part='3'] .loader-i18n-blip--1,
      .loader-i18n-orbit[data-i18n-part='3'] .loader-i18n-blip--2,
      .loader-i18n-orbit[data-i18n-part='3'] .loader-i18n-blip--3 {
        opacity: 1;
        background: rgb(56 189 248);
        box-shadow:
          0 0 0 3px rgb(56 189 248 / 0.2),
          0 0 12px rgb(56 189 248 / 0.55);
        animation: loader-i18n-blip-pulse 1.4s ease-in-out infinite;
      }
      .loader-i18n-orbit[data-i18n-part='3'] .loader-i18n-radar-plane {
        color: rgb(16 185 129);
        filter: drop-shadow(0 2px 8px rgb(16 185 129 / 0.45));
      }
      .loader-i18n-orbit[data-i18n-part='3'] .loader-i18n-radar {
        box-shadow:
          inset 0 0 0 1px rgb(16 185 129 / 0.28),
          0 10px 24px rgb(16 185 129 / 0.16);
      }
      @keyframes loader-i18n-sweep {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes loader-i18n-plane-orbit {
        from {
          transform: rotate(18deg) translateX(2.45rem) rotate(-18deg);
        }
        to {
          transform: rotate(378deg) translateX(2.45rem) rotate(-378deg);
        }
      }
      @keyframes loader-i18n-tag-orbit {
        0% {
          transform: rotate(0deg) translateX(4.15rem) rotate(0deg)
            translateY(-0.08rem);
        }
        50% {
          transform: rotate(180deg) translateX(4.35rem) rotate(-180deg)
            translateY(0.08rem);
        }
        100% {
          transform: rotate(360deg) translateX(4.15rem) rotate(-360deg)
            translateY(-0.08rem);
        }
      }
      @keyframes loader-i18n-blip-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.18);
        }
      }

      /* Startup loader — manifiesto de cabina (roles + agentes; sin radar) */
      #app-startup-loader-card.is-session-loading {
        max-width: 20rem;
        padding-top: 1.75rem;
        padding-bottom: 1.55rem;
      }
      .loader-startup-visual-session {
        display: flex;
        justify-content: center;
        width: 100%;
      }
      .loader-session-manifest {
        width: 11.5rem;
      }
      .loader-session-deck {
        position: relative;
        display: flex;
        justify-content: center;
        padding-bottom: 0.15rem;
      }
      .loader-session-deck-aura {
        position: absolute;
        top: 0.35rem;
        width: 5.75rem;
        height: 5.75rem;
        border-radius: 1.35rem;
        background: linear-gradient(
          145deg,
          rgb(224 242 254 / 0.55),
          rgb(186 230 253 / 0.2)
        );
        filter: blur(10px);
        animation: loader-session-aura 2.8s ease-in-out infinite;
      }
      .loader-session-logo-frame {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 5.15rem;
        height: 5.15rem;
        overflow: hidden;
        border-radius: 1.1rem;
        background: linear-gradient(
          165deg,
          rgb(255 255 255) 0%,
          rgb(240 249 255) 48%,
          rgb(224 242 254) 100%
        );
        box-shadow:
          inset 0 0 0 1px rgb(14 165 233 / 0.2),
          0 12px 26px rgb(14 165 233 / 0.16);
        animation: loader-session-float 3.2s ease-in-out infinite;
      }
      .loader-session-logo {
        width: 3.2rem;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 4px 10px rgb(14 165 233 / 0.18));
      }
      .loader-session-scanline {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          rgb(56 189 248 / 0.15),
          rgb(56 189 248 / 0.95),
          rgb(56 189 248 / 0.15),
          transparent
        );
        box-shadow: 0 0 14px rgb(56 189 248 / 0.45);
        animation: loader-session-scan 2.4s ease-in-out infinite;
        pointer-events: none;
      }
      .loader-session-bus {
        position: relative;
        height: 1.55rem;
        margin: 0.05rem 0 0.4rem;
      }
      .loader-session-wire {
        position: absolute;
        bottom: 0;
        width: 2px;
        height: 1.45rem;
        border-radius: 999px;
        background: linear-gradient(
          180deg,
          transparent 0%,
          rgb(14 165 233 / 0.12) 35%,
          rgb(56 189 248 / 0.9) 50%,
          rgb(14 165 233 / 0.12) 65%,
          transparent 100%
        );
        background-size: 100% 220%;
        animation: loader-session-wire 1.9s ease-in-out infinite;
      }
      .loader-session-wire--roles {
        left: 30%;
        transform: rotate(-24deg);
        transform-origin: bottom center;
      }
      .loader-session-wire--agents {
        right: 30%;
        transform: rotate(24deg);
        transform-origin: bottom center;
        animation-delay: 0.55s;
      }
      .loader-session-modules {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.55rem;
      }
      .loader-session-chip {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        padding: 0.45rem 0.35rem 0.5rem;
        border-radius: 0.65rem;
        border: 1px solid rgb(14 165 233 / 0.16);
        background: linear-gradient(
          180deg,
          rgb(255 255 255 / 0.98),
          rgb(248 250 252 / 0.92)
        );
        box-shadow: 0 6px 14px rgb(15 23 42 / 0.05);
        animation: loader-session-chip-pop 2.8s ease-in-out infinite;
      }
      .loader-session-chip--agents {
        animation-delay: 0.45s;
      }
      .loader-session-chip-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.55rem;
        height: 1.55rem;
        border-radius: 0.45rem;
        font-size: 0.72rem;
        color: rgb(3 105 161);
        background: rgb(224 242 254);
        border: 1px solid rgb(125 211 252);
      }
      .loader-session-chip--agents .loader-session-chip-icon {
        color: rgb(5 150 105);
        background: rgb(209 250 229);
        border-color: rgb(110 231 183);
      }
      .loader-session-chip-track {
        display: block;
        width: 100%;
        height: 0.28rem;
        border-radius: 999px;
        overflow: hidden;
        background: rgb(226 232 240 / 0.9);
      }
      .loader-session-chip-fill {
        display: block;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          rgb(14 165 233),
          rgb(56 189 248)
        );
        animation: loader-session-chip-load 2.8s ease-in-out infinite;
      }
      .loader-session-chip--agents .loader-session-chip-fill {
        background: linear-gradient(
          90deg,
          rgb(16 185 129),
          rgb(52 211 153)
        );
        animation-delay: 0.45s;
      }
      .loader-session-runway {
        display: flex;
        justify-content: center;
        gap: 0.3rem;
        margin-top: 0.7rem;
        padding: 0.38rem 0.55rem;
        border-radius: 0.4rem;
        background: linear-gradient(
          180deg,
          rgb(15 23 42 / 0.05),
          rgb(15 23 42 / 0.02)
        );
      }
      .loader-session-papi {
        width: 0.4rem;
        height: 0.4rem;
        border-radius: 0.12rem;
        background: rgb(14 165 233 / 0.14);
        animation: loader-session-papi 1.75s ease-in-out infinite;
      }
      .loader-session-papi:nth-child(1) {
        animation-delay: 0s;
      }
      .loader-session-papi:nth-child(2) {
        animation-delay: 0.12s;
      }
      .loader-session-papi:nth-child(3) {
        animation-delay: 0.24s;
      }
      .loader-session-papi:nth-child(4) {
        animation-delay: 0.36s;
      }
      .loader-session-papi:nth-child(5) {
        animation-delay: 0.48s;
      }
      .loader-session-papi:nth-child(6) {
        animation-delay: 0.6s;
      }
      .loader-session-papi:nth-child(7) {
        animation-delay: 0.72s;
      }
      .loader-session-papi:nth-child(8) {
        animation-delay: 0.84s;
      }
      @keyframes loader-session-aura {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.96);
        }
        50% {
          opacity: 0.9;
          transform: scale(1.04);
        }
      }
      @keyframes loader-session-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-0.2rem);
        }
      }
      @keyframes loader-session-scan {
        0% {
          top: 0;
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          top: calc(100% - 2px);
          opacity: 0;
        }
      }
      @keyframes loader-session-wire {
        0%,
        100% {
          background-position: 0 100%;
          opacity: 0.35;
        }
        50% {
          background-position: 0 0;
          opacity: 1;
