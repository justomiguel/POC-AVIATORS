  function kgResolveLimits_() {
    var lim = S.get('kgLimits');
    if (lim && typeof lim === 'object') return lim;
    return {
      maxNodesDefault: 150,
      maxNodesCap: 300,
      bfsDepthDefault: 2,
      bfsDepthCap: 4,
      densityCompact: 80,
      densityNormal: 150,
      densityWide: 250,
      hubSeedLimit: 30,
    };
  }

  function kgApplyLimitsToFilters_() {
    var lim = kgResolveLimits_();
    if (filterDensity) {
      var densityOpts = [
        { value: lim.densityCompact, key: 'kg_density_opt_compact_fmt' },
        { value: lim.densityNormal, key: 'kg_density_opt_normal_fmt' },
        { value: lim.densityWide, key: 'kg_density_opt_wide_fmt' },
      ];
      var prevDensity = filterDensity.value;
      filterDensity.innerHTML = '';
      var di;
      for (di = 0; di < densityOpts.length; di++) {
        var dOpt = densityOpts[di];
        var dEl = document.createElement('option');
        dEl.value = String(dOpt.value);
        dEl.textContent = i18nFmt(dOpt.key, { count: String(dOpt.value) });
        if (String(dOpt.value) === String(lim.densityNormal)) {
          dEl.selected = true;
        }
        filterDensity.appendChild(dEl);
      }
      if (prevDensity) filterDensity.value = prevDensity;
      if (!filterDensity.value) filterDensity.value = String(lim.densityNormal);
    }
    if (filterDepth) {
      var prevDepth = filterDepth.value;
      var depthCap = Math.max(1, parseInt(String(lim.bfsDepthCap || 4), 10) || 4);
      filterDepth.innerHTML = '';
      var d;
      for (d = 1; d <= depthCap; d++) {
        var depthEl = document.createElement('option');
        depthEl.value = String(d);
        depthEl.textContent = i18nFmt('kg_depth_opt_n_fmt', { n: String(d) });
        if (d === lim.bfsDepthDefault) depthEl.selected = true;
        filterDepth.appendChild(depthEl);
      }
      if (prevDepth && parseInt(prevDepth, 10) <= depthCap) {
        filterDepth.value = prevDepth;
      } else if (!filterDepth.value) {
        filterDepth.value = String(lim.bfsDepthDefault);
      }
    }
  }

  }

  function kgSnapshotKey_(filters) {
    try {

    } catch (e) {
      return KG_SS_PREFIX + 'default';
    }
  }

  function kgSaveSnapshot_(filters, data) {
    try {
      var key = kgSnapshotKey_(filters);
      sessionStorage.setItem(key, JSON.stringify(data));
    } catch (e) {}
  }

  function kgLoadSnapshot_(filters) {
    try {
      var key = kgSnapshotKey_(filters);
      var raw = sessionStorage.getItem(key);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function kgInvalidateSnapshots_() {
    try {
      var toRemove = [];
      var i;
      for (i = 0; i < sessionStorage.length; i++) {
        var k = sessionStorage.key(i);
        if (k && k.indexOf(KG_SS_PREFIX) === 0) toRemove.push(k);
      }
      for (i = 0; i < toRemove.length; i++) sessionStorage.removeItem(toRemove[i]);
    } catch (e) {}
  }

  function kgSetStatus(msg, isErr) {
    if (!statusEl) return;
    statusEl.textContent = msg || '\u00a0';
    statusEl.classList.toggle('text-red-600', !!isErr);
    statusEl.classList.toggle('dark:text-red-400', !!isErr);
    statusEl.classList.toggle('text-slate-600', !isErr);
  }

  function kgSetGraphLoader_(opts) {
    opts = opts || {};
    if (graphLoaderStep) {
      graphLoaderStep.textContent =
        opts.step != null && opts.stepTotal != null
          ? i18nFmt('kg_loader_step_fmt', {
              step: String(opts.step),
              total: String(opts.stepTotal),
            })
          : opts.stepText || '';
    }
    if (graphLoaderTitle) {
      graphLoaderTitle.textContent = opts.titleKey
        ? i18n(opts.titleKey)
        : opts.title || '';
    }
    if (graphLoaderMsg) {
      if (opts.msgKey) {
        graphLoaderMsg.textContent = opts.fmtArgs
          ? i18nFmt(opts.msgKey, opts.fmtArgs)
          : i18n(opts.msgKey);
      } else {
        graphLoaderMsg.textContent = opts.message || '';
      }
    }
    if (graphLoaderWhy) {
      graphLoaderWhy.textContent = opts.whyKey
        ? i18n(opts.whyKey)
        : opts.why || '';
    }
    if (graphLoaderEta) {
      graphLoaderEta.textContent = opts.etaKey
        ? i18n(opts.etaKey)
        : opts.eta || '';
    }
  }

  function kgShowGraphLoader(msgKey, fmtArgs) {
    kgSetGraphLoader_({ msgKey: msgKey, fmtArgs: fmtArgs });
    if (graphLoaderHideTimer) {
      clearTimeout(graphLoaderHideTimer);
      graphLoaderHideTimer = null;
    }
    if (!graphLoaderEl) return;
    graphLoaderEl.classList.remove('hidden');
    graphLoaderEl.setAttribute('aria-busy', 'true');
    requestAnimationFrame(function () {
      graphLoaderEl.classList.add('is-visible');
    });
  }

  function kgHideGraphLoader() {
    if (!graphLoaderEl) return;
    graphLoaderEl.classList.remove('is-visible');
    graphLoaderEl.setAttribute('aria-busy', 'false');
    graphLoaderHideTimer = setTimeout(function () {
      graphLoaderEl.classList.add('hidden');
      kgSetGraphLoader_({});
      graphLoaderHideTimer = null;
    }, 520);
  }

  function kgDescribeFiltersBrief_() {
    var parts = [];
    if (filterClient && filterClient.value) {
      var cLabel = filterClient.options[filterClient.selectedIndex];
      parts.push(
        i18nFmt('kg_loading_filter_client', {
          name: String((cLabel && cLabel.textContent) || filterClient.value),
        }),
      );
    }
    if (filterIndustry && filterIndustry.value) {
      parts.push(
        i18nFmt('kg_loading_filter_industry', {
          name: String(filterIndustry.value),
        }),
      );
    }
    if (filterType && filterType.value) {
      parts.push(
        i18nFmt('kg_loading_filter_type', {
          name: String(filterType.value),
        }),
      );
    }
    if (filterSearch && String(filterSearch.value || '').trim()) {
      parts.push(
        i18nFmt('kg_loading_filter_search', {
          q: String(filterSearch.value || '').trim(),
        }),
      );
    }
    var lim = kgResolveLimits_();
    var depthVal = filterDepth
      ? String(filterDepth.value || lim.bfsDepthDefault)
      : String(lim.bfsDepthDefault);
    var densityVal = filterDensity
      ? String(filterDensity.value || lim.densityNormal)
      : String(lim.densityNormal);
    parts.push(
      i18nFmt('kg_loading_filter_depth', { depth: depthVal, max: String(lim.bfsDepthCap) }),
    );
    parts.push(i18nFmt('kg_loading_filter_nodes', { max: densityVal }));
    if (S.get('kgFocusMode') && selectedNodeId) {
      parts.push(i18n('kg_loading_filter_focus'));
    }
    return parts.length ? parts.join(' · ') : i18n('kg_loading_filter_all');
  }

  function kgApplyLoadStep_(stepDef, extraFmt) {
    if (!stepDef) return;
    var fmt = extraFmt || {};
    kgSetGraphLoader_({
      step: stepDef.step,
      stepTotal: stepDef.total,
      titleKey: stepDef.titleKey,
      msgKey: stepDef.msgKey,
      whyKey: stepDef.whyKey,
      etaKey: stepDef.etaKey,
      fmtArgs: fmt,
    });
    if (!graphLoaderEl) return;
    graphLoaderEl.classList.remove('hidden');
    graphLoaderEl.setAttribute('aria-busy', 'true');
    graphLoaderEl.classList.add('is-visible');
  }

  function kgStartLoadingPulse_(filterSummary) {
    kgStopLoadingPulse_();
    kgLoaderStartedAt = Date.now();
    var pulseIdx = 0;
    var fmt = { filters: filterSummary };
    kgApplyLoadStep_(KG_LOAD_STEPS[0], fmt);
    if (graphLoaderMsg && filterSummary) {
      graphLoaderMsg.textContent = i18nFmt('kg_busy_loading_filters_fmt', fmt);
    }
    kgLoadingPulseTimer = setInterval(function () {
      if (!loading) {
        kgStopLoadingPulse_();
        return;
      }
      pulseIdx = (pulseIdx + 1) % KG_LOAD_STEPS.length;
      kgApplyLoadStep_(KG_LOAD_STEPS[pulseIdx], fmt);
    }, 2400);
  }

  function kgSetControlsDisabled(disabled) {
    var d = !!disabled;
    if (applyBtn) applyBtn.disabled = d;
    if (resetBtn) resetBtn.disabled = d;
    if (focusBtn) focusBtn.disabled = d;
    if (rebuildBtn) rebuildBtn.disabled = d;
    if (filterSearch) filterSearch.disabled = d;
    if (filterType) filterType.disabled = d;
    if (filterIndustry) filterIndustry.disabled = d;
    if (filterClient) filterClient.disabled = d;
    if (filterDepth) filterDepth.disabled = d;
    if (filterDensity) filterDensity.disabled = d;
    if (layoutModeEl) layoutModeEl.disabled = d;
    if (showLabelsEl) showLabelsEl.disabled = d;
    if (fitBtn) fitBtn.disabled = d;
    if (zoomInBtn) zoomInBtn.disabled = d;
    if (zoomOutBtn) zoomOutBtn.disabled = d;
    if (graphFindInput) graphFindInput.disabled = d;
    if (graphFindPrev) graphFindPrev.disabled = d;
    if (graphFindNext) graphFindNext.disabled = d;
    if (nodeListFilter) nodeListFilter.disabled = d;
    var ti;
    for (ti = 0; ti < typeToggles.length; ti++) {
      typeToggles[ti].disabled = d;
    }
  }

  function kgReapplyGraphView_() {
    if (lastSnapshot) kgRenderGraph(lastSnapshot);
  }

  function kgNormalizeText_(s) {
    return String(s || '')
      .trim()
      .toLowerCase();
  }

  function kgSyncNodeListSelection_() {
    if (!nodeListEl) return;
    var items = nodeListEl.querySelectorAll('.kg-node-list-item');
    var i;
    for (i = 0; i < items.length; i++) {
      var el = items[i];
      var nid = String(el.getAttribute('data-kg-node-id') || '');
      var sel = nid === selectedNodeId;
      el.setAttribute('aria-selected', sel ? 'true' : 'false');
      if (sel) {
        try {
          el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        } catch (eScroll) {}
      }
    }
  }

  function kgFocusNode_(nodeId, opts) {
    opts = opts || {};
    if (!nodeId || !nodeById[nodeId]) return false;
    selectedNodeId = nodeId;
    kgUpdateDetail(nodeById[nodeId]);
    kgSyncNodeListSelection_();
    if (!network) return true;
    try {
      network.selectNodes([nodeId]);
      network.focus(nodeId, {
        scale: opts.zoom != null ? opts.zoom : 1.22,
        animation: { duration: 350, easingFunction: 'easeInOutQuad' },
      });
      kgHighlightNeighborhood_(nodeId);
    } catch (eFocusNode) {}
    return true;
  }

  function kgUpdateFindStatus_() {
    if (!graphFindStatus) return;
    if (!findMatchIds.length) {
      graphFindStatus.textContent = findQuery
        ? i18n('kg_graph_find_no_match')
        : '';
      return;
    }
    if (findMatchIndex < 0) {
      graphFindStatus.textContent = i18nFmt('kg_graph_find_total', {
        total: String(findMatchIds.length),
      });
      return;
    }
    graphFindStatus.textContent = i18nFmt('kg_graph_find_match', {
      current: String(findMatchIndex + 1),
      total: String(findMatchIds.length),
    });
  }

  function kgRefreshFindMatches_() {
    findMatchIds = [];
    findQuery = graphFindInput ? kgNormalizeText_(graphFindInput.value) : '';
    if (!findQuery || !lastSnapshot) {
      findMatchIndex = -1;
      kgUpdateFindStatus_();
      return;
    }
    var nodes = lastSnapshot.nodes || [];
    var i;
    for (i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var label = kgNormalizeText_(n.label);
      var id = kgNormalizeText_(n.id);
      if (label.indexOf(findQuery) >= 0 || id.indexOf(findQuery) >= 0) {
        findMatchIds.push(n.id);
      }
    }
    findMatchIds.sort(function (a, b) {
      var na = nodeById[a];
      var nb = nodeById[b];
      var ta = TYPE_SORT_ORDER[String((na && na.type) || '')] != null
        ? TYPE_SORT_ORDER[String(na.type)]
        : 99;
      var tb = TYPE_SORT_ORDER[String((nb && nb.type) || '')] != null
        ? TYPE_SORT_ORDER[String(nb.type)]
        : 99;
      if (ta !== tb) return ta - tb;
      var la = String((na && na.label) || a);
      var lb = String((nb && nb.label) || b);
      return la.localeCompare(lb);
    });
    if (findMatchIndex >= findMatchIds.length) findMatchIndex = -1;
    kgUpdateFindStatus_();
  }

  function kgFindGo_(delta) {
    kgRefreshFindMatches_();
    if (!findMatchIds.length) return;
    if (findMatchIndex < 0) findMatchIndex = delta >= 0 ? 0 : findMatchIds.length - 1;
    else findMatchIndex = (findMatchIndex + delta + findMatchIds.length) % findMatchIds.length;
    kgFocusNode_(findMatchIds[findMatchIndex], { zoom: 1.35 });
    kgUpdateFindStatus_();
  }

  function kgBuildNodeList_() {
    if (!nodeListEl) return;
    nodeListEl.innerHTML = '';
    var nodes = (lastSnapshot && lastSnapshot.nodes) || [];
    var listQ = nodeListFilter ? kgNormalizeText_(nodeListFilter.value) : '';
    var sorted = nodes.slice();
    sorted.sort(function (a, b) {
      var ta = TYPE_SORT_ORDER[String(a.type || '')];
      var tb = TYPE_SORT_ORDER[String(b.type || '')];
      ta = ta != null ? ta : 99;
      tb = tb != null ? tb : 99;
      if (ta !== tb) return ta - tb;
      return String(a.label || a.id || '').localeCompare(String(b.label || b.id || ''));
    });
    var shown = 0;
    var i;
    for (i = 0; i < sorted.length; i++) {
      var n = sorted[i];
      var label = String(n.label || n.id || '');
      if (listQ && kgNormalizeText_(label).indexOf(listQ) < 0 && kgNormalizeText_(n.id).indexOf(listQ) < 0) {
        continue;
      }
      shown += 1;
      var nt = String(n.type || '');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'kg-node-list-item';
      btn.setAttribute('role', 'option');
      btn.setAttribute('data-kg-node-id', n.id);
      btn.setAttribute('aria-selected', n.id === selectedNodeId ? 'true' : 'false');
      var dot = document.createElement('span');
      dot.className = 'kg-node-list-dot';
      dot.style.backgroundColor = NODE_COLORS[nt] || '#94a3b8';
      dot.setAttribute('aria-hidden', 'true');
      var lbl = document.createElement('span');
      lbl.className = 'min-w-0 flex-1 truncate';
      lbl.textContent = label;
      var typ = document.createElement('span');
      typ.className = 'kg-node-list-type';
      typ.textContent = i18n(TYPE_I18N[nt] || nt);
      btn.appendChild(dot);
      btn.appendChild(lbl);
      btn.appendChild(typ);
      btn.addEventListener('click', function () {
        var nid = String(btn.getAttribute('data-kg-node-id') || '');
        selectedNodeId = nid;
        kgUpdateDetail(nodeById[nid] || null);
        kgSyncNodeListSelection_();
        kgFocusNode_(nid, { zoom: 1.3 });
        kgOpenSidePanel_('detail');
      });
      nodeListEl.appendChild(btn);
    }
    if (nodeListEmpty) {
      nodeListEmpty.classList.toggle('hidden', shown > 0 || !nodes.length);
    }
    if (!shown && nodes.length && nodeListEmpty) {
      nodeListEmpty.classList.remove('hidden');
    }
    kgSyncNodeListSelection_();
  }

  function kgResetFind_() {
    findMatchIds = [];
    findMatchIndex = -1;
    findQuery = '';
    if (graphFindInput) graphFindInput.value = '';
    kgUpdateFindStatus_();
  }

  function kgIsDarkTheme_() {
    return (
      document.documentElement.getAttribute('data-theme') === 'dark' ||
      document.documentElement.classList.contains('dark')
    );
  }

  function kgLegendShapeClass_(type) {
    var shapeCfg = NODE_SHAPES[type] || { shape: 'dot' };
    if (shapeCfg.shape === 'box') return 'kg-legend-shape kg-legend-shape--box';
    if (shapeCfg.shape === 'diamond') return 'kg-legend-shape kg-legend-shape--diamond';
    if (shapeCfg.shape === 'ellipse') return 'kg-legend-shape kg-legend-shape--ellipse';
    return 'kg-legend-shape kg-legend-shape--dot';
  }

  function kgGetDepth_() {
    return filterDepth ? parseInt(String(filterDepth.value || '2'), 10) : 2;
  }

  function kgUpdateScopeIndicator_(res) {
    var depth = kgGetDepth_();
    var stats = (res && res.stats) || {};
    var shown = stats.selectedNodes || (res && res.nodes && res.nodes.length) || 0;
    var edgeCount = stats.selectedEdges || (res && res.edges && res.edges.length) || 0;
    var maxNodes = stats.maxNodes || KG_DEFAULT_MAX_NODES;
    var maxDepth = stats.maxDepth || KG_DEFAULT_MAX_DEPTH;
    var truncated = !!(res && res.truncated);

    if (depthMeterEl) {
      depthMeterEl.innerHTML = '';
      if (depthMeterAria) {
        depthMeterAria.textContent = i18nFmt('kg_depth_meter_live', {
          depth: String(depth),
          max: String(maxDepth),
        });
        depthMeterEl.appendChild(depthMeterAria);
      }
      var d;
      for (d = 1; d <= maxDepth; d++) {
        var dot = document.createElement('span');
        dot.className = 'kg-depth-dot' + (d <= depth ? ' kg-depth-dot--on' : '');
        dot.setAttribute('aria-hidden', 'true');
        depthMeterEl.appendChild(dot);
      }
    }

    if (scopeSummary) {
      scopeSummary.textContent = i18nFmt('kg_scope_summary', {
        depth: String(depth),
        maxDepth: String(maxDepth),
        shown: String(shown),
        maxNodes: String(maxNodes),
      });
    }
    if (scopeTruncated) {
      scopeTruncated.classList.toggle('hidden', !truncated);
    }
  }

  function kgBuildLegend() {
    if (legendList) {
      legendList.innerHTML = '';
      var types = [
        'content',
        'client',
        'industry',
        'tag',
        'stage',
        'pricing_model',
      ];
      var i;
      for (i = 0; i < types.length; i++) {
        var t = types[i];
        var li = document.createElement('li');
        li.className = 'kg-legend-item flex items-start gap-2';
        var mark = document.createElement('span');
        mark.className = kgLegendShapeClass_(t);
        mark.style.backgroundColor = NODE_COLORS[t] || '#94a3b8';
        mark.setAttribute('aria-hidden', 'true');
        var lbl = document.createElement('span');
        lbl.textContent = i18n(SIMPLE_TYPE_I18N[t] || SIMPLE_TYPE_I18N.content);
        li.appendChild(mark);
        li.appendChild(lbl);
        legendList.appendChild(li);
      }
    }
    if (!legendEdges) return;
    legendEdges.innerHTML = '';
    var relKeys = [
      'belongs_to',
      'tagged_with',
      'in_industry',
      'related_content',
      'has_stage',
      'has_pricing_model',
    ];
    var ri;
    for (ri = 0; ri < relKeys.length; ri++) {
      var rk = relKeys[ri];
      var liE = document.createElement('li');
      liE.className = 'kg-legend-item flex items-start gap-2';
      var line = document.createElement('span');
      line.className = 'kg-legend-edge mt-1.5';
      line.style.backgroundColor = EDGE_COLORS[rk] || '#94a3b8';
      if (rk === 'related_content') {
        line.style.background =
          'repeating-linear-gradient(90deg,' +
          (EDGE_COLORS[rk] || '#0284c7') +
          ' 0 4px, transparent 4px 8px)';
      }
      var lblE = document.createElement('span');
      lblE.textContent = i18n(SIMPLE_REL_I18N[rk] || rk);
      liE.appendChild(line);
      liE.appendChild(lblE);
      legendEdges.appendChild(liE);
    }
  }

  function kgUpdateGraphStats_(nodeCount, edgeCount) {
    if (!graphStatsEl) return;
    graphStatsEl.textContent = i18nFmt('kg_graph_stats', {
      nodes: String(nodeCount || 0),
      edges: String(edgeCount || 0),
    });
  }

  function kgShowLabels_() {
    return !showLabelsEl || !!showLabelsEl.checked;
  }

  function kgResolveLayoutMode_() {
    var mode = layoutModeEl ? String(layoutModeEl.value || 'auto') : 'auto';
    if (mode !== 'auto') return mode;
    if (filterClient && String(filterClient.value || '').trim()) return 'hierarchical';
    return 'force';
  }

  function kgBuildVisOptions_(layoutMode, dark) {
    var showLabels = kgShowLabels_();
    var base = {
      nodes: {
        borderWidth: 2,
        shadow: dark
          ? false
          : { enabled: true, size: 6, x: 1, y: 2, color: 'rgba(15,23,42,0.12)' },
        font: {
          size: showLabels ? 11 : 0,
          face: 'Inter, system-ui, sans-serif',
          color: dark ? '#e2e8f0' : '#0f172a',
          strokeWidth: dark ? 0 : 2,
          strokeColor: dark ? 'transparent' : '#f8fafc',
        },
        scaling: { min: 10, max: 28 },
      },
      edges: {
        width: 1.5,
        smooth: { type: 'dynamic', roundness: 0.35 },
        shadow: dark ? false : { enabled: true, size: 3, x: 0, y: 1, color: 'rgba(15,23,42,0.08)' },
      },
      interaction: {
        hover: true,
        tooltipDelay: 120,
        hideEdgesOnDrag: true,
        hideEdgesOnZoom: true,
        navigationButtons: true,
        keyboard: { enabled: true, bindToWindow: false },
        zoomView: true,
      },
      layout: { improvedLayout: true },
    };

    if (layoutMode === 'hierarchical') {
      base.layout = {
        hierarchical: {
          enabled: true,
          direction: 'UD',
          sortMethod: 'hubsize',
          levelSeparation: 110,
          nodeSpacing: 140,
          treeSpacing: 180,
        },
      };
      base.physics = { enabled: false };
      return base;
    }

    var nodeCount =
      lastSnapshot && lastSnapshot.nodes ? lastSnapshot.nodes.length : 150;
    var stabIter = nodeCount > 100 ? 80 : nodeCount > 60 ? 120 : 180;
    base.physics = {
      enabled: true,
      stabilization: { iterations: stabIter, fit: true },
      barnesHut: {
        gravitationalConstant: -5200,
        centralGravity: 0.22,
        springLength: 140,
        springConstant: 0.045,
        damping: 0.12,
      },
    };
    return base;
  }

  // Tracking de nodos/aristas que fueron dimmed para reset selectivo
  var highlightedNodeIds = null;
  var highlightedEdgeIds = null;

  function kgResetHighlight_() {
    if (!network) return;
    try {
      // Reset parcial: solo los ids que se modificaron en el último highlight
      var updN = [];
      var updE = [];
      var i;
      if (highlightedNodeIds) {
        for (i = 0; i < highlightedNodeIds.length; i++) {
          updN.push({ id: highlightedNodeIds[i], opacity: 1 });
        }
      } else {
        // Fallback completo (primera vez o tras kgDestroyNetwork)
        var allIds = network.body.data.nodes.getIds();
        for (i = 0; i < allIds.length; i++) updN.push({ id: allIds[i], opacity: 1 });
      }
      if (updN.length) network.body.data.nodes.update(updN);

      if (highlightedEdgeIds) {
        for (i = 0; i < highlightedEdgeIds.length; i++) {
          updE.push({ id: highlightedEdgeIds[i], opacity: 1 });
        }
      } else {
        var allEids = network.body.data.edges.getIds();
        for (i = 0; i < allEids.length; i++) updE.push({ id: allEids[i], opacity: 1 });
      }
      if (updE.length) network.body.data.edges.update(updE);
    } catch (eReset) {}
    highlightedNodeIds = null;
    highlightedEdgeIds = null;
  }

  function kgHighlightNeighborhood_(nodeId) {
    if (!network || !nodeId) return;
    var connected = network.getConnectedNodes(nodeId);
    var connSet = {};
    var ci;
    for (ci = 0; ci < connected.length; ci++) connSet[connected[ci]] = true;
    connSet[nodeId] = true;

    var ids = network.body.data.nodes.getIds();
    var updN = [];
    var dimmedNodes = [];
    for (ci = 0; ci < ids.length; ci++) {
      if (connSet[ids[ci]]) {
        updN.push({ id: ids[ci], opacity: 1 });
      } else {
        updN.push({ id: ids[ci], opacity: 0.15 });
        dimmedNodes.push(ids[ci]);
      }
    }
    network.body.data.nodes.update(updN);
    // Guardar solo los dimmed para reset eficiente
    highlightedNodeIds = dimmedNodes;

    var eids = network.body.data.edges.getIds();
    var updE = [];
    var dimmedEdges = [];
    for (ci = 0; ci < eids.length; ci++) {
      var e = network.body.data.edges.get(eids[ci]);
      var onPath = e && connSet[String(e.from)] && connSet[String(e.to)];
      if (onPath) {
        updE.push({ id: eids[ci], opacity: 1 });
      } else {
        updE.push({ id: eids[ci], opacity: 0.08 });
        dimmedEdges.push(eids[ci]);
      }
    }
    network.body.data.edges.update(updE);
    highlightedEdgeIds = dimmedEdges;
  }

  function kgFitView_() {
    if (!network) return;
    try {
      network.fit({
        animation: { duration: 450, easingFunction: 'easeInOutQuad' },
      });
    } catch (eFit) {}
  }

  function kgZoomBy_(factor) {
    if (!network) return;
    try {
      var scale = network.getScale() * factor;
      network.moveTo({
        scale: Math.max(0.12, Math.min(2.8, scale)),
        animation: { duration: 200, easingFunction: 'easeInOutQuad' },
      });
    } catch (eZoom) {}
  }

  function kgGetAllowedNodeTypes() {
    /** @type {Object<string, boolean>} */
    var out = {};
    var i;
    for (i = 0; i < typeToggles.length; i++) {
      var el = typeToggles[i];
      var t = String(el.getAttribute('data-kg-type') || '').trim();
      if (t) out[t] = !!el.checked;
    }
    return out;
  }

  function kgGetMinEdgeWeight_() {
    if (!filterMinWeight) return 0;
    var w = parseFloat(String(filterMinWeight.value || '0'));
    return isNaN(w) || w < 0 ? 0 : w;
  }

  function kgFilterEdgesByWeight_(edges) {
    var minW = kgGetMinEdgeWeight_();
    if (!minW || !edges || !edges.length) return edges || [];
    var out = [];
    var i;
    for (i = 0; i < edges.length; i++) {
      var ew = Number(edges[i].weight);
      if (isNaN(ew)) ew = 1;
      if (ew >= minW) out.push(edges[i]);
    }
    return out;
  }

  function kgFormatEdgeMeta_(edge) {
    var parts = [];
    var ew = Number(edge && edge.weight);
    if (!isNaN(ew) && ew < 1 && ew > 0) {
      parts.push(i18nFmt('kg_edge_weight_fmt', { pct: String(Math.round(ew * 100)) }));
    }
    var src = edge && edge.edgeSource ? String(edge.edgeSource) : '';
    if (src && src !== 'structural') {
      parts.push(i18n(EDGE_SOURCE_I18N[src] || src));
    }
    return parts.length ? ' · ' + parts.join(' · ') : '';
  }

  function kgGetFilters() {
    return {
      contentType: filterType ? String(filterType.value || '').trim() : '',
      industry: filterIndustry ? String(filterIndustry.value || '').trim() : '',
      clientId: filterClient ? String(filterClient.value || '').trim() : '',
      searchQuery: filterSearch ? String(filterSearch.value || '').trim() : '',
      depth: filterDepth ? parseInt(String(filterDepth.value || '2'), 10) : 2,
      centerNodeId: selectedNodeId && S.get('kgFocusMode') ? selectedNodeId : '',
      maxNodes: filterDensity
        ? parseInt(String(filterDensity.value || String(kgResolveLimits_().densityNormal)), 10)
        : kgResolveLimits_().densityNormal,
      minEdgeWeight: kgGetMinEdgeWeight_(),
      allowedNodeTypes: kgGetAllowedNodeTypes(),
    };
  }

  function kgIndexSnapshot(data) {
    nodeById = {};
    var nodes = (data && data.nodes) || [];
    var ni;
    for (ni = 0; ni < nodes.length; ni++) {
      nodeById[nodes[ni].id] = nodes[ni];
    }
  }

  function kgDestroyNetwork() {
    if (network) {
      try {
        network.destroy();
      } catch (eDestroy) {}
      network = null;
    }
    highlightedNodeIds = null;
    highlightedEdgeIds = null;
    if (canvasEl) canvasEl.innerHTML = '';
  }

  function kgEnsureVis_(cb) {
    if (typeof vis !== 'undefined' && vis.Network) {
      cb();
      return;
    }
    if (!visHost) {
      kgHideGraphLoader();
      kgSetStatus(i18n('kg_error_vis_lib'), true);
      return;
    }
    if (visLoading) {
      var waitVis = setInterval(function () {
        if (typeof vis !== 'undefined' && vis.Network) {
          clearInterval(waitVis);
          cb();
        }
      }, 80);
      return;
    }
    visLoading = true;
    kgShowGraphLoader('kg_busy_vis');
    kgSetStatus(i18n('kg_busy_vis'));
    var scripts = visHost.querySelectorAll('script');
    var pending = scripts.length;
    if (!pending) {
      visLoading = false;
      if (typeof vis !== 'undefined' && vis.Network) cb();
      else {
        kgHideGraphLoader();
        kgSetStatus(i18n('kg_error_vis_lib'), true);
      }
      return;
    }
    var si;
    for (si = 0; si < scripts.length; si++) {
      (function (srcScript) {
        var s = document.createElement('script');
        if (srcScript.src) {
          s.src = srcScript.src;
          s.async = false;
        } else {
          s.textContent = srcScript.textContent;
        }
        var doneOne = function () {
          pending -= 1;
          if (pending <= 0) {
            visLoading = false;
            if (typeof vis !== 'undefined' && vis.Network) cb();
            else {
              kgHideGraphLoader();
              kgSetStatus(i18n('kg_error_vis_lib'), true);
            }
          }
        };
        s.onload = doneOne;
        s.onerror = doneOne;
        document.head.appendChild(s);
      })(scripts[si]);
    }
    var styles = visHost.querySelectorAll('style');
    for (si = 0; si < styles.length; si++) {
      document.head.appendChild(styles[si].cloneNode(true));
    }
  }

  function kgRenderGraph(data) {
    kgDestroyNetwork();
    kgResetHighlight_();
    var nodes = (data && data.nodes) || [];
    var edges = (data && data.edges) || [];
    kgUpdateGraphStats_(nodes.length, edges.length);
    if (!nodes.length) {
      kgHideGraphLoader();
      if (canvasEl) canvasEl.classList.add('hidden');
      if (emptyEl) emptyEl.classList.remove('hidden');
      kgBuildNodeList_();
      return;
    }
    if (canvasEl) canvasEl.classList.remove('hidden');
    if (emptyEl) emptyEl.classList.add('hidden');
    kgSetGraphLoader_({
      step: 1,
      stepTotal: 1,
      titleKey: 'kg_loader_render_title',
      msgKey: 'kg_busy_render',
      whyKey: 'kg_loader_render_why',
      etaKey: 'kg_loader_render_eta',
    });
    if (graphLoaderEl) {
      graphLoaderEl.classList.remove('hidden');
      graphLoaderEl.classList.add('is-visible');
      graphLoaderEl.setAttribute('aria-busy', 'true');

    kgSetStatus(i18n('kg_busy_render'));

    kgEnsureVis_(function () {
      if (typeof vis === 'undefined' || !vis.Network) {
        kgHideGraphLoader();
        kgSetStatus(i18n('kg_error_load'), true);
        return;
      }

      var dark = kgIsDarkTheme_();
      var showLabels = kgShowLabels_();
      var layoutMode = kgResolveLayoutMode_();
      var borderDefault = dark ? '#475569' : '#334155';
      var borderHighlight = dark ? '#f8fafc' : '#0f172a';

      var visNodes = [];
      var ni;
      for (ni = 0; ni < nodes.length; ni++) {
        var n = nodes[ni];
        var nt = String(n.type || '');
        var fill = NODE_COLORS[nt] || '#64748b';
        var shapeCfg = NODE_SHAPES[nt] || { shape: 'dot', size: 16 };
        var fullLabel = String(n.label || n.id || '');
        visNodes.push({
          id: n.id,
          label: showLabels ? fullLabel.slice(0, 42) : '',
          title: fullLabel,
          shape: shapeCfg.shape,
          size: shapeCfg.size,
          color: {
            background: fill,
            border: borderDefault,
            highlight: { background: fill, border: borderHighlight },
            hover: { background: fill, border: borderHighlight },
          },
        });
      }

      var filteredEdges = kgFilterEdgesByWeight_(edges);
      var visEdges = [];
      var ei;
      for (ei = 0; ei < filteredEdges.length; ei++) {
        var e = filteredEdges[ei];
        var rel = String(e.relation || '');
        var relI18nKey = REL_I18N[rel] || rel;
        var edgeColor = EDGE_COLORS[rel] || '#94a3b8';
        var ew = Number(e.weight);
        if (isNaN(ew) || ew <= 0) ew = 1;
        var edgeTitle = i18n(relI18nKey) + kgFormatEdgeMeta_(e);
        var edgeWidth = rel === 'belongs_to' || rel === 'related_content' ? 2 : 1.5;
        if (rel === 'similar_to' && ew < 1) edgeWidth = 1 + ew;
        visEdges.push({
          id: e.id || e.source + '-' + e.target + '-' + rel,
          from: e.source,
          to: e.target,
          title: edgeTitle,
          arrows: { to: { enabled: true, scaleFactor: 0.65 } },
          color: {
            color: edgeColor,
            highlight: edgeColor,
            hover: edgeColor,
            opacity: rel === 'similar_to' ? 0.72 : 0.88,
          },
          dashes: rel === 'related_content' || rel === 'similar_to',
          width: edgeWidth,
        });
      }

      var options = kgBuildVisOptions_(layoutMode, dark);
      var stabilized = false;

      network = new vis.Network(
        canvasEl,
        { nodes: new vis.DataSet(visNodes), edges: new vis.DataSet(visEdges) },
        options,
      );

      network.on('click', function (params) {
        kgResetHighlight_();
        if (!params.nodes || !params.nodes.length) {
          selectedNodeId = '';
          kgUpdateDetail(null);
          return;
        }
        selectedNodeId = params.nodes[0];
        kgUpdateDetail(nodeById[selectedNodeId] || null);
        kgSyncNodeListSelection_();
        kgOpenSidePanel_('detail');
      });

      network.on('hoverNode', function (params) {
        kgHighlightNeighborhood_(params.node);
      });
      network.on('blurNode', function () {
        kgResetHighlight_();
      });

      network.on('doubleClick', function (params) {
        if (!params.nodes || !params.nodes.length) return;
        kgFocusEntitySubgraph_(params.nodes[0]);
      });

      network.on('stabilizationIterationsDone', function () {
        if (stabilized) return;
        stabilized = true;
        try {
          network.setOptions({ physics: false });
        } catch (ePhysOff) {}
        kgFitView_();
        kgShowGraphLoaderComplete_();
        setTimeout(function () {
          kgHideGraphLoader();
        }, 900);
      });

      if (layoutMode === 'hierarchical') {
        setTimeout(function () {
          if (!stabilized) {
            stabilized = true;
            kgFitView_();
            kgShowGraphLoaderComplete_();
            setTimeout(function () {
              kgHideGraphLoader();
            }, 900);
          }
        }, 120);
      }

      // Fallback: si la estabilización no dispara (grafo chico o layout sin física)
      setTimeout(function () {
        if (!stabilized) {
          stabilized = true;
          kgShowGraphLoaderComplete_();
          setTimeout(function () {
            kgHideGraphLoader();
          }, 900);
        }
      }, 6000);

      if (selectedNodeId && nodeById[selectedNodeId]) {
        try {
          network.selectNodes([selectedNodeId]);
          network.focus(selectedNodeId, { scale: 1.15, animation: true });
        } catch (eFocus) {}
      }
    });
  }

  function kgFormatMeta_(node) {

    if (pl.industry) parts.push(String(pl.industry));
    if (pl.client_name) parts.push(String(pl.client_name));
    if (pl.title) parts.push(String(pl.title));

  function kgRenderEdgeList_(listEl, items, direction) {

  function kgUpdateDetail(node) {

    }
    detailLabel.textContent = String(node.label || node.id || '');
    detailType.textContent = i18n(TYPE_I18N[node.type] || node.type);
    var meta = kgFormatMeta_(node);
    if (detailMeta && detailMetaWrap) {
      if (meta) {
        detailMeta.textContent = meta;
        detailMetaWrap.classList.remove('hidden');
      } else {
        detailMetaWrap.classList.add('hidden');
      }
    }
    var outItems = [];
    var inItems = [];
    var edges = kgFilterEdgesByWeight_((lastSnapshot && lastSnapshot.edges) || []);
    var ei;
    for (ei = 0; ei < edges.length; ei++) {
      var e = edges[ei];
      if (e.source === node.id) {
        outItems.push({
          otherId: e.target,
          relation: e.relation,
          weight: e.weight,
          edgeSource: e.edgeSource,
        });
      } else if (e.target === node.id) {
        inItems.push({
          otherId: e.source,
          relation: e.relation,
          weight: e.weight,
          edgeSource: e.edgeSource,
        });
      }
    }
    if (detailEdgesWrap) {
      if (outItems.length || inItems.length) {
        detailEdgesWrap.classList.remove('hidden');
        kgRenderEdgeList_(detailEdgesOut, outItems, 'out');
        kgRenderEdgeList_(detailEdgesIn, inItems, 'in');
      } else {
        detailEdgesWrap.classList.add('hidden');
      }
    }
    var isContent =
      String(node.type || '') === 'content' &&
      node.payload &&

      openContentBtn.classList.toggle('hidden', !isContent);

  function kgLoad(opts) {

        });
        var statsFmt = {
          loadedNodes: String(stats.loadedNodes != null ? stats.loadedNodes : '—'),
          loadedEdges: String(stats.loadedEdges != null ? stats.loadedEdges : '—'),
          selectedNodes: String(
            stats.selectedNodes != null ? stats.selectedNodes : (res.nodes || []).length,
          ),

            stats.selectedEdges != null ? stats.selectedEdges : (res.edges || []).length,

  function kgAccFromProgressTotals_(totals) {

        (Number(totals.contents_done) || 0) +
        (Number(totals.clients_done) || 0) +
        (Number(totals.salesforce_done) || 0),

        (Number(totals.contents_failed) || 0) +
        (Number(totals.clients_failed) || 0) +

  function kgRebuildPhaseMeta_(phase) {

      total: KG_REBUILD_PHASES_ORDER.length,
      phase: ph,
    };

  function kgRebuildModalText_(res, acc) {
    var meta = kgRebuildPhaseMeta_((res && res.phase) || 'contents');
    var phaseKey = 'kg_phase_' + meta.phase;
    var batchDone = res && res.done != null ? Number(res.done) : 0;
    return i18nFmt('kg_busy_rebuild_verbose', {
      phaseNum: String(meta.num),
      phaseTotal: String(meta.total),
      phase: i18n(phaseKey),
      batchDone: String(batchDone),
      totalDone: String(acc.doneTotal),
      failed: String(acc.failedTotal),

        meta.num < meta.total
          ? i18n('kg_rebuild_hint_more_phases')
          : i18n('kg_rebuild_hint_finishing'),

  function kgRebuildStep_(phase, skip, acc, reset) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) {
          A.hideBlockingModal();
          rebuilding = false;
          kgSetControlsDisabled(false);
          kgSetStatus(i18n('kg_error_load'), true);
          return;
        }
        acc.doneTotal += res.done || 0;
        acc.failedTotal += res.failed || 0;
        acc.removedTotal += res.removed || 0;

        if (res.hasMore) {
          var modalMsg = kgRebuildModalText_(res, acc);
          A.showBlockingModal(modalMsg);
          kgSetStatus(modalMsg);
          kgRebuildStep_(res.phase, res.nextSkip, acc, false);
          return;
        }

        if (res.nextPhase && res.nextPhase !== 'done') {
          A.showBlockingModal(
            i18nFmt('kg_busy_rebuild_next_phase', {
              phase: i18n('kg_phase_' + res.nextPhase),
            }),
          );
          kgRebuildStep_(res.nextPhase, 0, acc, false);
          return;
        }

        A.hideBlockingModal();
        rebuilding = false;
        kgHidePendingSyncBanner_();
        kgSetControlsDisabled(false);
        var totals = res.progress && res.progress.totals;
        var contentDone =
          totals && totals.contents_done != null
            ? Number(totals.contents_done)
            : acc.doneTotal;
        var finMsg = i18nFmt('kg_rebuild_done', {
          done: String(contentDone),
          failed: String(acc.failedTotal),
        });
        if (acc.removedTotal > 0) {
          finMsg +=
            ' ' + i18nFmt('kg_stale_removed', { n: String(acc.removedTotal) });
        }
        kgSetStatus(finMsg);
        kgLoad();
      })
      .withFailureHandler(function (e) {
        rebuilding = false;
        kgSetControlsDisabled(false);
        A.reportRpcError(e, {
          scope: 'knowledgeGraph.rebuild',
          fallbackKey: 'kg_error_load',
          modal: true,
          toast: true,
          setStatus: function (m) {
            kgSetStatus(i18n('kg_rebuild_timeout_hint') + ' ' + m, true);
          },
        });
      })
      .rebuildKnowledgeGraphStep(phase, skip, KG_REBUILD_BATCH_SIZE, !!reset);
  }

      .withSuccessHandler(function (res) {

    headRow.appendChild(title);
    headRow.appendChild(countBadge);
    body.appendChild(headRow);
    body.appendChild(desc);
    card.appendChild(swatch);
    card.appendChild(body);
    return card;
  }

  function kgRenderEntityRelationCard_(rel, count) {
    var card = document.createElement('div');
    card.className =
      'rounded-xl border border-slate-200 bg-white p-2.5 dark:border-slate-600 dark:bg-slate-900/30';
    var headRow = document.createElement('div');
    headRow.className = 'flex items-center gap-2';
    var line = document.createElement('span');
    line.className = 'inline-block h-1.5 w-8 shrink-0 rounded-full';
    line.style.backgroundColor = EDGE_COLORS[rel] || '#94a3b8';
    var relTitle = document.createElement('p');
    relTitle.className = 'min-w-0 flex-1 text-sm font-medium text-slate-800 dark:text-slate-200';
    relTitle.textContent = i18n(REL_I18N[rel] || rel);
    var countBadge = document.createElement('span');
    countBadge.className =
      'shrink-0 rounded-full bg-slate-100 px-2 py-0.5 text-[0.65rem] font-semibold tabular-nums text-slate-600 dark:bg-slate-800 dark:text-slate-300';
    countBadge.textContent = String(count || 0);
    var relDesc = document.createElement('p');
    relDesc.className = 'mt-1.5 text-xs leading-relaxed text-slate-600 dark:text-slate-400';
    relDesc.textContent = i18n(ENTITY_REL_DESC_I18N[rel] || '');
    headRow.appendChild(line);
    headRow.appendChild(relTitle);
    headRow.appendChild(countBadge);
    card.appendChild(headRow);
    card.appendChild(relDesc);
    return card;
  }

  function kgReapplyPageI18n_() {
    var ci = S.get('cachedI18n');
    if (!A.i18nPackLooksValid(ci)) return;
    var page = document.getElementById('page-knowledge-graph');
    if (!page) return;
    var elems = page.querySelectorAll('[data-i18n]');
    var i;
    for (i = 0; i < elems.length; i++) {
      var key = elems[i].getAttribute('data-i18n');
      if (key && ci[key] !== undefined) elems[i].textContent = ci[key];
    }
    var htmlElems = page.querySelectorAll('[data-i18n-html]');
    for (i = 0; i < htmlElems.length; i++) {
      var hk = htmlElems[i].getAttribute('data-i18n-html');
      if (hk && ci[hk] !== undefined) htmlElems[i].innerHTML = ci[hk];
    }
    var plElems = page.querySelectorAll('[data-i18n-placeholder]');
    for (i = 0; i < plElems.length; i++) {
      var pk = plElems[i].getAttribute('data-i18n-placeholder');
      if (pk && ci[pk] !== undefined) plElems[i].placeholder = ci[pk];
    }
    var arElems = page.querySelectorAll('[data-i18n-aria-label]');
    for (i = 0; i < arElems.length; i++) {
      var ak = arElems[i].getAttribute('data-i18n-aria-label');
      if (ak && ci[ak] !== undefined) arElems[i].setAttribute('aria-label', ci[ak]);
    }
  }

  function kgPopulateEntitiesFilterTypes_() {
    if (!entitiesFilterType) return;
    var prev = String(entitiesFilterType.value || '');
    entitiesFilterType.innerHTML = '';
    var allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = i18n('kg_entities_filter_type_all');
    entitiesFilterType.appendChild(allOpt);
    var ti;
    for (ti = 0; ti < ENTITY_NODE_ORDER.length; ti++) {
      var nt = ENTITY_NODE_ORDER[ti];
      var opt = document.createElement('option');
      opt.value = nt;
      opt.textContent = i18n(TYPE_I18N[nt] || nt);
      entitiesFilterType.appendChild(opt);
    }
    if (prev && entitiesFilterType.querySelector('option[value="' + prev + '"]')) {
      entitiesFilterType.value = prev;
    }
  }

  function kgRenderEntityCatalog_(catalog) {
    if (!catalog || !catalog.ok) return;
    if (entitiesCatalogTotals) {
      entitiesCatalogTotals.textContent = i18nFmt('kg_entities_catalog_totals', {
        nodes: String(catalog.totalNodes || 0),
        edges: String(catalog.totalEdges || 0),
      });
    }
    if (entitiesTypesGrid) {
      entitiesTypesGrid.innerHTML = '';
      var countByType = {};
      var rows = catalog.nodeTypes || [];
      var ri;
      for (ri = 0; ri < rows.length; ri++) {
        countByType[String(rows[ri].type || '')] = Number(rows[ri].count) || 0;
      }
      var li;
      for (li = 0; li < ENTITY_TYPE_LAYERS_.length; li++) {
        var layer = ENTITY_TYPE_LAYERS_[li];
        var section = document.createElement('div');
        section.className = 'space-y-2';
        var layerTitle = document.createElement('p');
        layerTitle.className =
          'text-[0.65rem] font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400';
        layerTitle.textContent = i18n(layer.titleKey);
        var grid = document.createElement('div');
        grid.className = 'grid gap-2 sm:grid-cols-2';
        var ti;
        for (ti = 0; ti < layer.types.length; ti++) {
          var nt = layer.types[ti];
          grid.appendChild(kgRenderEntityTypeCard_(nt, countByType[nt] || 0));
        }
        section.appendChild(layerTitle);
        section.appendChild(grid);
        entitiesTypesGrid.appendChild(section);
      }
    }
    if (entitiesRelationsList) {
      entitiesRelationsList.innerHTML = '';
      var relCount = {};
      var relRows = catalog.relationTypes || [];
      var rj;
      for (rj = 0; rj < relRows.length; rj++) {
        relCount[String(relRows[rj].relation || '')] = Number(relRows[rj].count) || 0;
      }
      var rl;
      for (rl = 0; rl < ENTITY_REL_LAYERS_.length; rl++) {
        var relLayer = ENTITY_REL_LAYERS_[rl];
        var relSection = document.createElement('div');
        relSection.className = 'space-y-2';
        var relLayerTitle = document.createElement('p');
        relLayerTitle.className =
          'text-[0.65rem] font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400';
        relLayerTitle.textContent = i18n(relLayer.titleKey);
        var relGrid = document.createElement('div');
        relGrid.className = 'grid gap-2 sm:grid-cols-2';
        var rk;
        for (rk = 0; rk < relLayer.relations.length; rk++) {
          var rel = relLayer.relations[rk];
          relGrid.appendChild(kgRenderEntityRelationCard_(rel, relCount[rel] || 0));
        }
        relSection.appendChild(relLayerTitle);
        relSection.appendChild(relGrid);
        entitiesRelationsList.appendChild(relSection);
      }
    }
    kgReapplyPageI18n_();
    entitiesCatalogLoaded = true;
  }

  function kgLoadEntityCatalog_(onDone) {
    if (entitiesCatalogBusy) return;
    kgSetEntitiesCatalogBusy_(true);
    google.script.run
      .withSuccessHandler(function (res) {
        kgSetEntitiesCatalogBusy_(false);
        if (!res || !res.ok) {
          A.reportRpcError(res || new Error('catalog'), {
            scope: 'knowledgeGraph.entityCatalog',
            fallbackKey: 'kg_entities_error_catalog',
            modal: true,
          });
          if (typeof onDone === 'function') onDone();
          return;
        }
        kgRenderEntityCatalog_(res);
        if (typeof onDone === 'function') onDone();
      })
      .withFailureHandler(function (e) {
        kgSetEntitiesCatalogBusy_(false);
        A.reportRpcError(e, {
          scope: 'knowledgeGraph.entityCatalog',
          fallbackKey: 'kg_entities_error_catalog',
          modal: true,
        });
        if (typeof onDone === 'function') onDone();
      })
      .getKnowledgeGraphEntityCatalog();
  }

  function kgUpdateEntitiesPager_() {
    if (entitiesPageInfo) {
      if (!entitiesTotal) {
        entitiesPageInfo.textContent = i18n('metrics_pagination_empty');
      } else {
        var from = entitiesSkip + 1;
        var to = Math.min(entitiesSkip + entitiesPageSize, entitiesTotal);
        entitiesPageInfo.textContent = i18nFmt('metrics_pagination_info', {
          from: String(from),
          to: String(to),
          total: String(entitiesTotal),
        });
      }
    }
    if (entitiesPrev) entitiesPrev.disabled = entitiesListBusy || entitiesSkip <= 0;
    if (entitiesNext) {
      entitiesNext.disabled =
        entitiesListBusy || entitiesSkip + entitiesPageSize >= entitiesTotal;
    }
  }

  function kgRenderEntitiesTable_(items) {
    if (!entitiesTableBody) return;
    entitiesTableBody.innerHTML = '';
    var hasRows = items && items.length;
    if (entitiesListEmpty) entitiesListEmpty.classList.toggle('hidden', !!hasRows);
    if (!hasRows) return;
    var i;
    for (i = 0; i < items.length; i++) {
      (function (node) {
        var tr = document.createElement('tr');
        tr.className = 'border-t border-slate-100 dark:border-slate-700';
        var tdName = document.createElement('td');
        tdName.className = 'px-3 py-2 font-medium text-slate-800 dark:text-slate-200';
        tdName.textContent = String(node.label || node.id || '');
        var tdType = document.createElement('td');
        tdType.className = 'px-3 py-2 text-slate-600 dark:text-slate-400';
        tdType.textContent = i18n(TYPE_I18N[node.type] || node.type || '');
        var tdMeta = document.createElement('td');
        tdMeta.className = 'px-3 py-2 text-xs text-slate-500 dark:text-slate-400';
        tdMeta.textContent = kgEntitiesMetaForNode_(node);
        var tdAct = document.createElement('td');
        tdAct.className = 'px-3 py-2 text-right';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-sm btn-outline inline-flex items-center gap-2';
        var btnIcon = document.createElement('i');
        btnIcon.className = 'fa-solid fa-diagram-project';
        btnIcon.setAttribute('aria-hidden', 'true');
        var btnLabel = document.createElement('span');
        btnLabel.setAttribute('data-i18n', 'kg_entities_btn_view_graph');
        btnLabel.textContent = i18n('kg_entities_btn_view_graph');
        btn.appendChild(btnIcon);
        btn.appendChild(btnLabel);
        btn.addEventListener('click', function () {
          kgOpenNodeInGraph_(node);
        });
        tdAct.appendChild(btn);
        tr.appendChild(tdName);
        tr.appendChild(tdType);
        tr.appendChild(tdMeta);
        tr.appendChild(tdAct);
        entitiesTableBody.appendChild(tr);
      })(items[i]);
    }
  }

  function kgLoadEntitiesList_() {
    if (entitiesListBusy) return;
    if (entitiesListError) {
      entitiesListError.classList.add('hidden');
      entitiesListError.textContent = '';
    }
    kgSetEntitiesListBusy_(true);
    var params = {
      skip: entitiesSkip,
      limit: entitiesPageSize,
      nodeType: entitiesFilterType ? String(entitiesFilterType.value || '').trim() : '',
      searchQuery: entitiesFilterSearch
        ? String(entitiesFilterSearch.value || '').trim()
        : '',
    };
    google.script.run
      .withSuccessHandler(function (res) {
        kgSetEntitiesListBusy_(false);
        if (!res || !res.ok) {
          if (entitiesListError) {
            entitiesListError.textContent = i18n('kg_entities_error_list');
            entitiesListError.classList.remove('hidden');
          }
          return;
        }
        entitiesTotal = Number(res.total) || 0;
        entitiesSkip = Number(res.skip) || 0;
        kgRenderEntitiesTable_(res.items || []);
        kgUpdateEntitiesPager_();
      })
      .withFailureHandler(function (e) {
        kgSetEntitiesListBusy_(false);
        kgUpdateEntitiesPager_();
        A.reportRpcError(e, {
          scope: 'knowledgeGraph.entityList',
          fallbackKey: 'kg_entities_error_list',
          modal: true,
        });
      })
      .listKnowledgeGraphEntities(params);
  }

  function kgEnsureEntitiesLoaded_() {
    kgInitMainTabs_();
    if (!entitiesCatalogLoaded) {
      kgLoadEntityCatalog_(function () {
        kgLoadEntitiesList_();
      });
      return;
    }
    if (!entitiesTableBody || !entitiesTableBody.children.length) {
      kgLoadEntitiesList_();
    }
  }

  function kgEntitiesApplyFilters_() {
    entitiesSkip = 0;
    kgLoadEntitiesList_();
  }

  function kgFocusEntitySubgraph_(nodeId) {
    if (!nodeId) return;
    var lim = kgResolveLimits_();
    selectedNodeId = String(nodeId);
    if (filterDepth) filterDepth.value = String(lim.bfsDepthCap);
    if (filterDensity) filterDensity.value = String(lim.densityWide);
    if (filterSearch) filterSearch.value = '';
    kgUpdateDetail(nodeById[selectedNodeId] || null);
    kgSyncNodeListSelection_();
    kgOpenSidePanel_('detail');
    kgLoad({ focus: true, skipCache: true });
  }

  function kgOpenNodeInGraph_(node) {
    if (!node || !node.id) return;
    if (kgMainTabs) kgMainTabs.activate('kg-tab-graph');
    kgFocusEntitySubgraph_(node.id);
  }

  function kgApplySyncStatus_(st) {
    if (!st || !st.ok) return;
    if (st.staleGraphNodes > 0) {
      kgSetStatus(
        i18nFmt('kg_status_stale', { stale: String(st.staleGraphNodes) }),
      );
      return;
    }
    if (st.graphContentNodes === 0 && (st.catalogContents || 0) > 0) {
      kgSetStatus(i18n('kg_status_empty'));
      return;
    }
    if (st.needsCatchUp) {
      kgSetStatus(
        i18nFmt('kg_status_behind', {
          graph: String(st.graphContentNodes || 0),
          catalog: String(st.catalogContents || 0),
          missing: String(st.missingContents || 0),
        }),
      );
      return;
    }
    if (st.needsEmbeddings) {
      kgSetStatus(
        i18nFmt('kg_status_missing_embeddings', {
          withEmb: String(st.catalogWithEmbeddings || 0),
          catalog: String(st.catalogContents || 0),
          missing: String(st.missingEmbeddings || 0),
        }),
      );
      return;
    }
    if ((st.graphContentNodes || 0) > 0) {
      kgSetStatus(
        i18nFmt('kg_status_ready', {
          graph: String(st.graphContentNodes || 0),
        }),
      );
    }
  }

  function kgFetchSyncStatusThenLoad_() {
    google.script.run
      .withSuccessHandler(function (st) {
        kgApplySyncStatus_(st);
        kgLoad();
      })
      .withFailureHandler(function () {
        kgLoad();
      })
      .getKnowledgeGraphSyncStatus();
  }

  function kgAfterI18nReady_(fn) {
    var loc = 'es';
    try {
      var st = localStorage.getItem('aviators_locale');
      if (st === 'en') loc = 'en';
    } catch (eLocKg) {}
    if (typeof A.ensureClientI18n === 'function') {
      A.ensureClientI18n(loc, fn);
      return;
    }
    if (typeof fn === 'function') fn();
  }

  function onShow() {
    kgAfterI18nReady_(function () {
      kgInitMainTabs_();
      kgPopulateEntitiesFilterTypes_();
      kgReapplyPageI18n_();
      if (syncToolbar) {
        syncToolbar.classList.toggle('hidden', !S.get('canRebuildKnowledgeGraph'));
      }
      if (rebuildBtn) {
        rebuildBtn.classList.toggle('hidden', !S.get('canRebuildKnowledgeGraph'));
      }
      kgApplyLimitsToFilters_();
      kgBuildLegend();
      kgPopulateFilterOptions();
      kgCheckPendingSyncBanner_(function () {
        if (S.get('canRebuildKnowledgeGraph')) {
          kgFetchSyncStatusThenLoad_();
          return;
        }
        kgLoad();
      });
    });
  }

  if (pendingSyncResumeBtn) {
    pendingSyncResumeBtn.addEventListener('click', function () {
      kgResumePendingRebuild_();
    });
  }
  if (pendingSyncDiscardBtn) {
    pendingSyncDiscardBtn.addEventListener('click', function () {
      kgDiscardPendingRebuild_(function () {
        kgLoad({ skipCache: true });
      });
    });
  }

  if (applyBtn) {
    applyBtn.addEventListener('click', function () {
      kgLoad({ skipCache: true });
    });
  }
  if (resetBtn) {
    resetBtn.addEventListener('click', function () {
      if (filterSearch) filterSearch.value = '';
      if (filterType) filterType.value = '';
      if (filterIndustry) filterIndustry.value = '';
      if (filterClient) filterClient.value = '';
      var limReset = kgResolveLimits_();
      if (filterDepth) filterDepth.value = String(limReset.bfsDepthDefault);
      if (filterDensity) filterDensity.value = String(limReset.densityNormal);
      if (filterMinWeight) filterMinWeight.value = '0';
      if (nodeListFilter) nodeListFilter.value = '';
      selectedNodeId = '';
      kgResetFind_();
      var ti;
      for (ti = 0; ti < typeToggles.length; ti++) typeToggles[ti].checked = true;
      kgLoad();
    });
  }
  if (focusBtn) {
    focusBtn.addEventListener('click', function () {
      if (!selectedNodeId) {
        kgSetStatus(i18n('kg_focus_no_selection'), true);
        return;
      }
      if (filterSearch) filterSearch.value = '';
      kgLoad({ focus: true });
    });
  }
  if (rebuildBtn) {
    rebuildBtn.addEventListener('click', function () {
      kgEnqueueBackgroundSync_(true, function () {
        kgLoad({ skipCache: true });
      });
    });
  }
  if (openContentBtn) {
    openContentBtn.addEventListener('click', function () {
      if (!selectedNodeId || selectedNodeId.indexOf('content:') !== 0) return;
      var cid = selectedNodeId.replace(/^content:/, '');
      S.set('contentsPendingOpenId', cid);
      if (typeof A.setAppPage === 'function') {
        A.setAppPage('contents');
      }
    });
  }
  if (filterSearch) {
    filterSearch.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') kgLoad();
    });
  }
  if (filterDepth) {
    filterDepth.addEventListener('change', function () {
      kgUpdateScopeIndicator_(lastSnapshot);
    });
  }
  if (filterDensity) {
    filterDensity.addEventListener('change', function () {
      kgUpdateScopeIndicator_(lastSnapshot);
    });
  }
  if (layoutModeEl) {
    layoutModeEl.addEventListener('change', kgReapplyGraphView_);
  }
  if (showLabelsEl) {
    showLabelsEl.addEventListener('change', kgReapplyGraphView_);
  }
  if (fitBtn) {
    fitBtn.addEventListener('click', kgFitView_);
  }
  if (zoomInBtn) {
    zoomInBtn.addEventListener('click', function () {
      kgZoomBy_(1.22);
    });
  }
  if (zoomOutBtn) {
    zoomOutBtn.addEventListener('click', function () {
      kgZoomBy_(0.82);
    });
  }
  if (graphFindInput) {
    graphFindInput.addEventListener('input', function () {
      findMatchIndex = -1;
      kgRefreshFindMatches_();
    });
    graphFindInput.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        kgFindGo_(ev.shiftKey ? -1 : 1);
      }
    });
  }
  if (graphFindNext) {
    graphFindNext.addEventListener('click', function () {
      kgFindGo_(1);
    });
  }
  if (graphFindPrev) {
    graphFindPrev.addEventListener('click', function () {
      kgFindGo_(-1);
    });
  }
  if (nodeListFilter) {
    nodeListFilter.addEventListener('input', kgBuildNodeList_);
  }
  if (sideToggle) {
    sideToggle.addEventListener('click', function () {
      kgOpenSidePanel_('detail');
    });
  }
  if (sideOpen) {
    sideOpen.addEventListener('click', function () {
      kgOpenSidePanel_('detail');
    });
  }
  if (sideClose) {
    sideClose.addEventListener('click', kgCloseSidePanel_);
  }
  if (tabDetail) {
    tabDetail.addEventListener('click', function () {
      kgSwitchSideTab_('detail');
    });
  }
  if (tabNodes) {
    tabNodes.addEventListener('click', function () {
      kgSwitchSideTab_('nodes');
    });
  }
  if (entitiesApplyBtn) {
    entitiesApplyBtn.addEventListener('click', kgEntitiesApplyFilters_);
  }
  if (entitiesFilterSearch) {
    entitiesFilterSearch.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') kgEntitiesApplyFilters_();
    });
  }
  if (entitiesPrev) {
    entitiesPrev.addEventListener('click', function () {
      if (entitiesSkip <= 0 || entitiesListBusy) return;
      entitiesSkip = Math.max(0, entitiesSkip - entitiesPageSize);
      kgLoadEntitiesList_();
    });
  }
  if (entitiesNext) {
    entitiesNext.addEventListener('click', function () {
      if (entitiesListBusy || entitiesSkip + entitiesPageSize >= entitiesTotal) return;
      entitiesSkip += entitiesPageSize;
      kgLoadEntitiesList_();
    });
  }

  A.knowledgeGraph = {
    onShow: onShow,
    load: kgLoad,
  };
})(window.Aviators);
</script>
