<script>
(function (A) {
  var S = A.state;
  var i18n = A.i18n;
  var i18nFmt = A.i18nFmt;

  var viewLogin = document.getElementById('view-login');
  var viewApp = document.getElementById('view-app');
  var loginBtn = document.getElementById('login-btn');
  var loginStatus = document.getElementById('login-status');
  var emailEl = document.getElementById('email');
  var userAvatar = document.getElementById('user-avatar');
  var userAvatarPlaceholder = document.getElementById('user-avatar-placeholder');
  var userDisplayName = document.getElementById('user-display-name');
  var sidebarRole = document.getElementById('sidebar-role');
  var homeVisitante = document.getElementById('home-visitante');
  var homeMember = document.getElementById('home-member');
  var filesUl = document.getElementById('files');
  var sessionNote = document.getElementById('session-note');
  var backLogin = document.getElementById('logout-toolbar');
  var navBtnHome = document.getElementById('nav-btn-home');
  var navGroupChatModes = document.getElementById('nav-group-chat-modes');
  var navGroupKnowledge = document.getElementById('nav-group-knowledge');
  var navGroupAdmin = document.getElementById('nav-group-admin');
  var navPageOnboarding = document.getElementById('nav-page-onboarding');
  var navPageProposalBuilding = document.getElementById('nav-page-proposal-building');
  var navPageContents = document.getElementById('nav-page-contents');
  var navPageTags = document.getElementById('nav-page-tags');
  var navPageClients = document.getElementById('nav-page-clients');
  var navPageMetrics = document.getElementById('nav-page-metrics');
  var navPageKnowledgeGraph = document.getElementById('nav-page-knowledge-graph');
  var navPageSettings = document.getElementById('nav-page-settings');
  var navPageRequestAccess = document.getElementById('nav-page-request-access');
  var navVisitorDivider = document.getElementById('nav-visitor-divider');
  var navPageFaq = document.getElementById('nav-page-faq');
  var appSidebarProfile = document.getElementById('app-sidebar-profile');
  var chatModeBar = document.getElementById('chat-mode-bar');
  var chatModeGeneral = document.getElementById('chat-mode-general');
  var chatModeOnboarding = document.getElementById('chat-mode-onboarding');
  var chatModeProposalBuilding = document.getElementById('chat-mode-proposal-building');
  var adminAgentStatus = document.getElementById('admin-agent-status');
  var appShellView = document.getElementById('view-app');
  var appSidebar = document.getElementById('app-sidebar');
  var mobileDrawerOpenBtn = document.getElementById('mobile-drawer-open-btn');
  var mobileDrawerCloseBtn = document.getElementById('mobile-drawer-close-btn');
  var appDrawerBackdrop = document.getElementById('app-drawer-backdrop');
  var mobileDrawerMql = window.matchMedia ? window.matchMedia('(max-width: 1023px)') : null;
  var lastDrawerFocusEl = null;

  function isMobileDrawerViewport() {
    return !!(mobileDrawerMql && mobileDrawerMql.matches);
  }

  function setDrawerState(open, options) {
    var opts = options || {};
    var shouldOpen = !!open;
    if (!appShellView) return;
    if (!isMobileDrawerViewport()) shouldOpen = false;
    appShellView.classList.toggle('drawer-open', shouldOpen);
    if (appSidebar) appSidebar.setAttribute('aria-hidden', shouldOpen ? 'false' : 'true');
    if (mobileDrawerOpenBtn) {
      mobileDrawerOpenBtn.setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
    }
    if (!shouldOpen && opts.restoreFocus && lastDrawerFocusEl && lastDrawerFocusEl.focus) {
      try { lastDrawerFocusEl.focus(); } catch (eFocusBack) {}
    }
  }

  function openMobileDrawer() {
    if (!isMobileDrawerViewport()) return;
    lastDrawerFocusEl = document.activeElement || null;
    setDrawerState(true);
    var focusTarget =
      navBtnHome ||
      appSidebar && appSidebar.querySelector('.app-nav-item') ||
      mobileDrawerCloseBtn;
    if (focusTarget && focusTarget.focus) {
      try { focusTarget.focus(); } catch (eFocusOpen) {}
    }
  }

  function closeMobileDrawer(options) {
    setDrawerState(false, options);
  }

  function toggleMobileDrawer() {
    if (!appShellView) return;
    if (appShellView.classList.contains('drawer-open')) {
      closeMobileDrawer({ restoreFocus: true });
    } else {
      openMobileDrawer();
    }
  }

  function syncMobileDrawerViewport() {
    if (!isMobileDrawerViewport()) {
      closeMobileDrawer({ restoreFocus: false });
      if (appSidebar) appSidebar.setAttribute('aria-hidden', 'false');
    } else if (!appShellView || !appShellView.classList.contains('drawer-open')) {
      if (appSidebar) appSidebar.setAttribute('aria-hidden', 'true');
      if (mobileDrawerOpenBtn) mobileDrawerOpenBtn.setAttribute('aria-expanded', 'false');
    }
  }

  function isChatPage_(pg) {
    return pg === 'home' || pg === 'onboarding' || pg === 'proposal-building';
  }

  function syncNavGroups_(pg) {
    if (
      navGroupChatModes &&
      (pg === 'home' || pg === 'onboarding' || pg === 'proposal-building')
    ) {
      navGroupChatModes.open = true;
    }
    if (
      navGroupKnowledge &&
      (pg === 'contents' || pg === 'clients' || pg === 'tags' || pg === 'knowledge-graph')
    ) {
      navGroupKnowledge.open = true;
    }
    if (navGroupAdmin && (pg === 'metrics' || pg === 'settings')) {
      navGroupAdmin.open = true;
    }
    syncNavGroupSummaries_();
  }

  function syncNavGroupSummaries_() {
    var groups = document.querySelectorAll('.app-nav-group');
    var i;
    for (i = 0; i < groups.length; i++) {
      var group = groups[i];
      if (group.classList.contains('hidden')) continue;
      var summary = group.querySelector('.app-nav-group-summary');
      if (!summary) continue;
      var activeChild = group.querySelector('.app-nav-item.is-active');
      summary.classList.toggle('is-active', !!activeChild);
      group.classList.toggle('has-active-child', !!activeChild);
    }
  }

  function closeSiblingNavGroups_(openedGroup) {
    if (!openedGroup || !openedGroup.open) return;
    var groups = document.querySelectorAll('.app-nav-group');
    var i;
    for (i = 0; i < groups.length; i++) {
      var group = groups[i];
      if (group !== openedGroup && !group.classList.contains('hidden')) {
        group.open = false;
      }
    }
  }

  function syncChatModeTabs_(pg) {
    if (!chatModeBar) return;
    var canOb = !!S.get('canViewOnboarding');
    var canPb = !!S.get('canViewProposalBuilding');
    var modeCount = 1 + (canOb ? 1 : 0) + (canPb ? 1 : 0);
    chatModeBar.classList.toggle('hidden', !isChatPage_(pg) || modeCount < 2);
    if (chatModeOnboarding) {
      chatModeOnboarding.classList.toggle('hidden', !canOb);
    }
    if (chatModeProposalBuilding) {
      chatModeProposalBuilding.classList.toggle('hidden', !canPb);
    }
    var tabs = document.querySelectorAll('.chat-mode-tab');
    var i;
    for (i = 0; i < tabs.length; i++) {
      var tab = tabs[i];
      if (tab.classList.contains('hidden')) {
        tab.classList.remove('is-active');
        tab.setAttribute('aria-selected', 'false');
        continue;
      }
      var mode = tab.getAttribute('data-chat-mode') || 'home';
      var active = mode === pg || (mode === 'home' && pg === 'home');
      tab.classList.toggle('is-active', active);
      tab.setAttribute('aria-selected', active ? 'true' : 'false');
    }
  }

  function syncSidebarNav_(opts) {
    var o = opts || {};
    var canViewOnboarding = !!o.canViewOnboarding;
    var canViewProposalBuilding = !!o.canViewProposalBuilding;
    var canViewCatalog = !!o.canViewCatalog;
    var canViewTags = !!o.canViewTags;
    var canViewClients = !!o.canViewClients;
    var canViewMetrics = !!o.canViewMetrics;
    var canViewKnowledgeGraph = !!o.canViewKnowledgeGraph;
    var canViewSettings = !!o.canViewSettings;
    var isVisitor = !!o.isVisitor;
    var showKnowledge =
      canViewCatalog || canViewClients || canViewTags || canViewKnowledgeGraph;
    var showAdmin = canViewMetrics || canViewSettings;
    if (navGroupKnowledge) {
      navGroupKnowledge.classList.toggle('hidden', !showKnowledge);
    }
    if (navGroupAdmin) {
      navGroupAdmin.classList.toggle('hidden', !showAdmin);
    }
    if (navPageOnboarding) {
      navPageOnboarding.classList.toggle('hidden', !canViewOnboarding);
    }
    if (navPageProposalBuilding) {
      navPageProposalBuilding.classList.toggle('hidden', !canViewProposalBuilding);
    }
    if (navPageContents) navPageContents.classList.toggle('hidden', !canViewCatalog);
    if (navPageTags) navPageTags.classList.toggle('hidden', !canViewTags);
    if (navPageClients) navPageClients.classList.toggle('hidden', !canViewClients);
    if (navPageMetrics) navPageMetrics.classList.toggle('hidden', !canViewMetrics);
    if (navPageKnowledgeGraph) {
      navPageKnowledgeGraph.classList.toggle('hidden', !canViewKnowledgeGraph);
    }
    if (navPageSettings) navPageSettings.classList.toggle('hidden', !canViewSettings);
    if (navPageRequestAccess) {
      navPageRequestAccess.classList.toggle('hidden', !isVisitor);
    }
    if (navVisitorDivider) {
      navVisitorDivider.classList.toggle('hidden', !isVisitor);
    }
    syncChatModeTabs_(S.get('activePage') || 'home');
    syncNavGroupSummaries_();
  }

  function bindNavGroupToggle_(groupEl, storageKey, defaultOpen) {
    if (!groupEl) return;
    var fallbackOpen = !!defaultOpen;
    function readOpen(key, fbOpen) {
      try {
        var v = localStorage.getItem(key);
        if (v === '1') return true;
        if (v === '0') return false;
      } catch (eRead) {}
      return !!fbOpen;
    }
    groupEl.open = readOpen(storageKey, fallbackOpen);
    groupEl.addEventListener('toggle', function () {
      if (groupEl.open && isMobileDrawerViewport()) {
        closeSiblingNavGroups_(groupEl);
      }
      try {
        localStorage.setItem(storageKey, groupEl.open ? '1' : '0');
      } catch (eStore) {}
      syncNavGroupSummaries_();
    });
  }

  function restoreNavGroupState_() {
    bindNavGroupToggle_(navGroupChatModes, 'aviators_nav_chat_modes_open', true);
    bindNavGroupToggle_(navGroupKnowledge, 'aviators_nav_knowledge_open');
    bindNavGroupToggle_(navGroupAdmin, 'aviators_nav_admin_open');
  }

  restoreNavGroupState_();

  function setAppPage(page) {
    var pg = page;
    var prevPage = S.get('activePage') || '';
    var canManageAgents = !!S.get('canManageAgents');
    if (pg === 'agents') {
      if (!S.get('canViewAgents')) {
        pg = 'home';
      } else {
        S.set('settingsPendingTab', 'settings-tab-agents');
        pg = 'settings';
      }
    }
    if (pg === 'contents' && !S.get('canViewCatalog')) {
      pg = 'home';
    }
    if (pg === 'tags' && !S.get('canViewTags')) {
      pg = 'home';
    }
    if (pg === 'clients' && !S.get('canViewClients')) {
      pg = 'home';
    }
    if (pg === 'metrics' && !S.get('canViewMetrics')) {
      pg = 'home';
    }
    if (pg === 'knowledge-graph' && !S.get('canViewKnowledgeGraph')) {
      pg = 'home';
    }
    if (pg === 'settings' && !S.get('canViewSettings')) {
      pg = 'home';
    }
    if (pg === 'onboarding' && !S.get('canViewOnboarding')) {
      pg = 'home';
    }
    if (pg === 'proposal-building' && !S.get('canViewProposalBuilding')) {
      pg = 'home';
    }
    if (pg === 'request-access' && !S.get('isVisitor')) {
      pg = 'home';
    }
    if (
      (prevPage === 'home' || prevPage === 'onboarding' || prevPage === 'proposal-building') &&
      pg !== prevPage &&
      A.chat &&
      typeof A.chat.saveCurrentConversation === 'function'
    ) {
      A.chat.saveCurrentConversation();
    }
    var nodes = document.querySelectorAll('.app-page');
    var i;
    for (i = 0; i < nodes.length; i++) {
      var p = nodes[i];
      var id = p.id || '';
      var show =
        (pg === 'home' && id === 'page-home') ||
        (pg === 'onboarding' && id === 'page-onboarding') ||
        (pg === 'proposal-building' && id === 'page-proposal-building') ||
        (pg === 'contents' && id === 'page-contents') ||
        (pg === 'tags' && id === 'page-tags') ||
        (pg === 'clients' && id === 'page-clients') ||
        (pg === 'metrics' && id === 'page-metrics') ||
        (pg === 'knowledge-graph' && id === 'page-knowledge-graph') ||
        (pg === 'settings' && id === 'page-settings') ||
        (pg === 'request-access' && id === 'page-request-access') ||
        (pg === 'faq' && id === 'page-faq');
      p.classList.toggle('hidden', !show);
    }
    var chatShell = document.getElementById('home-chat-shell');
    if (chatShell) {
      chatShell.classList.toggle('hidden', pg !== 'home' && pg !== 'onboarding' && pg !== 'proposal-building');
    }
    if (homeMember) {
      homeMember.classList.toggle('hidden', pg === 'faq' || pg === 'request-access');
    }
    if (homeVisitante) {
      homeVisitante.classList.toggle('hidden', !(S.get('isVisitor') && pg === 'home'));
    }
    S.set('activePage', pg || '');
    if (
      (pg === 'home' || pg === 'onboarding' || pg === 'proposal-building') &&
      A.chat &&
      typeof A.chat.onEnterChatPage === 'function'
    ) {
      A.chat.onEnterChatPage(pg);
    }
    var viewApp = document.getElementById('view-app');
    if (viewApp) viewApp.setAttribute('data-active-page', pg || '');
    var scrollArea = document.querySelector('.app-content-scroll');
    if (scrollArea) scrollArea.scrollTop = 0;
    syncNavGroups_(pg);
    syncChatModeTabs_(pg);
    var navItems = document.querySelectorAll('.app-nav-item');
    for (i = 0; i < navItems.length; i++) {
      var nb = navItems[i];
      var ap = nb.getAttribute('data-app-page') || '';
      var isCurrent = ap === pg && !nb.classList.contains('hidden');
      nb.classList.toggle('is-active', isCurrent);
      if (isCurrent) {
        nb.setAttribute('aria-current', 'page');
      } else {
        nb.removeAttribute('aria-current');
      }
    }
    syncNavGroupSummaries_();
    if (pg === 'home') {
      if (A.dashboard && typeof A.dashboard.loadMetrics === 'function') {
        A.dashboard.loadMetrics();
      }
    }
    if (pg === 'metrics') {
      if (A.metrics && typeof A.metrics.loadDashboard === 'function') {
        A.metrics.loadDashboard();
      }
    }
    if (pg === 'settings') {
      if (A.settings && typeof A.settings.onShow === 'function') {
        A.settings.onShow();
      }
    }
    if (pg === 'request-access') {
      if (A.accessRequest && typeof A.accessRequest.onShow === 'function') {
        A.accessRequest.onShow();
      }
    }
    if (pg === 'contents') {
      var pendingContentId = String(S.get('contentsPendingOpenId') || '').trim();
      if (A.contents && A.contents.applyWriteAccess) A.contents.applyWriteAccess();
      if (pendingContentId) {
        S.set('contentsPendingOpenId', '');
        if (A.contents && A.contents.setScreen) {
          A.contents.setScreen('editor');
        }
        if (A.contents && A.contents.openViewById) {
          A.contents.openViewById(pendingContentId);
        } else if (A.contents && A.contents.selectById) {
          A.contents.selectById(pendingContentId);
        }
      } else {
        if (A.contents && A.contents.setScreen) {
          A.contents.setScreen('list');
        }
        if (A.contents && A.contents.toggleSpecificSections) A.contents.toggleSpecificSections();
        if (A.contents && A.contents.loadList) A.contents.loadList();
      }
    }
    if (pg === 'tags') {
      if (A.tags && typeof A.tags.onShow === 'function') {
        A.tags.onShow();
      }
    }
    if (pg === 'knowledge-graph') {
      if (A.knowledgeGraph && typeof A.knowledgeGraph.onShow === 'function') {
        A.knowledgeGraph.onShow();
      }
    }
    if (pg === 'clients') {
      var pendingClientName = String(S.get('clientsPendingOpenName') || '').trim();
      if (A.clients && A.clients.applyWriteAccess) A.clients.applyWriteAccess();
      if (pendingClientName) {
        if (A.clients && A.clients.setScreen) A.clients.setScreen('editor');
        if (A.clients && A.clients.tryOpenPendingName) A.clients.tryOpenPendingName();
      } else {
        if (A.clients && A.clients.setScreen) A.clients.setScreen('list');
        if (A.clients && A.clients.loadFilterOptions) A.clients.loadFilterOptions();
        if (A.clients && A.clients.loadList) A.clients.loadList();
      }
    }
    closeMobileDrawer({ restoreFocus: false });
  }

  A.setAppPage = setAppPage;

  function refreshUiAfterLocaleChange() {
    var llm = S.get('lastLlmCfg');
    if (llm) {
      A.chat.applyConsultModeLabels(llm);
      A.chat.updateHomeChatBanner(llm);
    }
    if (A.chat && A.chat.applyQuickPromptsForActivePage) {
      var ci = S.get('cachedI18n');
      var locUi = ci && ci._locale === 'en' ? 'en' : 'es';
      A.chat.applyQuickPromptsForActivePage(locUi);
    }
    var ce = document.getElementById('chat-empty');
    if (ce && !ce.classList.contains('hidden')) {
      ce.textContent = i18n(
        S.get('activePage') === 'onboarding' ? 'chat_empty_hint_onboarding' : 'chat_empty_hint',
      );
    }
    if (A.chat && typeof A.chat.applyPageChrome === 'function') {
      A.chat.applyPageChrome(S.get('activePage') || 'home');
    }
    if (A.dashboard && typeof A.dashboard.loadMetrics === 'function') {
      A.dashboard.loadMetrics();
    }
  }

  function renderContextFiles(files) {
    filesUl.innerHTML = '';
    for (var i = 0; i < files.length; i++) {
      (function (f) {
        var li = document.createElement('li');
        var lbl = document.createElement('label');
        var chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.value = f.id;
        chk.addEventListener('change', function () {
          if (!chk.checked) return;
          var n = filesUl.querySelectorAll('input:checked').length;
          if (n > A.MAX_SELECTION) {
            chk.checked = false;
            var askStatus = document.getElementById('ask-status');
            if (askStatus) {
              askStatus.textContent = i18nFmt('ask_max_docs', { max: A.MAX_SELECTION });
              askStatus.classList.add('err');
            }
          }
        });
        var a = document.createElement('a');
        a.href = f.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = f.name || f.id;
        lbl.appendChild(chk);
        lbl.appendChild(a);
        li.appendChild(lbl);
        filesUl.appendChild(li);
      })(files[i]);
    }
  }

  function loadContextFilesLazy() {
    var cached = A.cache.get('contextFiles');
    if (cached) {
      S.set('contextFiles', cached.files);
      S.set('contextFilesNote', cached.note);
      renderContextFiles(cached.files);
      if (sessionNote && cached.note) {
        sessionNote.textContent = (sessionNote.textContent || '').trim()
          ? sessionNote.textContent + ' ' + cached.note
          : cached.note;
      }
      return;
    }

    filesUl.innerHTML = '<li class="text-xs text-slate-400 dark:text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-1" aria-hidden="true"></i>' + i18n('context_files_loading') + '</li>';
    google.script.run
      .withSuccessHandler(function (res) {
        var files = (res && res.files) || [];
        var note = (res && res.note) || '';
        S.set('contextFiles', files);
        S.set('contextFilesNote', note);
        A.cache.set('contextFiles', { files: files, note: note }, 120000);
        renderContextFiles(files);
        if (sessionNote && note) {
          var cur = (sessionNote.textContent || '').trim();
          sessionNote.textContent = cur ? cur + ' ' + note : note;
        }
      })
      .withFailureHandler(function () {
        filesUl.innerHTML = '';
      })
      .getContextFiles();
  }

  function showApp(bootstrap) {
    if (A.hideStartupLoader) A.hideStartupLoader();
    var wantLocale = null;
    try {
      var st = localStorage.getItem('aviators_locale');
      if (st === 'es' || st === 'en') wantLocale = st;
    } catch (eLoc) {}

    function runShowAppBody() {
      var bootLocale =
        wantLocale ||
        (S.get('cachedI18n') && S.get('cachedI18n')._locale) ||
        'es';
      A.ensureClientI18n(bootLocale, function () {
      // Keep sidebar logo in sync with embedded login logo data URL.
      if (A.syncSidebarBrandLogo) A.syncSidebarBrandLogo();
      loginStatus.textContent = '\u00a0';
      viewLogin.classList.add('hidden');
      viewApp.classList.remove('hidden');

      var data = bootstrap.session || {};
      var llmCfg = bootstrap.llm || {};
      S.set('lastLlmCfg', llmCfg);

      sessionNote.textContent = data.note || '';
      sessionNote.classList.toggle(
        'err',
        (!data.email && !!data.note) || !!data.showNoRoleBanner,
      );
      emailEl.textContent = data.email || i18n('label_no_email');
      if (appSidebarProfile) {
        var emailTitle = (data.email || '').trim();
        if (emailTitle) {
          appSidebarProfile.setAttribute('title', emailTitle);
        } else {
          appSidebarProfile.removeAttribute('title');
        }
      }

      if (userDisplayName)
        userDisplayName.textContent =
          data.displayName || data.email || i18n('label_em_dash');
      if (sidebarRole)
        sidebarRole.textContent =
          data.roleLabel || i18n('role_label_visitor');

      var photo = (data.photoUrl || '').trim();
      if (userAvatar && userAvatarPlaceholder) {
        userAvatar.referrerPolicy = 'no-referrer';
        userAvatar.onerror = function Avatar_onerror() {
          userAvatar.onerror = null;
          userAvatar.removeAttribute('src');
          userAvatar.classList.add('hidden');
          userAvatar.alt = '';
          userAvatarPlaceholder.classList.remove('hidden');
          userAvatarPlaceholder.textContent = A.initialsFromDisplayName(
            data.displayName,
            data.email,
          );
        };
        if (photo) {
          userAvatar.src = photo;
          userAvatar.classList.remove('hidden');
          userAvatar.alt = data.displayName || data.email || '';
          userAvatarPlaceholder.classList.add('hidden');
        } else {
          userAvatar.removeAttribute('src');
          userAvatar.classList.add('hidden');
          userAvatar.alt = '';
          userAvatarPlaceholder.classList.remove('hidden');
          userAvatarPlaceholder.textContent = A.initialsFromDisplayName(
            data.displayName,
            data.email,
          );
        }
      }

      var isVisitor = !!data.isVisitor;
      S.set('isVisitor', isVisitor);
      if (homeVisitante) homeVisitante.classList.add('hidden');
      if (homeMember) homeMember.classList.remove('hidden');
      if (A.accessRequest && A.accessRequest.syncVisitorNav) {
        A.accessRequest.syncVisitorNav();
      }

      A.chat.updateHomeChatBanner(llmCfg);

      // Permisos del servidor (fuente única de verdad).
      var perms = bootstrap.permissions || {};
      var canManageAgents = !!perms.canManageAgents;
      var canWriteCatalog = !!perms.canEditCatalog;
      var canViewAgents = !!perms.canViewAgents || canManageAgents;
      var canViewCatalog = !!perms.canViewCatalog || canWriteCatalog;
      var canViewTags = !!perms.canViewTags;
      var canViewClients = !!perms.canViewClients;
      var canViewMetrics = !!perms.canViewMetrics;
      var canResetMetrics = !!perms.canResetMetrics;
      var canManageUsers = !!perms.canManageUsers;
      var canManageRoleConfig = !!perms.canManageRoleConfig;
      var canSyncSalesforceAccounts = !!perms.canSyncSalesforceAccounts;
      var canManageUnansweredQueue = !!perms.canManageUnansweredQueue;
      var canViewOnboarding = !!perms.canViewOnboarding;
      var canViewProposalBuilding = !!perms.canViewProposalBuilding;
      var canViewKnowledgeGraph = !!perms.canViewKnowledgeGraph;
      var canRebuildKnowledgeGraph = !!perms.canRebuildKnowledgeGraph;
      var canViewSettings =
        canViewAgents ||
        canManageAgents ||
        canResetMetrics ||
        canManageUsers ||
        canManageRoleConfig ||
        canSyncSalesforceAccounts ||
        canRebuildKnowledgeGraph;
      S.set('canManageAgents', canManageAgents);
      S.set('canWriteContents', canWriteCatalog);
      S.set('canViewAgents', canViewAgents);
      S.set('canViewCatalog', canViewCatalog);
      S.set('canViewTags', canViewTags);
      S.set('canViewClients', canViewClients);
      S.set('canViewMetrics', canViewMetrics);
      S.set('canResetMetrics', canResetMetrics);
      S.set('canManageUsers', canManageUsers);
      S.set('canManageRoleConfig', canManageRoleConfig);
      S.set('canSyncSalesforceAccounts', canSyncSalesforceAccounts);
      S.set('canManageUnansweredQueue', canManageUnansweredQueue);
      S.set('canViewOnboarding', canViewOnboarding);
      S.set('canViewProposalBuilding', canViewProposalBuilding);
      S.set('canViewKnowledgeGraph', canViewKnowledgeGraph);
      S.set('canRebuildKnowledgeGraph', canRebuildKnowledgeGraph);
      S.set('canViewSettings', canViewSettings);
      if (bootstrap.kgLimits && typeof bootstrap.kgLimits === 'object') {
        S.set('kgLimits', bootstrap.kgLimits);
      }
      S.set('webAppUrl', String(bootstrap.webAppUrl || '').trim());
      var adm = bootstrap.admin || {};
      var maxUp =
        adm.adminUploadMaxBytes != null
          ? parseInt(String(adm.adminUploadMaxBytes), 10)
          : 0;
      S.set(
        'adminUploadMaxBytes',
        !isNaN(maxUp) && maxUp > 0 ? maxUp : 50 * 1024 * 1024,
      );
      if (A.agents && A.agents.refreshUploadLimitHint) {
        A.agents.refreshUploadLimitHint();
      }
      console.log('[Aviators:permissions]', JSON.stringify({
        raw: bootstrap.permissions,
        canManageAgents: canManageAgents,
        canWriteCatalog: canWriteCatalog,
        canViewAgents: canViewAgents,
        canViewCatalog: canViewCatalog,
        adminSlice: { isAdmin: (bootstrap.admin||{}).isAdmin, cma: (bootstrap.admin||{}).canManageAgents, cwc: (bootstrap.admin||{}).canWriteCatalog },
        session: { email: data.email, roleKey: data.roleKey, roleLabel: data.roleLabel, isVisitor: data.isVisitor, showNoRoleBanner: data.showNoRoleBanner },
        dataBackend: bootstrap.dataBackend || '',
      }));
      if (isVisitor) {
        google.script.run
          .withSuccessHandler(function (diag) {
            console.warn('[Aviators:role-debug]', JSON.stringify(diag));
          })
          .withFailureHandler(function (err) {
            console.warn('[Aviators:role-debug] RPC failed', err && err.message ? err.message : err);
          })
          .debugRoleDirectory();
      }
      syncSidebarNav_({
        canViewOnboarding: canViewOnboarding,
        canViewProposalBuilding: canViewProposalBuilding,
        canViewCatalog: canViewCatalog,
        canViewTags: canViewTags,
        canViewClients: canViewClients,
        canViewMetrics: canViewMetrics,
        canViewKnowledgeGraph: canViewKnowledgeGraph,
        canViewSettings: canViewSettings,
        isVisitor: isVisitor,
      });
      setAppPage('home');
      syncMobileDrawerViewport();
      if (A.renderDashboard) {
        A.renderDashboard(bootstrap, {
          showAgentsCard: canManageAgents,
          canManageContents: canWriteCatalog,
          canViewContents: canViewCatalog,
          canViewClients: canViewClients,
        });
      }
      if (adminAgentStatus) {
        adminAgentStatus.textContent = '\u00a0';
        adminAgentStatus.classList.remove('err');
      }
      if (canViewAgents) {
        A.agents.loadList();
      }

      A.chat.applyConsultModeInitialState(llmCfg);

      // Apply quick prompts from bootstrap (guardados para refresco al cambiar idioma)
      var qpBootstrap = bootstrap.quickPrompts || [];
      S.set('quickPrompts', qpBootstrap);
      var qpObBootstrap = bootstrap.onboardingQuickPrompts || [];
      S.set('onboardingQuickPrompts', qpObBootstrap);
      if (A.chat.applyQuickPromptsForActivePage) {
        var locale =
          (S.get('cachedI18n') && S.get('cachedI18n')._locale) || wantLocale || 'es';
        A.chat.applyQuickPromptsForActivePage(locale);
      }

      // Settings page (quick prompts + destructive reset)
      if (canViewSettings && A.settings && A.settings.init) {
        A.settings.init(qpBootstrap, qpObBootstrap);
      }

      loadContextFilesLazy();

      A.drive.bootstrap(data);
      });
    }

    runShowAppBody();
  }

  function resetToLogin(message) {
    viewApp.classList.add('hidden');
    viewLogin.classList.remove('hidden');
    loginBtn.disabled = false;
    A.whenClientI18nReady(function () {
      A.applyClientI18n(S.get('cachedI18n'));
      loginStatus.textContent = message || '\u00a0';
      loginStatus.classList.toggle('err', !!message);
    });
  }

  function onLogoutClick() {
    resetToLogin('');
  }

  function setUiLocale(loc) {
    var next = loc === 'en' ? 'en' : 'es';
    try {
      localStorage.setItem('aviators_locale', next);
    } catch (eLoc2) {}
    A.loadClientI18nPack(next, function () {
      refreshUiAfterLocaleChange();
    });
  }

  // --- Event listeners ---

  loginBtn.addEventListener('click', function () {
    A.setBusy(true, i18n('busy_connecting'));
    google.script.run
      .withSuccessHandler(function (bootstrap) {
        A.setBusy(false, '\u00a0');
        showApp(bootstrap);
      })
      .withFailureHandler(function (e) {
        A.setLoginError(A.serverErrorMessage(e, 'err_login_session'));
      })
      .getBootstrap();
  });

  backLogin.addEventListener('click', onLogoutClick);

  if (navBtnHome) {
    navBtnHome.addEventListener('click', function () { setAppPage('home'); });
  }
  if (navPageOnboarding) {
    navPageOnboarding.addEventListener('click', function () { setAppPage('onboarding'); });
  }
  if (navPageProposalBuilding) {
    navPageProposalBuilding.addEventListener('click', function () { setAppPage('proposal-building'); });
  }
  if (chatModeGeneral) {
    chatModeGeneral.addEventListener('click', function () { setAppPage('home'); });
  }
  if (chatModeOnboarding) {
    chatModeOnboarding.addEventListener('click', function () { setAppPage('onboarding'); });
  }
  if (chatModeProposalBuilding) {
    chatModeProposalBuilding.addEventListener('click', function () { setAppPage('proposal-building'); });
  }
  if (navPageContents) {
    navPageContents.addEventListener('click', function () { setAppPage('contents'); });
  }
  if (navPageTags) {
    navPageTags.addEventListener('click', function () {
      if (A.tags && typeof A.tags.backToCloud === 'function') A.tags.backToCloud();
      setAppPage('tags');
    });
  }
  if (navPageClients) {
    navPageClients.addEventListener('click', function () { setAppPage('clients'); });
  }
  if (navPageMetrics) {
    navPageMetrics.addEventListener('click', function () { setAppPage('metrics'); });
  }
  if (navPageKnowledgeGraph) {
    navPageKnowledgeGraph.addEventListener('click', function () {
      setAppPage('knowledge-graph');
    });
  }
  if (navPageSettings) {
    navPageSettings.addEventListener('click', function () { setAppPage('settings'); });
  }
  if (navPageRequestAccess) {
    navPageRequestAccess.addEventListener('click', function () { setAppPage('request-access'); });
  }
  if (navPageFaq) {
    navPageFaq.addEventListener('click', function () { setAppPage('faq'); });
  }

  document.addEventListener('click', function (e) {
    var link = e.target.closest('[data-nav-page]');
    if (!link) return;
    e.preventDefault();
    setAppPage(link.getAttribute('data-nav-page'));
  });

  var localeBtnEsEl = document.getElementById('locale-btn-es');
  var localeBtnEnEl = document.getElementById('locale-btn-en');
  if (localeBtnEsEl) {
    localeBtnEsEl.addEventListener('click', function () { setUiLocale('es'); });
  }
  if (localeBtnEnEl) {
    localeBtnEnEl.addEventListener('click', function () { setUiLocale('en'); });
  }

  var loginLocaleEs = document.getElementById('login-locale-es');
  var loginLocaleEn = document.getElementById('login-locale-en');
  function highlightLoginLocale(loc) {
    if (loginLocaleEs) {
      loginLocaleEs.classList.toggle('ring-2', loc === 'es');
      loginLocaleEs.classList.toggle('ring-sky-500', loc === 'es');
      loginLocaleEs.classList.toggle('bg-sky-50', loc === 'es');
      loginLocaleEs.classList.toggle('dark:bg-sky-900/40', loc === 'es');
    }
    if (loginLocaleEn) {
      loginLocaleEn.classList.toggle('ring-2', loc === 'en');
      loginLocaleEn.classList.toggle('ring-sky-500', loc === 'en');
      loginLocaleEn.classList.toggle('bg-sky-50', loc === 'en');
      loginLocaleEn.classList.toggle('dark:bg-sky-900/40', loc === 'en');
    }
  }
  function setLoginLocale(loc) {
    setUiLocale(loc);
    highlightLoginLocale(loc);
  }
  if (loginLocaleEs) {
    loginLocaleEs.addEventListener('click', function () { setLoginLocale('es'); });
  }
  if (loginLocaleEn) {
    loginLocaleEn.addEventListener('click', function () { setLoginLocale('en'); });
  }
  (function initLoginLocale() {
    var saved = 'es';
    try { var s = localStorage.getItem('aviators_locale'); if (s === 'en') saved = 'en'; } catch (e) {}
    highlightLoginLocale(saved);
  })();

  // --- Dark mode ---

  var themeToggleBtn = document.getElementById('theme-toggle-btn');
  var themeToggleIcon = document.getElementById('theme-toggle-icon');
  var themeToggleLabel = document.getElementById('theme-toggle-label');
  var prefersDarkMedia = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function getSavedTheme() {
    try {
      var savedTheme = localStorage.getItem('aviators_theme');
      if (savedTheme === 'dark' || savedTheme === 'light') return savedTheme;
    } catch (e) {}
    return null;
  }

  function resolveTheme() {
    var savedTheme = getSavedTheme();
    if (savedTheme) return savedTheme;
    return prefersDarkMedia && prefersDarkMedia.matches ? 'dark' : 'light';
  }

  function applyTheme(theme, options) {
    var opts = options || {};
    var dark = theme === 'dark';
    document.documentElement.classList.toggle('dark', dark);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    if (themeToggleIcon) {
      themeToggleIcon.className = dark
        ? 'fa-solid fa-sun shrink-0 text-amber-400'
        : 'fa-solid fa-moon shrink-0 text-sky-600';
    }
    if (themeToggleLabel) {
      themeToggleLabel.setAttribute('data-i18n', dark ? 'theme_light' : 'theme_dark');
      themeToggleLabel.textContent = i18n(dark ? 'theme_light' : 'theme_dark');
    }
    if (themeToggleBtn) {
      themeToggleBtn.setAttribute('aria-pressed', dark ? 'true' : 'false');
      themeToggleBtn.setAttribute('title', i18n(dark ? 'theme_light' : 'theme_dark'));
      themeToggleBtn.setAttribute('aria-label', i18n('theme_toggle_aria'));
    }
    if (opts.persist) {
      try { localStorage.setItem('aviators_theme', theme); } catch (e) {}
    }
    if (A.metrics && typeof A.metrics.onThemeChange === 'function') {
      A.metrics.onThemeChange();
    }
  }

  (function initTheme() {
    applyTheme(resolveTheme());
    if (prefersDarkMedia) {
      var onPrefersChange = function (evt) {
        if (!getSavedTheme()) {
          applyTheme(evt.matches ? 'dark' : 'light');
        }
      };
      if (prefersDarkMedia.addEventListener) {
        prefersDarkMedia.addEventListener('change', onPrefersChange);
      } else if (prefersDarkMedia.addListener) {
        prefersDarkMedia.addListener(onPrefersChange);
      }
    }
  })();

  if (themeToggleBtn) {
    themeToggleBtn.addEventListener('click', function () {
      var isDark = document.documentElement.classList.contains('dark');
      applyTheme(isDark ? 'light' : 'dark', { persist: true });
    });
  }

  if (mobileDrawerOpenBtn) {
    mobileDrawerOpenBtn.addEventListener('click', function () {
      toggleMobileDrawer();
    });
  }
  if (mobileDrawerCloseBtn) {
    mobileDrawerCloseBtn.addEventListener('click', function () {
      closeMobileDrawer({ restoreFocus: true });
    });
  }
  if (appDrawerBackdrop) {
    appDrawerBackdrop.addEventListener('click', function () {
      closeMobileDrawer({ restoreFocus: true });
    });
  }
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (!appShellView || !appShellView.classList.contains('drawer-open')) return;
    closeMobileDrawer({ restoreFocus: true });
  });
  if (mobileDrawerMql) {
    if (mobileDrawerMql.addEventListener) {
      mobileDrawerMql.addEventListener('change', syncMobileDrawerViewport);
    } else if (mobileDrawerMql.addListener) {
      mobileDrawerMql.addListener(syncMobileDrawerViewport);
    }
  }
  window.addEventListener('resize', syncMobileDrawerViewport);
  window.addEventListener('orientationchange', syncMobileDrawerViewport);

  // --- Bootstrap ---

  function runSessionBootstrap_() {
    loginBtn.disabled = true;
    loginStatus.textContent = '\u00a0';
    if (A.showStartupLoader) {
      A.showStartupLoader(i18n('app_startup_session'));
    }
    google.script.run
      .withSuccessHandler(function (bootstrap) {
        if (A.hideStartupLoader) A.hideStartupLoader();
        loginBtn.disabled = false;
        loginStatus.textContent = '\u00a0';
        var s = bootstrap.session || {};
        if (s.email) {
          showApp(bootstrap);
        }
      })
      .withFailureHandler(function () {
        if (A.hideStartupLoader) A.hideStartupLoader();
        loginBtn.disabled = false;
        loginStatus.textContent = '\u00a0';
      })
      .getBootstrap();
  }

  var wantLocale = 'es';
  try {
    var savedLocale = localStorage.getItem('aviators_locale');
    if (savedLocale === 'en') wantLocale = 'en';
  } catch (eLocaleBoot) {}

  loginBtn.disabled = true;
  loginStatus.textContent = '\u00a0';
  A.whenClientI18nReady(function () {
    if (!A.i18nPackLooksValid(S.get('cachedI18n'))) {
      if (A.hideStartupLoader) A.hideStartupLoader();
      loginBtn.disabled = false;
      loginStatus.textContent =
        wantLocale === 'en'
          ? 'Could not load labels. Please reload the page.'
          : 'No se pudieron cargar los textos. Recargá la página.';
      loginStatus.classList.add('err');
      return;
    }
    A.applyClientI18n(S.get('cachedI18n'));
    runSessionBootstrap_();
  }, wantLocale);
})(window.Aviators);
</script>
