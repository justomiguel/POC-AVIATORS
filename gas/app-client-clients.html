<script>
(function (A) {
  var S = A.state;
  var i18n = A.i18n;
  var i18nFmt = A.i18nFmt;

  var clientsNewBtn = document.getElementById('clients-new-btn');
  var clientsScreenList = document.getElementById('clients-screen-list');
  var clientsScreenEditor = document.getElementById('clients-screen-editor');
  var clientsListLoader = document.getElementById('clients-list-loader');
  var clientsListLoaderMsg = document.getElementById('clients-list-loader-msg');
  var clientsTableBody = document.getElementById('clients-table-body');
  var clientsListStatus = document.getElementById('clients-list-status');
  var clientsEditorTitle = document.getElementById('clients-editor-title');
  var clientsEditorSubtitle = document.getElementById('clients-editor-subtitle');
  var clientsBackBtn = document.getElementById('clients-back-btn');
  var clientsId = document.getElementById('clients-id');
  var clientsName = document.getElementById('clients-name');
  var clientsIndustry = document.getElementById('clients-industry');
  var clientsSubIndustry = document.getElementById('clients-sub-industry');
  var clientsCountry = document.getElementById('clients-country');
  var clientsFilterQ = document.getElementById('clients-filter-q');
  var clientsFilterIndustry = document.getElementById('clients-filter-industry');
  var clientsFilterSubIndustry = document.getElementById('clients-filter-sub-industry');
  var clientsFilterClearBtn = document.getElementById('clients-filter-clear-btn');
  var clientsListEmpty = document.getElementById('clients-list-empty');
  var clientsListEmptyMsg = document.getElementById('clients-list-empty-msg');
  var clientsTableWrap = document.getElementById('clients-table-wrap');
  var clientsPageInfo = document.getElementById('clients-page-info');
  var clientsPrevBtn = document.getElementById('clients-prev-btn');
  var clientsNextBtn = document.getElementById('clients-next-btn');
  var clientsPagination = document.getElementById('clients-pagination');
  var clientsPageSizeSelect = document.getElementById('clients-page-size');
  var clientsEditBtn = document.getElementById('clients-edit-btn');
  var clientsContactName = document.getElementById('clients-contact-name');
  var clientsContactEmail = document.getElementById('clients-contact-email');
  var clientsNotes = document.getElementById('clients-notes');
  var clientsLogoUrl = document.getElementById('clients-logo-url');
  var clientsLogoFile = document.getElementById('clients-logo-file');
  var clientsLogoPickBtn = document.getElementById('clients-logo-pick-btn');
  var clientsLogoRemoveBtn = document.getElementById('clients-logo-remove-btn');
  var clientsLogoPreview = document.getElementById('clients-logo-preview');
  var clientsLogoPreviewWrap = document.getElementById('clients-logo-preview-wrap');
  var clientsLogoEmpty = document.getElementById('clients-logo-empty');
  var clientsSaveBtn = document.getElementById('clients-save-btn');
  var clientsDeleteBtn = document.getElementById('clients-delete-btn');
  var clientsCancelBtn = document.getElementById('clients-cancel-btn');
  var clientsEditorStatus = document.getElementById('clients-editor-status');
  var clientsEditorReadonlyBanner = document.getElementById('clients-editor-readonly-banner');
  var clientsLogoActions = document.getElementById('clients-logo-actions');
  var clientsLogoLead = document.querySelector('#clients-logo-heading + p');

  function clientsCanViewDetail_() {
    return !!S.get('canViewClients');
  }

  function clientsTableColSpan_() {
    if (S.get('canWriteContents')) return 8;
    if (clientsCanViewDetail_()) return 7;
    return 6;
  }

  function clientsGetListFilters_() {
    return {
      q: clientsFilterQ ? String(clientsFilterQ.value || '').trim() : '',
      industry: clientsFilterIndustry ? String(clientsFilterIndustry.value || '').trim() : '',
      sub_industry: clientsFilterSubIndustry
        ? String(clientsFilterSubIndustry.value || '').trim()
        : '',
    };
  }

  function clientsHasActiveFilters_() {
    var f = clientsGetListFilters_();
    return !!(f.q || f.industry || f.sub_industry);
  }

  function clientsListFilterFingerprint_() {
    var f = clientsGetListFilters_();
    return [
      f.q,
      f.industry,
      f.sub_industry,
      String(S.get('clientsListSkip') || 0),
      String(clientsGetPageSize_()),
    ].join('\u0001');
  }

  function clientsRebuildFilterSelect_(selectEl, values, allI18nKey) {
    if (!selectEl) return;
    var prev = String(selectEl.value || '').trim();
    var allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = i18n(allI18nKey);
    selectEl.innerHTML = '';
    selectEl.appendChild(allOpt);
    var list = values || [];
    var i;
    for (i = 0; i < list.length; i++) {
      var val = String(list[i] || '').trim();
      if (!val) continue;
      var opt = document.createElement('option');
      opt.value = val;
      opt.textContent = val;
      selectEl.appendChild(opt);
    }
    var stillValid = false;
    for (i = 0; i < selectEl.options.length; i++) {
      if (selectEl.options[i].value === prev) {
        stillValid = true;
        break;
      }
    }
    selectEl.value = stillValid ? prev : '';
  }

  function clientsRefreshSubIndustryFilterOptions_() {
    var res = S.get('clientsFilterOptions') || {};
    var industry = clientsFilterIndustry ? String(clientsFilterIndustry.value || '').trim() : '';
    var subs = res.sub_industries || [];
    var byInd = res.sub_industries_by_industry || {};
    if (industry && byInd[industry] && byInd[industry].length) {
      subs = byInd[industry];
    }
    clientsRebuildFilterSelect_(
      clientsFilterSubIndustry,
      subs,
      'clients_filter_sub_industry_all',
    );
  }

  function clientsApplyFilterOptions_(res) {
    S.set('clientsFilterOptions', res || {});
    clientsRebuildFilterSelect_(
      clientsFilterIndustry,
      (res && res.industries) || [],
      'clients_filter_industry_all',
    );
    clientsRebuildFilterSelect_(
      clientsIndustry,
      (res && res.industries) || [],
      'clients_industry_placeholder',
    );
    clientsRefreshSubIndustryFilterOptions_();
  }

  function clientsInvalidateFilterOptionsCache_() {
    if (A.cache && A.cache.invalidate) A.cache.invalidate('clientsFilterOptions');
  }

  function clientsLoadFilterOptions(opts) {
    var o = opts || {};
    if (!o.force) {
      var cached = A.cache.get('clientsFilterOptions');
      if (cached) {
        clientsApplyFilterOptions_(cached);
        return;
      }
    }
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) return;
        A.cache.set('clientsFilterOptions', res, CLIENTS_CACHE_TTL);
        clientsApplyFilterOptions_(res);
      })
      .withFailureHandler(function () {})
      .clientsListFilterOptions();
  }

  function clientsOnIndustryFilterChange_() {
    clientsRefreshSubIndustryFilterOptions_();
    clientsInvalidateListCache_();
    clientsLoadList({ resetSkip: true, skipCache: true });
  }

  function clientsRefreshDataAfterMutation_() {
    clientsInvalidateListCache_();
    clientsInvalidateFilterOptionsCache_();
    clientsLoadFilterOptions({ force: true });
    clientsLoadList({ resetSkip: true, skipCache: true });
  }

  function clientsSetEditorTitles_(mode, item) {
    var isView = mode === 'view';
    var isNew = mode === 'new';
    if (clientsEditorTitle) {
      if (isView) {
        clientsEditorTitle.textContent = i18n('clients_editor_title_view');
      } else if (isNew) {
        clientsEditorTitle.textContent = i18n('clients_btn_new');
      } else {
        clientsEditorTitle.textContent = (item && item.client_name) || '';
      }
    }
    if (clientsEditorSubtitle) {
      if (isView) {
        clientsEditorSubtitle.textContent = i18n('clients_editor_subtitle_view');
      } else if (isNew) {
        clientsEditorSubtitle.textContent = '\u00a0';
      } else {
        clientsEditorSubtitle.textContent = i18n('clients_btn_back_list');
      }
    }
  }

  function clientsUpdateEditBtn_() {
    if (!clientsEditBtn) return;
    var hasId = !!String(S.get('clientsSelectedId') || '').trim();
    var ro = !!S.get('clientsEditorReadonly');
    var show = !!S.get('canWriteContents') && hasId && ro;
    clientsEditBtn.classList.toggle('hidden', !show);
  }

  function clientsSyncFichaReadonlyUi_() {
    var ro = !!S.get('clientsEditorReadonly');
    var hero = document.getElementById('clients-ficha-hero');
    if (hero) hero.classList.toggle('hidden', !ro);
    if (!ro) return;

    var name = clientsName ? String(clientsName.value || '').trim() : '';
    var display = document.getElementById('clients-ficha-display-name');
    if (display) display.textContent = name || i18n('label_em_dash');

    var logoWrap = document.getElementById('clients-ficha-logo-wrap');
    var logoImg = document.getElementById('clients-ficha-logo');
    var logoUrl = clientsLogoUrl ? String(clientsLogoUrl.value || '').trim() : '';
    if (logoWrap && logoImg) {
      logoWrap.classList.toggle('hidden', !logoUrl);
      if (logoUrl) {
        logoImg.src = logoUrl;
        logoImg.alt = name;
      }
    }

    var metaDl = document.getElementById('clients-ficha-meta');
    if (metaDl) {
      metaDl.innerHTML = '';
      var fr = A.fichaReadonly;
      var industryVal = '';
      if (clientsIndustry && clientsIndustry.selectedIndex >= 0) {
        industryVal = String(
          clientsIndustry.options[clientsIndustry.selectedIndex].textContent || '',
        ).trim();
      }
      if (fr) {
        fr.appendMeta(metaDl, i18n('clients_lbl_industry'), industryVal, 'fa-industry');
        fr.appendMeta(
          metaDl,
          i18n('clients_lbl_sub_industry'),
          clientsSubIndustry ? clientsSubIndustry.value : '',
          'fa-layer-group',
        );
        fr.appendMeta(metaDl, i18n('clients_lbl_country'), clientsCountry ? clientsCountry.value : '', 'fa-globe');
        fr.appendMeta(
          metaDl,
          i18n('clients_lbl_contact_name'),
          clientsContactName ? clientsContactName.value : '',
          'fa-user',
        );
        fr.appendMeta(
          metaDl,
          i18n('clients_lbl_contact_email'),
          clientsContactEmail ? clientsContactEmail.value : '',
          'fa-envelope',
        );
      }
    }

    var body = document.getElementById('clients-ficha-body');
    if (A.fichaReadonly && body) {
      A.fichaReadonly.hideEmptyFields(body);
      A.fichaReadonly.syncTextareas(body);
    }
  }

  function clientsSetEditorReadonly(on) {
    var ro = !!on;
    var canWrite = !!S.get('canWriteContents');
    S.set('clientsEditorReadonly', ro);
    if (clientsScreenEditor) {
      clientsScreenEditor.classList.toggle('clients-editor-readonly', ro);
    }
    if (clientsEditorReadonlyBanner) {
      clientsEditorReadonlyBanner.classList.toggle('hidden', !ro || canWrite);
    }
    if (clientsLogoActions) clientsLogoActions.classList.toggle('hidden', ro);
    if (clientsLogoLead) clientsLogoLead.classList.toggle('hidden', ro);
    var writeIds = ['clients-save-btn', 'clients-delete-btn', 'clients-cancel-btn'];
    for (var wi = 0; wi < writeIds.length; wi++) {
      var el = document.getElementById(writeIds[wi]);
      if (el) el.classList.toggle('hidden', ro);
    }
    var fields = document.querySelectorAll(
      '#clients-screen-editor input:not([type="hidden"]), #clients-screen-editor select, #clients-screen-editor textarea',
    );
    for (var fi = 0; fi < fields.length; fi++) {
      if (fields[fi].id === 'clients-logo-file') continue;
      fields[fi].disabled = ro;
    }
    clientsSyncFichaReadonlyUi_();
    clientsUpdateEditBtn_();
  }

  function clientsApplyReadOnlyView_() {
    var item = S.get('clientsCurrentItem') || null;
    clientsSetEditorTitles_('view', item);
    clientsSetEditorReadonly(true);
    if (clientsDeleteBtn) clientsDeleteBtn.classList.add('hidden');
    window.requestAnimationFrame(function () {
      clientsSyncFichaReadonlyUi_();
    });
  }

  function clientsApplyEditView_() {
    if (!S.get('canWriteContents')) {
      clientsApplyReadOnlyView_();
      return;
    }
    var item = S.get('clientsCurrentItem') || null;
    clientsSetEditorTitles_('edit', item);
    clientsSetEditorReadonly(false);
    var hero = document.getElementById('clients-ficha-hero');
    if (hero) hero.classList.add('hidden');
    if (clientsDeleteBtn && clientsId && clientsId.value) {
      clientsDeleteBtn.classList.remove('hidden');
    }
    clientsUpdateEditBtn_();
  }

  function clientsSetScreen(mode) {
    var isList = mode === 'list';
    if (clientsScreenList) clientsScreenList.classList.toggle('hidden', !isList);
    if (clientsScreenEditor) clientsScreenEditor.classList.toggle('hidden', isList);
  }

  function clientsSetListBusy(on, msg) {
    if (clientsListLoader) clientsListLoader.classList.toggle('hidden', !on);
    if (clientsListLoaderMsg) clientsListLoaderMsg.textContent = on ? msg || '' : '';
  }

  function clientsSetListStatus(msg, isErr) {
    if (!clientsListStatus) return;
    clientsListStatus.textContent = msg || '\u00a0';
    clientsListStatus.classList.toggle('err', !!isErr);
  }

  function clientsSetEditorStatus(msg, isErr) {
    if (!clientsEditorStatus) return;
    clientsEditorStatus.textContent = msg || '\u00a0';
    clientsEditorStatus.classList.toggle('err', !!isErr);
  }

  function clientsReportRpcError(err, fallbackKey, setStatusFn) {
    if (A.reportRpcError) {
      A.reportRpcError(err, {
        scope: 'clients',
        fallbackKey: fallbackKey || 'err_generic',
        modal: true,
        toast: true,
        setStatus: setStatusFn,
      });
      return;
    }
    A.hideBlockingModal();
    var msg = (err && err.message) || i18n(fallbackKey || 'err_generic');
    if (typeof setStatusFn === 'function') setStatusFn(msg, true);
  }

  function clientsEnsureIndustryOption(value) {
    if (!clientsIndustry) return;
    var v = String(value || '').trim();
    if (!v) return;
    var opts = clientsIndustry.options || [];
    for (var i = 0; i < opts.length; i++) {
      if (String(opts[i].value || '') === v) return;
    }
    var opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    clientsIndustry.appendChild(opt);
  }

  var CLIENTS_LOGO_MAX_BYTES = 400000;

  function clientsSetLogoPreview(url) {
    var u = String(url || '').trim();
    if (clientsLogoUrl) clientsLogoUrl.value = u;
    var has = !!u;
    if (clientsLogoPreviewWrap) clientsLogoPreviewWrap.classList.toggle('hidden', !has);
    if (clientsLogoEmpty) clientsLogoEmpty.classList.toggle('hidden', has);
    if (clientsLogoRemoveBtn) clientsLogoRemoveBtn.classList.toggle('hidden', !has);
    if (clientsLogoPreview && has) {
      clientsLogoPreview.src = u;
      clientsLogoPreview.alt = (clientsName && clientsName.value) || '';
    }
    if (clientsLogoFile) clientsLogoFile.value = '';
  }

  function clientsResetForm() {
    S.set('clientsSelectedId', null);
    S.set('clientsCurrentItem', null);
    if (clientsId) clientsId.value = '';
    if (clientsName) clientsName.value = '';
    if (clientsIndustry) clientsIndustry.value = '';
    if (clientsSubIndustry) clientsSubIndustry.value = '';
    if (clientsCountry) clientsCountry.value = '';
    if (clientsContactName) clientsContactName.value = '';
    if (clientsContactEmail) clientsContactEmail.value = '';
    if (clientsNotes) clientsNotes.value = '';
    clientsSetLogoPreview('');
    clientsSetEditorReadonly(false);
    if (clientsLogoActions) clientsLogoActions.classList.remove('hidden');
    if (clientsLogoLead) clientsLogoLead.classList.remove('hidden');
    clientsSetEditorStatus('\u00a0', false);
    clientsUpdateEditBtn_();
  }

  function clientsFillForm(item) {
    if (!item) return;
    S.set('clientsCurrentItem', item);
    S.set('clientsSelectedId', item.client_id || null);
    if (clientsId) clientsId.value = item.client_id || '';
    if (clientsName) clientsName.value = item.client_name || '';
    clientsEnsureIndustryOption(item.industry || '');
    if (clientsIndustry) clientsIndustry.value = item.industry || '';
    if (clientsSubIndustry) clientsSubIndustry.value = item.sub_industry || '';
    if (clientsCountry) clientsCountry.value = item.country || '';
    if (clientsContactName) clientsContactName.value = item.main_contact_name || '';
    if (clientsContactEmail) clientsContactEmail.value = item.main_contact_email || '';
    if (clientsNotes) clientsNotes.value = item.notes || '';
    clientsSetLogoPreview(item.logo_url || '');
  }

  function clientsCollectPayload() {
    return {
      client_id: (clientsId && clientsId.value) || '',
      client_name: ((clientsName && clientsName.value) || '').trim(),
      industry: ((clientsIndustry && clientsIndustry.value) || '').trim(),
      sub_industry: ((clientsSubIndustry && clientsSubIndustry.value) || '').trim(),
      country: (clientsCountry && clientsCountry.value) || '',
      main_contact_name: (clientsContactName && clientsContactName.value) || '',
      main_contact_email: (clientsContactEmail && clientsContactEmail.value) || '',
      logo_url: (clientsLogoUrl && clientsLogoUrl.value) || '',
      notes: (clientsNotes && clientsNotes.value) || '',
    };
  }

  function clientsCellText_(txt, muted) {
    var td = document.createElement('td');
    td.className =
      'px-4 py-3 align-middle ' +
      (muted
        ? 'text-slate-600 dark:text-slate-400'
        : 'font-medium text-slate-900 dark:text-slate-100');
    td.textContent = txt || '\u2014';
    return td;
  }

  function clientsUpdatePager_() {
    var skip = S.get('clientsListSkip') || 0;
    var total = S.get('clientsListTotal') || 0;
    var items = S.get('clientsItemsCache') || [];
    var pageLen = items.length;
    if (clientsPageInfo) {
      if (!total) {
        clientsPageInfo.textContent = i18n('metrics_pagination_empty');
      } else {
        clientsPageInfo.textContent = i18nFmt('metrics_pagination_info', {
          from: skip + 1,
          to: skip + pageLen,
          total: total,
        });
      }
    }
    var busy = !!S.get('clientsListLoading');
    if (clientsPrevBtn) clientsPrevBtn.disabled = busy || skip <= 0;
    if (clientsNextBtn) clientsNextBtn.disabled = busy || !S.get('clientsListHasMore');
    if (clientsPagination) {
      clientsPagination.classList.toggle('hidden', !total && !clientsHasActiveFilters_());
    }
  }

  function clientsSetListControlsDisabled_(disabled) {
    var d = !!disabled;
    if (clientsFilterQ) clientsFilterQ.disabled = d;
    if (clientsFilterIndustry) clientsFilterIndustry.disabled = d;
    if (clientsFilterSubIndustry) clientsFilterSubIndustry.disabled = d;
    if (clientsFilterClearBtn) clientsFilterClearBtn.disabled = d;
    if (clientsPageSizeSelect) clientsPageSizeSelect.disabled = d;
    if (clientsNewBtn) clientsNewBtn.disabled = d && !S.get('canWriteContents');
    clientsUpdatePager_();
  }

  function clientsToggleListEmpty_(showEmpty, msgKey) {
    if (clientsListEmpty) clientsListEmpty.classList.toggle('hidden', !showEmpty);
    if (clientsTableWrap) clientsTableWrap.classList.toggle('hidden', showEmpty);
    if (clientsListEmptyMsg && showEmpty) {
      clientsListEmptyMsg.textContent = i18n(msgKey);
    }
  }

  function clientsRenderTable() {
    if (!clientsTableBody) return;
    clientsTableBody.innerHTML = '';
    var canWrite = !!S.get('canWriteContents');
    var canViewDetail = clientsCanViewDetail_();
    var showActions = canWrite || canViewDetail;
    var cache = S.get('clientsItemsCache') || [];

    if (!cache.length) {
      clientsToggleListEmpty_(
        true,
        clientsHasActiveFilters_() ? 'clients_no_results' : 'clients_no_items',
      );
      clientsUpdatePager_();
      return;
    }

    clientsToggleListEmpty_(false, '');
    for (var i = 0; i < cache.length; i++) {
      (function (item) {
        var tr = document.createElement('tr');
        tr.className =
          'transition-colors' +
          (showActions ? ' cursor-pointer hover:bg-sky-50/40 dark:hover:bg-slate-800/50' : '') +
          (i % 2 === 1 ? ' bg-slate-50/40 dark:bg-slate-800/20' : '');
        if (showActions) {
          tr.setAttribute('role', 'button');
          tr.setAttribute('tabindex', '0');
          tr.setAttribute(
            'aria-label',
            i18nFmt('clients_row_open_aria', { name: item.client_name || item.client_id || '' }),
          );
          tr.addEventListener('click', function (ev) {
            if (ev.target.closest('button, a, input, label, summary')) return;
            clientsOpenFromRow(item, { forceReadOnly: true });
          });
          tr.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            ev.preventDefault();
            clientsOpenFromRow(item, { forceReadOnly: true });
          });
        }
        if (canWrite) {
          var cbTd = document.createElement('td');
          cbTd.className = 'w-10 px-3 py-3';
          var cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.className = 'clients-row-cb rounded border-slate-300';
          cb.dataset.id = item.client_id || '';
          cb.addEventListener('change', clientsBatchUpdateBar);
          cbTd.appendChild(cb);
          tr.appendChild(cbTd);
        }
        var tdLogo = document.createElement('td');
        tdLogo.className = 'w-14 px-2 py-3';
        var logoUrl = String(item.logo_url || '').trim();
        if (logoUrl) {
          var img = document.createElement('img');
          img.src = logoUrl;
          img.alt = '';
          img.className =
            'h-10 w-10 rounded-xl border border-slate-200 object-contain bg-white shadow-sm dark:border-slate-600';
          tdLogo.appendChild(img);
        } else {
          tdLogo.innerHTML =
            '<span class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-dashed border-slate-200 bg-slate-50 text-slate-300 dark:border-slate-600 dark:bg-slate-800" aria-hidden="true"><i class="fa-solid fa-building text-sm"></i></span>';
        }
        tr.appendChild(tdLogo);
        tr.appendChild(clientsCellText_(item.client_name || '', false));
        var tdIndustry = document.createElement('td');
        tdIndustry.className = 'px-4 py-3 align-middle';
        var industry = String(item.industry || '').trim();
        if (industry) {
          var badge = document.createElement('span');
          badge.className =
            'inline-flex max-w-full items-center rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-medium text-slate-700 dark:bg-slate-700 dark:text-slate-200';
          badge.textContent = industry;
          tdIndustry.appendChild(badge);
        } else {
          tdIndustry.textContent = '\u2014';
          tdIndustry.className += ' text-slate-400';
        }
        tr.appendChild(tdIndustry);
        var tdSub = document.createElement('td');
        tdSub.className = 'px-4 py-3 align-middle';
        var sub = String(item.sub_industry || '').trim();
        if (sub) {
          var subBadge = document.createElement('span');
          subBadge.className =
            'inline-flex max-w-full items-center rounded-full bg-violet-50 px-2.5 py-0.5 text-xs font-medium text-violet-800 dark:bg-violet-950/50 dark:text-violet-200';
          subBadge.textContent = sub;
          subBadge.title = sub;
          tdSub.appendChild(subBadge);
        } else {
          tdSub.textContent = '\u2014';
          tdSub.className += ' text-slate-400';
        }
        tr.appendChild(tdSub);
        tr.appendChild(clientsCellText_(item.country || '', true));
        var tdContact = document.createElement('td');
        tdContact.className = 'px-4 py-3 align-middle text-slate-600 dark:text-slate-400';
        var contactName = String(item.main_contact_name || '').trim();
        var contactEmail = String(item.main_contact_email || '').trim();
        if (contactName) {
          var nameEl = document.createElement('div');
          nameEl.className = 'font-medium text-slate-800 dark:text-slate-200';
          nameEl.textContent = contactName;
          tdContact.appendChild(nameEl);
        }
        if (contactEmail) {
          var emailEl = document.createElement('div');
          emailEl.className = 'mt-0.5 truncate text-xs text-slate-500 dark:text-slate-400';
          emailEl.textContent = contactEmail;
          tdContact.appendChild(emailEl);
        }
        if (!contactName && !contactEmail) tdContact.textContent = '\u2014';
        tr.appendChild(tdContact);
        if (showActions) {
          var tdActions = document.createElement('td');
          tdActions.className = 'px-4 py-3 text-right align-middle';
          var actionBtn = document.createElement('button');
          actionBtn.type = 'button';
          actionBtn.className = 'btn btn-sm btn-outline inline-flex items-center gap-2';
          if (canWrite) {
            actionBtn.setAttribute('aria-label', i18n('clients_tooltip_edit'));
            actionBtn.innerHTML =
              '<i class="fa-solid fa-pen" aria-hidden="true"></i><span class="sr-only">' +
              i18n('clients_tooltip_edit') +
              '</span>';
            actionBtn.addEventListener('click', function (ev) {
              ev.stopPropagation();
              clientsOpenFromRow(item, { forceEdit: true });
            });
          } else {
            actionBtn.setAttribute('aria-label', i18n('clients_tooltip_view_detail'));
            actionBtn.innerHTML =
              '<i class="fa-solid fa-eye" aria-hidden="true"></i><span class="sr-only">' +
              i18n('clients_tooltip_view_detail') +
              '</span>';
            actionBtn.addEventListener('click', function (ev) {
              ev.stopPropagation();
              clientsOpenFromRow(item, { forceReadOnly: true });
            });
          }
          tdActions.appendChild(actionBtn);
          tr.appendChild(tdActions);
        }
        clientsTableBody.appendChild(tr);
      })(cache[i]);
    }
    clientsUpdatePager_();
  }

  var CLIENTS_PAGE_SIZES = [15, 25, 50];
  var CLIENTS_CACHE_TTL = 60000;

  function clientsGetPageSize_() {
    var n = Number(S.get('clientsPageSize'));
    for (var i = 0; i < CLIENTS_PAGE_SIZES.length; i++) {
      if (CLIENTS_PAGE_SIZES[i] === n) return n;
    }
    return 25;
  }

  function clientsSyncPageSizeSelect_() {
    if (!clientsPageSizeSelect) return;
    clientsPageSizeSelect.value = String(clientsGetPageSize_());
  }
  var clientsFilterDebounceTimer = null;

  function clientsLoadList(opts) {
    var o = opts || {};
    var resetSkip = !!o.resetSkip;
    var skipCache = !!o.skipCache;
    clientsSyncPageSizeSelect_();

    if (resetSkip) S.set('clientsListSkip', 0);
    var skip = S.get('clientsListSkip') || 0;
    var filters = clientsGetListFilters_();
    var fingerprint = clientsListFilterFingerprint_();

    if (!skipCache) {
      var cached = A.cache.get('clientsList');
      if (cached && cached.fingerprint === fingerprint) {
        S.set('clientsItemsCache', cached.items);
        S.set('clientsListTotal', cached.total);
        S.set('clientsListHasMore', cached.hasMore);
        clientsRenderTable();
        clientsSetListStatus('\u00a0', false);
        clientsTryOpenPendingName_();
        return;
      }
    }

    if (S.get('clientsListLoading')) return;
    S.set('clientsListLoading', true);
    clientsSetListControlsDisabled_(true);
    clientsSetListBusy(true, i18n('clients_busy_loading'));
    google.script.run
      .withSuccessHandler(function (res) {
        S.set('clientsListLoading', false);
        clientsSetListBusy(false, '');
        clientsSetListControlsDisabled_(false);
        var items = (res && res.items) || [];
        var total = (res && res.total) || 0;
        var hasMore = !!(res && res.hasMore);
        S.set('clientsItemsCache', items);
        S.set('clientsListTotal', total);
        S.set('clientsListHasMore', hasMore);
        A.cache.set(
          'clientsList',
          {
            fingerprint: fingerprint,
            items: items,
            total: total,
            hasMore: hasMore,
          },
          CLIENTS_CACHE_TTL,
        );
        clientsRenderTable();
        clientsSetListStatus('\u00a0', false);
        clientsTryOpenPendingName_();
      })
      .withFailureHandler(function (e) {
        S.set('clientsListLoading', false);
        clientsSetListBusy(false, '');
        clientsSetListControlsDisabled_(false);
        if (A.reportRpcError) {
          A.reportRpcError(e, {
            scope: 'clientsList',
            hideModal: true,
            toast: true,
            setStatus: clientsSetListStatus,
          });
        } else {
          clientsSetListStatus((e && e.message) || i18n('err_generic'), true);
        }
      })
      .clientsList({
        q: filters.q,
        industry: filters.industry,
        sub_industry: filters.sub_industry,
        skip: skip,
        limit: clientsGetPageSize_(),
      });
  }

  function clientsInvalidateListCache_() {
    if (A.cache && A.cache.invalidate) A.cache.invalidate('clientsList');
  }

  function clientsScheduleFilterReload_() {
    if (clientsFilterDebounceTimer) clearTimeout(clientsFilterDebounceTimer);
    clientsFilterDebounceTimer = setTimeout(function () {
      clientsFilterDebounceTimer = null;
      clientsInvalidateListCache_();
      clientsLoadList({ resetSkip: true, skipCache: true });
    }, 320);
  }

  function clientsClearFilters_() {
    if (clientsFilterQ) clientsFilterQ.value = '';
    if (clientsFilterIndustry) clientsFilterIndustry.value = '';
    if (clientsFilterSubIndustry) clientsFilterSubIndustry.value = '';
    clientsInvalidateListCache_();
    clientsLoadList({ resetSkip: true, skipCache: true });
  }

  function clientsFindItemByName_(name) {
    var target = String(name || '').trim();
    if (!target) return null;
    var normTarget = target
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase();
    var cache = S.get('clientsItemsCache') || [];
    var best = null;
    var bestScore = 0;
    var i;
    for (i = 0; i < cache.length; i++) {
      var item = cache[i];
      var cn = String(item.client_name || item.name || '').trim();
      if (!cn) continue;
      if (cn === target) return item;
      var normCn = cn
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();
      if (normCn === normTarget) return item;
      var score = 0;
      if (normCn.indexOf(normTarget) >= 0 || normTarget.indexOf(normCn) >= 0) {
        score =
          Math.min(normCn.length, normTarget.length) /
          Math.max(normCn.length, normTarget.length);
      }
      if (score > bestScore) {
        bestScore = score;
        best = item;
      }
    }
    return bestScore >= 0.65 ? best : null;
  }

  function clientsOpenFromRow(item, opts) {
    if (!item) return;
    clientsOpenEditor(item, opts || {});
  }

  function clientsOpenEditor(item, opts) {
    var o = opts || {};
    if (!item && !S.get('canWriteContents')) return;
    if (item && !S.get('canWriteContents') && !clientsCanViewDetail_()) {
      if (A.toast) A.toast.error(i18n('err_clients_forbidden') || i18n('err_admin_only'));
      return;
    }
    clientsResetForm();
    if (!item) {
      clientsSetEditorTitles_('new', null);
      if (clientsDeleteBtn) clientsDeleteBtn.classList.add('hidden');
      clientsSetEditorReadonly(false);
      clientsUpdateEditBtn_();
      clientsSetScreen('editor');
      return;
    }
    clientsFillForm(item);
    if (o.forceEdit && S.get('canWriteContents')) {
      clientsApplyEditView_();
    } else {
      clientsApplyReadOnlyView_();
    }
    clientsSetScreen('editor');
  }

  function clientsTryOpenPendingName_() {
    var pending = String(S.get('clientsPendingOpenName') || '').trim();
    if (!pending) return;
    S.set('clientsPendingOpenName', '');
    clientsOpenViewByName(pending);
  }

  function clientsOpenViewByName(name) {
    var n = String(name || '').trim();
    if (!n) return;
    if (!clientsCanViewDetail_()) {
      if (A.toast) A.toast.error(i18n('err_admin_only'));
      return;
    }
    S.set('clientsPendingOpenName', '');
    clientsSetScreen('editor');
    var cached = clientsFindItemByName_(n);
    if (cached) {
      clientsOpenEditor(cached, { forceReadOnly: true });
      return;
    }
    A.showBlockingModal(i18n('clients_busy_opening'));
    clientsSetEditorStatus(i18n('clients_busy_opening'), false);
    google.script.run
      .withSuccessHandler(function (res) {
        A.hideBlockingModal();
        var items = (res && res.items) || [];
        S.set('clientsItemsCache', items);
        var hit = clientsFindItemByName_(n);
        clientsSetEditorStatus('\u00a0', false);
        if (hit) {
          clientsOpenEditor(hit, { forceReadOnly: true });
          return;
        }
        clientsSetScreen('list');
        if (A.toast) A.toast.error(i18n('chat_ref_not_found'));
      })
      .withFailureHandler(function (e) {
        clientsSetScreen('list');
        clientsReportRpcError(e, 'err_generic', clientsSetEditorStatus);
      })
      .clientsList({ q: n, limit: 50 });
  }

  function clientsSave() {
    var payload = clientsCollectPayload();
    if (!payload.client_name) {
      clientsSetEditorStatus(i18n('clients_err_name_required'), true);
      return;
    }
    A.showBlockingModal(i18n('clients_busy_saving'));
    clientsInvalidateListCache_();
    clientsInvalidateFilterOptionsCache_();
    google.script.run
      .withSuccessHandler(function () {
        A.hideBlockingModal();
        clientsSetScreen('list');
        clientsRefreshDataAfterMutation_();
        clientsSetListStatus(i18n('clients_saved'), false);
      })
      .withFailureHandler(function (e) {
        clientsReportRpcError(e, 'err_generic', clientsSetEditorStatus);
      })
      .clientsUpsert(JSON.stringify(payload));
  }

  function clientsDelete() {
    var id = (clientsId && clientsId.value) || '';
    if (!id) return;
    A.confirmDialog({ message: i18n('clients_confirm_delete'), danger: true }).then(function (ok) {
      if (!ok) return;
      A.showBlockingModal(i18n('clients_busy_deleting'));
      clientsInvalidateListCache_();
      clientsInvalidateFilterOptionsCache_();
      google.script.run
        .withSuccessHandler(function () {
          A.hideBlockingModal();
          clientsResetForm();
          clientsSetScreen('list');
          clientsRefreshDataAfterMutation_();
          clientsSetListStatus(i18n('clients_deleted'), false);
        })
        .withFailureHandler(function (e) {
          clientsReportRpcError(e, 'err_client_id_invalid', clientsSetEditorStatus);
        })
        .clientsDelete(id);
    });
  }

  function clientsApplyWriteAccess() {
    var canWrite = !!S.get('canWriteContents');
    var canViewDetail = clientsCanViewDetail_();
    if (clientsNewBtn) clientsNewBtn.classList.toggle('hidden', !canWrite);
    var batchDel = document.getElementById('clients-batch-delete-btn');
    if (batchDel) batchDel.classList.toggle('hidden', !canWrite);
    var selectCol = document.getElementById('clients-th-select');
    if (selectCol) selectCol.classList.toggle('hidden', !canWrite);
    var actionsCol = document.getElementById('clients-th-actions');
    if (actionsCol) actionsCol.classList.toggle('hidden', !(canWrite || canViewDetail));
    if (clientsSelectAll) clientsSelectAll.checked = false;
    var badge = document.getElementById('clients-readonly-badge');
    if (badge) badge.classList.toggle('hidden', canWrite);
    if (clientsLogoPickBtn) clientsLogoPickBtn.disabled = !canWrite;
    if (clientsLogoRemoveBtn) clientsLogoRemoveBtn.disabled = !canWrite;
  }

  function clientsOnLogoFileSelected(file) {
    if (!file) return;
    if (!/^image\/(png|jpeg|webp|gif)$/i.test(file.type || '')) {
      clientsSetEditorStatus(i18n('clients_err_logo_invalid'), true);
      return;
    }
    if (file.size > CLIENTS_LOGO_MAX_BYTES) {
      clientsSetEditorStatus(i18n('clients_err_logo_too_large'), true);
      return;
    }
    var reader = new FileReader();
    reader.onload = function (ev) {
      clientsSetLogoPreview(String(ev.target.result || ''));
      clientsSetEditorStatus('\u00a0', false);
    };
    reader.onerror = function () {
      clientsSetEditorStatus(i18n('err_generic'), true);
    };
    reader.readAsDataURL(file);
  }

  // --- Event listeners ---

  if (clientsLogoPickBtn && clientsLogoFile) {
    clientsLogoPickBtn.addEventListener('click', function () {
      clientsLogoFile.click();
    });
    clientsLogoFile.addEventListener('change', function () {
      var file = clientsLogoFile.files && clientsLogoFile.files[0];
      clientsOnLogoFileSelected(file);
    });
  }
  if (clientsLogoRemoveBtn) {
    clientsLogoRemoveBtn.addEventListener('click', function () {
      clientsSetLogoPreview('');
    });
  }

  if (clientsNewBtn) {
    clientsNewBtn.addEventListener('click', function () { clientsOpenEditor(null); });
  }
  if (clientsBackBtn) {
    clientsBackBtn.addEventListener('click', function () {
      clientsResetForm();
      clientsSetScreen('list');
    });
  }
  if (clientsCancelBtn) {
    clientsCancelBtn.addEventListener('click', function () {
      clientsResetForm();
      clientsSetScreen('list');
    });
  }
  if (clientsSaveBtn) {
    clientsSaveBtn.addEventListener('click', function () { clientsSave(); });
  }
  if (clientsDeleteBtn) {
    clientsDeleteBtn.addEventListener('click', function () { clientsDelete(); });
  }
  if (clientsFilterQ) {
    clientsFilterQ.addEventListener('input', clientsScheduleFilterReload_);
    clientsFilterQ.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        if (clientsFilterDebounceTimer) clearTimeout(clientsFilterDebounceTimer);
        clientsInvalidateListCache_();
        clientsLoadList({ resetSkip: true, skipCache: true });
      }
    });
  }
  if (clientsFilterIndustry) {
    clientsFilterIndustry.addEventListener('change', clientsOnIndustryFilterChange_);
  }
  if (clientsFilterSubIndustry) {
    clientsFilterSubIndustry.addEventListener('change', function () {
      clientsInvalidateListCache_();
      clientsLoadList({ resetSkip: true, skipCache: true });
    });
  }
  if (clientsFilterClearBtn) {
    clientsFilterClearBtn.addEventListener('click', clientsClearFilters_);
  }
  if (clientsEditBtn) {
    clientsEditBtn.addEventListener('click', function () {
      if (!S.get('canWriteContents')) return;
      clientsApplyEditView_();
    });
  }
  if (clientsPageSizeSelect) {
    clientsPageSizeSelect.addEventListener('change', function () {
      var n = Number(clientsPageSizeSelect.value);
      if (CLIENTS_PAGE_SIZES.indexOf(n) < 0) return;
      S.set('clientsPageSize', n);
      clientsInvalidateListCache_();
      clientsLoadList({ resetSkip: true, skipCache: true });
    });
  }
  if (clientsPrevBtn) {
    clientsPrevBtn.addEventListener('click', function () {
      if (S.get('clientsListLoading')) return;
      var skip = S.get('clientsListSkip') || 0;
      var pageSize = clientsGetPageSize_();
      if (skip <= 0) return;
      S.set('clientsListSkip', Math.max(0, skip - pageSize));
      clientsInvalidateListCache_();
      clientsLoadList({ skipCache: true });
    });
  }
  if (clientsNextBtn) {
    clientsNextBtn.addEventListener('click', function () {
      if (S.get('clientsListLoading') || !S.get('clientsListHasMore')) return;
      S.set('clientsListSkip', (S.get('clientsListSkip') || 0) + clientsGetPageSize_());
      clientsInvalidateListCache_();
      clientsLoadList({ skipCache: true });
    });
  }

  clientsSyncPageSizeSelect_();

  // --- Batch ops ---
  var clientsBatchBar = document.getElementById('clients-batch-bar');
  var clientsBatchCount = document.getElementById('clients-batch-count');
  var clientsBatchDeleteBtn = document.getElementById('clients-batch-delete-btn');
  var clientsSelectAll = document.getElementById('clients-select-all');

  function clientsBatchGetSelected() {
    var cbs = clientsTableBody ? clientsTableBody.querySelectorAll('.clients-row-cb:checked') : [];
    var ids = [];
    for (var i = 0; i < cbs.length; i++) ids.push(cbs[i].dataset.id);
    return ids;
  }

  function clientsBatchUpdateBar() {
    var ids = clientsBatchGetSelected();
    if (clientsBatchBar) clientsBatchBar.classList.toggle('hidden', ids.length === 0);
    if (clientsBatchCount) clientsBatchCount.textContent = i18nFmt('batch_selected', { n: ids.length });
  }

  if (clientsSelectAll) {
    clientsSelectAll.addEventListener('change', function () {
      var checked = clientsSelectAll.checked;
      var cbs = clientsTableBody ? clientsTableBody.querySelectorAll('.clients-row-cb') : [];
      for (var i = 0; i < cbs.length; i++) cbs[i].checked = checked;
      clientsBatchUpdateBar();
    });
  }

  if (clientsBatchDeleteBtn) {
    clientsBatchDeleteBtn.addEventListener('click', function () {
      var ids = clientsBatchGetSelected();
      if (!ids.length) return;
      A.confirmDialog({
        message: i18nFmt('batch_delete_confirm', { n: ids.length }),
        danger: true,
      }).then(function (ok) {
        if (!ok) return;
        clientsBatchDeleteBtn.disabled = true;
        var done = 0;
        var total = ids.length;
        A.showBlockingModal(i18nFmt('batch_deleting', { done: 1, total: total }));
        function next() {
          if (done >= total) {
            clientsBatchDeleteBtn.disabled = false;
            A.hideBlockingModal();
            if (clientsSelectAll) clientsSelectAll.checked = false;
            clientsBatchUpdateBar();
            clientsRefreshDataAfterMutation_();
            if (A.toast) A.toast.success(i18nFmt('batch_done', { n: total }));
            return;
          }
          var progMsg = i18nFmt('batch_deleting', { done: done + 1, total: total });
          if (clientsBatchCount) clientsBatchCount.textContent = progMsg;
          A.showBlockingModal(progMsg);
          google.script.run
            .withSuccessHandler(function () { done++; next(); })
            .withFailureHandler(function (e) {
              clientsBatchDeleteBtn.disabled = false;
              clientsReportRpcError(e, 'err_client_id_invalid', clientsSetListStatus);
            })
            .clientsDelete(ids[done]);
        }
        next();
      });
    });
  }

  A.clients = {
    setScreen: clientsSetScreen,
    loadList: clientsLoadList,
    loadFilterOptions: clientsLoadFilterOptions,
    resetForm: clientsResetForm,
    applyWriteAccess: clientsApplyWriteAccess,
    selectById: function (name) {
      var hit = clientsFindItemByName_(name);
      if (hit) clientsOpenFromRow(hit, { forceReadOnly: true });
    },
    openViewByName: clientsOpenViewByName,
    tryOpenPendingName: clientsTryOpenPendingName_,
  };
})(window.Aviators);
</script>
