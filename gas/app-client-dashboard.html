<script>
(function (A) {
  var state = A.state;
  var i18n = A.i18n;
  var i18nFmt = A.i18nFmt;

  var MID_DOT = '\u00b7';
  var TIMES = '\u00d7';

  var _metricsEl = document.getElementById('dashboard-metrics');
  var _cardAgents = document.getElementById('dash-card-agents');
  var _cardContents = document.getElementById('dash-card-contents');
  var _cardClients = document.getElementById('dash-card-clients');
  var _agentsCountEl = document.getElementById('dash-agents-count');
  var _agentsDetailEl = document.getElementById('dash-agents-detail');
  var _contentsCountEl = document.getElementById('dash-contents-count');
  var _contentsDetailEl = document.getElementById('dash-contents-detail');
  var _clientsCountEl = document.getElementById('dash-clients-count');
  var _clientsDetailEl = document.getElementById('dash-clients-detail');

  var _dashOpts = {
    showAgentsCard: false,
    canManageContents: false,
  };

  function setDetailVisible(el, text, titleHint) {
    if (!el) return;
    var t = text != null ? String(text).trim() : '';
    if (!t) {
      el.textContent = '';
      el.removeAttribute('title');
      el.classList.add('hidden');
      return;
    }
    el.textContent = text;
    if (titleHint && String(titleHint).trim()) el.setAttribute('title', titleHint);
    else el.removeAttribute('title');
    el.classList.remove('hidden');
  }

  function dashKindLabel(kind, profileName) {
    var k = String(kind || '').trim();
    if (k === 'orchestrator') return i18n('dash_agent_kind_orchestrator');
    if (k === 'success_cases') return i18n('dash_agent_kind_success_cases');
    if (k === 'proposals') return i18n('dash_agent_kind_proposals');
    if (k === 'clients') return i18n('dash_agent_kind_clients');
    var pn = String(profileName || '').trim();
    if (pn) return i18nFmt('dash_agent_kind_other_named', { name: pn });
    return i18n('dash_agent_kind_other');
  }

  function fmtCountPair(label, n) {
    return label + ' ' + TIMES + ' ' + n;
  }

  function buildAgentsLines(payload) {
    if (!payload || !payload.kinds || !payload.kinds.length)
      return { display: '', full: '', empty: true };
    var bits = [];
    var i;
    for (i = 0; i < payload.kinds.length; i++) {
      var ki = payload.kinds[i];
      bits.push(fmtCountPair(dashKindLabel(ki.kind, ki.profileName), ki.count));
    }
    var line1 = bits.join(' ' + MID_DOT + ' ');
    var strat = payload.strategies || [];
    if (!strat.length) return { display: line1, full: line1, empty: false };
    var sj = [];
    for (i = 0; i < strat.length; i++) {
      sj.push(fmtCountPair(strat[i].name, strat[i].count));
    }
    var lineStrat = i18nFmt('dash_agents_strategies_line', { list: sj.join(', ') });
    return {
      display: line1 + '\n' + lineStrat,
      full: line1 + '\n' + lineStrat,
      empty: false,
    };
  }

  function buildContentsLine(payload) {
    if (!payload || !payload.byType) return { display: '', full: '', empty: true };
    var bt = payload.byType;
    var ordered = [
      ['proposal', i18n('contents_type_proposal'), bt.proposal],
      ['success_case', i18n('contents_type_success_case'), bt.success_case],
      ['client', i18n('contents_type_client'), bt.client],
    ];
    var parts = [];
    var i;
    for (i = 0; i < ordered.length; i++) {
      var n = Number(ordered[i][2]) || 0;
      if (n > 0) parts.push(fmtCountPair(ordered[i][1], n));
    }
    if (!parts.length) return { display: '', full: '', empty: true };
    var line = parts.join(' ' + MID_DOT + ' ');
    return { display: line, full: line, empty: false };
  }

  function buildClientsLine(payload) {
    if (!payload || !payload.industries || !payload.industries.length)
      return { display: '', full: '', empty: true };
    var parts = [];
    var i;
    for (i = 0; i < payload.industries.length; i++) {
      var row = payload.industries[i];
      var label = String(row.industry || '').trim()
        ? String(row.industry)
        : i18n('dash_industry_unknown');
      parts.push(fmtCountPair(label, row.count));
    }
    var line = parts.join(' ' + MID_DOT + ' ');
    return { display: line, full: line, empty: false };
  }

  function updateAgentsCount() {
    var cache = state.get('adminAgentsCache');
    _agentsCountEl.textContent = cache ? cache.length : '—';
  }

  function updateContentsCount() {
    var total = state.get('contentsListTotal');
    var cache = state.get('contentsItemsCache');
    _contentsCountEl.textContent = total || (cache ? cache.length : '—');
  }

  function updateClientsCount() {
    var total = state.get('clientsListTotal');
    var cache = state.get('clientsItemsCache');
    _clientsCountEl.textContent = total || (cache ? cache.length : '—');
  }

  function applyDashboardMetrics(res) {
    var showAgents = _dashOpts.showAgentsCard;
    var can = _dashOpts.canManageContents;

    if (showAgents && res && res.agents && _agentsCountEl) {
      _agentsCountEl.textContent = String(res.agents.total);
    }
    if (can && res && res.contents && _contentsCountEl) {
      _contentsCountEl.textContent = String(res.contents.total);
    }
    if (can && res && res.clients && _clientsCountEl) {
      _clientsCountEl.textContent = String(res.clients.total);
    }

    if (showAgents && res && res.agents) {
      var al = buildAgentsLines(res.agents);
      if (al.empty) setDetailVisible(_agentsDetailEl, i18n('dash_detail_empty'), '');
      else setDetailVisible(_agentsDetailEl, al.display, al.full);
    } else {
      setDetailVisible(_agentsDetailEl, '', '');
    }

    if (can && res && res.contents) {
      var cl = buildContentsLine(res.contents);
      if (cl.empty) setDetailVisible(_contentsDetailEl, i18n('dash_detail_empty'), '');
      else setDetailVisible(_contentsDetailEl, cl.display, cl.full);
    } else {
      setDetailVisible(_contentsDetailEl, '', '');
    }

    if (can && res && res.clients) {
      var zl = buildClientsLine(res.clients);
      if (zl.empty) setDetailVisible(_clientsDetailEl, i18n('dash_detail_empty'), '');
      else setDetailVisible(_clientsDetailEl, zl.display, zl.full);
    } else {
      setDetailVisible(_clientsDetailEl, '', '');
    }
  }

  function clearDashboardDetails() {
    setDetailVisible(_agentsDetailEl, '', '');
    setDetailVisible(_contentsDetailEl, '', '');
    setDetailVisible(_clientsDetailEl, '', '');
  }

  function loadDashboardMetrics() {
    if (!_metricsEl) return;
    if (!_dashOpts.showAgentsCard && !_dashOpts.canManageContents) return;
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.ok) applyDashboardMetrics(res);
        else clearDashboardDetails();
      })
      .withFailureHandler(function () {
        clearDashboardDetails();
      })
      .dashboardHomeMetrics();
  }

  function renderDashboard(bootstrap, opts) {
    if (!_metricsEl) return;
    var showAgentsCard = !!(opts && opts.showAgentsCard);
    var canManage = !!(opts && opts.canManageContents);
    _dashOpts = { showAgentsCard: showAgentsCard, canManageContents: canManage };

    if (_cardAgents) _cardAgents.classList.toggle('hidden', !showAgentsCard);
    if (_cardContents) _cardContents.classList.toggle('hidden', !canManage);
    if (_cardClients) _cardClients.classList.toggle('hidden', !canManage);

    if (showAgentsCard) updateAgentsCount();
    if (canManage) {
      updateContentsCount();
      updateClientsCount();
    }
    loadDashboardMetrics();
  }

  state.on('adminAgentsCache', updateAgentsCount);
  state.on('contentsListTotal', updateContentsCount);
  state.on('contentsItemsCache', updateContentsCount);
  state.on('clientsListTotal', updateClientsCount);
  state.on('clientsItemsCache', updateClientsCount);

  A.renderDashboard = renderDashboard;
  A.dashboard = { loadMetrics: loadDashboardMetrics };
})(window.Aviators);
</script>
