<script>
(function (A) {
  var S = A.state;
  var i18n = A.i18n;
  var i18nFmt = A.i18nFmt;

  var askBtn = document.getElementById('ask-btn');
  var questionEl = document.getElementById('question');
  var askStatus = document.getElementById('ask-status');
  var consultHeadingEl = document.getElementById('consult-heading');
  var driveFilesHeadingEl = document.getElementById('drive-files-heading');
  var geminiDocsBlock = document.getElementById('gemini-docs-block');
  var askDriveRow = document.getElementById('ask-drive-row');
  var globantAgentRow = document.getElementById('globant-agent-row');
  var askAgentBtn = document.getElementById('ask-agent-btn');
  var llmHintBox = document.getElementById('llm-hint-box');

  var CHAT_THINKING_ID = 'chat-msg-thinking';
  var MAX_HISTORY = 10;

  function pushHistory(role, content) {
    var hist = S.get('chatHistory') || [];
    hist.push({ role: role, content: content, ts: Date.now() });
    while (hist.length > MAX_HISTORY * 2) hist.shift();
    S.set('chatHistory', hist);
  }

  function getHistoryJson() {
    var hist = S.get('chatHistory') || [];
    return JSON.stringify(hist);
  }

  function clearHistory() {
    S.set('chatHistory', []);
  }

  function updateHomeChatBanner(cfg) {
    if (!llmHintBox) return;
    if (cfg && (cfg.mode === 'globant' || cfg.mode === 'apiKey')) {
      llmHintBox.classList.add('hidden');
      llmHintBox.textContent = '';
      llmHintBox.classList.remove('home-chat-banner', 'err');
      return;
    }
    llmHintBox.classList.remove('hidden');
    llmHintBox.classList.add('home-chat-banner', 'err');
    llmHintBox.textContent = i18n('home_chat_banner_setup');
  }

  function homeChatScrollToBottom() {
    var t = document.getElementById('chat-thread');
    if (!t) return;
    try { t.scrollTop = t.scrollHeight; } catch (eSc) {}
  }

  function homeChatRemoveThinking() {
    var el = document.getElementById(CHAT_THINKING_ID);
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }

  function homeChatSetThinking(on, msg) {
    var thread = document.getElementById('chat-thread');
    if (!thread) return;
    homeChatRemoveThinking();
    if (!on) return;
    var emptyEl = document.getElementById('chat-empty');
    if (emptyEl) emptyEl.classList.add('hidden');
    var wrap = document.createElement('div');
    wrap.id = CHAT_THINKING_ID;
    wrap.className = 'chat-msg-agent';
    wrap.setAttribute('aria-live', 'polite');
    var inner = document.createElement('div');
    inner.className = 'chat-bubble-agent chat-thinking';
    var icon = document.createElement('i');
    icon.className = 'fa-solid fa-sparkles chat-thinking-icon';
    icon.setAttribute('aria-hidden', 'true');
    var text = document.createElement('span');
    text.className = 'chat-thinking-text';
    text.textContent = msg || i18n('chat_thinking');
    var dots = document.createElement('span');
    dots.className = 'chat-thinking-dots';
    dots.setAttribute('aria-hidden', 'true');
    var d1 = document.createElement('span');
    d1.className = 'dot dot-1';
    var d2 = document.createElement('span');
    d2.className = 'dot dot-2';
    var d3 = document.createElement('span');
    d3.className = 'dot dot-3';
    dots.appendChild(d1);
    dots.appendChild(d2);
    dots.appendChild(d3);
    inner.appendChild(icon);
    inner.appendChild(text);
    inner.appendChild(dots);
    wrap.appendChild(inner);
    thread.appendChild(wrap);
    homeChatScrollToBottom();
  }

  function homeChatUpdateThinking(msg) {
    var el = document.getElementById(CHAT_THINKING_ID);
    if (!el) return;
    var txt = el.querySelector('.chat-thinking-text');
    if (txt) txt.textContent = msg;
  }

  function homeChatAgentHueFromKey_(key) {
    var str = String(key || '').trim();
    if (!str) return null;
    var h = 0;
    for (var i = 0; i < str.length; i++) {
      h = ((h << 5) - h) + str.charCodeAt(i);
      h |= 0;
    }
    return Math.abs(h) % 360;
  }

  function homeChatAppendUser(text) {
    var thread = document.getElementById('chat-thread');
    if (!thread) return;
    var emptyEl = document.getElementById('chat-empty');
    if (emptyEl) emptyEl.classList.add('hidden');
    var wrap = document.createElement('div');
    wrap.className = 'chat-msg-user';
    var sr = document.createElement('span');
    sr.className = 'sr-only';
    sr.textContent = i18n('chat_sr_you');
    var bub = document.createElement('div');
    bub.className = 'chat-bubble-user';
    bub.textContent = text;
    wrap.appendChild(sr);
    wrap.appendChild(bub);
    thread.appendChild(wrap);
    homeChatScrollToBottom();
  }

  function homeChatAppendAgent(body, metaLine, references, agentKey, eventId, agentId) {
    var thread = document.getElementById('chat-thread');
    if (!thread) return;
    var emptyEl = document.getElementById('chat-empty');
    if (emptyEl) emptyEl.classList.add('hidden');
    var wrap = document.createElement('div');
    wrap.className = 'chat-msg-agent';
    var sr = document.createElement('span');
    sr.className = 'sr-only';
    sr.textContent = i18n('chat_sr_agent');
    var col = document.createElement('div');
    col.className = 'chat-msg-agent-inner';
    var bub = document.createElement('div');
    bub.className = 'chat-bubble-agent';
    var agentHue = homeChatAgentHueFromKey_(agentKey);
    if (agentHue !== null) {
      bub.classList.add('chat-bubble-agent-tinted');
      bub.style.setProperty('--agent-h', String(agentHue));
    }
    bub.textContent = body || '';
    col.appendChild(bub);
    if (metaLine) {
      var metaP = document.createElement('p');
      metaP.className = 'chat-msg-meta';
      metaP.textContent = metaLine;
      col.appendChild(metaP);
    }
    var refs = Array.isArray(references) ? references : [];
    if (refs.length) {
      var refsWrap = document.createElement('div');
      refsWrap.className = 'mt-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-xs dark:border-slate-600 dark:bg-slate-800';
      var refsTitle = document.createElement('p');
      refsTitle.className = 'mb-1 font-semibold text-slate-600 dark:text-slate-300';
      refsTitle.textContent = i18n('chat_refs_title');
      refsWrap.appendChild(refsTitle);
      for (var ri = 0; ri < refs.length; ri++) {
        var ref = refs[ri] || {};
        var line = document.createElement('div');
        line.className = 'mb-1 last:mb-0';
        var label = document.createElement('span');
        label.className = 'text-slate-700 dark:text-slate-300';
        label.textContent = (ref.contentId || '-') + ' · ' + (ref.title || '');
        line.appendChild(label);
        var directUrl = String(ref.url || '').trim();
        if (!directUrl && ref.driveFileId) {
          directUrl =
            'https://drive.google.com/open?id=' +
            encodeURIComponent(String(ref.driveFileId || '').trim());
        }
        if (directUrl) {
          line.appendChild(document.createTextNode(' · '));
          var a = document.createElement('a');
          a.href = directUrl;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.className = 'text-sky-700 underline dark:text-sky-300';
          a.textContent = i18n('chat_refs_open_link');
          line.appendChild(a);
        } else {
          line.appendChild(document.createTextNode(' · '));
          (function (refObj) {
            var openBtn = document.createElement('button');
            openBtn.type = 'button';
            openBtn.className = 'inline-flex items-center gap-1 text-sky-700 underline dark:text-sky-300';
            openBtn.innerHTML =
              '<i class="fa-solid fa-up-right-from-square" aria-hidden="true"></i><span>' +
              i18n('chat_refs_open_link') +
              '</span>';
            openBtn.addEventListener('click', function () {
              var candidate = String(refObj.fileName || refObj.title || '').trim();
              if (!candidate) {
                if (A.toast) A.toast.error(i18n('chat_ref_not_found'));
                return;
              }
              var opened = window.open('about:blank', '_blank');
              google.script.run
                .withSuccessHandler(function (resOpen) {
                  var url = (resOpen && resOpen.url) || '';
                  if (url) {
                    if (opened) opened.location = url;
                    else window.open(url, '_blank');
                  } else {
                    if (opened) opened.close();
                    if (A.toast) A.toast.error(i18n('chat_ref_not_found'));
                  }
                })
                .withFailureHandler(function () {
                  if (opened) opened.close();
                  if (A.toast) A.toast.error(i18n('err_generic'));
                })
                .resolveDriveFileUrlByName(candidate);
            });
            line.appendChild(openBtn);
          })(ref);
        }
        refsWrap.appendChild(line);
      }
      col.appendChild(refsWrap);
    }

    // Feedback buttons (only when we have an eventId)
    if (eventId) {
      (function (eid, aid, aname, questionSnippet) {
        var fbRow = document.createElement('div');
        fbRow.className = 'chat-feedback-row mt-2 flex items-center gap-2';
        var upBtn = document.createElement('button');
        upBtn.type = 'button';
        upBtn.className = 'chat-feedback-btn';
        upBtn.setAttribute('aria-label', i18n('chat_feedback_up'));
        upBtn.innerHTML = '<i class="fa-regular fa-thumbs-up" aria-hidden="true"></i>';
        var downBtn = document.createElement('button');
        downBtn.type = 'button';
        downBtn.className = 'chat-feedback-btn';
        downBtn.setAttribute('aria-label', i18n('chat_feedback_down'));
        downBtn.innerHTML = '<i class="fa-regular fa-thumbs-down" aria-hidden="true"></i>';
        var fbStatus = document.createElement('span');
        fbStatus.className = 'chat-feedback-status text-xs text-slate-400';

        function submitFeedback(rating) {
          upBtn.disabled = true;
          downBtn.disabled = true;
          upBtn.classList.toggle('chat-feedback-btn-active', rating === 'up');
          downBtn.classList.toggle('chat-feedback-btn-active', rating === 'down');
          google.script.run
            .withSuccessHandler(function () {
              fbStatus.textContent = i18n('chat_feedback_done');
            })
            .withFailureHandler(function () {
              upBtn.disabled = false;
              downBtn.disabled = false;
              fbStatus.textContent = i18n('chat_feedback_error');
            })
            .metricsTrackFeedback(eid, rating, aid || '', aname || '', questionSnippet || '');
        }

        upBtn.addEventListener('click', function () { submitFeedback('up'); });
        downBtn.addEventListener('click', function () { submitFeedback('down'); });
        fbRow.appendChild(upBtn);
        fbRow.appendChild(downBtn);
        fbRow.appendChild(fbStatus);
        col.appendChild(fbRow);
      })(eventId, agentId, agentKey, (body || '').slice(0, 200));
    }

    wrap.appendChild(sr);
    wrap.appendChild(col);
    thread.appendChild(wrap);
    homeChatScrollToBottom();
  }

  function homeChatResetThread() {
    var thread = document.getElementById('chat-thread');
    if (!thread) return;
    thread.innerHTML = '';
    homeChatRemoveThinking();
    var p = document.createElement('p');
    p.id = 'chat-empty';
    p.className = 'chat-empty';
    p.setAttribute('data-i18n', 'chat_empty_hint');
    p.textContent = i18n('chat_empty_hint');
    thread.appendChild(p);
  }

  function applyConsultModeLabels(llmCfg) {
    if (!llmCfg || !consultHeadingEl) return;
    consultHeadingEl.textContent = i18n('static_consult_heading');
    if (driveFilesHeadingEl) {
      driveFilesHeadingEl.textContent =
        llmCfg.mode === 'globant'
          ? i18n('drive_heading_globant')
          : llmCfg.mode === 'apiKey'
            ? i18n('drive_heading_gemini')
            : i18n('drive_heading_plain');
    }
    var geminiUi = llmCfg.mode === 'apiKey';
    if (geminiDocsBlock) geminiDocsBlock.classList.toggle('hidden', !geminiUi);
    if (askDriveRow) askDriveRow.classList.toggle('hidden', llmCfg.mode === 'globant');
    if (globantAgentRow) globantAgentRow.classList.toggle('hidden', llmCfg.mode !== 'globant');
    var askBtnLabel =
      askBtn &&
      (askBtn.querySelector('[data-i18n="ask_btn"]') || askBtn.querySelector('span'));
    if (askBtnLabel) askBtnLabel.textContent = i18n('ask_btn');
  }

  function applyConsultModeInitialState(llmCfg) {
    applyConsultModeLabels(llmCfg);
    var llmReady = llmCfg.mode === 'globant' || llmCfg.mode === 'apiKey';
    if (askBtn) askBtn.disabled = !llmReady;
    if (askAgentBtn) askAgentBtn.disabled = !llmReady;
    homeChatResetThread();
    if (askStatus) {
      askStatus.textContent = '';
      askStatus.classList.toggle('err', false);
    }
    if (questionEl) questionEl.value = '';
  }

  // ── Conversation ID ──────────────────────────────────────────────────────────

  function homeChatNewConvId_() {
    return 'conv-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
  }

  if (!S.get('chatConvId')) {
    S.set('chatConvId', homeChatNewConvId_());
  }

  // ── History panel ─────────────────────────────────────────────────────────

  var histPanel = document.getElementById('chat-history-panel');
  var histList = document.getElementById('chat-history-list');
  var histEmpty = document.getElementById('chat-history-empty');
  var histLoading = document.getElementById('chat-history-loading');
  var histToggleBtn = document.getElementById('chat-history-toggle-btn');

  function homeChatSaveCurrentConversation_() {
    var hist = S.get('chatHistory') || [];
    if (!hist.length) return;
    var convId = S.get('chatConvId') || homeChatNewConvId_();
    var firstUser = '';
    for (var k = 0; k < hist.length; k++) {
      if (hist[k].role === 'user') { firstUser = String(hist[k].content || ''); break; }
    }
    var title = (firstUser || '(conversación)').slice(0, 80);
    try {
      google.script.run
        .withFailureHandler(function () {})
        .chatHistorySave(convId, title, JSON.stringify(hist));
    } catch (eSave) {}
  }

  function homeChatLoadHistoryList_() {
    if (!histList || !histPanel) return;
    if (histLoading) histLoading.classList.remove('hidden');
    if (histEmpty) histEmpty.classList.add('hidden');
    histList.innerHTML = '';
    google.script.run
      .withSuccessHandler(function (res) {
        if (histLoading) histLoading.classList.add('hidden');
        var items = (res && res.items) || [];
        if (!items.length) {
          if (histEmpty) histEmpty.classList.remove('hidden');
          return;
        }
        items.forEach(function (item) {
          var li = document.createElement('li');
          li.className = 'chat-history-item group flex items-start justify-between gap-2 rounded-lg px-2 py-2 hover:bg-slate-100 dark:hover:bg-slate-700';

          var infoBtn = document.createElement('button');
          infoBtn.type = 'button';
          infoBtn.className = 'flex-1 min-w-0 text-left';

          var dateEl = document.createElement('span');
          dateEl.className = 'block text-[10px] text-slate-400 dark:text-slate-500';
          var d = new Date(item.tsCreated);
          dateEl.textContent = isNaN(d.getTime()) ? item.tsCreated : d.toLocaleDateString();

          var titleEl = document.createElement('span');
          titleEl.className = 'block text-xs text-slate-700 dark:text-slate-300 truncate';
          titleEl.textContent = item.title || '(sin título)';

          infoBtn.appendChild(dateEl);
          infoBtn.appendChild(titleEl);

          infoBtn.addEventListener('click', (function (cid) {
            return function () {
              homeChatLoadConversation_(cid);
              if (histPanel) histPanel.classList.add('hidden');
            };
          })(item.convId));

          var delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'chat-history-del-btn shrink-0 rounded p-1 text-slate-400 opacity-0 group-hover:opacity-100 hover:text-red-500 transition-opacity';
          delBtn.setAttribute('aria-label', i18n('chat_history_delete'));
          delBtn.innerHTML = '<i class="fa-solid fa-trash text-[10px]" aria-hidden="true"></i>';
          delBtn.addEventListener('click', (function (cid, liEl) {
            return function (ev) {
              ev.stopPropagation();
              google.script.run
                .withSuccessHandler(function () { liEl.remove(); if (!histList.children.length && histEmpty) histEmpty.classList.remove('hidden'); })
                .withFailureHandler(function () {})
                .chatHistoryDelete(cid);
            };
          })(item.convId, li));

          li.appendChild(infoBtn);
          li.appendChild(delBtn);
          histList.appendChild(li);
        });
      })
      .withFailureHandler(function () {
        if (histLoading) histLoading.classList.add('hidden');
        if (histEmpty) histEmpty.classList.remove('hidden');
      })
      .chatHistoryList();
  }

  function homeChatLoadConversation_(convId) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok || !res.messagesJson) return;
        var msgs = [];
        try { msgs = JSON.parse(res.messagesJson); } catch (eP) {}
        if (!msgs.length) return;
        homeChatResetThread();
        clearHistory();
        S.set('chatConvId', convId);
        var lastUser = '';
        for (var i = 0; i < msgs.length; i++) {
          var m = msgs[i];
          if (m.role === 'user') {
            homeChatAppendUser(m.content || '');
            lastUser = m.content || '';
          } else if (m.role === 'assistant') {
            homeChatAppendAgent(m.content || '', '', []);
          }
          S.get('chatHistory') || S.set('chatHistory', []);
          var h = S.get('chatHistory') || [];
          h.push({ role: m.role, content: m.content, ts: m.ts || Date.now() });
          while (h.length > MAX_HISTORY * 2) h.shift();
          S.set('chatHistory', h);
        }
        if (A.toast) A.toast.info(i18n('chat_history_heading'));
        homeChatHideQuickPromptStarters_();
      })
      .withFailureHandler(function () {
        if (A.toast) A.toast.error(i18n('chat_history_load_error'));
      })
      .chatHistoryLoad(convId);
  }

  if (histToggleBtn) {
    histToggleBtn.addEventListener('click', function () {
      if (!histPanel) return;
      var isHidden = histPanel.classList.contains('hidden');
      histPanel.classList.toggle('hidden', !isHidden);
      if (isHidden) homeChatLoadHistoryList_();
    });
  }

  // Click outside to close history panel
  document.addEventListener('click', function (ev) {
    if (!histPanel || histPanel.classList.contains('hidden')) return;
    if (histPanel.contains(ev.target) || (histToggleBtn && histToggleBtn.contains(ev.target))) return;
    histPanel.classList.add('hidden');
  });

  // ── Quick prompts ──────────────────────────────────────────────────────────

  function homeChatResolveUiLocale_(localeOpt) {
    if (localeOpt != null && String(localeOpt).trim() !== '') {
      return String(localeOpt).slice(0, 2) === 'en' ? 'en' : 'es';
    }
    var ci = S.get('cachedI18n');
    return ci && ci._locale === 'en' ? 'en' : 'es';
  }

  /** Dispara el mismo envío que Enter / botón Enviar según modo Globant vs documentos.
   * @return {boolean} true si se disparó el envío (click en botón de consulta). */
  function homeChatTriggerSend_() {
    if (!questionEl) return false;
    var q = (questionEl.value || '').trim();
    if (!q) return false;
    if (globantAgentRow && !globantAgentRow.classList.contains('hidden') &&
        askAgentBtn && !askAgentBtn.disabled) {
      askAgentBtn.click();
      return true;
    }
    if (askDriveRow && !askDriveRow.classList.contains('hidden') &&
        askBtn && !askBtn.disabled) {
      askBtn.click();
      return true;
    }
    if (askStatus) {
      askStatus.textContent = i18n('home_chat_banner_setup');
      askStatus.classList.add('err');
    } else if (A.toast) {
      A.toast.error(i18n('home_chat_banner_setup'));
    }
    return false;
  }

  function homeChatHideQuickPromptStarters_() {
    S.set('chatStartersShown', false);
    var container = document.getElementById('chat-quick-prompts');
    if (container) container.classList.add('hidden');
  }

  function homeChatRestoreQuickPromptStarters_() {
    var qp = S.get('quickPrompts');
    if (!qp || !qp.length) return;
    S.set('chatStartersShown', true);
    homeChatApplyQuickPrompts_(qp, null);
  }

  function homeChatApplyQuickPrompts_(prompts, locale) {
    var container = document.getElementById('chat-quick-prompts');
    if (!container) return;
    if (!prompts || !prompts.length) { container.classList.add('hidden'); return; }
    var list = container.querySelector('.chat-qp-list');
    if (!list) return;
    list.innerHTML = '';
    var loc = homeChatResolveUiLocale_(locale);
    prompts.forEach(function (p) {
      var text = String((loc === 'en' ? p.en : p.es) || p.es || p.en || '').trim();
      if (!text) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chat-qp-chip';
      btn.textContent = text;
      btn.addEventListener('click', function () {
        if (questionEl) {
          questionEl.value = text;
        }
        if (homeChatTriggerSend_()) {
          homeChatHideQuickPromptStarters_();
        }
      });
      list.appendChild(btn);
    });
    container.classList.toggle('hidden', !list.children.length);
    if (S.get('chatStartersShown') === false) {
      container.classList.add('hidden');
    }
  }

  // --- Event listeners ---

  if (askBtn) {
    askBtn.addEventListener('click', function () {
      askStatus.textContent = '';
      askStatus.classList.remove('err');
      var q = (questionEl.value || '').trim();
      if (!q) {
        askStatus.textContent = i18n('ask_empty_question');
        askStatus.classList.add('err');
        return;
      }
      var ids = A.getSelectedIds();
      homeChatAppendUser(q);
      pushHistory('user', q);
      questionEl.value = '';
      homeChatSetThinking(true);
      var histJson = getHistoryJson();
      google.script.run
        .withSuccessHandler(function (res) {
          askBtn.disabled = false;
          askAgentBtn.disabled = false;
          homeChatRemoveThinking();
          var answer = res.answer || '';
          pushHistory('assistant', answer);
          var metaLine = '';
          if (res.meta && typeof res.meta.filesUsed === 'number' && res.meta.filesUsed > 0) {
            metaLine = i18nFmt('meta_files_suffix', { n: res.meta.filesUsed });
          }
          homeChatAppendAgent(answer, metaLine, (res.meta && res.meta.references) || [], '', res.eventId || '', 'drive_docs');
          askStatus.textContent = '\u00a0';
        })
        .withFailureHandler(function (e) {
          askBtn.disabled = false;
          askAgentBtn.disabled = false;
          homeChatRemoveThinking();
          askStatus.textContent = e && e.message ? e.message : i18n('err_ask');
          askStatus.classList.add('err');
        })
        .askAboutDocuments(q, ids, histJson);
      askBtn.disabled = true;
      askAgentBtn.disabled = true;
      askStatus.textContent = i18n('busy_consulting');
    });
  }

  if (askAgentBtn) {
    askAgentBtn.addEventListener('click', function () {
      askStatus.textContent = '';
      askStatus.classList.remove('err');
      var gp = (questionEl.value || '').trim();
      if (!gp) {
        askStatus.textContent = i18n('ask_empty_question');
        askStatus.classList.add('err');
        return;
      }
      homeChatAppendUser(gp);
      pushHistory('user', gp);
      questionEl.value = '';
      askAgentBtn.disabled = true;
      askBtn.disabled = true;
      homeChatSetThinking(true, i18n('orch_step_routing'));
      askStatus.textContent = i18n('orch_step_routing');
      var agentHistJson = getHistoryJson();
      google.script.run
        .withSuccessHandler(function (route) {
          var agents = route.agents || [];
          var agNames = agents.map(function (a) { return a.name || a.id; }).join(', ');
          var isMulti = agents.length > 1;
          if (route.isSelf) {
            homeChatUpdateThinking(i18nFmt('orch_step_answering', { agent: agNames }));
            askStatus.textContent = i18nFmt('orch_step_answering', { agent: agNames });
          } else if (isMulti) {
            homeChatUpdateThinking(i18nFmt('orch_step_multi', { agents: agNames }));
            askStatus.textContent = i18nFmt('orch_step_multi', { agents: agNames });
          } else {
            homeChatUpdateThinking(i18nFmt('orch_step_delegating', { agent: agNames }));
            askStatus.textContent = i18nFmt('orch_step_delegating', { agent: agNames });
          }
          var agentIds = agents.map(function (a) { return a.id; });
          if (isMulti) {
            google.script.run
              .withSuccessHandler(function (results) {
                askAgentBtn.disabled = false;
                askBtn.disabled = false;
                homeChatRemoveThinking();
                if (!results || !results.length) {
                  homeChatAppendAgent(i18n('orch_no_results'), '', []);
                } else {
                  var combined = [];
                  for (var k = 0; k < results.length; k++) {
                    var badge = i18nFmt('orch_routed_badge', { agent: results[k].agentName });
                    var agentTintKey =
                      results[k].agentName || (agentIds[k] != null ? String(agentIds[k]) : '');
                    homeChatAppendAgent(
                      results[k].answer || '',
                      badge,
                      (results[k].meta && results[k].meta.references) || [],
                      agentTintKey,
                      results[k].eventId || '',
                      agentIds[k] != null ? String(agentIds[k]) : '',
                    );
                    combined.push(results[k].answer || '');
                  }
                  pushHistory('assistant', combined.join('\n---\n'));
                }
                askStatus.textContent = '\u00a0';
              })
              .withFailureHandler(function (e) {
                askAgentBtn.disabled = false;
                askBtn.disabled = false;
                homeChatRemoveThinking();
                askStatus.textContent = e && e.message ? e.message : i18n('err_ask_agent');
                askStatus.classList.add('err');
              })
              .globantAnswerMultiAgent(gp, agentIds, agentHistJson);
          } else {
            google.script.run
              .withSuccessHandler(function (res) {
                askAgentBtn.disabled = false;
                askBtn.disabled = false;
                homeChatRemoveThinking();
                var answer = res.answer || '';
                pushHistory('assistant', answer);
                var badge = i18nFmt('orch_routed_badge', { agent: res.agentName || agNames });
                var singleTintKey =
                  res.agentName ||
                  (agentIds && agentIds.length ? String(agentIds[0]) : '') ||
                  agNames;
                var singleAgentId = agentIds && agentIds.length ? String(agentIds[0]) : '';
                homeChatAppendAgent(answer, badge, (res.meta && res.meta.references) || [], singleTintKey, res.eventId || '', singleAgentId);
                askStatus.textContent = '\u00a0';
              })
              .withFailureHandler(function (e) {
                askAgentBtn.disabled = false;
                askBtn.disabled = false;
                homeChatRemoveThinking();
                askStatus.textContent = e && e.message ? e.message : i18n('err_ask_agent');
                askStatus.classList.add('err');
              })
              .globantAnswerWithAgent(gp, agentIds[0], agentHistJson);
          }
        })
        .withFailureHandler(function (e) {
          askAgentBtn.disabled = false;
          askBtn.disabled = false;
          homeChatRemoveThinking();
          askStatus.textContent = e && e.message ? e.message : i18n('err_ask_agent');
          askStatus.classList.add('err');
        })
        .globantRouteQuery(gp);
    });
  }

  var chatNewBtn = document.getElementById('chat-new-btn');
  if (chatNewBtn) {
    chatNewBtn.addEventListener('click', function () {
      homeChatSaveCurrentConversation_();
      clearHistory();
      S.set('chatConvId', homeChatNewConvId_());
      homeChatResetThread();
      if (questionEl) questionEl.value = '';
      if (askStatus) { askStatus.textContent = ''; askStatus.classList.remove('err'); }
      homeChatRestoreQuickPromptStarters_();
    });
  }

  if (questionEl) {
    questionEl.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' || ev.shiftKey) return;
      if (ev.isComposing) return;
      ev.preventDefault();
      if (globantAgentRow && !globantAgentRow.classList.contains('hidden') &&
          askAgentBtn && !askAgentBtn.disabled) {
        askAgentBtn.click();
        return;
      }
      if (askDriveRow && !askDriveRow.classList.contains('hidden') &&
          askBtn && !askBtn.disabled) {
        askBtn.click();
        return;
      }
    });
  }

  A.chat = {
    updateHomeChatBanner: updateHomeChatBanner,
    applyConsultModeLabels: applyConsultModeLabels,
    applyConsultModeInitialState: applyConsultModeInitialState,
    resetThread: homeChatResetThread,
    appendUser: homeChatAppendUser,
    appendAgent: homeChatAppendAgent,
    setThinking: homeChatSetThinking,
    removeThinking: homeChatRemoveThinking,
    updateThinking: homeChatUpdateThinking,
    saveCurrentConversation: homeChatSaveCurrentConversation_,
    applyQuickPrompts: homeChatApplyQuickPrompts_,
    restoreQuickPromptStarters: homeChatRestoreQuickPromptStarters_,
    THINKING_ID: CHAT_THINKING_ID,
  };
})(window.Aviators);
</script>
