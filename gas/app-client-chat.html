<script>
(function (A) {
  var S = A.state;
  var i18n = A.i18n;
  var i18nFmt = A.i18nFmt;

  var askBtn = document.getElementById('ask-btn');
  var questionEl = document.getElementById('question');
  var askStatus = document.getElementById('ask-status');
  var consultHeadingEl = document.getElementById('consult-heading');
  var driveFilesHeadingEl = document.getElementById('drive-files-heading');
  var geminiDocsBlock = document.getElementById('gemini-docs-block');
  var askDriveRow = document.getElementById('ask-drive-row');
  var globantAgentRow = document.getElementById('globant-agent-row');
  var askAgentBtn = document.getElementById('ask-agent-btn');
  var llmHintBox = document.getElementById('llm-hint-box');
  var chatAttachRow = document.getElementById('chat-attach-row');
  var chatAttachBtn = document.getElementById('chat-attach-btn');
  var chatAttachInput = document.getElementById('chat-attach-input');
  var chatAttachChip = document.getElementById('chat-attach-chip');
  var chatAttachName = document.getElementById('chat-attach-name');
  var chatAttachClear = document.getElementById('chat-attach-clear');

  var CHAT_THINKING_ID = 'chat-msg-thinking';
  var CHAT_PROGRESS_TIMER = null;
  var CHAT_STEPS_ROUTE = ['orch_step_routing', 'chat_step_preparing', 'chat_step_searching_index'];
  var CHAT_STEPS_ANSWER = ['chat_step_searching_index', 'chat_step_reading_sources', 'chat_step_generating'];
  var CHAT_STEPS_DRIVE = ['chat_step_loading_context', 'chat_step_consulting_model', 'chat_step_composing'];
  var CHAT_STEPS_EPHEMERAL = [
    'chat_step_ephemeral_validating',
    'chat_step_ephemeral_matching',
    'chat_step_ephemeral_analyzing',
  ];
  var CHAT_PROGRESS_TICK_MS = 5200;
  var MAX_HISTORY = 10;
  var CHAT_AGENT_ONBOARDING = 'onboarding';

  var dashboardTitleEl = document.getElementById('dashboard-title');
  var dashboardLeadEl = document.getElementById('dashboard-lead');

  function homeChatIsOnboardingPage_() {
    return S.get('activePage') === 'onboarding';
  }

  function homeChatIsProposalBuildingPage_() {
    return S.get('activePage') === 'proposal-building';
  }

  function homeChatHistKey_() {
    if (homeChatIsOnboardingPage_()) return 'onboardingChatHistory';
    if (homeChatIsProposalBuildingPage_()) return 'proposalBuildingChatHistory';
    return 'chatHistory';
  }

  function homeChatConvKey_() {
    if (homeChatIsOnboardingPage_()) return 'onboardingChatConvId';
    if (homeChatIsProposalBuildingPage_()) return 'proposalBuildingChatConvId';
    return 'chatConvId';
  }

  function homeChatGetHistory_() {
    return S.get(homeChatHistKey_()) || [];
  }

  function homeChatSetHistory_(hist) {
    S.set(homeChatHistKey_(), hist);
  }

  function homeChatForcedAgentId_() {
    if (homeChatIsOnboardingPage_()) return CHAT_AGENT_ONBOARDING;
    return null;
  }

  function homeChatStartersKey_() {
    if (homeChatIsOnboardingPage_()) return 'onboardingChatStartersShown';
    if (homeChatIsProposalBuildingPage_()) return 'proposalBuildingChatStartersShown';
    return 'chatStartersShown';
  }

  function homeChatGetQuickPrompts_() {
    if (homeChatIsOnboardingPage_()) return S.get('onboardingQuickPrompts') || [];
    if (homeChatIsProposalBuildingPage_()) return [];
    return S.get('quickPrompts') || [];
  }

  function pushHistory(role, content, extra) {
    var hist = homeChatGetHistory_();
    var entry = { role: role, content: content, ts: Date.now() };
    if (extra && typeof extra === 'object') {
      if (extra.metaLine != null) entry.metaLine = extra.metaLine;
      if (extra.references) entry.references = extra.references;
      if (extra.agentKey != null) entry.agentKey = extra.agentKey;
      if (extra.eventId != null) entry.eventId = extra.eventId;
      if (extra.agentId != null) entry.agentId = extra.agentId;
      if (extra.attachmentName != null) entry.attachmentName = extra.attachmentName;
      if (extra.submitMode != null) entry.submitMode = extra.submitMode;
    }
    hist.push(entry);
    while (hist.length > MAX_HISTORY * 2) hist.shift();
    homeChatSetHistory_(hist);
    return hist.length - 1;
  }

  function homeChatGetTurn_(idx) {
    var hist = homeChatGetHistory_();
    return typeof idx === 'number' && idx >= 0 && idx < hist.length ? hist[idx] : null;
  }

  function homeChatFindUserTurnForAgentIdx_(agentHistIdx) {
    var hist = homeChatGetHistory_();
    for (var i = agentHistIdx - 1; i >= 0; i--) {
      if (hist[i] && hist[i].role === 'user') return { turn: hist[i], idx: i };
    }
    return null;
  }

  function homeChatHistoryJsonForRegenerate_() {
    var hist = homeChatGetHistory_().slice();
    if (hist.length && hist[hist.length - 1].role === 'assistant') hist.pop();
    return JSON.stringify(hist);
  }

  function homeChatCopyText_(text) {
    var s = String(text || '');
    if (!s) return Promise.reject(new Error('empty'));
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(s);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement('textarea');
        ta.value = s;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) resolve();
        else reject(new Error('copy'));
      } catch (eC) {
        reject(eC);
      }
    });
  }

  function homeChatRefExportUrl_(ref) {
    var actions = homeChatResolveRefActions_(ref);
    if (actions.drive.available && actions.drive.url) return actions.drive.url;
    if (actions.catalog.available) return 'aviators://contents/' + actions.catalog.contentId;
    if (actions.rag.available) return 'aviators://agents/' + encodeURIComponent(actions.rag.profileName);
    return '';
  }

  function homeChatFormatRefsBlock_(refs) {
    var list = Array.isArray(refs) ? refs : [];
    if (!list.length) return '';
    var lines = [i18n('chat_refs_title')];
    for (var ri = 0; ri < list.length; ri++) {
      var ref = list[ri] || {};
      var typeLbl = homeChatRefTypeLabel_(ref.contentType);
      var title = ref.title || i18n('chat_history_untitled');
      var head = (ri + 1) + '. **' + typeLbl + '** — ' + title;
      if (ref.clientName) head += ' (' + ref.clientName + ')';
      lines.push(head);
      var url = homeChatRefExportUrl_(ref);
      if (url) lines.push('   ' + url);
    }
    return lines.join('\n');
  }

  function homeChatFormatTurnForCopy_(turn) {
    if (!turn) return '';
    var parts = [String(turn.content || '')];
    if (turn.metaLine) {
      parts.push('');
      parts.push(String(turn.metaLine));
    }
    var refsBlock = homeChatFormatRefsBlock_(turn.references);
    if (refsBlock) {
      parts.push('');
      parts.push(refsBlock);
    }
    return parts.join('\n');
  }

  function homeChatBuildConversationMarkdown_() {
    var hist = homeChatGetHistory_();
    if (!hist.length) return '';
    var lines = ['# ' + i18n('chat_export_title'), ''];
    for (var i = 0; i < hist.length; i++) {
      var m = hist[i];
      if (m.role === 'user') {
        lines.push('## ' + i18n('chat_sr_you'));
        lines.push('');
        lines.push(String(m.content || ''));
        if (m.attachmentName) {
          lines.push('');
          lines.push('_' + i18nFmt('chat_attach_selected', { name: m.attachmentName }) + '_');
        }
      } else if (m.role === 'assistant') {
        lines.push('## ' + i18n('chat_sr_agent'));
        lines.push('');
        lines.push(String(m.content || ''));
        if (m.metaLine) {
          lines.push('');
          lines.push('_' + String(m.metaLine) + '_');
        }
        var refsBlock = homeChatFormatRefsBlock_(m.references);
        if (refsBlock) {
          lines.push('');
          lines.push(refsBlock);
        }
      }
      lines.push('');
    }
    return lines.join('\n').trim() + '\n';
  }

  function homeChatRefreshRegenerateButtons_() {
    var thread = document.getElementById('chat-thread');
    if (!thread) return;
    var hist = homeChatGetHistory_();
    var lastUserIdx = -1;
    for (var hi = hist.length - 1; hi >= 0; hi--) {
      if (hist[hi] && hist[hi].role === 'user') {
        lastUserIdx = hi;
        break;
      }
    }
    var agents = thread.querySelectorAll('.chat-msg-agent[data-hist-idx]');
    for (var ai = 0; ai < agents.length; ai++) {
      var regBtn = agents[ai].querySelector('[data-chat-action="regenerate"]');
      if (!regBtn) continue;
      var hIdx = parseInt(agents[ai].getAttribute('data-hist-idx'), 10);
      regBtn.disabled = isNaN(hIdx) || hIdx <= lastUserIdx;
    }
  }

  function homeChatRemoveLastAgentMessage_() {
    var thread = document.getElementById('chat-thread');
    if (!thread) return null;
    var agents = thread.querySelectorAll('.chat-msg-agent[data-hist-idx]');
    if (!agents.length) return null;
    var last = agents[agents.length - 1];
    var idxAttr = last.getAttribute('data-hist-idx');
    last.parentNode.removeChild(last);
    var hist = homeChatGetHistory_();
    if (hist.length && hist[hist.length - 1].role === 'assistant') hist.pop();
    homeChatSetHistory_(hist);
    homeChatRefreshRegenerateButtons_();
    return idxAttr != null ? parseInt(idxAttr, 10) : null;
  }

  /** Quita del hilo e historial todas las respuestas posteriores al turno de usuario dado. */
  function homeChatRemoveAssistantRepliesAfterUserIdx_(userHistIdx) {
    var thread = document.getElementById('chat-thread');
    var hist = homeChatGetHistory_();
    if (userHistIdx < 0 || userHistIdx >= hist.length) return;
    while (hist.length > userHistIdx + 1) hist.pop();
    homeChatSetHistory_(hist);
    if (thread) {
      var nodes = thread.querySelectorAll('.chat-msg-agent[data-hist-idx]');
      for (var ni = 0; ni < nodes.length; ni++) {
        var hIdx = parseInt(nodes[ni].getAttribute('data-hist-idx'), 10);
        if (!isNaN(hIdx) && hIdx > userHistIdx && nodes[ni].parentNode) {
          nodes[ni].parentNode.removeChild(nodes[ni]);
        }
      }
    }
    homeChatRefreshRegenerateButtons_();
  }

  function homeChatBuildActionBtn_(iconClass, labelKey, action, histIdx) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chat-msg-action-btn';
    btn.setAttribute('data-chat-action', action);
    if (histIdx != null) btn.setAttribute('data-hist-idx', String(histIdx));
    btn.innerHTML =
      '<i class="fa-solid ' +
      iconClass +
      '" aria-hidden="true"></i><span>' +
      i18n(labelKey) +
      '</span>';
    return btn;
  }

  function homeChatDownloadTextFile_(filename, text, mime) {
    var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 100);
  }

  function homeChatEscapeHtml_(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function homeChatSanitizeMarkdownUrl_(href) {
    var h = String(href || '').trim();
    if (/^https?:\/\//i.test(h) || /^mailto:/i.test(h)) return h;
    return '';
  }

  function homeChatInlineMarkdown_(escaped) {
    var s = String(escaped || '');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_m, label, url) {
      var safe = homeChatSanitizeMarkdownUrl_(url);
      if (!safe) return label;
      return (
        '<a href="' +
        safe +
        '" target="_blank" rel="noopener noreferrer" class="chat-md-a">' +
        label +
        '</a>'
      );
    });
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong class="chat-md-strong">$1</strong>');
    s = s.replace(/\*([^*\n]+)\*/g, '<em class="chat-md-em">$1</em>');
    s = s.replace(/`([^`\n]+)`/g, '<code class="chat-md-code">$1</code>');
    return s;
  }

  /**
   * Subconjunto Markdown seguro (sin HTML crudo del modelo).
   * @param {string} raw
   * @return {string}
   */
  function homeChatRenderMarkdown_(raw) {
    var text = String(raw || '');
    if (!text.trim()) return '';

    var lines = text.split(/\r?\n/);
    var html = [];
    var inCode = false;
    var codeBuf = [];
    var listType = null;
    var para = [];

    function flushPara() {
      if (!para.length) return;
      html.push(
        '<p class="chat-md-p">' +
          homeChatInlineMarkdown_(homeChatEscapeHtml_(para.join(' '))) +
          '</p>',
      );
      para = [];
    }

    function closeList() {
      if (listType) {
        html.push('</' + listType + '>');
        listType = null;
      }
    }

    var i;
    for (i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (/^```/.test(line)) {
        flushPara();
        closeList();
        if (inCode) {
          html.push(
            '<pre class="chat-md-pre"><code>' +
              homeChatEscapeHtml_(codeBuf.join('\n')) +
              '</code></pre>',
          );
          codeBuf = [];
          inCode = false;
        } else {
          inCode = true;
        }
        continue;
      }
      if (inCode) {
        codeBuf.push(line);
        continue;
      }

      var ul = /^(\s*)[-*•]\s+(.+)$/.exec(line);
      var ol = /^(\s*)\d+\.\s+(.+)$/.exec(line);
      if (ul) {
        flushPara();
        if (listType !== 'ul') {
          closeList();
          html.push('<ul class="chat-md-ul">');
          listType = 'ul';
        }
        html.push(
          '<li class="chat-md-li">' +
            homeChatInlineMarkdown_(homeChatEscapeHtml_(ul[2])) +
            '</li>',
        );
        continue;
      }
      if (ol) {
        flushPara();
        if (listType !== 'ol') {
          closeList();
          html.push('<ol class="chat-md-ol">');
          listType = 'ol';
        }
        html.push(
          '<li class="chat-md-li">' +
            homeChatInlineMarkdown_(homeChatEscapeHtml_(ol[2])) +
            '</li>',
        );
        continue;
      }

      closeList();
      if (!String(line || '').trim()) {
        flushPara();
        continue;
      }

      var hd = /^(#{1,3})\s+(.+)$/.exec(line);
      if (hd) {
        flushPara();
        var level = hd[1].length;
        var tag = 'h' + level;
        html.push(
          '<' +
            tag +
            ' class="chat-md-h' +
            level +
            '">' +
            homeChatInlineMarkdown_(homeChatEscapeHtml_(hd[2])) +
            '</' +
            tag +
            '>',
        );
        continue;
      }

      para.push(String(line).trim());
    }

    flushPara();
    closeList();
    if (inCode && codeBuf.length) {
      html.push(
        '<pre class="chat-md-pre"><code>' +
          homeChatEscapeHtml_(codeBuf.join('\n')) +
          '</code></pre>',
      );
    }

    return '<div class="chat-md">' + html.join('') + '</div>';
  }

  function homeChatSetAgentBubbleHtml_(bubbleEl, rawMarkdown) {
    if (!bubbleEl) return;
    bubbleEl.classList.add('chat-bubble-agent--md');
    bubbleEl.innerHTML = homeChatRenderMarkdown_(rawMarkdown);
  }

  function homeChatResolveExportLocale_() {
    return homeChatResolveUiLocale_(null);
  }

  function homeChatLogoDataUrl_() {
    var img = document.getElementById('aviators-logo');
    if (!img) return '';
    return String(img.getAttribute('src') || img.src || '').trim();
  }

  function homeChatDownloadPdfBase64_(filename, pdfBase64) {
    var b64 = String(pdfBase64 || '');
    if (!b64) return;
    var binary = atob(b64);
    var len = binary.length;
    var bytes = new Uint8Array(len);
    var i;
    for (i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
    var blob = new Blob([bytes], { type: 'application/pdf' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename || 'aviators-export.pdf';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);
  }

  /**
   * @param {{mode?: string, turnIndex?: number}} opts
   */
  function homeChatExportPdf_(opts) {
    var options = opts || {};
    var hist = homeChatGetHistory_();
    if (!hist.length) {
      if (A.toast) A.toast.info(i18n('chat_export_empty'));
      return;
    }
    var mode = options.mode === 'turn' ? 'turn' : 'conversation';
    if (mode === 'turn') {
      var tIdx = options.turnIndex;
      if (typeof tIdx !== 'number' || !hist[tIdx] || hist[tIdx].role !== 'assistant') {
        if (A.toast) A.toast.info(i18n('chat_export_empty'));
        return;
      }
    }
    A.showBlockingModal(i18n('chat_export_busy'));
    google.script.run
      .withSuccessHandler(function (res) {
        A.hideBlockingModal();
        if (!res || !res.ok || !res.pdfBase64) {
          if (A.toast) A.toast.error(i18n('chat_export_error'));
          return;
        }
        homeChatDownloadPdfBase64_(res.filename, res.pdfBase64);
        if (A.toast) A.toast.success(i18n('chat_export_done'));
      })
      .withFailureHandler(function (err) {
        A.reportRpcError(err, {
          scope: 'chatExportPdf',
          fallbackKey: 'chat_export_error',
          modal: true,
          toast: true,
        });
      })
      .chatExportPdf({
        mode: mode,
        locale: homeChatResolveExportLocale_(),
        logoSrc: homeChatLogoDataUrl_(),
        messages: hist,
        turnIndex: mode === 'turn' ? options.turnIndex : undefined,
      });
  }

  function getHistoryJson() {
    var hist = homeChatGetHistory_();
    return JSON.stringify(hist);
  }

  function clearHistory() {
    homeChatSetHistory_([]);
  }

  function updateHomeChatBanner(cfg) {
    if (!llmHintBox) return;
    if (cfg && (cfg.mode === 'globant' || cfg.mode === 'apiKey')) {
      llmHintBox.classList.add('hidden');
      llmHintBox.textContent = '';
      llmHintBox.classList.remove('home-chat-banner', 'err');
      return;
    }
    llmHintBox.classList.remove('hidden');
    llmHintBox.classList.add('home-chat-banner', 'err');
    llmHintBox.textContent = i18n('home_chat_banner_setup');
  }

  function homeChatScrollToBottom() {
    var t = document.getElementById('chat-thread');
    if (!t) return;
    try { t.scrollTop = t.scrollHeight; } catch (eSc) {}
  }

  function homeChatClearProgressTimer_() {
    if (CHAT_PROGRESS_TIMER != null) {
      clearInterval(CHAT_PROGRESS_TIMER);
      CHAT_PROGRESS_TIMER = null;
    }
  }

  function homeChatRemoveThinking() {
    homeChatClearProgressTimer_();
    var el = document.getElementById(CHAT_THINKING_ID);
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }

  function homeChatResolveMsg_(keyOrMsg, fmtArgs) {
    if (!keyOrMsg) return i18n('chat_thinking');
    var s = String(keyOrMsg);
    if (fmtArgs && typeof fmtArgs === 'object') return i18nFmt(s, fmtArgs);
    var t = i18n(s);
    return t !== s ? t : s;
  }

  function homeChatBuildThinkingStepsEl_(stepKeys, activeIdx) {
    var ul = document.createElement('ul');
    ul.className = 'chat-thinking-steps';
    ul.setAttribute('role', 'status');
    ul.setAttribute('aria-live', 'polite');
    ul.setAttribute('aria-label', i18n('chat_progress_sr'));
    for (var si = 0; si < stepKeys.length; si++) {
      var li = document.createElement('li');
      var state = si < activeIdx ? 'done' : si === activeIdx ? 'active' : 'pending';
      li.className = 'chat-thinking-step chat-thinking-step--' + state;
      var stepIcon = document.createElement('i');
      stepIcon.className = 'chat-thinking-step-icon fa-solid ';
      stepIcon.setAttribute('aria-hidden', 'true');
      if (state === 'done') {
        stepIcon.className += 'fa-circle-check';
      } else if (state === 'active') {
        stepIcon.className += 'fa-spinner fa-spin';
      } else {
        stepIcon.className += 'fa-circle';
      }
      var stepText = document.createElement('span');
      stepText.textContent = homeChatResolveMsg_(stepKeys[si]);
      li.appendChild(stepIcon);
      li.appendChild(stepText);
      ul.appendChild(li);
    }
    return ul;
  }

  function homeChatBuildThinkingDots_() {
    var dots = document.createElement('span');
    dots.className = 'chat-thinking-dots';
    dots.setAttribute('aria-hidden', 'true');
    ['dot-1', 'dot-2', 'dot-3'].forEach(function (cls) {
      var d = document.createElement('span');
      d.className = 'dot ' + cls;
      dots.appendChild(d);
    });
    return dots;
  }

  /**
   * @param {boolean} on
   * @param {string} headline clave i18n, texto ya resuelto, u omitir
   * @param {string[]|null} stepKeys
   * @param {number} activeIdx
   * @param {Object|null} headlineFmt
   */
  function homeChatSetThinking(on, headline, stepKeys, activeIdx, headlineFmt) {
    var thread = document.getElementById('chat-thread');
    if (!thread) return;
    homeChatClearProgressTimer_();
    var prev = document.getElementById(CHAT_THINKING_ID);
    if (prev && prev.parentNode) prev.parentNode.removeChild(prev);
    if (!on) return;
    var emptyEl = document.getElementById('chat-empty');
    if (emptyEl) emptyEl.classList.add('hidden');
    var steps = stepKeys && stepKeys.length ? stepKeys : null;
    var active = typeof activeIdx === 'number' ? activeIdx : 0;
    var wrap = document.createElement('div');
    wrap.id = CHAT_THINKING_ID;
    wrap.className = 'chat-msg-agent';
    wrap.setAttribute('aria-live', 'polite');
    var inner = document.createElement('div');
    inner.className = 'chat-bubble-agent chat-thinking' + (steps ? ' chat-thinking--pipeline' : '');
    var head = document.createElement('div');
    head.className = 'chat-thinking-head';
    var icon = document.createElement('i');
    icon.className = 'fa-solid fa-sparkles chat-thinking-icon';
    icon.setAttribute('aria-hidden', 'true');
    var text = document.createElement('span');
    text.className = 'chat-thinking-text';
    text.textContent = homeChatResolveMsg_(headline, headlineFmt);
    head.appendChild(icon);
    head.appendChild(text);
    head.appendChild(homeChatBuildThinkingDots_());
    inner.appendChild(head);
    if (steps) inner.appendChild(homeChatBuildThinkingStepsEl_(steps, active));
    wrap.appendChild(inner);
    thread.appendChild(wrap);
    homeChatScrollToBottom();
  }

  function homeChatUpdateThinking(msg, stepKeys, activeIdx, headlineFmt) {
    homeChatSetThinking(true, msg, stepKeys || null, activeIdx, headlineFmt);
  }

  function homeChatStartProgressTicker_(stepKeys, startIdx, headline, headlineFmt) {
    homeChatClearProgressTimer_();
    if (!stepKeys || !stepKeys.length) return;
    var idx = typeof startIdx === 'number' ? startIdx : 0;
    CHAT_PROGRESS_TIMER = setInterval(function () {
      if (idx >= stepKeys.length - 1) return;
      idx += 1;
      homeChatSetThinking(true, headline, stepKeys, idx, headlineFmt);
      if (askStatus) askStatus.textContent = homeChatResolveMsg_(stepKeys[idx]);
    }, CHAT_PROGRESS_TICK_MS);
  }

  function homeChatBeginRouteProgress_() {
    homeChatSetThinking(true, 'orch_step_routing', CHAT_STEPS_ROUTE, 0);

  function homeChatReadPdfAttachment_(file, onOk, onErr) {
    if (!file) {
      onErr(new Error(i18n('err_ephemeral_doc_empty')));
      return;
    }
    var mime = file.type || 'application/pdf';
    if (mime !== 'application/pdf' && !/\.pdf$/i.test(file.name || '')) {
      onErr(new Error(i18nFmt('err_ephemeral_doc_mime', { name: file.name, mime: mime })));
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      var dataUrl = String(reader.result || '');
      var comma = dataUrl.indexOf(',');
      var b64 = comma >= 0 ? dataUrl.slice(comma + 1) : '';
      if (!b64) {
        onErr(new Error(i18n('err_ephemeral_doc_empty')));
        return;
      }
      onOk({ name: file.name, mimeType: 'application/pdf', dataBase64: b64 });
    };
    reader.onerror = function () {
      onErr(new Error(i18n('err_ephemeral_doc_payload')));
    };
    reader.readAsDataURL(file);
  }

  function homeChatRouteHeadline_(route) {
    var agents = route.agents || [];
    var agNames = agents.map(function (a) { return a.name || a.id; }).join(', ');
    if (route.isSelf) {
      return { key: 'orch_step_answering', fmt: { agent: agNames } };
    }
    if (agents.length > 1) {
      return { key: 'orch_step_multi', fmt: { agents: agNames } };
    }
    return { key: 'orch_step_delegating', fmt: { agent: agNames } };
  }

  function homeChatAgentHueFromKey_(key) {
    var str = String(key || '').trim();
    if (!str) return null;
    var h = 0;
    for (var i = 0; i < str.length; i++) {
      h = ((h << 5) - h) + str.charCodeAt(i);
      h |= 0;
    }
    return Math.abs(h) % 360;
  }

  function homeChatBuildAttachmentChipEl_(fileName) {
    var name = String(fileName || '').trim();
    if (!name) return null;
    var chip = document.createElement('span');
    chip.className =
      'chat-attach-chip inline-flex max-w-full items-center gap-2 rounded-full border border-sky-200 bg-sky-50 px-3 py-1.5 text-xs text-sky-900 dark:border-sky-800 dark:bg-sky-950/40 dark:text-sky-100';
    chip.setAttribute('role', 'note');
    chip.setAttribute('aria-label', i18nFmt('chat_attach_selected', { name: name }));
    var icon = document.createElement('i');
    icon.className = 'fa-solid fa-file-pdf shrink-0';
    icon.setAttribute('aria-hidden', 'true');
    var nameEl = document.createElement('span');
    nameEl.className = 'truncate';
    nameEl.textContent = name;
    chip.appendChild(icon);
    chip.appendChild(nameEl);
    return chip;
  }

  function homeChatRefTypeLabel_(contentType) {
    var t = String(contentType || '').trim();
    if (t === 'proposal') return i18n('contents_type_proposal');
    if (t === 'success_case') return i18n('contents_type_success_case');
    if (t === 'client') return i18n('contents_type_client');
    if (t === 'onboarding') return i18n('contents_type_onboarding');
    if (t === 'selected_file') return i18n('chat_ref_type_selected_file');
    return t || i18n('label_em_dash');
  }

  function homeChatRefPdfAvailable_(ref) {
    var r = ref || {};
    if (String(r.driveFileId || r.url || r.globantDocumentId || '').trim()) return true;
    var ct = String(r.contentType || '').trim();
    if (ct === 'onboarding' && String(r.globantDocumentId || r.documentId || '').trim()) {
      return true;
    }
    var contentId = String(r.contentId || '').trim();
    if (!contentId) return false;
    if (ct === 'proposal' || ct === 'success_case' || ct === 'onboarding') return true;
    var fn = String(r.fileName || '').trim();
    return /\.pdf$/i.test(fn);
  }

  function homeChatResolveRefActions_(ref) {
    if (ref && ref.actions) {
      var merged = ref.actions;
      if (!merged.clientMaster && ref.clientName && S.get('canViewClients')) {
        merged = Object.assign({}, merged, {
          clientMaster: {
            available: true,
            clientName: String(ref.clientName || '').trim(),
          },
        });
      }
      if (merged.drive) {
        var driveUrl = String(merged.drive.url || ref.url || '').trim();
        merged = Object.assign({}, merged, {
          drive: {
            available: !!(driveUrl && (merged.drive.available || homeChatRefPdfAvailable_(ref))),
            url: driveUrl,
          },
        });
      }
      return merged;
    }
    var r = ref || {};
    var driveUrl = String(r.url || '').trim();
    if (!driveUrl && r.driveFileId) {
      driveUrl =
        'https://drive.google.com/open?id=' + encodeURIComponent(String(r.driveFileId));
    }
    var contentId = String(r.contentId || '').trim();
    var clientName = String(r.clientName || '').trim();
    var canCatalog = !!S.get('canViewCatalog');
    return {
      drive: {
        available: !!(driveUrl && homeChatRefPdfAvailable_(r)),
        url: driveUrl,
      },
      catalog: {
        available: !!(contentId && canCatalog),
        contentId: contentId,
      },
      clientMaster: {
        available: !!(clientName && canCatalog && !contentId),
        clientName: clientName,
      },
    };
  }

  function homeChatOpenExternalUrl_(url) {
    var u = String(url || '').trim();
    if (!u) {
      if (A.toast) A.toast.error(i18n('chat_ref_not_found'));
      return;
    }
    window.open(u, '_blank', 'noopener,noreferrer');
  }

  function homeChatRefSortKey_(ref) {
    var actions = homeChatResolveRefActions_(ref);
    if (actions.drive.available && actions.drive.url) return 0;
    if (homeChatRefPdfAvailable_(ref) && (ref.url || ref.driveFileId || ref.globantDocumentId)) {
      return 0;
    }
    if (actions.catalog.available) return 1;
    if (actions.clientMaster && actions.clientMaster.available) return 3;
    return 2;
  }

  function homeChatSortRefs_(references) {
    var refs = Array.isArray(references) ? references.slice() : [];
    refs.sort(function (a, b) {
      return homeChatRefSortKey_(a) - homeChatRefSortKey_(b);
    });
    return refs;
  }

  function homeChatOpenPdfRef_(ref) {
    var r = ref || {};
    var actions = homeChatResolveRefActions_(ref);
    var direct = String(actions.drive.url || r.url || '').trim();
    if (direct) {
      homeChatOpenExternalUrl_(direct);
      return;
    }
    if (A.showBlockingModal) {
      A.showBlockingModal(i18n('chat_ref_resolving_link'));
    }
    google.script.run
      .withSuccessHandler(function (res) {
        if (A.hideBlockingModal) A.hideBlockingModal();
        if (res && res.openUrl) {
          homeChatOpenExternalUrl_(res.openUrl);
          return;
        }
        if (A.toast) A.toast.error(i18n('err_pdf_not_available'));
      })
      .withFailureHandler(function (e) {
        if (A.hideBlockingModal) A.hideBlockingModal();
        A.reportRpcError(e, {
          scope: 'chatRefOpenUrl',
          fallbackKey: 'err_pdf_not_available',
          modal: true,
          toast: true,
        });
      })
      .chatReferenceOpenUrl(
        JSON.stringify({
          contentId: r.contentId || actions.catalog.contentId || '',
          driveFileId: r.driveFileId || '',
          url: r.url || '',
          globantDocumentId: r.globantDocumentId || r.documentId || '',
          globantProfileName: r.globantProfileName || r.profileName || '',
        }),
      );
  }

  function homeChatOpenCatalogRef_(contentId) {
    var id = String(contentId || '').trim();
    if (!id) return;
    if (!S.get('canViewCatalog')) {
      if (A.toast) A.toast.error(i18n('chat_ref_catalog_denied'));
      return;
    }
    S.set('contentsPendingOpenId', id);
    A.setAppPage('contents');
  }

  function homeChatOpenClientRef_(clientName) {
    var name = String(clientName || '').trim();
    if (!name) return;
    if (!S.get('canViewCatalog')) {
      if (A.toast) A.toast.error(i18n('chat_ref_catalog_denied'));
      return;
    }
    S.set('clientsPendingOpenName', name);
    A.setAppPage('clients');
  }

  function homeChatRefPrimaryOpen_(ref) {
    var actions = homeChatResolveRefActions_(ref);
    if (actions.drive.available || homeChatRefPdfAvailable_(ref)) {
      homeChatOpenPdfRef_(ref);
      return;
    }
    if (actions.catalog.available) {
      homeChatOpenCatalogRef_(actions.catalog.contentId);
      return;
    }
    if (actions.clientMaster && actions.clientMaster.available) {
      homeChatOpenClientRef_(actions.clientMaster.clientName);
    }
  }

  function homeChatBuildRefActionBtn_(iconClass, label, onClick) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className =
      'btn btn-sm btn-outline inline-flex items-center gap-1.5 px-2 py-1 text-[11px]';
    btn.innerHTML =
      '<i class="fa-solid ' +
      iconClass +
      '" aria-hidden="true"></i><span>' +
      label +
      '</span>';
    btn.addEventListener('click', onClick);
    return btn;
  }

  /**
   * Bloque de fuentes relacionadas (colapsado por defecto).
   * @param {Array<Object>} references
   * @return {HTMLElement|null}
   */
  function homeChatBuildRefsElement_(references) {
    var refs = homeChatSortRefs_(references);
    if (!refs.length) return null;

    var details = document.createElement('details');
    details.className = 'chat-refs-details';

    var summary = document.createElement('summary');
    summary.className = 'chat-refs-summary';
    summary.setAttribute(
      'aria-label',
      i18nFmt('chat_refs_summary', { count: String(refs.length) }),
    );
    var chevron = document.createElement('i');
    chevron.className = 'fa-solid fa-chevron-right chat-refs-chevron';
    chevron.setAttribute('aria-hidden', 'true');
    summary.appendChild(chevron);
    var summaryText = document.createElement('span');
    summaryText.textContent = i18nFmt('chat_refs_summary', { count: String(refs.length) });
    summary.appendChild(summaryText);
    details.appendChild(summary);

    var refsList = document.createElement('ul');
    refsList.className = 'chat-refs-list';
    refsList.setAttribute('aria-label', i18n('chat_refs_title'));

    var ri;
    for (ri = 0; ri < refs.length; ri++) {
      (function (refItem) {
        var actions = homeChatResolveRefActions_(refItem);
        var hasAnyAction =
          actions.catalog.available ||
          (actions.clientMaster && actions.clientMaster.available) ||
          actions.drive.available ||
          homeChatRefPdfAvailable_(refItem);
        if (!hasAnyAction && !refItem.title) return;

        var li = document.createElement('li');
        li.className =
          'rounded-md border border-slate-200 bg-white px-2.5 py-2 dark:border-slate-600 dark:bg-slate-900/40';

        var topRow = document.createElement('div');
        topRow.className = 'flex items-start gap-2';

        var typeBadge = document.createElement('span');
        typeBadge.className =
          'mt-0.5 shrink-0 rounded-full border border-sky-200 bg-sky-50 px-1.5 py-0.5 text-[10px] font-medium uppercase tracking-wide text-sky-900 dark:border-sky-800 dark:bg-sky-950/40 dark:text-sky-200';
        typeBadge.textContent = homeChatRefTypeLabel_(refItem.contentType);
        topRow.appendChild(typeBadge);

        var titleBtn = document.createElement('button');
        titleBtn.type = 'button';
        titleBtn.className =
          'min-w-0 flex-1 text-left text-slate-800 underline-offset-2 hover:underline dark:text-slate-100';
        titleBtn.textContent = refItem.title || i18n('chat_history_untitled');
        if (hasAnyAction) {
          titleBtn.addEventListener('click', function () {
            homeChatRefPrimaryOpen_(refItem);
          });
        } else {
          titleBtn.classList.remove('hover:underline');
          titleBtn.disabled = true;
        }
        topRow.appendChild(titleBtn);
        li.appendChild(topRow);

        if (refItem.clientName) {
          var clientP = document.createElement('p');
          clientP.className = 'mt-1 text-[11px] text-slate-500 dark:text-slate-400';
          clientP.textContent = refItem.clientName;
          li.appendChild(clientP);
        }

        var fileUrl = String(
          (actions.drive && actions.drive.url) || refItem.url || '',
        ).trim();
        var canOpenPdf = actions.drive.available || homeChatRefPdfAvailable_(refItem);
        if (fileUrl || canOpenPdf) {
          var urlRow = document.createElement('p');
          urlRow.className = 'mt-1.5 text-[11px] text-slate-600 dark:text-slate-400';
          var urlLbl = document.createElement('span');
          urlLbl.className = 'font-medium text-slate-500 dark:text-slate-400';
          urlLbl.textContent = i18n('chat_ref_file_url_label') + ': ';
          var urlLink = document.createElement('button');
          urlLink.type = 'button';
          urlLink.className =
            'break-all text-left font-medium text-sky-700 underline underline-offset-2 hover:text-sky-900 dark:text-sky-300 dark:hover:text-sky-200';
          urlLink.textContent = fileUrl || i18n('chat_ref_action_view_pdf');
          urlLink.addEventListener('click', function () {
            homeChatOpenPdfRef_(refItem);
          });
          urlRow.appendChild(urlLbl);
          urlRow.appendChild(urlLink);
          li.appendChild(urlRow);
        }

        var actionRow = document.createElement('div');
        actionRow.className = 'mt-2 flex flex-wrap gap-1.5';
        if (actions.catalog.available) {
          actionRow.appendChild(
            homeChatBuildRefActionBtn_('fa-folder-open', i18n('chat_ref_action_catalog'), function () {
              homeChatOpenCatalogRef_(actions.catalog.contentId);
            }),
          );
        }
        if (actions.clientMaster && actions.clientMaster.available) {
          actionRow.appendChild(
            homeChatBuildRefActionBtn_('fa-building', i18n('chat_ref_action_client'), function () {
              homeChatOpenClientRef_(actions.clientMaster.clientName);
            }),
          );
        }
        if (actionRow.children.length) li.appendChild(actionRow);
        refsList.appendChild(li);
      })(refs[ri] || {});
    }

    if (!refsList.children.length) return null;
    details.appendChild(refsList);
    return details;
  }

  function homeChatAppendAgent(body, metaLine, references, agentKey, eventId, agentId, histIdx) {
    var thread = document.getElementById('chat-thread');
    if (!thread) return;
    var emptyEl = document.getElementById('chat-empty');
    if (emptyEl) emptyEl.classList.add('hidden');
    var wrap = document.createElement('div');
    wrap.className = 'chat-msg-agent';
    if (typeof histIdx === 'number') wrap.setAttribute('data-hist-idx', String(histIdx));
    var sr = document.createElement('span');
    sr.className = 'sr-only';
    sr.textContent = i18n('chat_sr_agent');
    var col = document.createElement('div');
    col.className = 'chat-msg-agent-inner';
    var bub = document.createElement('div');
    bub.className = 'chat-bubble-agent';
    var agentHue = homeChatAgentHueFromKey_(agentKey);
    if (agentHue !== null) {
      bub.classList.add('chat-bubble-agent-tinted');
      bub.style.setProperty('--agent-h', String(agentHue));
    }
    homeChatSetAgentBubbleHtml_(bub, body || '');
    col.appendChild(bub);
    if (metaLine) {
      var metaP = document.createElement('p');
      metaP.className = 'chat-msg-meta';
      metaP.textContent = metaLine;
      col.appendChild(metaP);
    }
    var refsEl = homeChatBuildRefsElement_(references);
    if (refsEl) col.appendChild(refsEl);

    if (typeof histIdx === 'number') {
      (function (turnIdx) {
        var actionsRow = document.createElement('div');
        actionsRow.className = 'chat-msg-actions';
        var copyBtn = homeChatBuildActionBtn_('fa-copy', 'chat_action_copy', 'copy', turnIdx);
        var pdfBtn = homeChatBuildActionBtn_(
          'fa-file-pdf',
          'chat_action_export_pdf',
          'export-pdf',
          turnIdx,
        );
        var regenBtn = homeChatBuildActionBtn_(
          'fa-rotate-right',
          'chat_action_regenerate',
          'regenerate',
          turnIdx,
        );
        var reformBtn = homeChatBuildActionBtn_(
          'fa-pen',
          'chat_action_reformulate',
          'reformulate',
          turnIdx,
        );
        copyBtn.addEventListener('click', function () {
          var turn = homeChatGetTurn_(turnIdx);
          var text = homeChatFormatTurnForCopy_(turn);
          copyBtn.disabled = true;
          homeChatCopyText_(text)
            .then(function () {
              if (A.toast) A.toast.success(i18n('chat_copy_done'));
            })
            .catch(function () {
              if (A.toast) A.toast.error(i18n('chat_copy_error'));
            })
            .finally(function () {
              copyBtn.disabled = false;
            });
        });
        pdfBtn.addEventListener('click', function () {
          if (pdfBtn.disabled) return;
          pdfBtn.disabled = true;
          homeChatExportPdf_({ mode: 'turn', turnIndex: turnIdx });
          setTimeout(function () {
            pdfBtn.disabled = false;
          }, 1200);
        });
        regenBtn.addEventListener('click', function () {
          if (regenBtn.disabled) return;
          homeChatRegenerateFromAgentIdx_(turnIdx);
        });
        reformBtn.addEventListener('click', function () {
          var pair = homeChatFindUserTurnForAgentIdx_(turnIdx);
          if (!pair || !questionEl) return;
          questionEl.value = String(pair.turn.content || '');
          questionEl.focus();
          try {
            var len = questionEl.value.length;
            questionEl.setSelectionRange(len, len);
          } catch (eSel) {}
        });
        actionsRow.appendChild(copyBtn);
        actionsRow.appendChild(pdfBtn);
        actionsRow.appendChild(regenBtn);
        actionsRow.appendChild(reformBtn);
        col.appendChild(actionsRow);
      })(histIdx);
      homeChatRefreshRegenerateButtons_();
    }

    // Feedback buttons (only when we have an eventId)
    if (eventId) {
      (function (eid, aid, aname, questionSnippet) {
        var fbRow = document.createElement('div');
        fbRow.className = 'chat-feedback-row mt-2 flex items-center gap-2';
        var upBtn = document.createElement('button');
        upBtn.type = 'button';
        upBtn.className = 'chat-feedback-btn';
        upBtn.setAttribute('aria-label', i18n('chat_feedback_up'));
        upBtn.innerHTML = '<i class="fa-regular fa-thumbs-up" aria-hidden="true"></i>';
        var downBtn = document.createElement('button');
        downBtn.type = 'button';
        downBtn.className = 'chat-feedback-btn';
        downBtn.setAttribute('aria-label', i18n('chat_feedback_down'));
        downBtn.innerHTML = '<i class="fa-regular fa-thumbs-down" aria-hidden="true"></i>';
        var fbStatus = document.createElement('span');
        fbStatus.className = 'chat-feedback-status text-xs text-slate-400 dark:text-slate-400';

        function submitFeedback(rating) {
          upBtn.disabled = true;
          downBtn.disabled = true;
          upBtn.classList.toggle('chat-feedback-btn-active', rating === 'up');
          downBtn.classList.toggle('chat-feedback-btn-active', rating === 'down');
          google.script.run
            .withSuccessHandler(function () {
              fbStatus.textContent = i18n('chat_feedback_done');
            })
            .withFailureHandler(function () {
              upBtn.disabled = false;
              downBtn.disabled = false;
              fbStatus.textContent = i18n('chat_feedback_error');
            })
            .metricsTrackFeedback(eid, rating, aid || '', aname || '', questionSnippet || '');
        }

        upBtn.addEventListener('click', function () { submitFeedback('up'); });
        downBtn.addEventListener('click', function () { submitFeedback('down'); });
        fbRow.appendChild(upBtn);
        fbRow.appendChild(downBtn);
        fbRow.appendChild(fbStatus);
        col.appendChild(fbRow);
      })(eventId, agentId, agentKey, (body || '').slice(0, 200));
    }

    wrap.appendChild(sr);
    wrap.appendChild(col);
    thread.appendChild(wrap);
    homeChatScrollToBottom();
  }

  function homeChatResetThread() {
    var thread = document.getElementById('chat-thread');
    if (!thread) return;
    thread.innerHTML = '';
    homeChatRemoveThinking();
    var p = document.createElement('p');
    p.id = 'chat-empty';
    p.className = 'chat-empty';
    var emptyKey = homeChatIsOnboardingPage_()
      ? 'chat_empty_hint_onboarding'
      : homeChatIsProposalBuildingPage_()
        ? 'chat_empty_hint_proposal_building'
        : 'chat_empty_hint';
    p.setAttribute('data-i18n', emptyKey);
    p.textContent = i18n(emptyKey);
    thread.appendChild(p);
  }

  function homeChatApplyPageChrome_(page) {
    var pg = page || S.get('activePage') || 'home';
    var isOb = pg === 'onboarding';
    var isPb = pg === 'proposal-building';
    if (dashboardTitleEl) {
      dashboardTitleEl.textContent = i18n(
        isOb ? 'page_onboarding_title' : isPb ? 'page_proposal_building_title' : 'dashboard_title',
      );
    }
    if (dashboardLeadEl) {
      dashboardLeadEl.textContent = i18n(
        isOb ? 'page_onboarding_chat_lead' : isPb ? 'page_proposal_building_chat_lead' : 'dashboard_lead',
      );
    }
    if (consultHeadingEl) {
      consultHeadingEl.textContent = i18n(
        isOb ? 'onboarding_consult_heading' : isPb ? 'pb_consult_heading' : 'static_consult_heading',
      );
    }
    var composerLead = document.querySelector('.chat-composer-lead');
    if (composerLead) {
      composerLead.textContent = i18n(
        isOb ? 'onboarding_consult_lead' : isPb ? 'pb_consult_lead' : 'static_consult_lead',
      );
    }
    if (chatAttachRow && homeChatIsOnboardingPage_()) {
      homeChatClearAttachment_();
    }
    if (chatAttachRow) {
      var llm = S.get('lastLlmCfg') || {};
      chatAttachRow.classList.toggle(
        'hidden',
        llm.mode !== 'globant' || isOb,
      );
    }
    var pbValidateBtn = document.getElementById('pb-validate-brief-btn');
    if (pbValidateBtn) {

      A.proposalBuilding.onEnterPage();

  function homeChatRebuildThreadFromState_() {
    var hist = homeChatGetHistory_();
    homeChatResetThread();
    if (!hist.length) {
      homeChatRestoreQuickPromptStarters_();
      return;
    }
    homeChatHideQuickPromptStarters_();
    for (var i = 0; i < hist.length; i++) {
      var m = hist[i];
      if (m.role === 'user') {
        homeChatAppendUser(m.content || '', m.attachmentName || '');
        if (m.submitMode) S.set('chatLastSubmitMode', m.submitMode);
      } else if (m.role === 'assistant') {
        homeChatAppendAgent(
          m.content || '',
          m.metaLine || '',
          m.references || [],
          m.agentKey || '',
          m.eventId || '',
          m.agentId || '',
          i,
        );
      }
    }
    homeChatRefreshRegenerateButtons_();
  }

    homeChatRebuildThreadFromState_();

  // ── Conversation ID ──────────────────────────────────────────────────────────

  function homeChatNewConvId_() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) {
      return crypto.randomUUID();
    }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0;
      var v = c === 'x' ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }

  function homeChatEnsureConvId_() {
    var key = homeChatConvKey_();
    var cid = S.get(key);
    if (!cid || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(cid))) {
      cid = homeChatNewConvId_();
      S.set(key, cid);
    }
    return cid;
  }

  if (!S.get('chatConvId')) {
    S.set('chatConvId', homeChatNewConvId_());
  }
  if (!S.get('onboardingChatConvId')) {
    S.set('onboardingChatConvId', homeChatNewConvId_());
  }
  if (!S.get('proposalBuildingChatConvId')) {
    S.set('proposalBuildingChatConvId', homeChatNewConvId_());
  }

  // ── History panel ─────────────────────────────────────────────────────────

  var histPanel = document.getElementById('chat-history-panel');
  var histList = document.getElementById('chat-history-list');
  var histEmpty = document.getElementById('chat-history-empty');
  var histLoading = document.getElementById('chat-history-loading');
  var histToggleBtn = document.getElementById('chat-history-toggle-btn');

  function homeChatSaveCurrentConversation_() {
    var hist = homeChatGetHistory_();
    if (!hist.length) return;
    var convKey = homeChatConvKey_();
    var convId = homeChatEnsureConvId_();
    var firstUser = '';
    for (var k = 0; k < hist.length; k++) {
      if (hist[k].role === 'user') { firstUser = String(hist[k].content || ''); break; }
    }
    var titlePrefix = homeChatIsOnboardingPage_()
      ? i18n('nav_onboarding') + ': '
      : homeChatIsProposalBuildingPage_()
        ? i18n('nav_proposal_building') + ': '
        : '';
    var title = (titlePrefix + (firstUser || i18n('chat_history_untitled'))).slice(0, 80);
    try {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.convId && res.convId !== convId) {
            S.set(convKey, res.convId);
          }
        })
        .withFailureHandler(function () {
          if (A.toast) A.toast.error(i18n('chat_history_save_error'));
        })
        .chatHistorySave(convId, title, JSON.stringify(hist));
    } catch (eSave) {}
  }

  function homeChatLoadHistoryList_() {
    if (!histList || !histPanel) return;
    if (histLoading) histLoading.classList.remove('hidden');
    if (histEmpty) histEmpty.classList.add('hidden');
    histList.innerHTML = '';
    google.script.run
      .withSuccessHandler(function (res) {
        if (histLoading) histLoading.classList.add('hidden');
        var items = (res && res.items) || [];
        if (!items.length) {
          if (histEmpty) histEmpty.classList.remove('hidden');
          return;
        }
        items.forEach(function (item) {
          var li = document.createElement('li');
          li.className = 'chat-history-item group flex items-start justify-between gap-2 rounded-lg px-2 py-2 hover:bg-slate-100 dark:hover:bg-slate-700';

          var infoBtn = document.createElement('button');
          infoBtn.type = 'button';
          infoBtn.className = 'flex-1 min-w-0 text-left';

          var dateEl = document.createElement('span');
          dateEl.className = 'block text-[10px] text-slate-400 dark:text-slate-400';
          var d = new Date(item.tsCreated);
          dateEl.textContent = isNaN(d.getTime()) ? item.tsCreated : d.toLocaleDateString();

          var titleEl = document.createElement('span');
          titleEl.className = 'block text-xs text-slate-700 dark:text-slate-300 truncate';
          titleEl.textContent = item.title || i18n('chat_history_untitled');

          infoBtn.appendChild(dateEl);
          infoBtn.appendChild(titleEl);

          infoBtn.addEventListener('click', (function (cid) {
            return function () {
              homeChatLoadConversation_(cid);
              if (histPanel) A.hideFloatingPanel(histPanel);
            };
          })(item.convId));

          var delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'chat-history-del-btn shrink-0 rounded p-1 text-slate-400 opacity-0 group-hover:opacity-100 hover:text-red-500 transition-opacity';
          delBtn.setAttribute('aria-label', i18n('chat_history_delete'));
          delBtn.innerHTML = '<i class="fa-solid fa-trash text-[10px]" aria-hidden="true"></i>';
          delBtn.addEventListener('click', (function (cid, liEl) {
            return function (ev) {
              ev.stopPropagation();
              google.script.run
                .withSuccessHandler(function () { liEl.remove(); if (!histList.children.length && histEmpty) histEmpty.classList.remove('hidden'); })
                .withFailureHandler(function () {})
                .chatHistoryDelete(cid);
            };
          })(item.convId, li));

          li.appendChild(infoBtn);
          li.appendChild(delBtn);
          histList.appendChild(li);
        });
      })
      .withFailureHandler(function () {
        if (histLoading) histLoading.classList.add('hidden');
        if (histEmpty) histEmpty.classList.remove('hidden');
        if (A.toast) A.toast.error(i18n('chat_history_load_error'));
      })
      .chatHistoryList();
  }

  function homeChatLoadConversation_(convId) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok || !res.messagesJson) return;
        var msgs = [];
        try { msgs = JSON.parse(res.messagesJson); } catch (eP) {}
        if (!msgs.length) return;
        homeChatResetThread();
        clearHistory();
        S.set(homeChatConvKey_(), convId);
        var lastUser = '';
        for (var i = 0; i < msgs.length; i++) {
          var m = msgs[i];
          var h = homeChatGetHistory_();
          var entry = {
            role: m.role,
            content: m.content,
            ts: m.ts || Date.now(),
            metaLine: m.metaLine,
            references: m.references,
            agentKey: m.agentKey,
            eventId: m.eventId,
            agentId: m.agentId,
            attachmentName: m.attachmentName,
            submitMode: m.submitMode,
          };
          h.push(entry);
          while (h.length > MAX_HISTORY * 2) h.shift();
          homeChatSetHistory_(h);
          var turnIdx = h.length - 1;
          if (m.role === 'user') {
            homeChatAppendUser(m.content || '', m.attachmentName || '');
            lastUser = m.content || '';
            if (m.submitMode) S.set('chatLastSubmitMode', m.submitMode);
          } else if (m.role === 'assistant') {
            homeChatAppendAgent(
              m.content || '',
              m.metaLine || '',
              m.references || [],
              m.agentKey || '',
              m.eventId || '',
              m.agentId || '',
              turnIdx,
            );
          }
        }
        if (A.toast) A.toast.info(i18n('chat_history_heading'));
        homeChatHideQuickPromptStarters_();
      })
      .withFailureHandler(function () {
        if (A.toast) A.toast.error(i18n('chat_history_load_error'));
      })
      .chatHistoryLoad(convId);
  }

  function homeChatResolveUiLocale_(localeOpt) {
    if (localeOpt != null && String(localeOpt).trim() !== '') {
      return String(localeOpt).slice(0, 2) === 'en' ? 'en' : 'es';
    }
    var ci = S.get('cachedI18n');
    return ci && ci._locale === 'en' ? 'en' : 'es';
  }

  /** Dispara el mismo envío que Enter / botón Enviar según modo Globant vs documentos.
   * @return {boolean} true si se disparó el envío (click en botón de consulta). */
  function homeChatTriggerSend_() {
    if (!questionEl) return false;
    var q = (questionEl.value || '').trim();
    if (!q) return false;
    if (globantAgentRow && !globantAgentRow.classList.contains('hidden') &&
        askAgentBtn && !askAgentBtn.disabled) {
      askAgentBtn.click();
      return true;
    }
    if (askDriveRow && !askDriveRow.classList.contains('hidden') &&
        askBtn && !askBtn.disabled) {
      askBtn.click();
      return true;
    }
    if (askStatus) {
      askStatus.textContent = i18n('home_chat_banner_setup');
      askStatus.classList.add('err');
    } else if (A.toast) {
      A.toast.error(i18n('home_chat_banner_setup'));
    }
    return false;
  }

  function homeChatHideQuickPromptStarters_() {
    S.set(homeChatStartersKey_(), false);
    var container = document.getElementById('chat-quick-prompts');
    if (container) container.classList.add('hidden');
  }

  function homeChatRestoreQuickPromptStarters_() {
    var qp = homeChatGetQuickPrompts_();
    if (!qp || !qp.length) return;
    S.set(homeChatStartersKey_(), true);
    homeChatApplyQuickPrompts_(qp, null);
  }

  function homeChatApplyQuickPromptsForActivePage_(locale) {
    var hist = homeChatGetHistory_();
    if (hist.length) return;
    var qp = homeChatGetQuickPrompts_();
    if (!qp || !qp.length) return;
    S.set(homeChatStartersKey_(), true);
    homeChatApplyQuickPrompts_(qp, locale);
  }

  function homeChatApplyQuickPrompts_(prompts, locale) {
    var container = document.getElementById('chat-quick-prompts');
    if (!container) return;
    if (!prompts || !prompts.length) { container.classList.add('hidden'); return; }
    var list = container.querySelector('.chat-qp-list');
    if (!list) return;
    list.innerHTML = '';
    var loc = homeChatResolveUiLocale_(locale);
    prompts.forEach(function (p) {
      var text = String((loc === 'en' ? p.en : p.es) || p.es || p.en || '').trim();
      if (!text) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chat-qp-chip';
      btn.textContent = text;
      btn.addEventListener('click', function () {
        if (questionEl) {
          questionEl.value = text;
        }
        if (homeChatTriggerSend_()) {
          homeChatHideQuickPromptStarters_();
        }
      });
      list.appendChild(btn);
    });
    container.classList.toggle('hidden', !list.children.length);
    if (S.get(homeChatStartersKey_()) === false) {
      container.classList.add('hidden');
    }
  }

  function homeChatFinishAgentResponse_(answer, metaLine, references, agentKey, eventId, agentId, submitMode) {
    var aIdx = pushHistory('assistant', answer, {
      metaLine: metaLine || '',
      references: references || [],
      agentKey: agentKey || '',
      eventId: eventId || '',
      agentId: agentId || '',
      submitMode: submitMode || '',
    });
    homeChatAppendAgent(
      answer,
      metaLine,
      references || [],
      agentKey,
      eventId,
      agentId,
      aIdx,
    );
    askStatus.textContent = '\u00a0';
    homeChatSaveCurrentConversation_();
  }

  function homeChatRunDriveQuery_(q, skipUserAppend) {

      homeChatAppendUser(q);
      pushHistory('user', q, { submitMode: 'drive' });
      S.set('chatLastSubmitMode', 'drive');

    homeChatBeginDriveProgress_();
    var histJson = skipUserAppend ? homeChatHistoryJsonForRegenerate_() : getHistoryJson();

      .withSuccessHandler(function (res) {
        askBtn.disabled = false;
        askAgentBtn.disabled = false;
        homeChatRemoveThinking();
        var answer = res.answer || '';
        var metaLine = '';
        if (res.meta && typeof res.meta.filesUsed === 'number' && res.meta.filesUsed > 0) {
          metaLine = i18nFmt('meta_files_suffix', { n: res.meta.filesUsed });
        }
        homeChatFinishAgentResponse_(
          answer,
          metaLine,
          (res.meta && res.meta.references) || [],
          '',
          res.eventId || '',
          'drive_docs',
          'drive',

      .withFailureHandler(function (e) {
        askBtn.disabled = false;
        askAgentBtn.disabled = false;
        homeChatRemoveThinking();
        askStatus.textContent = e && e.message ? e.message : i18n('err_ask');
        askStatus.classList.add('err');

      .askAboutDocuments(q, A.getSelectedIds(), histJson);

    askAgentBtn.disabled = true;
    askStatus.textContent = i18n('busy_consulting');

          res.agentName || 'onboarding',
          res.eventId || '',
          agentId,
          'onboarding',
        );
      })
      .withFailureHandler(function (e) {
        askAgentBtn.disabled = false;
        askBtn.disabled = false;
        homeChatRemoveThinking();
        A.reportRpcError(e, {
          scope: 'onboardingChat',
          fallbackKey: 'err_ask_agent',
          modal: true,
          setStatus: function (msg) {
            askStatus.textContent = msg;
            askStatus.classList.add('err');
          },
        });
      })
      .globantAnswerWithAgent(gp, agentId, histJson);
  }

  function homeChatRunOrchestratorQuery_(gp, skipUserAppend) {
    if (!skipUserAppend) {
      homeChatAppendUser(gp);
      pushHistory('user', gp, { submitMode: 'agent' });
      S.set('chatLastSubmitMode', 'agent');
    }
    askAgentBtn.disabled = true;
    askBtn.disabled = true;
    homeChatBeginRouteProgress_();
    askStatus.textContent = i18n('orch_step_routing');
    var histJson = skipUserAppend ? homeChatHistoryJsonForRegenerate_() : getHistoryJson();
    google.script.run
      .withSuccessHandler(function (route) {
        var agents = route.agents || [];
        var isMulti = agents.length > 1;
        var headline = homeChatRouteHeadline_(route);
        var statusMsg = homeChatResolveMsg_(headline.key, headline.fmt);
        homeChatBeginAnswerProgress_(headline.key, headline.fmt);
        askStatus.textContent = statusMsg;
        var agentIds = agents.map(function (a) { return a.id; });
        if (isMulti) {
          google.script.run
            .withSuccessHandler(function (results) {
              askAgentBtn.disabled = false;
              askBtn.disabled = false;
              homeChatRemoveThinking();
              if (!results || !results.length) {
                var emptyIdx = pushHistory('assistant', i18n('orch_no_results'), { submitMode: 'agent' });
                homeChatAppendAgent(i18n('orch_no_results'), '', [], '', '', '', emptyIdx);
              } else {
                var combined = [];
                for (var k = 0; k < results.length; k++) {
                  var badge = i18nFmt('orch_routed_badge', { agent: results[k].agentName });
                  var agentTintKey =
                    results[k].agentName || (agentIds[k] != null ? String(agentIds[k]) : '');
                  var aIdx = pushHistory('assistant', results[k].answer || '', {
                    metaLine: badge,
                    references: (results[k].meta && results[k].meta.references) || [],
                    agentKey: agentTintKey,
                    eventId: results[k].eventId || '',
                    agentId: agentIds[k] != null ? String(agentIds[k]) : '',
                    submitMode: 'agent',
                  });
                  homeChatAppendAgent(
                    results[k].answer || '',
                    badge,
                    (results[k].meta && results[k].meta.references) || [],
                    agentTintKey,
                    results[k].eventId || '',
                    agentIds[k] != null ? String(agentIds[k]) : '',
                    aIdx,
                  );
                  combined.push(results[k].answer || '');
                }
                if (combined.length > 1) {
                  var hist = homeChatGetHistory_();
                  if (hist.length && hist[hist.length - 1].role === 'assistant') {
                    hist[hist.length - 1].content = combined.join('\n---\n');
                    homeChatSetHistory_(hist);
                  }
                }
              }
              askStatus.textContent = '\u00a0';
              homeChatSaveCurrentConversation_();
              homeChatRefreshRegenerateButtons_();
            })
            .withFailureHandler(function (e) {
              askAgentBtn.disabled = false;
              askBtn.disabled = false;
              homeChatRemoveThinking();
              askStatus.textContent = e && e.message ? e.message : i18n('err_ask_agent');
              askStatus.classList.add('err');
            })
            .globantAnswerMultiAgent(gp, agentIds, histJson);
        } else {
          google.script.run
            .withSuccessHandler(function (res) {
              askAgentBtn.disabled = false;
              askBtn.disabled = false;
              homeChatRemoveThinking();
              var answer = res.answer || '';
              var badge = i18nFmt('orch_routed_badge', { agent: res.agentName || '' });
              var singleTintKey =
                res.agentName ||
                (agentIds && agentIds.length ? String(agentIds[0]) : '');
              var singleAgentId = agentIds && agentIds.length ? String(agentIds[0]) : '';
              homeChatFinishAgentResponse_(
                answer,
                badge,
                (res.meta && res.meta.references) || [],
                singleTintKey,
                res.eventId || '',
                singleAgentId,
                'agent',
              );
            })
            .withFailureHandler(function (e) {
              askAgentBtn.disabled = false;
              askBtn.disabled = false;
              homeChatRemoveThinking();
              askStatus.textContent = e && e.message ? e.message : i18n('err_ask_agent');
              askStatus.classList.add('err');
            })
            .globantAnswerWithAgent(gp, agentIds[0], histJson);
        }
      })
      .withFailureHandler(function (e) {
        askAgentBtn.disabled = false;
        askBtn.disabled = false;
        homeChatRemoveThinking();
        askStatus.textContent = e && e.message ? e.message : i18n('err_ask_agent');
        askStatus.classList.add('err');
      })
      .globantRouteQuery(gp);
  }

  function homeChatRegenerateFromAgentIdx_(agentHistIdx) {
    var hist = homeChatGetHistory_();
    if (!hist.length || hist[hist.length - 1].role !== 'assistant') return;
    if (agentHistIdx < 0 || agentHistIdx >= hist.length || hist[agentHistIdx].role !== 'assistant') return;
    var pair = homeChatFindUserTurnForAgentIdx_(agentHistIdx);
    if (!pair || !pair.turn) return;
    var q = String(pair.turn.content || '').trim();
    if (!q) return;
    homeChatRemoveThinking();
    var mode = pair.turn.submitMode || S.get('chatLastSubmitMode') || 'agent';
    homeChatRemoveAssistantRepliesAfterUserIdx_(pair.idx);
    homeChatHideQuickPromptStarters_();
    askStatus.textContent = '';
    askStatus.classList.remove('err');
    askStatus.textContent = i18n('chat_regenerate_busy');
    if (mode === 'drive') {
      homeChatRunDriveQuery_(q, true);
      return;
    }
    if (mode === 'ephemeral') {
      var payload = S.get('chatLastEphemeralPayload');
      if (!payload) {
        if (askStatus) {
          askStatus.textContent = i18n('chat_regenerate_no_attachment');
          askStatus.classList.add('err');
        } else if (A.toast) {
          A.toast.error(i18n('chat_regenerate_no_attachment'));
        }
        return;
      }
      homeChatRunEphemeralQuery_(q, payload, true);
      return;
    }
    if (mode === 'onboarding') {
      homeChatRunForcedAgentQuery_(CHAT_AGENT_ONBOARDING, q, true);
      return;
    }
    if (mode === 'proposal_building') {
      homeChatRunProposalBuildingAgent_(q, true);
      return;
    }
    homeChatRunOrchestratorQuery_(q, true);
  }

  // --- Event listeners ---

  if (askBtn) {
    askBtn.addEventListener('click', function () {
      askStatus.textContent = '';
      askStatus.classList.remove('err');
      var q = (questionEl.value || '').trim();
      if (!q) {
        askStatus.textContent = i18n('ask_empty_question');
        askStatus.classList.add('err');
        return;
      }
      homeChatHideQuickPromptStarters_();
      questionEl.value = '';
      homeChatRunDriveQuery_(q, false);
    });
  }

  if (chatAttachBtn && chatAttachInput) {
    chatAttachBtn.addEventListener('click', function () {
      chatAttachInput.click();
    });
    chatAttachInput.addEventListener('change', function () {
      var f = chatAttachInput.files && chatAttachInput.files[0];
      if (!f) return;
      chatAttachBtn.disabled = true;
      var readFn = homeChatReadPdfAttachment_;
      if (
        homeChatIsProposalBuildingPage_() &&
        A.proposalBuilding &&
        typeof A.proposalBuilding.readAttachmentFile === 'function'
      ) {
        readFn = A.proposalBuilding.readAttachmentFile;
      }
      readFn(
        f,
        function (wrap) {
          chatAttachBtn.disabled = false;
          homeChatShowAttachment_(wrap);
        },
        function (err) {
          chatAttachBtn.disabled = false;
          homeChatClearAttachment_();
          if (askStatus) {
            askStatus.textContent = err && err.message ? err.message : i18n('err_ephemeral_doc_payload');
            askStatus.classList.add('err');
          }
        },
      );
    });
  }

  if (chatAttachClear) {
    chatAttachClear.addEventListener('click', function () {
      homeChatClearAttachment_();
    });
  }

  if (askAgentBtn) {
    askAgentBtn.addEventListener('click', function () {
      askStatus.textContent = '';
      askStatus.classList.remove('err');
      var gp = (questionEl.value || '').trim();
      var forcedAgent = homeChatForcedAgentId_();
      var attached = homeChatGetAttachment_();

      if (homeChatIsProposalBuildingPage_() && A.proposalBuilding) {
        var attachName = attached ? attached.name : '';
        if (attached) {
          homeChatClearAttachment_();
        }
        homeChatHideQuickPromptStarters_();
        questionEl.value = '';
        var pbPhase = A.proposalBuilding.getPhase ? A.proposalBuilding.getPhase() : 'intake';
        if (pbPhase === 'building') {
          if (!gp) {
            askStatus.textContent = i18n('ask_empty_question');
            askStatus.classList.add('err');
            return;
          }
          homeChatRunProposalBuildingAgent_(gp, false);
          return;
        }
        if (
          A.proposalBuilding.wantsValidatePhrase &&
          A.proposalBuilding.wantsValidatePhrase(gp)
        ) {
          A.proposalBuilding.onSend(gp, attachName, attached);
          return;
        }
        if (!gp && !attachName) {
          askStatus.textContent = i18n('pb_err_extract_empty');
          askStatus.classList.add('err');
          return;
        }
        A.proposalBuilding.onSend(gp || i18n('pb_btn_validate_brief'), attachName, attached);
        return;
      }

      if (attached && !forcedAgent) {
        if (!gp) {
          askStatus.textContent = i18n('chat_ephemeral_need_prompt');
          askStatus.classList.add('err');
          return;
        }
        homeChatHideQuickPromptStarters_();
        questionEl.value = '';
        var attachPayloadJson = JSON.stringify(attached);
        var attachName = attached.name;
        homeChatClearAttachment_();
        homeChatRunEphemeralQuery_(gp, attachPayloadJson, false, attachName);
        return;
      }

      if (!gp) {
        askStatus.textContent = i18n('ask_empty_question');
        askStatus.classList.add('err');
        return;
      }
      homeChatHideQuickPromptStarters_();
      questionEl.value = '';
      askAgentBtn.disabled = true;
      askBtn.disabled = true;
      if (forcedAgent) {
        homeChatRunForcedAgentQuery_(forcedAgent, gp, false);
        return;
      }
      homeChatRunOrchestratorQuery_(gp, false);
    });
  }

  var chatNewBtn = document.getElementById('chat-new-btn');
  if (chatNewBtn) {
    chatNewBtn.addEventListener('click', function () {
      homeChatSaveCurrentConversation_();
      clearHistory();
      S.set(homeChatConvKey_(), homeChatNewConvId_());
      if (homeChatIsProposalBuildingPage_() && A.proposalBuilding && A.proposalBuilding.resetSession) {
        A.proposalBuilding.resetSession();
      }
      homeChatResetThread();
      if (questionEl) questionEl.value = '';
      homeChatClearAttachment_();
      if (askStatus) { askStatus.textContent = ''; askStatus.classList.remove('err'); }
      homeChatRestoreQuickPromptStarters_();
      homeChatApplyPageChrome_(S.get('activePage'));
    });
  }

  if (questionEl) {
    questionEl.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' || ev.shiftKey) return;
      if (ev.isComposing) return;
      ev.preventDefault();
      if (globantAgentRow && !globantAgentRow.classList.contains('hidden') &&
          askAgentBtn && !askAgentBtn.disabled) {
        askAgentBtn.click();
        return;
      }
      if (askDriveRow && !askDriveRow.classList.contains('hidden') &&
          askBtn && !askBtn.disabled) {
        askBtn.click();
        return;
      }
    });
  }

  A.chat = {
    updateHomeChatBanner: updateHomeChatBanner,
    applyConsultModeLabels: applyConsultModeLabels,
    applyConsultModeInitialState: applyConsultModeInitialState,
    applyPageChrome: homeChatApplyPageChrome_,
    onEnterChatPage: homeChatOnEnterChatPage_,
    resetThread: homeChatResetThread,
    appendUser: homeChatAppendUser,
    appendAgent: homeChatAppendAgent,
    setThinking: homeChatSetThinking,
    removeThinking: homeChatRemoveThinking,
    updateThinking: homeChatUpdateThinking,
    saveCurrentConversation: homeChatSaveCurrentConversation_,
    applyQuickPrompts: homeChatApplyQuickPrompts_,
    applyQuickPromptsForActivePage: homeChatApplyQuickPromptsForActivePage_,
    restoreQuickPromptStarters: homeChatRestoreQuickPromptStarters_,
    getAttachment: homeChatGetAttachment_,
    clearAttachment: homeChatClearAttachment_,
    appendUserForProposalBuilding: homeChatAppendUserForProposalBuilding_,
    runProposalBuildingAgent_: homeChatRunProposalBuildingAgent_,
    onProposalBuildingReady_: homeChatOnProposalBuildingReady_,
    THINKING_ID: CHAT_THINKING_ID,
  };
})(window.Aviators);
</script>
