<script>
(function (A) {
  var S = A.state;
  var i18n = A.i18n;
  var i18nFmt = A.i18nFmt;

  function escapeCsvField(val) {
    var s = String(val == null ? '' : val);
    if (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  function downloadCsv(filename, headerRow, dataRows) {
    var lines = [headerRow.map(escapeCsvField).join(',')];
    for (var i = 0; i < dataRows.length; i++) {
      lines.push(dataRows[i].map(escapeCsvField).join(','));
    }
    var csv = lines.join('\r\n');
    var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  }

  function exportContentsCsv() {
    var cache = S.get('contentsItemsCache') || [];
    if (!cache.length) {
      if (A.toast) A.toast.info(i18n('export_no_data'));
      return;
    }
    var headers = ['title', 'content_type', 'client_name', 'summary', 'description', 'created_at', 'updated_at'];
    var rows = [];
    for (var i = 0; i < cache.length; i++) {
      var c = cache[i].common || {};
      rows.push([
        c.title || '', c.content_type || '', c.client_name || '',
        c.summary || '', c.description || '', c.created_at || '', c.updated_at || '',
      ]);
    }
    downloadCsv('aviators-contents.csv', headers, rows);
    if (A.toast) A.toast.success(i18n('export_done'));
  }

  function exportClientsCsv() {
    var cache = S.get('clientsItemsCache') || [];
    if (!cache.length) {
      if (A.toast) A.toast.info(i18n('export_no_data'));
      return;
    }
    var headers = ['client_name', 'industry', 'country', 'main_contact_name', 'main_contact_email'];
    var rows = [];
    for (var i = 0; i < cache.length; i++) {
      var cl = cache[i];
      rows.push([
        cl.client_name || '', cl.industry || '', cl.country || '',
        cl.main_contact_name || '', cl.main_contact_email || '',
      ]);
    }
    downloadCsv('aviators-clients.csv', headers, rows);
    if (A.toast) A.toast.success(i18n('export_done'));
  }

  function parseCsvText(text) {
    var lines = text.split(/\r?\n/).filter(function (l) { return l.trim().length > 0; });
    if (lines.length < 2) return { headers: [], rows: [] };
    var headers = parseCsvLine(lines[0]);
    var rows = [];
    for (var i = 1; i < lines.length; i++) {
      rows.push(parseCsvLine(lines[i]));
    }
    return { headers: headers, rows: rows };
  }

  function parseCsvLine(line) {
    var fields = [];
    var current = '';
    var inQuotes = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (inQuotes) {
        if (ch === '"' && i + 1 < line.length && line[i + 1] === '"') {
          current += '"'; i++;
        } else if (ch === '"') {
          inQuotes = false;
        } else {
          current += ch;
        }
      } else {
        if (ch === '"') { inQuotes = true; }
        else if (ch === ',') { fields.push(current); current = ''; }
        else { current += ch; }
      }
    }
    fields.push(current);
    return fields;
  }

  function importCsvFlow(target) {
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.csv,text/csv';
    fileInput.addEventListener('change', function () {
      var file = fileInput.files && fileInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        var text = ev.target.result;
        var parsed = parseCsvText(text);
        if (!parsed.rows.length) {
          if (A.toast) A.toast.error(i18n('import_empty'));
          return;
        }
        showImportPreview(target, parsed);
      };
      reader.readAsText(file);
    });
    fileInput.click();
  }

  function showImportPreview(target, parsed) {
    var overlay = document.createElement('div');
    overlay.className = 'fixed inset-0 z-[9998] flex items-center justify-center bg-black/40 p-4';
    var dialog = document.createElement('div');
    dialog.className = 'max-h-[80vh] w-full max-w-2xl overflow-auto rounded-2xl bg-white p-6 shadow-xl dark:bg-slate-800';

    var title = document.createElement('h3');
    title.className = 'text-lg font-bold text-slate-900 dark:text-slate-100 mb-3';
    title.textContent = i18n('import_preview_title');
    dialog.appendChild(title);

    var info = document.createElement('p');
    info.className = 'text-sm text-slate-600 dark:text-slate-400 mb-4';
    info.textContent = i18nFmt('import_preview_rows', { n: parsed.rows.length });
    dialog.appendChild(info);

    var tableWrap = document.createElement('div');
    tableWrap.className = 'overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-600 mb-4';
    var table = document.createElement('table');
    table.className = 'min-w-full text-xs';
    var thead = document.createElement('thead');
    thead.className = 'bg-slate-50 dark:bg-slate-700';
    var headerTr = document.createElement('tr');
    for (var h = 0; h < parsed.headers.length; h++) {
      var th = document.createElement('th');
      th.className = 'px-2 py-1 text-left font-medium text-slate-600 dark:text-slate-300';
      th.textContent = parsed.headers[h];
      headerTr.appendChild(th);
    }
    thead.appendChild(headerTr);
    table.appendChild(thead);
    var tbody = document.createElement('tbody');
    var previewMax = Math.min(parsed.rows.length, 10);
    for (var r = 0; r < previewMax; r++) {
      var tr = document.createElement('tr');
      tr.className = 'border-t border-slate-100 dark:border-slate-600';
      for (var c = 0; c < parsed.headers.length; c++) {
        var td = document.createElement('td');
        td.className = 'px-2 py-1 text-slate-700 dark:text-slate-300';
        td.textContent = (parsed.rows[r] && parsed.rows[r][c]) || '';
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    if (parsed.rows.length > 10) {
      var moreRow = document.createElement('tr');
      var moreTd = document.createElement('td');
      moreTd.colSpan = parsed.headers.length;
      moreTd.className = 'px-2 py-1 text-center text-slate-400';
      moreTd.textContent = '… + ' + (parsed.rows.length - 10) + ' more';
      moreRow.appendChild(moreTd);
      tbody.appendChild(moreRow);
    }
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    dialog.appendChild(tableWrap);

    var btnRow = document.createElement('div');
    btnRow.className = 'flex items-center gap-3 justify-end';
    var cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'btn btn-sm btn-secondary';
    cancelBtn.innerHTML = '<i class="fa-solid fa-xmark" aria-hidden="true"></i> <span>' + i18n('import_cancel') + '</span>';
    cancelBtn.addEventListener('click', function () { document.body.removeChild(overlay); });
    var confirmBtn = document.createElement('button');
    confirmBtn.type = 'button';
    confirmBtn.className = 'btn btn-sm btn-primary';
    confirmBtn.innerHTML = '<i class="fa-solid fa-file-import" aria-hidden="true"></i> <span>' + i18nFmt('import_confirm', { n: parsed.rows.length }) + '</span>';
    confirmBtn.addEventListener('click', function () {
      document.body.removeChild(overlay);
      runImport(target, parsed);
    });
    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(confirmBtn);
    dialog.appendChild(btnRow);
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);
  }

  function runImport(target, parsed) {
    var rows = parsed.rows;
    var headers = parsed.headers;
    var total = rows.length;
    var done = 0;
    var errors = 0;

    function buildObj(row) {
      var obj = {};
      for (var i = 0; i < headers.length; i++) {
        obj[headers[i]] = (row[i] || '').trim();
      }
      return obj;
    }

    function next() {
      if (done >= total) {
        if (target === 'contents') {
          A.cache.invalidate('contentsList');
          if (A.contents) A.contents.loadList({ skipCache: true });
        } else {
          A.cache.invalidate('clientsList');
          if (A.clients) A.clients.loadList({ skipCache: true });
        }
        var msg = i18nFmt('import_done', { n: total - errors });
        if (errors > 0) msg += ' ' + i18nFmt('import_errors', { n: errors });
        if (A.toast) A.toast.success(msg);
        return;
      }

      if (A.toast && done % 10 === 0) {
        // silent progress
      }

      var obj = buildObj(rows[done]);
      var serverFn = target === 'contents' ? 'contentsSaveDraft' : 'clientsUpsert';
      google.script.run
        .withSuccessHandler(function () { done++; next(); })
        .withFailureHandler(function () { errors++; done++; next(); })
        [serverFn](obj);
    }

    if (A.toast) A.toast.info(i18nFmt('import_progress', { done: 0, total: total }));
    next();
  }

  // --- Export/Import buttons wiring ---

  var contentsExportBtn = document.getElementById('contents-export-btn');
  var contentsImportBtn = document.getElementById('contents-import-btn');
  var clientsExportBtn = document.getElementById('clients-export-btn');
  var clientsImportBtn = document.getElementById('clients-import-btn');

  if (contentsExportBtn) {
    contentsExportBtn.addEventListener('click', function () {
      if (!S.get('canWriteContents')) return;
      exportContentsCsv();
    });
  }
  if (contentsImportBtn) {
    contentsImportBtn.addEventListener('click', function () {
      if (!S.get('canWriteContents')) return;
      importCsvFlow('contents');
    });
  }
  if (clientsExportBtn) {
    clientsExportBtn.addEventListener('click', function () {
      if (!S.get('canWriteContents')) return;
      exportClientsCsv();
    });
  }
  if (clientsImportBtn) {
    clientsImportBtn.addEventListener('click', function () {
      if (!S.get('canWriteContents')) return;
      importCsvFlow('clients');
    });
  }

  A.exportImport = {
    exportContentsCsv: exportContentsCsv,
    exportClientsCsv: exportClientsCsv,
    importCsvFlow: importCsvFlow,
  };
})(window.Aviators);
</script>
