<script>
window.Aviators = window.Aviators || {};
(function (A) {
  function readInitialI18nPack() {
    var node = document.getElementById('aviators-i18n-initial');
    if (!node) return null;
    try {
      return JSON.parse(node.textContent || '{}');
    } catch (eI18nInitial) {
      return null;
    }
  }

  var _state = {
    adminAgentsCache: [],
    adminSelectedAgentId: null,
    adminAgentDocsSkip: 0,
    adminSourcesState: { folders: [], files: [] },
    contentsItemsCache: [],
    contentsSelectedId: null,
    contentsCurrentFile: null,
    contentsRowBusyId: '',
    contentsSortKey: '',
    contentsSortDir: '',
    contentsUploadCancelled: false,
    contentsCurrentTags: [],
    contentsAllTagsCache: [],
    contentsClientsCache: [],
    contentsClientNewMode: false,
    contentsListTotal: 0,
    contentsListHasMore: false,
    contentsListSkip: 0,
    contentsPageSize: 15,
    contentsListLoading: false,
    clientsItemsCache: [],
    clientsSelectedId: null,
    clientsListSkip: 0,
    clientsPageSize: 15,
    clientsListTotal: 0,
    clientsListHasMore: false,
    contextFiles: null,
    contextFilesNote: '',
    chatHistory: [],
    onboardingChatHistory: [],
    proposalBuildingChatHistory: [],
    proposalBuildingChatConvId: '',
    proposalBuildingPhase: 'intake',
    proposalBuildingDraftBrief: null,
    proposalBuildingValidatedBrief: null,
    proposalBuildingContext: null,
    contentsPendingOpenId: '',
    canViewAgents: false,
    canViewCatalog: false,
    canViewTags: false,
    canViewClients: false,
    canViewMetrics: false,
    canViewSettings: false,
    canManageUsers: false,
    canManageRoleConfig: false,
    canResetMetrics: false,
    canSyncSalesforceAccounts: false,
    canManageUnansweredQueue: false,
    canViewOnboarding: false,
    canViewProposalBuilding: false,
    webAppUrl: '',
    driveExpStack: [],
    driveExpNextToken: '',
    lastLlmCfg: null,
    cachedI18n: readInitialI18nPack(),
  };
  var _listeners = {};

  A.state = {
    get: function (key) { return _state[key]; },
    set: function (key, value) {
      var old = _state[key];
      _state[key] = value;
      if (_listeners[key]) {
        for (var i = 0; i < _listeners[key].length; i++) {
          _listeners[key][i](value, old, key);
        }
      }
    },
    on: function (key, fn) {
      if (!_listeners[key]) _listeners[key] = [];
      _listeners[key].push(fn);
    },
    off: function (key, fn) {
      if (!_listeners[key]) return;
      _listeners[key] = _listeners[key].filter(function (f) { return f !== fn; });
    },
    dump: function () { return JSON.parse(JSON.stringify(_state)); }
  };

  A.MAX_SELECTION = 5;
  A.MIME_FOLDER = 'application/vnd.google-apps.folder';

  var blockingModal = document.getElementById('blocking-modal');
  var blockingModalMsg = document.getElementById('blocking-modal-msg');
  var blockingModalProgress = document.getElementById('blocking-modal-progress');
  var blockingModalCounter = document.getElementById('blocking-modal-counter');
  var blockingModalFileIdx = document.getElementById('blocking-modal-file-idx');
  var blockingModalBar = document.getElementById('blocking-modal-bar');
  var blockingModalStep = document.getElementById('blocking-modal-step');
  var blockingModalDetail = document.getElementById('blocking-modal-detail');
  var blockingModalFilename = document.getElementById('blocking-modal-filename');

  /**
   * @param {string|Object} msgOrOpts mensaje plano o { message, progress, analyzed, completed, total, current, fileName, stepLabel, phase, barPercent }
   */
  A.showBlockingModal = function (msgOrOpts) {
    var msg = '';
    var showProgress = false;
    if (msgOrOpts && typeof msgOrOpts === 'object') {
      showProgress = !!msgOrOpts.progress;
      msg = msgOrOpts.message || '';
      if (showProgress) {
        var analyzed = msgOrOpts.analyzed != null ? msgOrOpts.analyzed : 0;
        var completed = msgOrOpts.completed != null ? msgOrOpts.completed : 0;
        var total = msgOrOpts.total != null ? msgOrOpts.total : 0;
        var current = msgOrOpts.current != null ? msgOrOpts.current : 0;
        var barPct = msgOrOpts.barPercent;
        if (barPct == null && total > 0) {
          barPct = Math.round((analyzed / total) * 100);
          if (analyzed < total && barPct < 4) barPct = 4;
        }
        if (blockingModalCounter && A.i18nFmt) {
          blockingModalCounter.textContent = A.i18nFmt('contents_batch_counter_analyzed', {
            analyzed: analyzed,
            total: total,
          });
        }
        if (blockingModalFileIdx && A.i18nFmt) {
          blockingModalFileIdx.textContent = A.i18nFmt('contents_batch_counter_file', {
            current: current,
            total: total,
          });
        }
        if (blockingModalBar) {
          blockingModalBar.style.width = Math.max(0, Math.min(100, barPct || 0)) + '%';
        }
        if (blockingModalStep) {
          blockingModalStep.textContent = msgOrOpts.stepLabel || '';
        }
        if (blockingModalDetail) {
          blockingModalDetail.textContent = msgOrOpts.phase || '';
        }
        if (blockingModalFilename) {
          blockingModalFilename.textContent = msgOrOpts.fileName
            ? A.i18nFmt
              ? A.i18nFmt('contents_batch_file_label', { name: msgOrOpts.fileName })
              : msgOrOpts.fileName
            : '';
        }
        if (completed > 0 && blockingModalCounter && A.i18nFmt) {
          blockingModalCounter.textContent = A.i18nFmt('contents_batch_counter_analyzed_saved', {
            analyzed: analyzed,
            saved: completed,
            total: total,
          });
        }
      }
    } else {
      msg = msgOrOpts || '';
    }
    if (blockingModalProgress) {
      blockingModalProgress.classList.toggle('hidden', !showProgress);
    }
    if (blockingModalMsg) blockingModalMsg.textContent = msg;
    if (blockingModal) {
      blockingModal.classList.remove('hidden');
      blockingModal.setAttribute('aria-hidden', 'false');
    }
  };

  A.hideBlockingModal = function () {
    if (blockingModal) {
      blockingModal.classList.add('hidden');
      blockingModal.setAttribute('aria-hidden', 'true');
    }
    if (blockingModalProgress) blockingModalProgress.classList.add('hidden');
    if (blockingModalBar) blockingModalBar.style.width = '0%';
    if (blockingModalStep) blockingModalStep.textContent = '';
    if (blockingModalDetail) blockingModalDetail.textContent = '';
    if (blockingModalFilename) blockingModalFilename.textContent = '';
  };

  A.positionFloatingPanel = function (anchorEl, panelEl, opts) {
    opts = opts || {};
    if (!anchorEl || !panelEl) return;
    var gap = opts.gap != null ? opts.gap : 4;
    panelEl.classList.add('app-floating-panel');
    var rect = anchorEl.getBoundingClientRect();
    var w = opts.width != null ? opts.width : anchorEl.offsetWidth;
    panelEl.style.width = typeof w === 'number' ? Math.max(w, 0) + 'px' : w;
    panelEl.style.maxWidth = Math.max(0, window.innerWidth - 16) + 'px';
    var pw = panelEl.offsetWidth || (typeof w === 'number' ? w : 288);
    var left = rect.left;
    if (left + pw > window.innerWidth - 8) {
      left = Math.max(8, window.innerWidth - pw - 8);
    }
    panelEl.style.left = left + 'px';
    var top = rect.bottom + gap;
    var ph = panelEl.offsetHeight;
    if (ph && top + ph > window.innerHeight - 8) {
      top = Math.max(8, rect.top - gap - ph);
    }
    panelEl.style.top = top + 'px';
  };

  A.showFloatingPanel = function (anchorEl, panelEl, opts) {
    if (!anchorEl || !panelEl) return;
    panelEl._floatAnchor = anchorEl;
    panelEl._floatOpts = opts || {};
    A.positionFloatingPanel(anchorEl, panelEl, panelEl._floatOpts);
    panelEl.classList.remove('hidden');
    if (!panelEl._floatOnReposition) {
      panelEl._floatOnReposition = function () {
        if (panelEl.classList.contains('hidden')) return;
        A.positionFloatingPanel(panelEl._floatAnchor, panelEl, panelEl._floatOpts);
      };
      window.addEventListener('scroll', panelEl._floatOnReposition, true);
      window.addEventListener('resize', panelEl._floatOnReposition);
    }
  };

  A.hideFloatingPanel = function (panelEl) {
    if (!panelEl) return;
    panelEl.classList.add('hidden');
    if (panelEl._floatOnReposition) {
      window.removeEventListener('scroll', panelEl._floatOnReposition, true);
      window.removeEventListener('resize', panelEl._floatOnReposition);
      panelEl._floatOnReposition = null;
    }
  };

  var confirmModal = document.getElementById('app-confirm-modal');
  var confirmDialog = document.getElementById('app-confirm-dialog');
  var confirmTitle = document.getElementById('app-confirm-title');
  var confirmMessage = document.getElementById('app-confirm-message');
  var confirmPhraseWrap = document.getElementById('app-confirm-phrase-wrap');
  var confirmPhraseLabel = document.getElementById('app-confirm-phrase-label');
  var confirmPhraseInput = document.getElementById('app-confirm-phrase-input');
  var confirmCancelBtn = document.getElementById('app-confirm-cancel');
  var confirmConfirmBtn = document.getElementById('app-confirm-confirm');
  var confirmResolve = null;
  var confirmRequirePhrase = '';

  function closeConfirmModal(result) {
    if (confirmModal) {
      confirmModal.classList.add('hidden');
      confirmModal.setAttribute('aria-hidden', 'true');
    }
    document.removeEventListener('keydown', confirmKeyHandler);
    confirmRequirePhrase = '';
    if (confirmPhraseInput) {
      confirmPhraseInput.classList.remove('ring-2', 'ring-red-500');
    }
    if (confirmResolve) {
      var r = confirmResolve;
      confirmResolve = null;
      r(result);
    }
  }

  function confirmKeyHandler(e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      closeConfirmModal(false);
    }
  }

  A.confirmDialog = function (opts) {
    return new Promise(function (resolve) {
      var o = opts || {};
      confirmResolve = resolve;
      confirmRequirePhrase = o.requirePhrase ? String(o.requirePhrase).trim() : '';
      if (confirmTitle) {
        if (o.title) {
          confirmTitle.textContent = o.title;
          confirmTitle.classList.remove('hidden');
        } else {
          confirmTitle.textContent = '';
          confirmTitle.classList.add('hidden');
        }
      }
      if (confirmMessage) confirmMessage.textContent = o.message || '';
      if (confirmCancelBtn) {
        var cancelSpan = confirmCancelBtn.querySelector('span');
        if (cancelSpan) {
          cancelSpan.textContent = o.cancelLabel || A.i18n('confirm_dialog_cancel');
        }
      }
      if (confirmConfirmBtn) {
        var okSpan = confirmConfirmBtn.querySelector('span');
        if (okSpan) {
          okSpan.textContent = o.confirmLabel || A.i18n('confirm_dialog_confirm');
        }
        confirmConfirmBtn.classList.toggle('danger', !!o.danger);
      }
      if (confirmPhraseWrap) {
        confirmPhraseWrap.classList.toggle('hidden', !confirmRequirePhrase);
      }
      if (confirmPhraseInput) {
        confirmPhraseInput.value = '';
        confirmPhraseInput.disabled = false;
        confirmPhraseInput.classList.remove('ring-2', 'ring-red-500');
      }
      if (confirmRequirePhrase && confirmPhraseLabel) {
        confirmPhraseLabel.textContent = A.i18nFmt
          ? A.i18nFmt('confirm_dialog_type_label', { phrase: confirmRequirePhrase })
          : confirmRequirePhrase;
      }
      if (confirmModal) {
        confirmModal.classList.remove('hidden');
        confirmModal.setAttribute('aria-hidden', 'false');
      }
      document.addEventListener('keydown', confirmKeyHandler);
      setTimeout(function () {
        if (confirmRequirePhrase && confirmPhraseInput) confirmPhraseInput.focus();
        else if (confirmConfirmBtn) confirmConfirmBtn.focus();
        else if (confirmDialog) confirmDialog.focus();
      }, 0);
    });
  };

  if (confirmCancelBtn) {
    confirmCancelBtn.addEventListener('click', function () {
      closeConfirmModal(false);
    });
  }
  if (confirmConfirmBtn) {
    confirmConfirmBtn.addEventListener('click', function () {
      if (confirmRequirePhrase) {
        var typed = (confirmPhraseInput && confirmPhraseInput.value) || '';
        if (typed.trim().toUpperCase() !== confirmRequirePhrase.toUpperCase()) {
          if (confirmPhraseInput) {
            confirmPhraseInput.classList.add('ring-2', 'ring-red-500');
            confirmPhraseInput.focus();
          }
          return;
        }
      }
      closeConfirmModal(true);
    });
  }
  if (confirmModal) {
    confirmModal.addEventListener('click', function (e) {
      if (e.target === confirmModal) closeConfirmModal(false);
    });
  }
  if (confirmPhraseInput) {
    confirmPhraseInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (confirmConfirmBtn) confirmConfirmBtn.click();
      }
    });
  }

  var errorModal = document.getElementById('app-error-modal');
  var errorDialog = document.getElementById('app-error-dialog');
  var errorTitle = document.getElementById('app-error-title');
  var errorMessage = document.getElementById('app-error-message');
  var errorDetailWrap = document.getElementById('app-error-detail-wrap');
  var errorDetail = document.getElementById('app-error-detail');
  var errorCloseBtn = document.getElementById('app-error-close');

  function closeErrorModal() {
    if (errorModal) {
      errorModal.classList.add('hidden');
      errorModal.setAttribute('aria-hidden', 'true');
    }
    document.removeEventListener('keydown', errorKeyHandler);
  }

  function errorKeyHandler(e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      closeErrorModal();
    }
  }

  /**
   * Modal de error visible (resumen + detalle técnico opcional).
   * @param {{title?:string, message?:string, detail?:string}} opts
   */
  A.showErrorDialog = function (opts) {
    var o = opts || {};
    var message = String(o.message || '').trim();
    var detail = String(o.detail || '').trim();
    if (!detail && message.indexOf('\n') >= 0) {
      var parts = message.split('\n\n');
      message = parts[0].trim();
      detail = parts.slice(1).join('\n\n').trim();
    }
    if (errorTitle) {
      errorTitle.textContent =
        o.title || (A.i18n ? A.i18n('error_dialog_title') : 'Error');
    }
    if (errorMessage) errorMessage.textContent = message || (A.i18n ? A.i18n('err_generic') : '');
    if (errorDetail) errorDetail.textContent = detail;
    if (errorDetailWrap) errorDetailWrap.classList.toggle('hidden', !detail);
    if (errorModal) {
      errorModal.classList.remove('hidden');
      errorModal.setAttribute('aria-hidden', 'false');
    }
    document.addEventListener('keydown', errorKeyHandler);
    setTimeout(function () {
      if (errorCloseBtn) errorCloseBtn.focus();
      else if (errorDialog) errorDialog.focus();
    }, 0);
  };

  A.hideErrorDialog = closeErrorModal;

  if (errorCloseBtn) {
    errorCloseBtn.addEventListener('click', function () {
      closeErrorModal();
    });
  }
  if (errorModal) {
    errorModal.addEventListener('click', function (e) {
      if (e.target === errorModal) closeErrorModal();
    });
  }

  A.setBusy = function (busy, msg) {
    var btn = document.getElementById('login-btn');
    var st = document.getElementById('login-status');
    if (btn) btn.disabled = !!busy;
    if (st) {
      st.textContent =
        msg != null && msg !== ''
          ? msg
          : busy
            ? A.i18n('busy_connecting')
            : '\u00a0';
      st.classList.toggle('err', false);
    }
  };

  A.setLoginError = function (text) {
    var btn = document.getElementById('login-btn');
    var st = document.getElementById('login-status');
    if (st) {
      st.textContent = text || A.i18n('err_generic');
      st.classList.toggle('err', true);
    }
    if (btn) btn.disabled = false;
  };

  A.mimeShortLabel = function (mt) {
    if (mt === A.MIME_FOLDER) return A.i18n('mime_folder');
    if (mt === 'application/pdf' || mt === 'application/vnd.google-apps.document')
      return A.i18n('mime_doc_pdf');
    if (mt === 'application/vnd.google-apps.spreadsheet') return A.i18n('mime_sheet');
    if (mt === 'application/vnd.google-apps.presentation') return A.i18n('mime_slides');
    if (mt === 'application/vnd.google-apps.drawing') return A.i18n('mime_drawing');
    if (mt && mt.indexOf('vnd.google-apps') !== -1) return A.i18n('mime_google');
    var cut = (mt || '').split('/').pop() || mt || A.i18n('mime_file');
    return cut.length > 18 ? cut.substring(0, 16) + A.i18n('mime_trunc') : cut;
  };

  A.getSelectedIds = function () {
    var filesUl = document.getElementById('files');
    var out = [];
    if (!filesUl) return out;
    var nodes = filesUl.querySelectorAll('input[type=checkbox]');
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].checked) out.push(nodes[i].value);
    }
    return out;
  };

  A.syncSidebarBrandLogo = function () {
    var loginLogo = document.getElementById('aviators-logo');
    var side = document.getElementById('sidebar-brand-logo');
    if (!side) return;
    var src = loginLogo && loginLogo.getAttribute('src');
    if (src) side.setAttribute('src', src);
  };

  A.updateLocaleButtonHighlight = function () {
    var ci = _state.cachedI18n;
    var loc = ci && ci._locale ? ci._locale : 'es';
    var esBtn = document.getElementById('locale-btn-es');
    var enBtn = document.getElementById('locale-btn-en');
    var currentEl = document.getElementById('sidebar-locale-current');
    if (esBtn) {
      esBtn.classList.toggle('ring-2', loc === 'es');
      esBtn.classList.toggle('ring-sky-500', loc === 'es');
      esBtn.classList.toggle('bg-sky-50', loc === 'es');
      esBtn.classList.toggle('dark:bg-sky-900/45', loc === 'es');
    }
    if (enBtn) {
      enBtn.classList.toggle('ring-2', loc === 'en');
      enBtn.classList.toggle('ring-sky-500', loc === 'en');
      enBtn.classList.toggle('bg-sky-50', loc === 'en');
      enBtn.classList.toggle('dark:bg-sky-900/45', loc === 'en');
    }
    if (currentEl) {
      currentEl.textContent = loc === 'en' ? 'EN' : 'ES';
    }
    var localeDropdown = document.getElementById('sidebar-locale-dropdown');
    if (localeDropdown && localeDropdown.open) {
      localeDropdown.open = false;
    }
  };

  A.initialsFromDisplayName = function (name, email) {
    var s = (name || '').trim();
    if (!s && email) s = ((email || '').split('@')[0] || '').trim();
    var parts = s.split(/\s+/).filter(function (x) { return x.length; });
    if (parts.length >= 2)
      return (parts[0][0] + parts[1][0]).toUpperCase().slice(0, 2);
    return (s.slice(0, 2) || '?').toUpperCase();
  };

  var _cacheStore = {};

  A.cache = {
    get: function (key) {
      var entry = _cacheStore[key];
      if (!entry) return null;
      if (Date.now() > entry.expiresAt) {
        delete _cacheStore[key];
        return null;
      }
      return entry.data;
    },
    set: function (key, data, ttlMs) {
      _cacheStore[key] = { data: data, expiresAt: Date.now() + (ttlMs || 60000) };
    },
    invalidate: function (key) {
      delete _cacheStore[key];
    },
    clear: function () {
      _cacheStore = {};
    },
  };

  A.initTabGroup = function (root) {
    if (!root) return { activate: function () {} };
    // Solo tabs del tablist hijo directo; evita mezclar sub-grupos anidados (p. ej. Usuarios en Configuración).
    var tabListEl = root.querySelector(':scope > [role="tablist"]');
    var tabs = tabListEl ? tabListEl.querySelectorAll('[role="tab"]') : [];
    var tabList = [];
    var i;
    for (i = 0; i < tabs.length; i++) tabList.push(tabs[i]);
    function panelForTab(tabEl) {
      var panelId = tabEl.getAttribute('aria-controls');
      return panelId ? document.getElementById(panelId) : null;
    }
    function activate(tabId) {
      for (i = 0; i < tabList.length; i++) {
        var tab = tabList[i];
        var on = tab.id === tabId;
        tab.setAttribute('aria-selected', on ? 'true' : 'false');
        tab.tabIndex = on ? 0 : -1;
        tab.classList.toggle('is-active', on);
        var panel = panelForTab(tab);
        if (panel) {
          panel.hidden = !on;
          panel.classList.toggle('hidden', !on);
        }
      }
    }
    for (i = 0; i < tabList.length; i++) {
      (function (tabEl) {
        tabEl.addEventListener('click', function () {
          activate(tabEl.id);
        });
        tabEl.addEventListener('keydown', function (ev) {
          var idx = tabList.indexOf(tabEl);
          var next = -1;
          if (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') {
            next = (idx + 1) % tabList.length;
          } else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowUp') {
            next = (idx - 1 + tabList.length) % tabList.length;
          } else if (ev.key === 'Home') {
            next = 0;
          } else if (ev.key === 'End') {
            next = tabList.length - 1;
          } else {
            return;
          }
          ev.preventDefault();
          activate(tabList[next].id);
          tabList[next].focus();
        });
      })(tabList[i]);
    }
    if (tabList.length) {
      var initial =
        tabList[0].getAttribute('aria-selected') === 'true' ? tabList[0].id : tabList[0].id;
      for (i = 0; i < tabList.length; i++) {
        if (tabList[i].getAttribute('aria-selected') === 'true') {
          initial = tabList[i].id;
          break;
        }
      }
      activate(initial);
    }
    return { activate: activate };
  };

  /**
   * Ficha solo lectura: textareas sin scroll interno y campos vacíos ocultos.
   * @param {HTMLElement|null} root
   */
  A.fichaReadonly = {
    syncTextareas: function (root) {
      if (!root) return;
      var list = root.querySelectorAll('textarea');
      var i;
      for (i = 0; i < list.length; i++) {
        var ta = list[i];
        ta.style.height = 'auto';
        ta.style.overflow = 'hidden';
        ta.style.resize = 'none';
        var h = ta.scrollHeight;
        if (h > 0) ta.style.height = h + 'px';
      }
    },

    hideEmptyFields: function (root) {
      if (!root) return;
      var blocks = root.querySelectorAll('.ficha-field');
      var bi;
      for (bi = 0; bi < blocks.length; bi++) {
        var block = blocks[bi];
        var control = block.querySelector('input, select, textarea');
        if (!control) continue;
        var val = '';
        if (control.tagName === 'SELECT') {
          var opt = control.options[control.selectedIndex];
          val = opt ? String(opt.textContent || opt.value || '').trim() : '';
          if (val === '—' || val === '\u2014') val = '';
        } else {
          val = String(control.value || '').trim();
        }
        block.classList.toggle('ficha-field--empty', !val);
      }
      var sections = root.querySelectorAll('.ficha-section');
      var si;
      for (si = 0; si < sections.length; si++) {
        var sec = sections[si];
        var secFields = sec.querySelectorAll('.ficha-field');
        var hasVisible = false;
        var fi;
        for (fi = 0; fi < secFields.length; fi++) {
          if (!secFields[fi].classList.contains('ficha-field--empty')) {
            hasVisible = true;
            break;
          }
        }
        sec.classList.toggle('ficha-section--empty', secFields.length > 0 && !hasVisible);
      }
    },

    appendMeta: function (container, label, value, iconClass) {
      if (!container || !String(value || '').trim()) return;
      var card = document.createElement('div');
      card.className = 'ficha-meta-card';
      card.setAttribute('role', 'listitem');
      if (iconClass) {
        var iconWrap = document.createElement('span');
        iconWrap.className = 'ficha-meta-card-icon';
        iconWrap.setAttribute('aria-hidden', 'true');
        iconWrap.innerHTML = '<i class="fa-solid ' + iconClass + '"></i>';
        card.appendChild(iconWrap);
      }
      var body = document.createElement('div');
      body.className = 'min-w-0 flex-1';
      var lbl = document.createElement('div');
      lbl.className = 'ficha-meta-label';
      lbl.textContent = label;
      var val = document.createElement('div');
      val.className = 'ficha-meta-value';
      val.textContent = value;
      body.appendChild(lbl);
      body.appendChild(val);
      card.appendChild(body);
      container.appendChild(card);
    },
  };
})(window.Aviators);
</script>
