<script>
(function (A) {
  var S = A.state;
  var i18n = A.i18n;
  var i18nFmt = A.i18nFmt;

  var backBtn = document.getElementById('pv-back-btn');
  var heroAccent = document.getElementById('pv-hero-accent');
  var heroClient = document.getElementById('pv-hero-client');
  var heroTitle = document.getElementById('pv-hero-title');
  var heroSummary = document.getElementById('pv-hero-summary');
  var heroStatus = document.getElementById('pv-hero-status');
  var heroMeta = document.getElementById('pv-hero-meta');
  var tabbar = document.getElementById('pv-tabbar');
  var overviewStats = document.getElementById('pv-overview-stats');
  var quickLinks = document.getElementById('pv-quick-links');
  var briefContent = document.getElementById('pv-brief-content');
  var materialsList = document.getElementById('pv-materials-list');
  var materialsEmpty = document.getElementById('pv-materials-empty');
  var studiosList = document.getElementById('pv-studios-list');
  var studiosEmpty = document.getElementById('pv-studios-empty');
  var deliverablesArtifacts = document.getElementById('pv-deliverables-artifacts');
  var deliverablesModules = document.getElementById('pv-deliverables-modules');
  var agendaModal = document.getElementById('pv-agenda-modal');
  var agendaDialog = document.getElementById('pv-agenda-dialog');
  var agendaSectionsWrap = document.getElementById('pv-agenda-sections-wrap');
  var agendaDeckOptionsList = document.getElementById('pv-agenda-deck-options-list');
  var agendaItemsList = document.getElementById('pv-agenda-items-list');
  var agendaModalCloseIcon = document.getElementById('pv-agenda-modal-close-icon');
  var agendaModalCloseBtn = document.getElementById('pv-agenda-modal-close-btn');
  var successCasesWrap = document.getElementById('pv-success-cases-wrap');
  var successCasesList = document.getElementById('pv-success-cases-list');
  var deliverablesEmpty = document.getElementById('pv-deliverables-empty');
  var deliverablesHero = document.getElementById('pv-deliverables-hero');
  var materialsBrowseBtn = document.getElementById('pv-materials-browse-btn');
  var materialsInput = document.getElementById('pv-materials-input');
  var materialsDriveUrl = document.getElementById('pv-materials-drive-url');
  var materialsDriveBtn = document.getElementById('pv-materials-drive-btn');
  var materialsAddStatus = document.getElementById('pv-materials-add-status');
  var materialsAddSection = document.querySelector('.pv-materials-add');
  var editBtn = document.getElementById('pv-edit-btn');
  var saveBtn = document.getElementById('pv-save-btn');
  var cancelBtn = document.getElementById('pv-cancel-btn');
  var remindersRoot = document.getElementById('pv-reminders-root');
  var remindersToggle = document.getElementById('pv-reminders-toggle');
  var remindersPanel = document.getElementById('pv-reminders-panel');
  var remindersSummary = document.getElementById('pv-reminders-summary');
  var remindersSaveBtn = document.getElementById('pv-reminders-save-btn');
  var remindersStatus = document.getElementById('pv-reminders-status');
  var pvRemindersExpanded_ = false;
  var pageProposalView = document.getElementById('page-proposal-view');

  var PV_COMMERCIAL_MODELS_ = [
    'TIME_AND_MATERIALS',
    'STAFF_AUGMENTATION',
    'FIXED_PRICE',
    'SUBSCRIPTION',
    'AI_PODS',
  ];
  var PV_COMMERCIAL_LABEL_KEYS_ = {
    TIME_AND_MATERIALS: 'pb_pricing_time_and_materials',
    STAFF_AUGMENTATION: 'pb_pricing_staff_augmentation',
    FIXED_PRICE: 'pb_pricing_fixed_price',
    SUBSCRIPTION: 'pb_pricing_subscription',
    AI_PODS: 'pb_pricing_ai_pods',
  };
  var PV_SESSION_STATUSES_ = ['in_progress', 'completed', 'failed'];
  var PV_BUILDER_STEPS_ = ['materials', 'brief', 'studios', 'success_cases', 'configure', 'building'];
  var PV_STATUS_LABEL_KEYS_ = {
    in_progress: 'my_proposals_status_in_progress',
    completed: 'my_proposals_status_completed',
    failed: 'my_proposals_status_failed',
  };
  var PV_BUILDER_STEP_LABEL_KEYS_ = {
    materials: 'my_proposals_step_materials',
    brief: 'my_proposals_step_brief',
    studios: 'my_proposals_step_studios',
    configure: 'my_proposals_step_configure',
    building: 'my_proposals_step_building',
  };

  var PV_TABS_ = ['summary', 'materials', 'studios', 'deliverables'];
  var PV_STUDIO_PRIORITY_ORDER_ = ['high', 'medium', 'low'];
  var PV_STUDIO_PRIORITY_LABEL_KEYS_ = {
    high: 'pb_studios_priority_high_heading',
    medium: 'pb_studios_priority_medium_heading',
    low: 'pb_studios_priority_low_heading',
  };
  var PV_STUDIO_PRIORITY_BADGE_KEYS_ = {
    high: 'pb_studio_priority_high',
    medium: 'pb_studio_priority_medium',
    low: 'pb_studio_priority_low',
  };
  var PV_STUDIO_PRIORITY_ICON_KEYS_ = {
    high: 'pv_studios_priority_icon_high',
    medium: 'pv_studios_priority_icon_medium',
    low: 'pv_studios_priority_icon_low',
  };
  var PV_STUDIO_TYPE_LABEL_KEYS_ = {
    digital: 'pb_studios_type_digital',
    ai: 'pb_studios_type_ai',
    enterprise: 'pb_studios_type_enterprise',
  };
  var PV_STUDIO_TYPE_ICONS_ = {
    digital: 'fa-laptop-code',
    ai: 'fa-brain',
    enterprise: 'fa-server',
  };

  function pvGetSession_() {
    return S.get('proposalViewSession') || null;
  }

  function pvStatusKind_(status) {
    var st = String(status || '').trim();
    if (st === 'completed') return 'completed';
    if (st === 'failed') return 'failed';
    return 'progress';
  }

  function pvStatusIcon_(kind) {
    if (kind === 'completed') return 'fa-circle-check';
    if (kind === 'failed') return 'fa-circle-xmark';
    return 'fa-spinner';
  }

  function pvStatusLabel_(status, builderStep) {
    var st = String(status || '').trim();
    if (st === 'completed') return i18n('my_proposals_status_completed');
    if (st === 'failed') return i18n('my_proposals_status_failed');
    var stepKey = 'my_proposals_step_' + String(builderStep || 'materials');
    var stepLabel = i18n(stepKey);
    if (stepLabel === stepKey) return i18n('my_proposals_status_in_progress');
    return i18nFmt('my_proposals_status_step', { step: stepLabel });
  }

  function pvIndustryLabel_(key) {
    if (key === 'Logistica') return i18n('pb_industry_logistics');
    if (key === 'Aerolineas') return i18n('pb_industry_airlines');
    return key || i18n('label_em_dash');
  }

  function pvLanguageLabel_(lang) {
    if (lang === 'en') return i18n('pb_lang_en');
    if (lang === 'es') return i18n('pb_lang_es');
    return lang || i18n('label_em_dash');
  }

  function pvFormatDate_(iso) {
    var raw = String(iso || '').trim();
    if (!raw) return i18n('label_em_dash');
    try {
      var d = new Date(raw);
      if (isNaN(d.getTime())) return raw;
      return new Intl.DateTimeFormat(A.getLocale ? A.getLocale() : undefined, {
        dateStyle: 'medium',
        timeStyle: 'short',
      }).format(d);
    } catch (eFmt) {
      return raw;
    }
  }

  function pvEffectiveBrief_(session) {
    session = session || {};
    return session.validatedBrief || session.draftBrief || {};
  }

  function pvExtractDriveFileId_(raw) {
    var s = String(raw || '').trim();
    if (!s) return '';
    var m = s.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (m && m[1]) return m[1];
    m = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m && m[1]) return m[1];
    if (/^[a-zA-Z0-9_-]{10,}$/.test(s)) return s;
    return '';
  }

  function pvDriveOpenUrl_(driveFileId, fallbackUrl) {
    var direct = String(fallbackUrl || '').trim();
    if (direct) return direct;
    var id = pvExtractDriveFileId_(driveFileId);
    if (id) return 'https://drive.google.com/open?id=' + encodeURIComponent(id);
    return '';
  }

  function pvEffectiveDeliverables_(session) {
    session = session || {};
    var ctx = session.context && typeof session.context === 'object' ? session.context : {};
    var deckId = String(session.deckFileId || ctx.proposalDeckFileId || '').trim();
    var deckUrl = pvDriveOpenUrl_(deckId, session.deckFileUrl || ctx.proposalDeckFileUrl || '');
    var deckName = String(session.deckFileName || ctx.proposalDeckFileName || '').trim();
    var checklistId = String(session.checklistFileId || ctx.checklistFileId || '').trim();
    var checklistUrl = pvDriveOpenUrl_(
      checklistId,
      session.checklistFileUrl || ctx.checklistFileUrl || '',
    );
    var checklistName = String(session.checklistFileName || ctx.checklistFileName || '').trim();
    var packageId = String(session.packageFolderId || ctx.proposalPackageFolderId || '').trim();
    var packageUrl = pvDriveOpenUrl_(
      packageId,
      session.packageFolderUrl || ctx.proposalPackageFolderUrl || '',
    );
    var packageName = String(
      session.packageFolderName || ctx.proposalPackageFolderName || '',
    ).trim();
    return {
      deckFileId: deckId,
      deckFileUrl: deckUrl,
      deckFileName: deckName,
      checklistFileId: checklistId,
      checklistFileUrl: checklistUrl,
      checklistFileName: checklistName,
      packageFolderId: packageId,
      packageFolderUrl: packageUrl,
      packageFolderName: packageName,
    };
  }

  function pvIsEditing_() {
    return !!S.get('proposalViewEditing');
  }

  function pvSplitLines_(text) {
    return String(text || '')
      .split(/\r?\n/)
      .map(function (line) {
        return String(line || '').trim();
      })
      .filter(function (line) {
        return !!line;
      });
  }

  function pvSplitComma_(text) {
    return String(text || '')
      .split(/[,;]/)
      .map(function (part) {
        return String(part || '').trim();
      })
      .filter(function (part) {
        return !!part;
      });
  }

  function pvEscapeHtml_(text) {
    return String(text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function pvOpenStudioDocument_(contentId) {
    var cid = String(contentId || '').trim();
    if (!cid || !S.get('canViewCatalog')) return;
    S.set('contentsPendingOpenId', cid);
    if (typeof A.setAppPage === 'function') A.setAppPage('contents');
  }

  function pvParseDeadlineDate_(text) {
    var raw = String(text || '').trim();
    if (!raw) return null;
    var d = new Date(raw);
    if (!isNaN(d.getTime())) return d;
    var m = raw.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if (m) {
      var day = parseInt(m[1], 10);
      var month = parseInt(m[2], 10) - 1;
      var year = parseInt(m[3], 10);
      if (year < 100) year += 2000;
      d = new Date(year, month, day, 9, 0, 0);
      if (!isNaN(d.getTime())) return d;
    }
    return null;
  }

  function pvToDatetimeLocal_(isoOrText) {
    var d = isoOrText ? new Date(isoOrText) : null;
    if (!d || isNaN(d.getTime())) {
      d = pvParseDeadlineDate_(isoOrText);
    }
    if (!d || isNaN(d.getTime())) return '';
    var pad = function (n) {
      return n < 10 ? '0' + n : String(n);
    };
    return (
      d.getFullYear() +
      '-' +
      pad(d.getMonth() + 1) +
      '-' +
      pad(d.getDate()) +
      'T' +
      pad(d.getHours()) +
      ':' +
      pad(d.getMinutes())
    );
  }

  function pvDefaultReminderDatetime_(rfpText, daysBefore) {
    var d = pvParseDeadlineDate_(rfpText);
    if (!d) return '';
    if (daysBefore) d.setDate(d.getDate() - daysBefore);
    d.setHours(9, 0, 0, 0);
    return pvToDatetimeLocal_(d.toISOString());
  }

  function pvGetViewReminders_(session) {
    session = session || {};
    var ctx = session.context && typeof session.context === 'object' ? session.context : {};
    return ctx.viewReminders && typeof ctx.viewReminders === 'object' ? ctx.viewReminders : {};
  }

  function pvCountEnabledReminders_(session) {
    var saved = pvGetViewReminders_(session);
    var count = 0;
    if (saved.sendEnabled === true) count++;
    if (saved.reviewEnabled === true) count++;
    return count;
  }

  function pvCountEnabledRemindersFromDom_() {
    var count = 0;
    if (!remindersRoot) return 0;
    var kinds = ['send', 'review'];
    var ki;
    for (ki = 0; ki < kinds.length; ki++) {
      var card = remindersRoot.querySelector('.pv-reminder-card--' + kinds[ki]);
      var cb = card ? card.querySelector('.pv-reminder-enabled') : null;
      if (cb && cb.checked) count++;
    }
    return count;
  }

  function pvUpdateRemindersSummary_(session) {
    if (!remindersSummary) return;
    var count =
      pvRemindersExpanded_ && remindersRoot
        ? pvCountEnabledRemindersFromDom_()
        : pvCountEnabledReminders_(session);
    remindersSummary.classList.remove('pv-reminders-summary--none', 'pv-reminders-summary--active');
    if (count <= 0) {
      remindersSummary.textContent = i18n('pv_reminders_summary_none');
      remindersSummary.classList.add('pv-reminders-summary--none');
      return;
    }
    remindersSummary.classList.add('pv-reminders-summary--active');
    if (count === 1) remindersSummary.textContent = i18n('pv_reminders_summary_one');
    else remindersSummary.textContent = i18nFmt('pv_reminders_summary_many', { count: String(count) });
  }

  function pvSetRemindersExpanded_(expanded) {
    pvRemindersExpanded_ = !!expanded;
    if (!remindersPanel || !remindersToggle) return;
    remindersPanel.classList.toggle('hidden', !expanded);
    remindersPanel.hidden = !expanded;
    remindersToggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    var chevron = remindersToggle.querySelector('.pv-reminders-chevron');
    if (chevron) chevron.classList.toggle('is-open', expanded);
  }

  function pvToggleRemindersPanel_() {
    pvSetRemindersExpanded_(!pvRemindersExpanded_);
    pvUpdateRemindersSummary_(pvGetSession_());
  }

  function pvCommercialLabel_(model) {
    var key = PV_COMMERCIAL_LABEL_KEYS_[String(model || '').trim()];
    return key ? i18n(key) : model || i18n('label_em_dash');
  }

  function pvUpdateEditModeBanner_() {
    var host = pageProposalView ? pageProposalView.querySelector('.pv-toolbar') : null;
    if (!host) return;
    var banner = document.getElementById('pv-edit-mode-banner');
    if (pvIsEditing_()) {
      if (!banner) {
        banner = document.createElement('p');
        banner.id = 'pv-edit-mode-banner';
        banner.className = 'pv-edit-hint text-sm';
        banner.setAttribute('role', 'status');
        host.insertAdjacentElement('afterend', banner);
      }
      banner.textContent = i18n('pv_edit_mode_hint');
      banner.classList.remove('hidden');
    } else if (banner) {
      banner.classList.add('hidden');
    }
  }

  function pvCanSaveProposals_() {
    return !!S.get('canSaveProposals');
  }

  function pvUpdateToolbar_() {
    var editing = pvIsEditing_();
    var canSave = pvCanSaveProposals_();
    if (editBtn) editBtn.classList.toggle('hidden', editing || !canSave);
    if (saveBtn) saveBtn.classList.toggle('hidden', !editing || !canSave);
    if (cancelBtn) cancelBtn.classList.toggle('hidden', !editing || !canSave);
    if (pageProposalView) pageProposalView.classList.toggle('pv-is-editing', editing && canSave);
    if (materialsAddSection) {
      materialsAddSection.classList.toggle('hidden', editing || !canSave);
    }
    if (remindersSaveBtn) remindersSaveBtn.classList.toggle('hidden', !canSave);
    if (remindersRoot) {
      var reminderInputs = remindersRoot.querySelectorAll('.pv-reminder-enabled, .pv-reminder-datetime');
      var ri;
      for (ri = 0; ri < reminderInputs.length; ri++) {
        reminderInputs[ri].disabled = !canSave;
      }
      var reminderActionBtns = remindersRoot.querySelectorAll('.pv-reminder-gcal-btn, .pv-reminder-ics-btn');
      var rb;
      for (rb = 0; rb < reminderActionBtns.length; rb++) {
        reminderActionBtns[rb].disabled = !canSave;
      }
    }
    pvUpdateEditModeBanner_();
  }

  function pvSetEditing_(on) {
    S.set('proposalViewEditing', !!on);
    pvUpdateToolbar_();
    var session = pvGetSession_();
    if (session) pvRenderAll_(session);
  }

  function pvSetRemindersStatus_(msg, isError) {
    if (!remindersStatus) return;
    if (!msg) {
      remindersStatus.classList.add('hidden');
      remindersStatus.textContent = '';
      remindersStatus.classList.remove('text-rose-700', 'text-emerald-700', 'dark:text-rose-300', 'dark:text-emerald-300');
      return;
    }
    remindersStatus.textContent = msg;
    remindersStatus.classList.remove('hidden');
    remindersStatus.classList.toggle('text-rose-700', !!isError);
    remindersStatus.classList.toggle('dark:text-rose-300', !!isError);
    remindersStatus.classList.toggle('text-emerald-700', !isError);
    remindersStatus.classList.toggle('dark:text-emerald-300', !isError);
  }

  function pvFormatIcsDatetime_(dtLocal) {
    var d = new Date(dtLocal);
    if (isNaN(d.getTime())) return '';
    var pad = function (n) {
      return n < 10 ? '0' + n : String(n);
    };
    return (
      d.getFullYear() +
      pad(d.getMonth() + 1) +
      pad(d.getDate()) +
      'T' +
      pad(d.getHours()) +
      pad(d.getMinutes()) +
      pad(d.getSeconds())
    );
  }

  function pvGoogleCalendarUrl_(title, dtLocal, details) {
    var start = pvFormatIcsDatetime_(dtLocal);
    if (!start) return '';
    var endDate = new Date(dtLocal);
    endDate.setHours(endDate.getHours() + 1);
    var end = pvFormatIcsDatetime_(pvToDatetimeLocal_(endDate.toISOString()));
    return (
      'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' +
      encodeURIComponent(title) +
      '&dates=' +
      start +
      '/' +
      end +
      '&details=' +
      encodeURIComponent(details || '')
    );
  }

  function pvDownloadIcs_(filename, title, dtLocal, details) {
    var start = pvFormatIcsDatetime_(dtLocal);
    if (!start) return;
    var endDate = new Date(dtLocal);
    endDate.setHours(endDate.getHours() + 1);
    var end = pvFormatIcsDatetime_(pvToDatetimeLocal_(endDate.toISOString()));
    var uid = 'aviators-pv-' + Date.now() + '@aviators';
    var ics =
      'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Aviators//Proposal Reminder//EN\r\nBEGIN:VEVENT\r\nUID:' +
      uid +
      '\r\nDTSTART:' +
      start +
      '\r\nDTEND:' +
      end +
      '\r\nSUMMARY:' +
      String(title || '').replace(/[,;\\]/g, ' ') +
      '\r\nDESCRIPTION:' +
      String(details || '').replace(/\r?\n/g, '\\n').replace(/[,;\\]/g, ' ') +
      '\r\nEND:VEVENT\r\nEND:VCALENDAR';
    var blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename || 'reminder.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function pvReminderEventTitle_(kind, session) {
    session = session || pvGetSession_() || {};
    var name = session.proposalName || session.clientName || i18n('my_proposals_untitled');
    if (kind === 'review') return i18nFmt('pv_reminder_event_review', { name: name });
    return i18nFmt('pv_reminder_event_send', { name: name });
  }

  function pvReminderEventDetails_(session) {
    session = session || pvGetSession_() || {};
    var parts = [];
    if (session.clientName) parts.push(session.clientName);
    var rfp = session.rfpDeadline || pvEffectiveBrief_(session).rfpDeadline;
    if (rfp) parts.push(i18n('pv_lbl_rfp_deadline') + ': ' + rfp);
    return parts.join('\n');
  }

  function pvAppendReminderCard_(wrap, kind, session) {
    var saved = pvGetViewReminders_(session);
    var brief = pvEffectiveBrief_(session);
    var rfp = session.rfpDeadline || brief.rfpDeadline || '';
    var titleKey = kind === 'review' ? 'pv_reminder_review_title' : 'pv_reminder_send_title';
    var leadKey = kind === 'review' ? 'pv_reminder_review_lead' : 'pv_reminder_send_lead';
    var defaultAt =
      kind === 'review' ? pvDefaultReminderDatetime_(rfp, 1) : pvDefaultReminderDatetime_(rfp, 0);
    var enabled = saved[kind + 'Enabled'] === true;
    var atVal = saved[kind + 'At'] || defaultAt || '';

    var card = document.createElement('article');
    card.className = 'pv-reminder-card pv-reminder-card--' + kind;
    card.innerHTML =
      '<header class="pv-reminder-card-head">' +
      '<span class="pv-reminder-card-icon" aria-hidden="true"><i class="fa-solid ' +
      (kind === 'review' ? 'fa-magnifying-glass' : 'fa-paper-plane') +
      '"></i></span>' +
      '<div class="min-w-0 flex-1"><h4 class="pv-reminder-card-title"></h4><p class="pv-reminder-card-lead"></p></div>' +
      '</header>' +
      '<label class="pv-reminder-toggle inline-flex items-center gap-2 text-sm">' +
      '<input type="checkbox" class="pv-reminder-enabled" data-pv-reminder-kind="' +
      kind +
      '" ' +
      (enabled ? 'checked' : '') +
      ' />' +
      '<span></span></label>' +
      '<label class="pv-reminder-datetime-label block text-sm">' +
      '<span class="pv-reminder-datetime-caption"></span>' +
      '<input type="datetime-local" class="aviators-field pv-reminder-datetime mt-1 w-full text-sm" data-pv-reminder-kind="' +
      kind +
      '" value="' +
      pvEscapeHtml_(atVal) +
      '" ' +
      (!enabled ? 'disabled' : '') +
      ' /></label>' +
      '<div class="pv-reminder-actions flex flex-wrap gap-2">' +
      '<button type="button" class="btn btn-sm btn-outline inline-flex items-center gap-2 pv-reminder-gcal-btn" data-pv-reminder-kind="' +
      kind +
      '"><i class="fa-brands fa-google" aria-hidden="true"></i><span></span></button>' +
      '<button type="button" class="btn btn-sm btn-outline inline-flex items-center gap-2 pv-reminder-ics-btn" data-pv-reminder-kind="' +
      kind +
      '"><i class="fa-solid fa-calendar-plus" aria-hidden="true"></i><span></span></button>' +
      '</div>';
    card.querySelector('.pv-reminder-card-title').textContent = i18n(titleKey);
    card.querySelector('.pv-reminder-card-lead').textContent = i18n(leadKey);
    card.querySelector('.pv-reminder-toggle span').textContent = i18n('pv_reminder_enable');
    card.querySelector('.pv-reminder-datetime-caption').textContent = i18n('pv_reminder_datetime_label');
    card.querySelector('.pv-reminder-gcal-btn span').textContent = i18n('pv_reminder_btn_gcal');
    card.querySelector('.pv-reminder-ics-btn span').textContent = i18n('pv_reminder_btn_ics');
    wrap.appendChild(card);
  }

  function pvRenderReminders_(session) {
    if (!remindersRoot) return;
    remindersRoot.innerHTML = '';
    session = session || pvGetSession_() || {};
    pvAppendReminderCard_(remindersRoot, 'send', session);
    pvAppendReminderCard_(remindersRoot, 'review', session);

    var toggles = remindersRoot.querySelectorAll('.pv-reminder-enabled');
    var ti;

  function pvCollectRemindersPayload_() {
    var out = {
      sendEnabled: false,
      reviewEnabled: false,
      sendAt: '',
      reviewAt: '',
    };
    if (!remindersRoot) return out;
    var kinds = ['send', 'review'];
    var ki;
    for (ki = 0; ki < kinds.length; ki++) {
      var kind = kinds[ki];
      var card = remindersRoot.querySelector('.pv-reminder-card--' + kind);

  function pvSetTab_(tabKey) {
    var raw = String(tabKey || '').trim();
    if (raw === 'overview' || raw === 'brief') raw = 'summary';

    S.set('proposalViewActiveTab', key);
    if (tabbar) {
      var tabs = tabbar.querySelectorAll('[data-pv-tab]');
      var i;
      for (i = 0; i < tabs.length; i++) {
        var btn = tabs[i];
        var active = (btn.getAttribute('data-pv-tab') || '') === key;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-selected', active ? 'true' : 'false');
      }
    }
    var panels = document.querySelectorAll('[data-pv-panel]');
    var j;
    for (j = 0; j < panels.length; j++) {

  function pvAppendMetaChip_(wrap, iconClass, labelKey, value) {
    if (!value || value === i18n('label_em_dash')) return;
    var dt = document.createElement('div');
    dt.className = 'pv-meta-chip';
    dt.innerHTML =
      '<dt class="pv-meta-chip-label"><i class="fa-solid ' +
      iconClass +
      '" aria-hidden="true"></i><span></span></dt><dd class="pv-meta-chip-value"></dd>';
    dt.querySelector('.pv-meta-chip-label span').textContent = i18n(labelKey);
    dt.querySelector('.pv-meta-chip-value').textContent = value;
    wrap.appendChild(dt);
  }

  function pvAppendStatCard_(wrap, iconClass, tone, labelKey, value) {
    var card = document.createElement('div');
    card.className = 'pv-stat-card pv-stat-card--' + tone;
    card.innerHTML =
      '<span class="pv-stat-icon" aria-hidden="true"><i class="fa-solid ' +
      iconClass +
      '"></i></span><div class="min-w-0"><p class="pv-stat-label"></p><p class="pv-stat-value"></p></div>';
    card.querySelector('.pv-stat-label').textContent = i18n(labelKey);
    card.querySelector('.pv-stat-value').textContent = value;
    wrap.appendChild(card);
  }

  function pvAppendLinkChip_(wrap, href, labelKey, iconClass, fileName) {
    if (!href) return;
    var a = document.createElement('a');
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.className = 'pv-link-chip';
    a.innerHTML =
      '<i class="fa-solid ' +
      iconClass +
      '" aria-hidden="true"></i><span class="pv-link-chip-text"></span>';
    a.querySelector('.pv-link-chip-text').textContent = fileName
      ? fileName
      : i18n(labelKey);
    wrap.appendChild(a);
  }

  function pvAppendBriefSection_(wrap, iconClass, tone, headingKey, leadKey, bodyFn) {
    var section = document.createElement('section');
    section.className = 'pv-brief-section pv-brief-section--' + tone;
    var head = document.createElement('header');
    head.className = 'pv-brief-section-head';
    head.innerHTML =
      '<span class="pv-brief-section-icon" aria-hidden="true"><i class="fa-solid ' +
      iconClass +
      '"></i></span><div><h3 class="pv-brief-section-title"></h3><p class="pv-brief-section-lead"></p></div>';
    head.querySelector('.pv-brief-section-title').textContent = i18n(headingKey);
    if (leadKey) head.querySelector('.pv-brief-section-lead').textContent = i18n(leadKey);
    else head.querySelector('.pv-brief-section-lead').classList.add('hidden');
    section.appendChild(head);
    var body = document.createElement('div');
    body.className = 'pv-brief-section-body';
    bodyFn(body);
    if (!body.children.length && !body.textContent.trim()) return;
    section.appendChild(body);
    wrap.appendChild(section);
  }

  function pvAppendListItems_(wrap, items, emptyKey) {
    var list = Array.isArray(items) ? items : [];
    if (!list.length) {
      var empty = document.createElement('p');
      empty.className = 'text-sm italic text-slate-500 dark:text-slate-400';
      empty.textContent = i18n(emptyKey || 'label_em_dash');
      wrap.appendChild(empty);
      return;
    }
    var ul = document.createElement('ul');
    ul.className = 'pv-detail-list';
    var i;
    for (i = 0; i < list.length; i++) {
      var li = document.createElement('li');
      li.className = 'pv-detail-list-item';
      li.textContent = String(list[i] || '').trim();
      if (li.textContent) ul.appendChild(li);
    }
    wrap.appendChild(ul);
  }

  function pvAppendScopeItems_(wrap, scopeItems) {
    var list = Array.isArray(scopeItems) ? scopeItems : [];
    if (!list.length) {
      wrap.innerHTML = '<p class="text-sm italic text-slate-500 dark:text-slate-400">' + i18n('label_em_dash') + '</p>';
      return;
    }
    var i;
    for (i = 0; i < list.length; i++) {
      var row = list[i] || {};
      var card = document.createElement('article');
      card.className = 'pv-scope-card';
      if (row.title) {
        var title = document.createElement('h4');
        title.className = 'pv-scope-card-title';
        title.textContent = String(row.title);
        card.appendChild(title);
      }
      if (row.description) {
        var desc = document.createElement('p');
        desc.className = 'pv-scope-card-desc';
        desc.textContent = String(row.description);
        card.appendChild(desc);
      }
      wrap.appendChild(card);
    }

  function pvAppendMilestones_(wrap, milestones) {

      wrap.innerHTML = '<p class="text-sm italic text-slate-500 dark:text-slate-400">' + i18n('label_em_dash') + '</p>';
      return;
    }
    var table = document.createElement('div');
    table.className = 'pv-milestones-table';
    var i;
    for (i = 0; i < list.length; i++) {
      var ms = list[i] || {};

      row.className = 'pv-milestone-row';
      row.innerHTML =

      row.querySelector('.pv-milestone-date span:last-child').textContent =

      row.querySelector('.pv-milestone-label').textContent = String(ms.label || ms.name || ms.title || '');
      table.appendChild(row);

    wrap.appendChild(table);

  function pvAppendStakeholders_(wrap, stakeholders) {
    var list = Array.isArray(stakeholders) ? stakeholders : [];
    if (!list.length) {

        '<p class="text-sm italic text-slate-500 dark:text-slate-400">' +

        heroStatus.querySelectorAll('.pv-edit-field-label')[1].textContent = i18n('pv_lbl_progress_step');
      } else {
        heroStatus.className = 'pv-hero-status pv-hero-status--' + kind;
        heroStatus.innerHTML =
          '<i class="fa-solid ' +
          pvStatusIcon_(kind) +
          '" aria-hidden="true"></i><span></span>';
        heroStatus.querySelector('span').textContent = pvStatusLabel_(session.status, session.builderStep);
      }
    }
    if (heroMeta) {
      heroMeta.innerHTML = '';
      if (pvIsEditing_()) {
        var industryVal = session.industryKey || '';
        var titleField =
          '<label class="pv-meta-edit block text-sm"><span class="pv-edit-field-label"></span><input type="text" class="aviators-field w-full text-sm" data-pv-edit="title" value="' +
          pvEscapeHtml_(session.title || '') +
          '" /></label>';
        var industryField =
          '<label class="pv-meta-edit block text-sm"><span class="pv-edit-field-label"></span><select class="aviators-field w-full text-sm" data-pv-edit="industryKey">' +
          '<option value="Logistica"' +
          (industryVal === 'Logistica' ? ' selected' : '') +
          '>' +
          pvEscapeHtml_(i18n('pb_industry_logistics')) +
          '</option>' +
          '<option value="Aerolineas"' +
          (industryVal === 'Aerolineas' ? ' selected' : '') +
          '>' +
          pvEscapeHtml_(i18n('pb_industry_airlines')) +
          '</option></select></label>';
        var commercialField =
          '<label class="pv-meta-edit block text-sm"><span class="pv-edit-field-label"></span><select class="aviators-field w-full text-sm" data-pv-edit="commercialModel">' +
          pvBuildCommercialSelectHtml_(session.commercialModel || brief.commercialModel || '') +
          '</select></label>';
        var rfpField =
          '<label class="pv-meta-edit block text-sm"><span class="pv-edit-field-label"></span><input type="text" class="aviators-field w-full text-sm" data-pv-edit="rfpDeadline" value="' +
          pvEscapeHtml_(session.rfpDeadline || brief.rfpDeadline || '') +
          '" /></label>';

          { icon: 'fa-tag', labelKey: 'pv_edit_lbl_internal_title', html: titleField },
          { icon: 'fa-industry', labelKey: 'pv_lbl_industry', html: industryField },
          { icon: 'fa-calendar-day', labelKey: 'pv_lbl_rfp_deadline', html: rfpField },
          { icon: 'fa-handshake', labelKey: 'pv_lbl_commercial_model', html: commercialField },
        ];
        var ci;
        for (ci = 0; ci < chips.length; ci++) {

          chip.className = 'pv-meta-chip pv-meta-chip--edit';

            chips[ci].icon +
            '" aria-hidden="true"></i><span></span></dt><dd class="pv-meta-chip-value"></dd>';
          chip.querySelector('.pv-meta-chip-label span').textContent = i18n(chips[ci].labelKey);
          chip.querySelector('.pv-meta-chip-value').innerHTML = chips[ci].html;

  function pvRenderOverview_(session) {
    session = session || {};
    var brief = pvEffectiveBrief_(session);
    if (overviewStats) {
      overviewStats.innerHTML = '';
      pvAppendStatCard_(
        overviewStats,
        'fa-layer-group',
        'sky',
        'pv_lbl_materials_count',
        String(Array.isArray(session.materials) ? session.materials.length : 0),
      );
      pvAppendStatCard_(
        overviewStats,
        'fa-building',
        'rose',
        'pv_lbl_studios_count',
        String(Array.isArray(session.studioRecommendations) ? session.studioRecommendations.length : 0),
      );
      pvAppendStatCard_(
        overviewStats,
        'fa-list-check',
        'sky',
        'pv_lbl_scope_items',
        String(Array.isArray(brief.scopeItems) ? brief.scopeItems.length : 0),
      );
      pvAppendStatCard_(
        overviewStats,
        'fa-route',
        'amber',
        'pv_lbl_progress_step',
        pvStatusLabel_(session.status, session.builderStep),
      );
    }
    if (quickLinks) {
      quickLinks.innerHTML = '';
      var deliv = pvEffectiveDeliverables_(session);
      pvAppendLinkChip_(
        quickLinks,
        deliv.packageFolderUrl,

        'fa-folder-open',
        deliv.packageFolderName,
      );
      pvAppendLinkChip_(
        quickLinks,
        deliv.deckFileUrl,
        'pb_btn_open_deck',
        'fa-file-powerpoint',
        deliv.deckFileName,
      );
      pvAppendLinkChip_(
        quickLinks,
        deliv.checklistFileUrl,
        'pb_btn_open_checklist',
        'fa-list-check',
        deliv.checklistFileName,
      );
      if (!quickLinks.children.length) {
        var pending = document.createElement('span');
        pending.className = 'pv-links-pending';
        pending.textContent = i18n('my_proposals_links_pending');
        quickLinks.appendChild(pending);
      }

    pvRenderReminders_(session);

  function pvRenderBrief_(session) {
    if (!briefContent) return;
    if (pvIsEditing_()) {
      pvRenderBriefEdit_(session);
      return;
    }
    briefContent.innerHTML = '';
    var brief = pvEffectiveBrief_(session);
    if (!brief || typeof brief !== 'object') {
      briefContent.innerHTML =
        '<p class="pv-empty-state"><i class="fa-solid fa-clipboard" aria-hidden="true"></i><span>' +
        i18n('pv_brief_empty') +
        '</span></p>';
      return;
    }
    if (brief.projectSummary) {
      pvAppendBriefSection_(briefContent, 'fa-align-left', 'sky', 'pv_overview_summary_heading', '', function (body) {
        var p = document.createElement('p');
        p.className = 'text-sm leading-relaxed text-slate-700 dark:text-slate-300';
        p.textContent = String(brief.projectSummary);
        body.appendChild(p);
      });
    }
    pvAppendBriefSection_(
      briefContent,
      'fa-bullseye',
      'sky',
      'pb_brief_sec_ask_heading',
      'pb_brief_sec_ask_lead',
      function (body) {
        pvAppendScopeItems_(body, brief.scopeItems);
      },
    );
    pvAppendBriefSection_(
      briefContent,
      'fa-handshake',
      'amber',
      'pb_brief_sec_commercial_heading',
      'pb_brief_sec_commercial_lead',
      function (body) {
        var grid = document.createElement('dl');
        grid.className = 'pv-brief-kv-grid';
        var rows = [
          { key: 'pb_lbl_commercial_model', val: brief.commercialModel },
          { key: 'pv_lbl_rfp_deadline', val: brief.rfpDeadline },
        ];
        if (brief.budget) rows.push({ key: 'pb_brief_budget_group_label', val: brief.budget });
        var i;
        for (i = 0; i < rows.length; i++) {
          if (!rows[i].val) continue;
          var row = document.createElement('div');
          row.className = 'pv-brief-kv-row';
          row.innerHTML = '<dt></dt><dd></dd>';
          row.querySelector('dt').textContent = i18n(rows[i].key);
          row.querySelector('dd').textContent = String(rows[i].val);
          grid.appendChild(row);
        }
        body.appendChild(grid);
        pvAppendMilestones_(body, brief.milestones);
      },
    );
    pvAppendBriefSection_(
      briefContent,
      'fa-users',
      'rose',
      'pb_brief_sec_people_heading',
      'pb_brief_sec_people_lead',
      function (body) {
        pvAppendStakeholders_(body, brief.stakeholders);
      },
    );
    pvAppendBriefSection_(
      briefContent,
      'fa-flag-checkered',
      'emerald',
      'pb_brief_sec_goals_heading',
      'pb_brief_sec_goals_lead',
      function (body) {
        pvAppendListItems_(body, brief.businessObjectives, 'label_em_dash');
        if (brief.constraints && brief.constraints.length) {
          var sub = document.createElement('div');
          sub.className = 'mt-4';
          sub.innerHTML =
            '<p class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400"></p>';
          sub.querySelector('p').textContent = i18n('pv_lbl_constraints');
          pvAppendListItems_(sub, brief.constraints, 'label_em_dash');
          body.appendChild(sub);
        }
      },
    );
    if (brief.technologyHints && brief.technologyHints.length) {
      pvAppendBriefSection_(briefContent, 'fa-microchip', 'slate', 'pv_lbl_technology', '', function (body) {
        var chips = document.createElement('div');
        chips.className = 'pv-tech-chips';
        var i;
        for (i = 0; i < brief.technologyHints.length; i++) {
          var chip = document.createElement('span');
          chip.className = 'pv-tech-chip';
          chip.textContent = String(brief.technologyHints[i]);
          chips.appendChild(chip);
        }
        body.appendChild(chips);
      });
    }
    if (brief.detectedLanguage) {
      pvAppendBriefSection_(briefContent, 'fa-language', 'sky', 'pb_lbl_detected_language', '', function (body) {
        var p = document.createElement('p');
        p.className = 'text-sm font-medium text-slate-800 dark:text-slate-200';
        p.textContent = pvLanguageLabel_(brief.detectedLanguage);
        body.appendChild(p);
      });
    }

  function pvMimeIcon_(mime) {
    var m = String(mime || '').toLowerCase();
    if (m.indexOf('pdf') >= 0) return 'fa-file-pdf';
    if (m.indexOf('word') >= 0 || m.indexOf('document') >= 0) return 'fa-file-word';
    if (m.indexOf('image') >= 0) return 'fa-file-image';
    if (m.indexOf('csv') >= 0 || m.indexOf('spreadsheet') >= 0) return 'fa-file-csv';
    return 'fa-file-lines';
  }

  function pvRenderMaterials_(session) {
    if (!materialsList || !materialsEmpty) return;
    materialsList.innerHTML = '';
    var list = Array.isArray(session.materials) ? session.materials : [];
    if (pvIsEditing_()) {
      materialsEmpty.classList.add('hidden');
      materialsList.classList.remove('hidden');
      if (!list.length) {
        pvAppendMaterialEditRow_(materialsList, {});
      } else {
        var ei;
        for (ei = 0; ei < list.length; ei++) {
          pvAppendMaterialEditRow_(materialsList, list[ei]);
        }
      }
      var addLi = document.createElement('li');
      addLi.className = 'pv-edit-add-row-wrap list-none';
      var addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'btn btn-sm btn-outline inline-flex items-center gap-2';
      addBtn.innerHTML = '<i class="fa-solid fa-plus" aria-hidden="true"></i><span></span>';
      addBtn.querySelector('span').textContent = i18n('pv_edit_btn_add_material');
      addBtn.addEventListener('click', function () {
        pvAppendMaterialEditRow_(materialsList, {});
      });
      addLi.appendChild(addBtn);
      materialsList.appendChild(addLi);
      return;
    }
    materialsEmpty.classList.toggle('hidden', !!list.length);
    materialsList.classList.toggle('hidden', !list.length);
    var i;
    for (i = 0; i < list.length; i++) {
      var row = list[i] || {};
      var li = document.createElement('li');
      li.className = 'pv-material-row';
      var icon = pvMimeIcon_(row.mimeType);
      var sourceIcon = row.source === 'drive_link' ? 'fa-brands fa-google-drive' : 'fa-cloud-arrow-up';
      li.innerHTML =
        '<span class="pv-material-icon" aria-hidden="true"><i class="fa-solid ' +
        icon +
        '"></i></span><div class="min-w-0 flex-1"><p class="pv-material-name"></p><p class="pv-material-meta"></p></div>';
      li.querySelector('.pv-material-name').textContent = String(row.name || i18n('label_em_dash'));
      var metaParts = [];
      if (row.uploadedAt) metaParts.push(pvFormatDate_(row.uploadedAt));
      if (row.source === 'drive_link') metaParts.push(i18n('pv_materials_source_drive'));
      else if (row.mimeType) metaParts.push(String(row.mimeType));
      li.querySelector('.pv-material-meta').innerHTML =
        '<i class="fa-solid ' + sourceIcon + '" aria-hidden="true"></i><span></span>';
      li.querySelector('.pv-material-meta span').textContent = metaParts.join(' · ');
      if (row.driveFileUrl) {
        var link = document.createElement('a');
        link.href = row.driveFileUrl;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.className = 'btn btn-sm btn-outline inline-flex items-center gap-2 shrink-0';
        link.innerHTML =
          '<i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i><span></span>';
        link.querySelector('span').textContent = i18n('pb_btn_open_material_drive');
        li.appendChild(link);
      }
      materialsList.appendChild(li);
    }
  }

  function pvNormalizeStudioPriority_(rawPriority) {
    var p = String(rawPriority || 'medium').trim().toLowerCase();
    if (p === 'high' || p === 'medium' || p === 'low') return p;
    return 'medium';
  }

  function pvNormalizeStudioType_(rawType, studioName) {
    var t = String(rawType || '').trim().toLowerCase();
    if (t === 'digital' || t === 'ai' || t === 'enterprise') return t;
    var name = String(studioName || '').toLowerCase();
    if (/sap|servicenow|salesforce|oracle|aws|adobe|google cloud|microsoft|process optimization/.test(name)) {
      return 'enterprise';

    if (
      /automotive|media|healthcare|finance|airline|hospitality|games|education|sports|retail|consumer goods|energy|high tech/.test(
        name,
      )
    ) {
      return 'ai';
    }
    return 'digital';
  }

  function pvGetDeckOptionsFromSession_(session) {
    session = session || {};
    var ctx = session.context && typeof session.context === 'object' ? session.context : {};
    return ctx.deckOptions && typeof ctx.deckOptions === 'object' ? ctx.deckOptions : {};
  }

  function pvGetDeckOptionsEffective_(session) {
    session = session || {};
    var deckOpts = pvGetDeckOptionsFromSession_(session);
    var globantCb = document.querySelector('[data-pv-edit-deck-opt="includeGlobant"]');
    var airlinesCb = document.querySelector('[data-pv-edit-deck-opt="includeAirlinesStudio"]');
    if (pvIsEditing_() && (globantCb || airlinesCb)) {
      return {
        includeGlobant: globantCb ? !!globantCb.checked : deckOpts.includeGlobant !== false,
        includeAirlinesStudio: airlinesCb ? !!airlinesCb.checked : deckOpts.includeAirlinesStudio !== false,
      };
    }
    return {
      includeGlobant: deckOpts.includeGlobant !== false,
      includeAirlinesStudio: deckOpts.includeAirlinesStudio !== false,
    };
  }

  function pvShouldShowDeckSections_(session) {
    session = session || {};
    var deckOpts = pvGetDeckOptionsFromSession_(session);
    return session.industryKey === 'Aerolineas' || Object.keys(deckOpts).length > 0;
  }

  function pvBuildAgendaItems_(session, deckOpts) {
    session = session || {};
    deckOpts = deckOpts || {};
    var defs = [];
    if (deckOpts.includeGlobant !== false) {
      defs.push('pb_agenda_item_globant');
    }
    if (session.industryKey === 'Aerolineas' && deckOpts.includeAirlinesStudio !== false) {
      defs.push('pb_agenda_item_airlines_studio');
    }
    defs.push('pb_agenda_item_understanding');
    defs.push('pb_agenda_item_solution');
    defs.push('pb_agenda_item_success_cases');
    var out = [];
    var i;
    for (i = 0; i < defs.length; i++) {
      out.push({ order: i + 1, label: i18n(defs[i]) });
    }
    return out;
  }

  function pvRenderAgendaItemsList_(session, deckOpts) {
    if (!agendaItemsList) return;
    agendaItemsList.innerHTML = '';
    var items = pvBuildAgendaItems_(session, deckOpts);
    var i;
    for (i = 0; i < items.length; i++) {
      var li = document.createElement('li');
      li.className = 'pv-agenda-item-row';
      li.innerHTML =
        '<span class="pv-agenda-item-order" aria-hidden="true"></span><span class="pv-agenda-item-label"></span>';
      li.querySelector('.pv-agenda-item-order').textContent = String(items[i].order);
      li.querySelector('.pv-agenda-item-label').textContent = items[i].label;
      agendaItemsList.appendChild(li);

  function pvRenderAgendaModalContent_(session) {
    session = session || pvGetSession_() || {};
    var deckOpts = pvGetDeckOptionsEffective_(session);
    var showSections = pvShouldShowDeckSections_(session);
    if (agendaSectionsWrap) agendaSectionsWrap.classList.toggle('hidden', !showSections);
    if (agendaDeckOptionsList) {
      agendaDeckOptionsList.innerHTML = '';
      if (showSections) {
        if (pvIsEditing_()) {
          pvRenderDeckOptionsEdit_(session);
        } else {
          pvAppendDeckOptionRow_(agendaDeckOptionsList, 'pb_agenda_item_globant', deckOpts.includeGlobant !== false);
          if (session.industryKey === 'Aerolineas') {
            pvAppendDeckOptionRow_(
              agendaDeckOptionsList,
              'pb_agenda_item_airlines_studio',
              deckOpts.includeAirlinesStudio !== false,
            );
          }
        }
      }
    }
    pvRenderAgendaItemsList_(session, deckOpts);

    var session = pvGetSession_();

    pvRenderAgendaModalContent_(session);

      agendaModal.setAttribute('aria-hidden', 'false');

    if (!opts.keepEditing) {
      S.set('proposalViewEditing', false);
      pvRemindersExpanded_ = false;
    }
    pvUpdateToolbar_();
    pvRenderAll_(session);
  }

  function pvSetMaterialsStatus_(msg, isError) {
    if (!materialsAddStatus) return;
    if (!msg) {
      materialsAddStatus.classList.add('hidden');
      materialsAddStatus.textContent = '';
      materialsAddStatus.classList.remove('text-rose-700', 'text-emerald-700', 'dark:text-rose-300', 'dark:text-emerald-300');
      return;
    }
    materialsAddStatus.textContent = msg;
    materialsAddStatus.classList.remove('hidden');
    materialsAddStatus.classList.toggle('text-rose-700', !!isError);
    materialsAddStatus.classList.toggle('dark:text-rose-300', !!isError);
    materialsAddStatus.classList.toggle('text-emerald-700', !isError);
    materialsAddStatus.classList.toggle('dark:text-emerald-300', !isError);
  }

  function pvReadFileAttachment_(file, onOk, onErr) {
    if (A.proposalBuilding && typeof A.proposalBuilding.readAttachmentFile === 'function') {
      A.proposalBuilding.readAttachmentFile(file, onOk, onErr);
      return;
    }
    onErr(new Error(i18n('pv_materials_err_upload')));
  }

  function pvUploadMaterialAttachment_(attachment, onDone) {
    var session = pvGetSession_();
    if (!session || !session.sessionId) {
      if (onDone) onDone();
      return;
    }
    google.script.run
      .withSuccessHandler(function (res) {
        var updated = res && res.session;
        if (updated) pvHydrateSession_(updated);
        if (onDone) onDone(null, updated);
      })
      .withFailureHandler(function (e) {
        if (onDone) onDone(e);
        else {
          A.reportRpcError(e, {
            scope: 'proposalViewAddMaterial',
            fallbackKey: 'pv_materials_err_upload',
            modal: true,
            setStatus: function (msg) {
              pvSetMaterialsStatus_(msg, true);
            },
          });
        }
      })
      .proposalBuildingSessionAddMaterial(session.sessionId, JSON.stringify({ attachment: attachment }));
  }

  function pvAddDriveMaterial_() {
    var session = pvGetSession_();
    if (!session || !session.sessionId) return;
    var url = materialsDriveUrl ? String(materialsDriveUrl.value || '').trim() : '';
    if (!url) {
      pvSetMaterialsStatus_(i18n('pv_materials_err_drive_empty'), true);
      return;
    }
    A.showBlockingModal(i18n('pv_materials_busy_drive'));
    pvSetMaterialsStatus_('');
    if (materialsBrowseBtn) materialsBrowseBtn.disabled = true;
    if (materialsDriveBtn) materialsDriveBtn.disabled = true;
    google.script.run
      .withSuccessHandler(function (res) {
        A.hideBlockingModal();
        if (materialsBrowseBtn) materialsBrowseBtn.disabled = false;
        if (materialsDriveBtn) materialsDriveBtn.disabled = false;
        if (materialsDriveUrl) materialsDriveUrl.value = '';
        var updated = res && res.session;
        if (updated) pvHydrateSession_(updated);
        pvSetMaterialsStatus_(i18n('pv_materials_added'), false);
      })
      .withFailureHandler(function (e) {
        A.hideBlockingModal();
        if (materialsBrowseBtn) materialsBrowseBtn.disabled = false;
        if (materialsDriveBtn) materialsDriveBtn.disabled = false;
        A.reportRpcError(e, {
          scope: 'proposalViewAddDriveMaterial',
          fallbackKey: 'pv_materials_err_upload',
          modal: true,
          setStatus: function (msg) {
            pvSetMaterialsStatus_(msg, true);
          },
        });
      })
      .proposalBuildingSessionAddMaterial(session.sessionId, JSON.stringify({ driveUrl: url }));
  }

  function pvHandleMaterialFiles_(fileList) {
    var files = fileList ? Array.from(fileList) : [];
    if (!files.length) return;
    A.showBlockingModal(i18n('pv_materials_busy_upload'));
    pvSetMaterialsStatus_('');
    if (materialsBrowseBtn) materialsBrowseBtn.disabled = true;
    if (materialsDriveBtn) materialsDriveBtn.disabled = true;
    var queue = files.slice();
    function drain_() {
      if (!queue.length) {
        A.hideBlockingModal();
        if (materialsBrowseBtn) materialsBrowseBtn.disabled = false;
        if (materialsDriveBtn) materialsDriveBtn.disabled = false;
        if (materialsInput) materialsInput.value = '';
        pvSetMaterialsStatus_(i18n('pv_materials_added'), false);
        return;
      }
      var file = queue.shift();
      pvReadFileAttachment_(
        file,
        function (attachment) {
          pvUploadMaterialAttachment_(attachment, function (err) {
            if (err) {
              A.hideBlockingModal();
              if (materialsBrowseBtn) materialsBrowseBtn.disabled = false;
              if (materialsDriveBtn) materialsDriveBtn.disabled = false;
              A.reportRpcError(err, {
                scope: 'proposalViewAddMaterial',
                fallbackKey: 'pv_materials_err_upload',
                modal: true,
                setStatus: function (msg) {
                  pvSetMaterialsStatus_(msg, true);
                },
              });
              return;
            }
            drain_();
          });
        },
        function (eRead) {
          A.hideBlockingModal();
          if (materialsBrowseBtn) materialsBrowseBtn.disabled = false;
          if (materialsDriveBtn) materialsDriveBtn.disabled = false;
          A.reportRpcError(eRead, {
            scope: 'proposalViewReadMaterial',
            fallbackKey: 'pv_materials_err_upload',
            modal: true,
          });
        },
      );
    }
    drain_();
  }

  function pvRenderAll_(session) {
    pvRenderHero_(session);
    pvRenderOverview_(session);
    pvRenderBrief_(session);
    pvRenderMaterials_(session);
    pvRenderStudios_(session);
    pvRenderDeliverables_(session);
    pvUpdateToolbar_();
  }

  function pvOpenSession_(sessionId) {
    var sid = String(sessionId || '').trim();
    if (!sid) return;
    A.showBlockingModal(i18n('pv_busy_loading'));
    google.script.run
      .withSuccessHandler(function (res) {
        A.hideBlockingModal();
        var session = res && res.session;
        if (!session || !session.sessionId) {
          A.showErrorDialog({
            title: i18n('page_proposal_view_title'),
            message: i18n('pv_err_load'),
          });
          return;
        }
        S.set('proposalViewSession', session);
        S.set('proposalViewSessionId', session.sessionId);
        S.set('proposalViewEditing', false);
        pvRemindersExpanded_ = false;
        pvUpdateToolbar_();
        pvRenderAll_(session);
        var savedTab = S.get('proposalViewActiveTab') || 'summary';
        if (savedTab === 'overview' || savedTab === 'brief') savedTab = 'summary';
        pvSetTab_(savedTab);
        if (typeof A.setAppPage === 'function') A.setAppPage('proposal-view');
      })
      .withFailureHandler(function (e) {
        A.hideBlockingModal();
        A.reportRpcError(e, {
          scope: 'proposalViewLoad',
          fallbackKey: 'pv_err_load',
          modal: true,
        });
      })
      .proposalBuildingSessionGet(sid);
  }

  if (materialsBrowseBtn && materialsInput) {
    materialsBrowseBtn.addEventListener('click', function () {
      materialsInput.click();
    });
    materialsInput.addEventListener('change', function () {
      pvHandleMaterialFiles_(materialsInput.files);
    });
  }
  if (materialsDriveBtn) {
    materialsDriveBtn.addEventListener('click', pvAddDriveMaterial_);
  }
  if (materialsDriveUrl) {
    materialsDriveUrl.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        pvAddDriveMaterial_();
      }
    });
  }

  if (backBtn) {
    backBtn.addEventListener('click', function () {
      if (typeof A.setAppPage === 'function') A.setAppPage('my-proposals');
    });
  }
  if (editBtn) {
    editBtn.addEventListener('click', function () {
      pvSetEditing_(true);
      pvSetTab_('summary');
    });
  }
  if (saveBtn) {
    saveBtn.addEventListener('click', pvSaveEdit_);
  }
  if (cancelBtn) {
    cancelBtn.addEventListener('click', function () {
      pvSetEditing_(false);
    });
  }
  if (remindersToggle) {
    remindersToggle.addEventListener('click', pvToggleRemindersPanel_);
  }
  if (remindersSaveBtn) {
    remindersSaveBtn.addEventListener('click', function () {
      pvSaveReminders_();
    });
  }
  if (tabbar) {
    tabbar.addEventListener('click', function (ev) {
      var btn = ev.target && ev.target.closest ? ev.target.closest('[data-pv-tab]') : null;
      if (!btn) return;
      pvSetTab_(btn.getAttribute('data-pv-tab') || 'summary');
    });
    tabbar.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      var btn = ev.target && ev.target.closest ? ev.target.closest('[data-pv-tab]') : null;
      if (!btn) return;
      ev.preventDefault();
      pvSetTab_(btn.getAttribute('data-pv-tab') || 'summary');
    });
  }
  if (agendaModalCloseBtn) agendaModalCloseBtn.addEventListener('click', pvCloseAgendaModal_);
  if (agendaModalCloseIcon) agendaModalCloseIcon.addEventListener('click', pvCloseAgendaModal_);
  if (agendaModal) {
    agendaModal.addEventListener('click', function (ev) {
      if (ev.target === agendaModal) pvCloseAgendaModal_();
    });
  }
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (agendaModal && !agendaModal.classList.contains('hidden')) pvCloseAgendaModal_();
  });

  A.proposalView = {
    openSession: pvOpenSession_,
    onEnterPage: function () {
      var session = pvGetSession_();
      if (session && session.sessionId) {
        pvUpdateToolbar_();
        pvRenderAll_(session);
        pvSetTab_(S.get('proposalViewActiveTab') || 'summary');
      }
    },
    setTab: pvSetTab_,
  };

  pvUpdateToolbar_();

  S.on('activePage', function (pg) {
    if (pg === 'proposal-view' && A.proposalView && typeof A.proposalView.onEnterPage === 'function') {
      A.proposalView.onEnterPage();
    }
  });
})(window.Aviators);
</script>
