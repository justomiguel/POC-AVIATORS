<script>
(function (A) {
  var S = A.state;
  var i18n = A.i18n;
  var i18nFmt = A.i18nFmt;

  var qpSection = document.getElementById('settings-qp-section');
  var qpList = document.getElementById('admin-qp-list');
  var qpAddBtn = document.getElementById('admin-qp-add-btn');
  var qpSaveBtn = document.getElementById('admin-qp-save-btn');
  var qpStatus = document.getElementById('admin-qp-status');
  var qpObList = document.getElementById('admin-qp-onboarding-list');
  var qpObAddBtn = document.getElementById('admin-qp-onboarding-add-btn');
  var qpObSaveBtn = document.getElementById('admin-qp-onboarding-save-btn');
  var qpObStatus = document.getElementById('admin-qp-onboarding-status');

  var resetSection = document.getElementById('admin-reset-all-section');
  var resetAllBtn = document.getElementById('admin-reset-all-btn');
  var resetStatus = document.getElementById('settings-reset-status');

  var embeddingsSection = document.getElementById('admin-embeddings-section');
  var rebuildEmbeddingsBtn = document.getElementById('admin-rebuild-embeddings-btn');
  var embeddingsStatus = document.getElementById('settings-embeddings-status');
  var embeddingsBusy = false;

  var kgLimitsSection = document.getElementById('settings-kg-limits-section');
  var kgLimitsLoader = document.getElementById('settings-kg-limits-loader');
  var kgLimitsSaveBtn = document.getElementById('settings-kg-limits-save-btn');
  var kgLimitsStatus = document.getElementById('settings-kg-limits-status');
  var kgMaxNodesDefault = document.getElementById('settings-kg-max-nodes-default');
  var kgMaxNodesCap = document.getElementById('settings-kg-max-nodes-cap');
  var kgHubSeedLimit = document.getElementById('settings-kg-hub-seed-limit');
  var kgDepthDefault = document.getElementById('settings-kg-depth-default');
  var kgDepthCap = document.getElementById('settings-kg-depth-cap');
  var kgDensityCompact = document.getElementById('settings-kg-density-compact');
  var kgDensityNormal = document.getElementById('settings-kg-density-normal');
  var kgDensityWide = document.getElementById('settings-kg-density-wide');
  var kgLimitsBusy = false;

  var sfSyncSection = document.getElementById('admin-sf-sync-section');
  var sfSyncBtn = document.getElementById('admin-sf-sync-btn');
  var clientsDedupeBtn = document.getElementById('admin-clients-dedupe-btn');
  var sfSyncActivateAutoBtn = document.getElementById('admin-sf-sync-activate-auto-btn');
  var sfSyncStatus = document.getElementById('settings-sf-sync-status');
  var sfSyncScheduleVal = document.getElementById('admin-sf-sync-schedule-val');
  var sfSyncTriggerVal = document.getElementById('admin-sf-sync-trigger-val');
  var sfSyncLastVal = document.getElementById('admin-sf-sync-last-val');
  var sfSyncBusy = false;
  var sfSyncStatusLoading = false;

  var roleConfigSection = document.getElementById('settings-role-config-section');
  var roleConfigBoard = document.getElementById('role-config-board');
  var roleConfigPoolRead = document.getElementById('role-config-pool-read');
  var roleConfigPoolWrite = document.getElementById('role-config-pool-write');
  var roleConfigLoader = document.getElementById('role-config-loader');
  var roleConfigLoaderMsg = document.getElementById('role-config-loader-msg');
  var roleConfigAddBtn = document.getElementById('role-config-add-btn');
  var roleConfigSaveBtn = document.getElementById('role-config-save-btn');
  var roleConfigStatus = document.getElementById('role-config-status');
  var roleConfigAddDialog = document.getElementById('role-config-add-dialog');
  var roleConfigAddForm = document.getElementById('role-config-add-form');
  var roleConfigAddKey = document.getElementById('role-config-add-key');
  var roleConfigAddLabelEs = document.getElementById('role-config-add-label-es');
  var roleConfigAddLabelEn = document.getElementById('role-config-add-label-en');
  var roleConfigAddCancel = document.getElementById('role-config-add-cancel');

  var settingsTabRoot = document.getElementById('settings-tab-root');
  var settingsTabList = document.getElementById('settings-tab-list');
  var settingsUsersTabRoot = document.getElementById('settings-users-tab-root');
  var settingsTabs = null;
  var settingsUsersTabs = null;

  var usersSection = document.getElementById('settings-users-section');
  var visitorsSearch = document.getElementById('admin-users-visitors-search');
  var visitorsLoader = document.getElementById('admin-users-visitors-loader');
  var visitorsLoaderMsg = document.getElementById('admin-users-visitors-loader-msg');
  var visitorsBody = document.getElementById('admin-users-visitors-body');
  var visitorsPagerInfo = document.getElementById('admin-users-visitors-pager-info');
  var visitorsPrev = document.getElementById('admin-users-visitors-prev');
  var visitorsNext = document.getElementById('admin-users-visitors-next');
  var visitorsStatus = document.getElementById('admin-users-visitors-status');
  var rolesSearch = document.getElementById('admin-users-roles-search');
  var rolesLoader = document.getElementById('admin-users-roles-loader');
  var rolesLoaderMsg = document.getElementById('admin-users-roles-loader-msg');
  var rolesBody = document.getElementById('admin-users-roles-body');
  var rolesPagerInfo = document.getElementById('admin-users-roles-pager-info');
  var rolesPrev = document.getElementById('admin-users-roles-prev');
  var rolesNext = document.getElementById('admin-users-roles-next');
  var rolesStatus = document.getElementById('admin-users-roles-status');
  var requestsStatus = document.getElementById('admin-users-requests-status');
  var bulkPaste = document.getElementById('admin-users-bulk-paste');
  var bulkRole = document.getElementById('admin-users-bulk-role');
  var bulkAssignBtn = document.getElementById('admin-users-bulk-assign-btn');
  var bulkPreview = document.getElementById('admin-users-bulk-preview');
  var bulkStatus = document.getElementById('admin-users-bulk-status');
  var bulkPreviewTimer = null;
  var bulkBusy = false;

  var USERS_PAGE_SIZE = 25;
  var usersRoleOptions = [];
  var visitorsSkip = 0;
  var rolesSkip = 0;
  var visitorsTotal = 0;
  var rolesTotal = 0;
  var visitorsHasMore = false;
  var rolesHasMore = false;
  var visitorsItems = [];
  var rolesItems = [];
  var usersSearchTimer = null;
  var usersBusy = false;

  var resetBusy = false;

  var roleConfigPermissions = [];
  var roleConfigRoles = [];
  var roleConfigBusy = false;
  var roleConfigDragKey = '';

  function roleConfigLocaleUi_() {
    var ci = S.get('cachedI18n');
    return ci && ci._locale === 'en' ? 'en' : 'es';
  }

  function roleConfigSetStatus(text, isError) {
    if (!roleConfigStatus) return;
    var t = String(text || '').trim();
    roleConfigStatus.textContent = t || '\u00a0';
    roleConfigStatus.classList.toggle('text-red-700', !!isError && !!t);
    roleConfigStatus.classList.toggle('text-emerald-700', !isError && !!t);
    roleConfigStatus.classList.toggle('text-slate-600', !t);
  }

  function roleConfigSetBusy(on, msgKey) {
    roleConfigBusy = !!on;
    if (roleConfigLoader) roleConfigLoader.classList.toggle('hidden', !on);
    if (roleConfigLoaderMsg && on) {
      roleConfigLoaderMsg.textContent = i18n(msgKey || 'role_config_busy_load');
    }
    if (roleConfigSaveBtn) roleConfigSaveBtn.disabled = on;
    if (roleConfigAddBtn) roleConfigAddBtn.disabled = on;
  }

  function roleConfigFindRole_(key) {
    var k = String(key || '').trim().toLowerCase();
    for (var i = 0; i < roleConfigRoles.length; i++) {
      if (roleConfigRoles[i].key === k) return roleConfigRoles[i];
    }
    return null;
  }

  function roleConfigFindPerm_(key) {
    var k = String(key || '').trim();
    for (var i = 0; i < roleConfigPermissions.length; i++) {
      if (roleConfigPermissions[i].key === k) return roleConfigPermissions[i];
    }
    return null;
  }

  function roleConfigRoleLabel_(role) {
    if (!role || !role.label) return role ? role.key : '';
    var loc = roleConfigLocaleUi_();
    return String(role.label[loc] || role.label.es || role.key).trim() || role.key;
  }

  function roleConfigGrant_(roleKey, permKey) {
    var role = roleConfigFindRole_(roleKey);
    if (!role || role.key === 'admin') return;
    if (!role.permissions) role.permissions = {};
    role.permissions[permKey] = true;
  }

  function roleConfigRevoke_(roleKey, permKey) {
    var role = roleConfigFindRole_(roleKey);
    if (!role || role.key === 'admin') return;
    if (role.permissions) delete role.permissions[permKey];
  }

  function roleConfigHasPerm_(role, permKey) {
    if (!role) return false;
    if (role.key === 'admin') return true;
    return !!(role.permissions && role.permissions[permKey]);
  }

  function roleConfigPermKind_(perm) {
    return perm && perm.kind === 'write' ? 'write' : 'read';
  }

  function roleConfigBuildChip_(perm, mode, roleKey) {
    var chip = document.createElement('span');
    chip.className = 'role-config-chip';
    chip.setAttribute('role', 'listitem');
    chip.dataset.permKey = perm.key;
    chip.dataset.permKind = roleConfigPermKind_(perm);
    if (roleKey) chip.dataset.roleKey = roleKey;
    var readonly = mode === 'readonly';
    var active = mode === 'active';
    var kind = roleConfigPermKind_(perm);
    chip.classList.add(
      readonly ? 'role-config-chip-readonly' : active ? 'role-config-chip-active' : 'role-config-chip-pool',
    );
    chip.classList.add(kind === 'write' ? 'role-config-chip-kind-write' : 'role-config-chip-kind-read');
    chip.textContent = perm.label || perm.key;
    if (!readonly) {
      chip.draggable = true;
      chip.addEventListener('dragstart', function (ev) {
        roleConfigDragKey = perm.key;
        if (ev.dataTransfer) {
          ev.dataTransfer.setData('text/plain', perm.key);
          ev.dataTransfer.effectAllowed = 'copyMove';
        }
      });
      chip.addEventListener('dragend', function () {
        roleConfigDragKey = '';
        var zones = document.querySelectorAll('.role-config-dropzone.is-drag-over');
        for (var z = 0; z < zones.length; z++) zones[z].classList.remove('is-drag-over');
      });
    }
    if (active && roleKey !== 'admin') {
      var rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'role-config-chip-remove';
      rm.setAttribute('aria-label', i18n('role_config_delete_btn'));
      rm.innerHTML = '<i class="fa-solid fa-xmark" aria-hidden="true"></i>';
      rm.addEventListener('click', function (ev) {
        ev.stopPropagation();
        roleConfigRevoke_(roleKey, perm.key);
        roleConfigRenderBoard_();
        roleConfigRenderPool_();
      });
      chip.appendChild(rm);
    }
    return chip;
  }

  function roleConfigBindDropzone_(zone, roleKey, expectedKind) {
    zone.addEventListener('dragover', function (ev) {
      if (roleKey === 'admin') return;
      var pk = roleConfigDragKey || (ev.dataTransfer ? ev.dataTransfer.getData('text/plain') : '');
      var perm = roleConfigFindPerm_(pk);
      if (perm && roleConfigPermKind_(perm) !== expectedKind) {
        if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'none';
        return;
      }
      ev.preventDefault();
      zone.classList.add('is-drag-over');
      if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'copy';
    });
    zone.addEventListener('dragleave', function () {
      zone.classList.remove('is-drag-over');
    });
    zone.addEventListener('drop', function (ev) {
      ev.preventDefault();
      zone.classList.remove('is-drag-over');
      if (roleKey === 'admin') return;
      var pk = roleConfigDragKey || (ev.dataTransfer ? ev.dataTransfer.getData('text/plain') : '');
      pk = String(pk || '').trim();
      if (!pk) return;
      var permDrop = roleConfigFindPerm_(pk);
      if (!permDrop || roleConfigPermKind_(permDrop) !== expectedKind) return;
      roleConfigGrant_(roleKey, pk);
      roleConfigRenderBoard_();
      roleConfigRenderPool_();
    });
  }

  function roleConfigCreateRoleZone_(role, kind) {
    var zone = document.createElement('div');
    zone.className = 'role-config-dropzone role-config-dropzone-' + kind;
    zone.dataset.expectedKind = kind;

    var label = document.createElement('p');
    label.className = 'role-config-zone-label';
    label.textContent = i18n(kind === 'write' ? 'role_config_col_write_label' : 'role_config_col_read_label');
    zone.appendChild(label);

    var chipsWrap = document.createElement('div');
    chipsWrap.className = 'role-config-zone-chips flex flex-wrap gap-1.5';
    chipsWrap.setAttribute('role', 'list');

    var chipCount = 0;
    for (var p = 0; p < roleConfigPermissions.length; p++) {
      var perm = roleConfigPermissions[p];
      if (roleConfigPermKind_(perm) !== kind) continue;
      if (!roleConfigHasPerm_(role, perm.key)) continue;
      chipCount++;
      var mode = role.key === 'admin' ? 'readonly' : 'active';
      chipsWrap.appendChild(roleConfigBuildChip_(perm, mode, role.key));
    }

    if (role.key !== 'admin' && chipCount === 0) {
      var hint = document.createElement('p');
      hint.className = 'role-config-zone-hint';
      hint.textContent = i18n('role_config_drop_hint');
      chipsWrap.appendChild(hint);
    }

    zone.appendChild(chipsWrap);
    roleConfigBindDropzone_(zone, role.key, kind);
    return zone;
  }

  function roleConfigRenderBoard_() {
    if (!roleConfigBoard) return;
    roleConfigBoard.innerHTML = '';
    for (var i = 0; i < roleConfigRoles.length; i++) {
      (function (role) {
        var col = document.createElement('div');
        col.className = 'role-config-column';
        col.dataset.roleKey = role.key;

        var head = document.createElement('div');
        head.className = 'role-config-column-head';

        var titleRow = document.createElement('div');
        titleRow.className = 'flex items-start justify-between gap-2';

        var title = document.createElement('div');
        title.className = 'role-config-column-title';
        title.textContent = roleConfigRoleLabel_(role);
        titleRow.appendChild(title);

        if (!role.system && role.key !== 'admin') {
          var delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'inline-flex items-center gap-1 rounded px-1.5 py-0.5 text-[10px] text-red-600 hover:bg-red-50';
          delBtn.title = i18n('role_config_delete_btn');
          delBtn.innerHTML = '<i class="fa-solid fa-trash" aria-hidden="true"></i>';
          delBtn.addEventListener('click', function () {
            roleConfigDeleteRole_(role.key);
          });
          titleRow.appendChild(delBtn);
        }
        head.appendChild(titleRow);

        var meta = document.createElement('p');
        meta.className = 'role-config-column-meta';
        var metaParts = [];
        if (role.system || role.key === 'admin') metaParts.push(i18n('role_config_system_badge'));
        metaParts.push(i18nFmt('role_config_users_count', { count: role.userCount || 0 }));
        meta.textContent = metaParts.join(' · ');
        head.appendChild(meta);
        col.appendChild(head);

        col.appendChild(roleConfigCreateRoleZone_(role, 'read'));
        col.appendChild(roleConfigCreateRoleZone_(role, 'write'));
        roleConfigBoard.appendChild(col);
      })(roleConfigRoles[i]);
    }
  }

  function roleConfigRenderPool_() {
    if (roleConfigPoolRead) roleConfigPoolRead.innerHTML = '';
    if (roleConfigPoolWrite) roleConfigPoolWrite.innerHTML = '';
    for (var i = 0; i < roleConfigPermissions.length; i++) {
      var perm = roleConfigPermissions[i];
      var target = roleConfigPermKind_(perm) === 'write' ? roleConfigPoolWrite : roleConfigPoolRead;
      if (target) target.appendChild(roleConfigBuildChip_(perm, 'pool', ''));
    }
  }

  function roleConfigBindPoolRevoke_(poolEl, kind) {
    if (!poolEl || poolEl.dataset.bound === '1') return;
    poolEl.dataset.bound = '1';
    poolEl.addEventListener('dragover', function (ev) {
      ev.preventDefault();
    });
    poolEl.addEventListener('drop', function (ev) {
      ev.preventDefault();
      var pk = roleConfigDragKey || (ev.dataTransfer ? ev.dataTransfer.getData('text/plain') : '');
      pk = String(pk || '').trim();
      if (!pk) return;
      var perm = roleConfigFindPerm_(pk);
      if (!perm || roleConfigPermKind_(perm) !== kind) return;
      for (var i = 0; i < roleConfigRoles.length; i++) {
        var role = roleConfigRoles[i];
        if (role.key === 'admin') continue;
        if (role.permissions && role.permissions[pk]) {
          roleConfigRevoke_(role.key, pk);
        }
      }
      roleConfigRenderBoard_();
      roleConfigRenderPool_();
    });
  }

  function roleConfigBindAllPools_() {
    roleConfigBindPoolRevoke_(roleConfigPoolRead, 'read');
    roleConfigBindPoolRevoke_(roleConfigPoolWrite, 'write');
  }

  function roleConfigLoad_() {
    if (!S.get('canManageRoleConfig')) return;
    roleConfigSetBusy(true, 'role_config_busy_load');
    roleConfigSetStatus('', false);
    google.script.run
      .withSuccessHandler(function (res) {
        roleConfigSetBusy(false);
        roleConfigPermissions = (res && res.permissions) || [];
        roleConfigRoles = (res && res.roles) || [];
        roleConfigRenderBoard_();
        roleConfigRenderPool_();
      })
      .withFailureHandler(function (e) {
        roleConfigSetBusy(false);
        roleConfigSetStatus((e && e.message) || i18n('role_config_err_generic'), true);
      })
      .adminRoleConfigGet();
  }

  function roleConfigCollectPayload_() {
    var roles = [];
    for (var i = 0; i < roleConfigRoles.length; i++) {
      var r = roleConfigRoles[i];
      roles.push({
        key: r.key,
        label: r.label || { es: r.key, en: r.key },
        system: !!r.system,
        permissions: r.permissions || {},
      });
    }
    return { version: 1, roles: roles };
  }

  function roleConfigSave_() {
    if (!S.get('canManageRoleConfig') || roleConfigBusy) return;
    roleConfigSetBusy(true, 'role_config_busy_save');
    A.showBlockingModal(i18n('role_config_busy_save'));
    google.script.run
      .withSuccessHandler(function () {
        A.hideBlockingModal();
        roleConfigSetBusy(false);
        roleConfigSetStatus(i18n('role_config_save_done'), false);
        roleConfigLoad_();
        usersLoadRoleOptions(function () {
          usersReloadAll();
        });
      })
      .withFailureHandler(function (e) {
        A.hideBlockingModal();
        roleConfigSetBusy(false);
        roleConfigSetStatus((e && e.message) || i18n('role_config_err_generic'), true);
      })
      .adminRoleConfigSave(JSON.stringify(roleConfigCollectPayload_()));
  }

  function roleConfigDeleteRole_(key) {
    if (!S.get('canManageRoleConfig') || roleConfigBusy) return;
    A.confirmDialog({
      title: i18n('role_config_delete_btn'),
      message: i18nFmt('role_config_delete_confirm', { key: key }),
      danger: true,
      confirmLabel: i18n('role_config_delete_btn'),
    }).then(function (ok) {
      if (!ok) return;
      roleConfigSetBusy(true, 'role_config_busy_delete');
      A.showBlockingModal(i18n('role_config_busy_delete'));
      google.script.run
        .withSuccessHandler(function () {
          A.hideBlockingModal();
          roleConfigSetBusy(false);
          roleConfigSetStatus(i18n('role_config_delete_done'), false);
          roleConfigLoad_();
          usersLoadRoleOptions(function () {
            usersReloadAll();
          });
        })
        .withFailureHandler(function (e) {
          A.hideBlockingModal();
          roleConfigSetBusy(false);
          roleConfigSetStatus((e && e.message) || i18n('role_config_err_generic'), true);
        })
        .adminRoleConfigRemoveRole(key);
    });
  }

  function roleConfigOpenAddDialog_() {
    if (!roleConfigAddDialog) return;
    if (roleConfigAddKey) roleConfigAddKey.value = '';
    if (roleConfigAddLabelEs) roleConfigAddLabelEs.value = '';
    if (roleConfigAddLabelEn) roleConfigAddLabelEn.value = '';
    if (typeof roleConfigAddDialog.showModal === 'function') roleConfigAddDialog.showModal();
  }

  function roleConfigSubmitAdd_() {
    if (!S.get('canManageRoleConfig') || roleConfigBusy) return;
    var key = roleConfigAddKey ? roleConfigAddKey.value.trim().toLowerCase() : '';
    var labelEs = roleConfigAddLabelEs ? roleConfigAddLabelEs.value.trim() : '';
    var labelEn = roleConfigAddLabelEn ? roleConfigAddLabelEn.value.trim() : '';
    if (!key || !labelEs) return;
    roleConfigSetBusy(true, 'role_config_busy_add');
    A.showBlockingModal(i18n('role_config_busy_add'));
    google.script.run
      .withSuccessHandler(function () {
        A.hideBlockingModal();
        roleConfigSetBusy(false);
        if (roleConfigAddDialog && typeof roleConfigAddDialog.close === 'function') {
          roleConfigAddDialog.close();
        }
        roleConfigSetStatus(i18n('role_config_add_done'), false);
        roleConfigLoad_();
        usersLoadRoleOptions(function () {
          usersReloadAll();
        });
      })
      .withFailureHandler(function (e) {
        A.hideBlockingModal();
        roleConfigSetBusy(false);
        roleConfigSetStatus((e && e.message) || i18n('role_config_err_generic'), true);
      })
      .adminRoleConfigAddRole(key, labelEs, labelEn || labelEs);
  }

  if (roleConfigAddBtn) {
    roleConfigAddBtn.addEventListener('click', roleConfigOpenAddDialog_);
  }
  if (roleConfigAddCancel && roleConfigAddDialog) {
    roleConfigAddCancel.addEventListener('click', function () {
      roleConfigAddDialog.close();
    });
  }
  if (roleConfigAddForm) {
    roleConfigAddForm.addEventListener('submit', function (ev) {
      ev.preventDefault();
      roleConfigSubmitAdd_();
    });
  }
  if (roleConfigSaveBtn) {
    roleConfigSaveBtn.addEventListener('click', roleConfigSave_);
  }

  function setResetStatus(text, isError) {
    if (!resetStatus) return;
    var t = String(text || '').trim();
    resetStatus.textContent = t || '\u00a0';
    resetStatus.classList.toggle('text-red-700', !!isError && !!t);
    resetStatus.classList.toggle('dark:text-red-400', !!isError && !!t);
    resetStatus.classList.toggle('text-emerald-700', !isError && !!t);
    resetStatus.classList.toggle('dark:text-emerald-400', !isError && !!t);
    resetStatus.classList.toggle('text-slate-600', !t);
    resetStatus.classList.toggle('dark:text-slate-400', !t);
  }

  function setEmbeddingsStatus(text, isError) {
    if (!embeddingsStatus) return;
    var t = String(text || '').trim();
    embeddingsStatus.textContent = t || '\u00a0';
    embeddingsStatus.classList.toggle('text-red-700', !!isError && !!t);
    embeddingsStatus.classList.toggle('dark:text-red-400', !!isError && !!t);
    embeddingsStatus.classList.toggle('text-emerald-700', !isError && !!t);
    embeddingsStatus.classList.toggle('dark:text-emerald-400', !isError && !!t);
    embeddingsStatus.classList.toggle('text-slate-600', !t);
    embeddingsStatus.classList.toggle('dark:text-slate-400', !t);
  }

  function setSfSyncStatus(text, isError) {
    if (!sfSyncStatus) return;
    var t = String(text || '').trim();
    sfSyncStatus.textContent = t || '\u00a0';
    sfSyncStatus.classList.toggle('text-red-700', !!isError && !!t);
    sfSyncStatus.classList.toggle('dark:text-red-400', !!isError && !!t);
    sfSyncStatus.classList.toggle('text-emerald-700', !isError && !!t);
    sfSyncStatus.classList.toggle('dark:text-emerald-400', !isError && !!t);
    sfSyncStatus.classList.toggle('text-slate-600', !t);
    sfSyncStatus.classList.toggle('dark:text-slate-400', !t);
  }

  function sfSyncFormatDateTime_(iso) {
    if (!iso) return '';
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      var loc = S.get('cachedI18n') && S.get('cachedI18n')._locale === 'en' ? 'en' : 'es';
      return new Intl.DateTimeFormat(loc, {
        dateStyle: 'medium',
        timeStyle: 'short',
      }).format(d);
    } catch (ignoreFmt) {
      return String(iso).slice(0, 19);
    }
  }

  function sfSyncRenderStatusPanel_(info) {
    if (!info) return;
    var hour = info.scheduleHour != null ? String(info.scheduleHour) : '6';
    if (sfSyncScheduleVal) {
      sfSyncScheduleVal.textContent = !info.spreadsheetConfigured
        ? i18n('admin_sf_sync_sheet_missing')
        : i18nFmt('admin_sf_sync_schedule_value', { hour: hour });
    }
    if (sfSyncTriggerVal) {
      if (info.triggerPermissionsOk === false) {
        sfSyncTriggerVal.textContent = i18n('admin_sf_sync_trigger_scope_required');
      } else {
        sfSyncTriggerVal.textContent = info.triggerInstalled
          ? i18n('admin_sf_sync_trigger_on')
          : i18n('admin_sf_sync_trigger_off');
      }
    }
    if (sfSyncActivateAutoBtn) {
      var showActivate =
        !!info.spreadsheetConfigured &&
        info.triggerPermissionsOk !== false &&
        !info.triggerInstalled;
      sfSyncActivateAutoBtn.classList.toggle('hidden', !showActivate);
      sfSyncActivateAutoBtn.disabled = !showActivate || sfSyncBusy;
    }
    var st = info.state || {};
    if (sfSyncLastVal) {
      if (!st.last_sync_at) {
        sfSyncLastVal.textContent = i18n('admin_sf_sync_last_none');
      } else {
        var lastLine = i18nFmt('admin_sf_sync_last_line', {

  function rebuildEmbeddingsBatch_(skip, doneAcc, failedAcc, total) {

      .withSuccessHandler(function (res) {

        var tot = res && res.total != null ? res.total : total;
        var nextSkip = res && res.skip != null && res.limit != null ? res.skip + res.limit : skip;
        if (res && res.hasMore) {
          A.showBlockingModal(
            i18nFmt('admin_embeddings_busy', { done: String(done), total: String(tot) }),

        A.hideBlockingModal();
        embeddingsBusy = false;
        if (rebuildEmbeddingsBtn) rebuildEmbeddingsBtn.disabled = false;
        setEmbeddingsStatus(
          i18nFmt('admin_embeddings_done', { done: String(done), failed: String(failed) }),

      .withFailureHandler(function (e) {
        A.hideBlockingModal();

      { tabId: 'settings-tab-users', perm: 'canManageUsers' },

      { tabId: 'settings-tab-salesforce', perm: 'canSyncSalesforceAccounts' },
      { tabId: 'settings-tab-data', perm: 'canResetMetrics' },
    ];
    var visibleTabs = [];
    for (var ti = 0; ti < tabPermMap.length; ti++) {
      var entry = tabPermMap[ti];

        !!S.get(entry.perm) || (entry.altPerm && !!S.get(entry.altPerm));

    if (settingsTabList) {
      settingsTabList.classList.toggle('hidden', visibleTabs.length <= 1);

  function usersFormatDate(iso) {
    if (!iso) return '\u2014';
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      var ci = S.get('cachedI18n');
      var loc = ci && ci._locale === 'en' ? 'en' : 'es';
      return new Intl.DateTimeFormat(loc, {
        dateStyle: 'short',
        timeStyle: 'short',
      }).format(d);
    } catch (eDate) {
      return iso;
    }
  }

  function usersUpdatePager(infoEl, prevBtn, nextBtn, skip, total, pageLen) {
    if (infoEl) {
      if (!total) {
        infoEl.textContent = i18n('metrics_pagination_empty');
      } else {
        var from = total ? skip + 1 : 0;
        var to = skip + pageLen;
        infoEl.textContent = i18nFmt('metrics_pagination_info', {
          from: from,
          to: to,
          total: total,
        });
      }
    }
    if (prevBtn) prevBtn.disabled = usersBusy || skip <= 0;
    if (nextBtn) nextBtn.disabled = usersBusy || skip + pageLen >= total;
  }

  function usersBuildRoleSelect(selectedKey) {

    blank.value = '';
    blank.textContent = i18n('admin_users_select_role');
    sel.appendChild(blank);

      if (selectedKey && opt.value === selectedKey) opt.selected = true;
      sel.appendChild(opt);

  function usersAssignRole(email, roleKey, mode) {
    if (!S.get('canManageUsers') || usersBusy) return;
    if (!roleKey) {
      usersSetStatus(
        mode === 'update' ? rolesStatus : visitorsStatus,
        i18n('admin_users_err_role'),
        true,
      );
      return;
    }
    usersBusy = true;
    var busyKey =
      mode === 'update' ? 'admin_users_busy_update' : 'admin_users_busy_assign';
    var doneKey =
      mode === 'update' ? 'admin_users_update_done' : 'admin_users_assign_done';
    A.showBlockingModal(i18n(busyKey));
    google.script.run
      .withSuccessHandler(function () {
        A.hideBlockingModal();
        usersBusy = false;
        usersSetStatus(visitorsStatus, i18n(doneKey), false);
        usersSetStatus(rolesStatus, i18n(doneKey), false);
        if (requestsStatus) usersSetStatus(requestsStatus, i18n(doneKey), false);
        usersReloadAll();
      })
      .withFailureHandler(function (e) {
        A.hideBlockingModal();
        usersBusy = false;
        usersSetStatus(
          mode === 'update' ? rolesStatus : visitorsStatus,
          (e && e.message) || i18n('admin_users_err_generic'),
          true,
        );
        usersReloadAll();
      })
      [mode === 'update' ? 'adminUsersUpdateRole' : 'adminUsersAssignRole'](email, roleKey);
  }

      .withSuccessHandler(function (res) {

        var failedPart =
          failed > 0

            : '';
        var msg = i18nFmt('admin_users_bulk_done', {
          success: String(success),
          total: String(tot),
          role: roleLbl,
          failedPart: failedPart,
        });
        if (failed > 0 && res.failures && res.failures.length) {
          var fi;
          for (fi = 0; fi < res.failures.length && fi < 5; fi++) {
            msg +=
              '\n' +
              String(res.failures[fi].email || '') +
              ': ' +
              String(res.failures[fi].message || '');

        usersSetStatus(bulkStatus, msg, failed > 0);

    function renumberItems_() {
      var items = cfg.list.querySelectorAll('.admin-qp-item');

        var lbl = items[i].querySelector('span.text-xs.font-medium');
        if (lbl) lbl.textContent = '#' + (i + 1);
      }

    function collectPrompts_() {
      var items = cfg.list.querySelectorAll('.admin-qp-item');
      var out = [];
      for (var i = 0; i < items.length; i++) {
        var esEl = items[i].querySelector('.admin-qp-es');
        var enEl = items[i].querySelector('.admin-qp-en');
        var es = esEl ? esEl.value.trim() : '';
        var en = enEl ? enEl.value.trim() : '';
        if (!es && !en) continue;
        out.push({
          id: cfg.idPrefix + (i + 1),
          es: es,
          en: en,
          order: i + 1,
        });
      }
      return out;

    return {

  function sfSyncEmbeddingsBatch_(start, doneAcc, failedAcc, total, dataRes) {
    var limit = 8;
    google.script.run
      .withSuccessHandler(function (res) {
        var processed = res && res.processed ? res.processed : 0;
        var failed = failedAcc + (res && res.failed ? res.failed : 0);
        var done = doneAcc + processed;
        var tot = res && res.total != null ? res.total : total;
        var progress = res && res.done != null ? res.done : start + limit;
        if (res && res.hasMore) {
          var busyMsg = i18nFmt('admin_sf_sync_busy_embeddings', {
            done: String(progress),
            total: String(tot),
          });
          sfSyncShowProgress_(busyMsg);
          sfSyncEmbeddingsBatch_(progress, done, failed, tot, dataRes);
          return;
        }
        sfSyncFinish_(dataRes, done, failed);

      if (S.get('canManageUsers')) {
        usersLoadRoleOptions(function () {
          usersReloadAll();
        });
      }
      if (S.get('canSyncSalesforceAccounts')) {
        sfSyncLoadStatusPanel_();
      }
      if (S.get('canRebuildKnowledgeGraph')) {
        kgLimitsLoad_();
      }
    },
    onShow: function () {
      initSettingsTabs();
      settingsActivatePendingTab_();
      if (settingsIsAgentsTabActive_()) {
        settingsOnAgentsTabShow_();
      } else {
        settingsSyncAgentsPanels_();
      }
      setResetStatus('', false);
      setEmbeddingsStatus('', false);
      setSfSyncStatus('', false);
      if (qpStatus) qpStatus.textContent = '';
      if (qpObStatus) qpObStatus.textContent = '';
      roleConfigSetStatus('', false);
      usersSetStatus(visitorsStatus, '', false);
      usersSetStatus(rolesStatus, '', false);
      if (requestsStatus) usersSetStatus(requestsStatus, '', false);
      if (bulkStatus) usersSetStatus(bulkStatus, '', false);
      if (S.get('canManageRoleConfig')) {
        roleConfigLoad_();
      }
      if (S.get('canManageUsers')) {
        usersLoadRoleOptions(function () {
          usersReloadAll();
        });
      }
      if (S.get('canSyncSalesforceAccounts')) {
        sfSyncLoadStatusPanel_();
      }
      if (S.get('canRebuildKnowledgeGraph')) {
        kgLimitsLoad_();
      }
    },
    reloadQuickPrompts: reloadQuickPrompts,
    usersUpdatePager: usersUpdatePager,
    usersAssignRoleFromRequest: usersAssignRoleFromRequest,
    usersReloadAll: usersReloadAll,
    openAgentsTab: function () {
      S.set('settingsPendingTab', 'settings-tab-agents');
      if (typeof A.setAppPage === 'function') {
        A.setAppPage('settings');
      }
    },
    activateTab: function (tabId) {
      if (!tabId) return;
      S.set('settingsPendingTab', String(tabId));
      if (S.get('activePage') === 'settings') {
        settingsActivatePendingTab_();
      }
    },
  };
})(window.Aviators);
</script>
