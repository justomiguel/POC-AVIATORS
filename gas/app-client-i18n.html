<script>
(function (A) {
  var S = A.state;

  A.applyClientI18n = function (pack) {
    if (!pack) return;
    S.set('cachedI18n', pack);
    A.updateLocaleButtonHighlight();
    var elems = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < elems.length; i++) {
      var key = elems[i].getAttribute('data-i18n');
      if (key && pack[key] !== undefined) elems[i].textContent = pack[key];
    }
    var htmlElems = document.querySelectorAll('[data-i18n-html]');
    for (var j = 0; j < htmlElems.length; j++) {
      var hk = htmlElems[j].getAttribute('data-i18n-html');
      if (hk && pack[hk] !== undefined) htmlElems[j].innerHTML = pack[hk];
    }
    var plElems = document.querySelectorAll('[data-i18n-placeholder]');
    for (var p = 0; p < plElems.length; p++) {
      var pk = plElems[p].getAttribute('data-i18n-placeholder');
      if (pk && pack[pk] !== undefined) plElems[p].placeholder = pack[pk];
    }
    var arElems = document.querySelectorAll('[data-i18n-aria-label]');
    for (var a = 0; a < arElems.length; a++) {
      var ak = arElems[a].getAttribute('data-i18n-aria-label');
      if (ak && pack[ak] !== undefined)
        arElems[a].setAttribute('aria-label', pack[ak]);
    }
  };

  A.i18n = function (key) {
    var ci = S.get('cachedI18n');
    return (ci && ci[key]) || key;
  };

  A.i18nFmt = function (key, params) {
    var ci = S.get('cachedI18n');
    var tpl = (ci && ci[key]) || key;
    if (!params) return tpl;
    return tpl.replace(/\{(\w+)\}/g, function (_, k) {
      return params[k] !== undefined ? params[k] : '{' + k + '}';
    });
  };

  /** @type {Object<string, string>} */
  var SERVER_ERROR_I18N = {
    ERR_DRIVE_ROOT_NOT_CONFIGURED: 'err_drive_root_not_configured',
    ERR_SALESFORCE_SHEET_NOT_CONFIGURED: 'err_salesforce_sheet_not_configured',
    ERR_SCRIPTAPP_SCOPE: 'err_scriptapp_scope',
    ERR_SUPABASE_NOT_CONFIGURED: 'err_supabase_not_configured',
    ERR_SUPABASE_SHEETS_DISABLED: 'err_supabase_sheets_disabled',
    ERR_ROLE_SUPABASE: 'err_role_supabase',
    ERR_CONTENT_REPAIR_DRIVE_SUCCESS_CASE_ONLY: 'err_contents_repair_drive_success_only',
    ERR_ACCESS_REQUEST_NOT_VISITOR: 'access_request_err_not_visitor',
    ERR_ACCESS_REQUEST_INVALID_ROLE: 'admin_users_err_role',
    ERR_ACCESS_REQUEST_REASON_REQUIRED: 'access_request_err_reason',
    ERR_ACCESS_REQUEST_REASON_TOO_LONG: 'access_request_err_reason_long',
    ERR_ACCESS_REQUEST_ALREADY_PENDING: 'access_request_err_pending',
    ERR_ACCESS_REQUEST_NO_SESSION: 'err_login_session',
    ERR_ACCESS_REQUEST_ID_REQUIRED: 'err_generic',
    ERR_ADMIN_USERS_BULK_NO_EMAILS: 'admin_users_bulk_err_no_emails',
    ERR_ADMIN_USERS_BULK_TOO_MANY: 'admin_users_bulk_err_too_many',
    ERR_CLIENT_ID_INVALID: 'err_client_id_invalid',
    ERR_CHAT_EXPORT_EMPTY: 'err_chat_export_empty',
    ERR_CHAT_EXPORT_PDF: 'err_chat_export_pdf',
    ERR_PDF_NOT_AVAILABLE: 'err_pdf_not_available',
    ERR_PDF_DRIVE: 'err_pdf_drive',
    ERR_ADMIN_AGENT_API_MODEL_INVALID: 'err_admin_agent_api_model_invalid',
    ERR_ADMIN_AGENT_API_STRATEGY_INVALID: 'err_admin_agent_api_strategy_invalid',
  };

  A.extractServerErrorCode = function (err) {
    var raw = err && err.message != null ? String(err.message).trim() : '';
    if (!raw) return '';
    var head = raw.match(/^ERR_[A-Z0-9_]+/);
    if (head) return head[0];
    var idx = raw.indexOf('ERR_');
    if (idx < 0) return '';
    var rest = raw.slice(idx);
    var cut = rest.search(/[\s:]/);
    return cut > 0 ? rest.slice(0, cut) : rest;
  };

  /**
   * Mensaje legible para errores de google.script.run (códigos ERR_* → i18n).
   * @param {*} err
   * @param {string=} fallbackKey
   * @return {string}
   */
  A.serverErrorMessage = function (err, fallbackKey) {
    var raw = err && err.message != null ? String(err.message).trim() : '';
    var code = A.extractServerErrorCode(err);
    if (code) {
      if (code.indexOf('ERR_SUPABASE_HTTP_') === 0) return A.i18n('err_supabase_http');
      if (code.indexOf('ERR_SUPABASE_JSON') === 0) return A.i18n('err_supabase_json');
      var key = SERVER_ERROR_I18N[code];
      if (key) return A.i18n(key);
      var colon = raw.indexOf(': ');
      if (colon > 0 && raw.indexOf(code) === 0) {
        var detailMsg = raw.slice(colon + 2).trim();
        if (detailMsg) return detailMsg;
      }
      return A.i18nFmt('err_server_code', { code: code });
    }
    if (raw) return raw;
    return A.i18n(fallbackKey || 'err_generic');
  };

  /**
   * Registra error en consola, cierra modal opcional, toast y callback de estado.
   * @param {*} err
   * @param {{scope?:string,fallbackKey?:string,hideModal?:boolean,toast?:boolean,setStatus?:function(string,boolean)}} opts
   * @return {string}
   */
  A.reportRpcError = function (err, opts) {
    var o = opts || {};
    var scope = o.scope || 'rpc';
    var raw = err && err.message != null ? String(err.message).trim() : '';
    var msg = A.serverErrorMessage(err, o.fallbackKey);
    if (window.console && console.error) {
      console.error('[Aviators RPC]', scope, raw || err);
    }
    if (o.hideModal !== false && A.hideBlockingModal) A.hideBlockingModal();
    if (o.modal && A.showErrorDialog) {
      A.showErrorDialog({
        title: o.title || A.i18n('error_dialog_title'),
        message: msg,
        detail: raw && raw !== msg ? raw : '',
      });
      if (o.toast === undefined) o.toast = false;
    }
    if (o.toast !== false && A.toast) A.toast.error(msg);
    if (typeof o.setStatus === 'function') o.setStatus(msg, true);
    return msg;
  };

  (function () {
    var want = null;
    try {
      var st = localStorage.getItem('aviators_locale');
      if (st === 'es' || st === 'en') want = st;
    } catch (eLoc) {}
    var ci = S.get('cachedI18n');
    if (!want || (ci && ci._locale === want)) return;
    google.script.run
      .withSuccessHandler(function (pack) {
        if (pack) A.applyClientI18n(pack);
      })
      .withFailureHandler(function () {})
      .getI18nPack(want);
  })();
})(window.Aviators);
</script>
