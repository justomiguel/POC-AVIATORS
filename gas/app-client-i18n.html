<script>
(function (A) {
  var S = A.state;
  var I18N_RELOADING = false;
  var I18N_READY_WAITERS = [];
  var I18N_LOAD_TIMEOUT_MS = 90000;
  var I18N_LS_SCHEMA_ = 'v1';
  var i18nLoadTimeoutId = null;

  function i18nClearLoadTimeout_() {
    if (i18nLoadTimeoutId) {
      clearTimeout(i18nLoadTimeoutId);
      i18nLoadTimeoutId = null;
    }
  }

  function i18nStartupMessage_(key, fallbackEs, fallbackEn) {
    var ci = S.get('cachedI18n');
    if (ci && ci[key]) return ci[key];
    var loc = ci && ci._locale === 'en' ? 'en' : 'es';
    return loc === 'en' ? fallbackEn : fallbackEs;
  }

  function i18nStartupLocale_(locale) {
    return locale === 'en' ? 'en' : 'es';
  }

  function i18nStartupSub_(loc, partIndex) {
    var ci = S.get('cachedI18n');
    var keys = [
      'app_startup_i18n_sub_meta',
      'app_startup_i18n_sub1',
      'app_startup_i18n_sub2',
      'app_startup_i18n_sub3',
    ];
    var idx = Math.max(0, Math.min(keys.length - 1, Number(partIndex) || 0));
    if (ci && ci[keys[idx]]) return ci[keys[idx]];
    var fallbacks = {
      es: [
        'Torre de control: autorizando plan de vuelo lingüístico…',
        'Compartimiento 1: menús y navegación a bordo…',
        'Compartimiento 2: formularios y estados vacíos…',
        'Compartimiento 3: mensajes de error y pistas técnicas…',
      ],
      en: [
        'Control tower: clearing the linguistic flight plan…',
        'Cargo bay 1: menus and navigation aboard…',
        'Cargo bay 2: forms and empty states…',
        'Cargo bay 3: errors and technical hints…',
      ],
    };
    var pack = fallbacks[i18nStartupLocale_(loc)] || fallbacks.es;
    return pack[idx] || pack[0];
  }

  function i18nResolveLocale_(locale) {
    return locale === 'en' ? 'en' : 'es';
  }

  function i18nPreferredLocale_() {
    try {
      var st = localStorage.getItem('aviators_locale');
      if (st === 'en') return 'en';
    } catch (eLocPref) {}
    return 'es';
  }

  function i18nStorageKey_(locale) {
    return 'aviators_i18n_' + I18N_LS_SCHEMA_ + '_' + i18nResolveLocale_(locale);
  }

  /**
   * Bypass de caché local: ?i18n_refresh=1 (equivale a forzar descarga completa).
   * @return {boolean}
   */
  function i18nShouldBypassLocalCache_() {
    try {
      var params = new URLSearchParams(window.location.search);
      if (params.get('i18n_refresh') === '1') return true;
    } catch (eQ) {}
    return false;
  }

  /**
   * @param {'es'|'en'} locale
   * @return {{revision:string,pack:Object,savedAt:number}|null}
   */
  function i18nReadLocalPack_(locale) {
    try {
      var raw = localStorage.getItem(i18nStorageKey_(locale));
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (!data || typeof data !== 'object' || !data.pack || !data.revision) return null;
      if (!A.i18nPackLooksValid(data.pack)) return null;
      if (data.pack._locale !== i18nResolveLocale_(locale)) return null;
      return {
        revision: String(data.revision),
        pack: data.pack,
        savedAt: Number(data.savedAt) || 0,
      };
    } catch (eRead) {
      return null;
    }
  }

  /**
   * @param {'es'|'en'} locale
   * @param {string} revision
   * @param {Object} pack
   */
  function i18nWriteLocalPack_(locale, revision, pack) {
    if (!pack || !A.i18nPackLooksValid(pack)) return;
    try {
      localStorage.setItem(
        i18nStorageKey_(locale),
        JSON.stringify({
          revision: String(revision || ''),
          savedAt: Date.now(),
          pack: pack,
        }),
      );
    } catch (eWrite) {
      if (window.console && console.warn) {
        console.warn('[Aviators i18n] localStorage write failed', eWrite);
      }
    }
  }

  function i18nClearLocalPack_(locale) {
    try {
      if (locale) {
        localStorage.removeItem(i18nStorageKey_(locale));
        return;
      }
      localStorage.removeItem(i18nStorageKey_('es'));
      localStorage.removeItem(i18nStorageKey_('en'));
    } catch (eClr) {}
  }

  function i18nTryHydrateFromLocalStorage_() {
    if (i18nShouldBypassLocalCache_()) return;
    var loc = i18nPreferredLocale_();
    var ci = S.get('cachedI18n');
    if (A.i18nPackLooksValid(ci) && ci._locale === loc) return;
    var cached = i18nReadLocalPack_(loc);
    if (cached && cached.pack) {
      S.set('cachedI18n', cached.pack);
    }
  }

  function i18nFlushReadyWaiters_() {
    var waiters = I18N_READY_WAITERS.slice();
    I18N_READY_WAITERS.length = 0;
    var wi;
    for (wi = 0; wi < waiters.length; wi++) {
      try {
        waiters[wi]();
      } catch (eWaiter) {}
    }
  }

  function i18nSanitizeCachedPack_() {
    var ci = S.get('cachedI18n');
    if (!ci || typeof ci !== 'object' || typeof ci._locale !== 'string') {
      S.set('cachedI18n', null);
      return;
    }
    if (!A.i18nPackLooksValid(ci)) {
      S.set('cachedI18n', null);
    }
  }

  A.applyClientI18n = function (pack) {
    if (!pack || typeof pack !== 'object' || typeof pack._locale !== 'string') return;
    if (!A.i18nPackLooksValid(pack)) return;
    S.set('cachedI18n', pack);
    A.updateLocaleButtonHighlight();
    var elems = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < elems.length; i++) {
      var key = elems[i].getAttribute('data-i18n');
      if (key && pack[key] !== undefined) elems[i].textContent = pack[key];
    }
    var htmlElems = document.querySelectorAll('[data-i18n-html]');
    for (var j = 0; j < htmlElems.length; j++) {
      var hk = htmlElems[j].getAttribute('data-i18n-html');
      if (hk && pack[hk] !== undefined) htmlElems[j].innerHTML = pack[hk];
    }
    var plElems = document.querySelectorAll('[data-i18n-placeholder]');
    for (var p = 0; p < plElems.length; p++) {
      var pk = plElems[p].getAttribute('data-i18n-placeholder');
      if (pk && pack[pk] !== undefined) plElems[p].placeholder = pack[pk];
    }
    var arElems = document.querySelectorAll('[data-i18n-aria-label]');
    for (var a = 0; a < arElems.length; a++) {
      var ak = arElems[a].getAttribute('data-i18n-aria-label');
      if (ak && pack[ak] !== undefined)
        arElems[a].setAttribute('aria-label', pack[ak]);
    }
  };

  A.i18n = function (key) {
    var ci = S.get('cachedI18n');
    if (!A.i18nPackLooksValid(ci) && !I18N_RELOADING) {
      var loc = ci && ci._locale === 'en' ? 'en' : 'es';
      A.loadClientI18nPack(loc);
    }
    ci = S.get('cachedI18n');
    return (ci && ci[key]) || key;
  };

  A.i18nFmt = function (key, params) {
    var ci = S.get('cachedI18n');
    var tpl = (ci && ci[key]) || key;
    if (!params) return tpl;
    return tpl.replace(/\{(\w+)\}/g, function (_, k) {
      return params[k] !== undefined ? params[k] : '{' + k + '}';
    });
  };

  /** @param {Object<string, string>|null|undefined} pack */
  A.i18nPackLooksValid = function (pack) {
    if (!pack || typeof pack !== 'object') return false;
    if (typeof pack._locale !== 'string') return false;
    if (!pack.app_title || !pack.kg_loader_step_fmt) return false;
    var count = 0;
    var k;
    for (k in pack) {
      if (Object.prototype.hasOwnProperty.call(pack, k) && k !== '_locale') count++;
    }
    return count >= 400;
  };

  /**
   * Descarga el pack en partes desde el servidor.
   * @param {'es'|'en'} loc
   * @param {{silent?:boolean,attempt?:number,onDone?:function(Object,string),onFail?:function(*)}} opts
   */
  function i18nFetchPackFromServer_(loc, opts) {
    var o = opts || {};
    var silent = !!o.silent;
    var attempt = Number(o.attempt) || 0;

    function finishOk(merged, revision) {
      I18N_RELOADING = false;
      i18nClearLoadTimeout_();
      if (revision) i18nWriteLocalPack_(loc, revision, merged);
      A.applyClientI18n(merged);
      i18nFlushReadyWaiters_();
      if (typeof o.onDone === 'function') o.onDone(merged, revision || '');
    }

    function finishFail(err) {
      I18N_RELOADING = false;
      i18nClearLoadTimeout_();
      if (typeof o.onFail === 'function') o.onFail(err);
      i18nFlushReadyWaiters_();
    }

    function loadOnce_(tryNo) {
      google.script.run
        .withSuccessHandler(function (meta) {
          var parts = meta && meta.parts ? Number(meta.parts) : 0;
          var revision = meta && meta.revision ? String(meta.revision) : '';
          if (!parts || parts < 1) {
            if (tryNo < 1) {
              loadOnce_(tryNo + 1);
              return;
            }
            finishFail(new Error('i18n_meta_invalid'));
            return;
          }
          /** @type {Object<string, string>} */
          var merged = { _locale: loc };
          var nextPart = 0;

          function loadPart() {
            if (nextPart >= parts) {
              if (!A.i18nPackLooksValid(merged)) {
                if (tryNo < 1) {
                  loadOnce_(tryNo + 1);
                  return;
                }
                finishFail(new Error('i18n_merge_invalid'));
                return;
              }
              if (!silent && A.setStartupLoaderI18nProgress) {
                A.setStartupLoaderI18nProgress(3, i18nStartupSub_(loc, 3));
              }
              finishOk(merged, revision);
              return;
            }
            var partIdx = nextPart;
            nextPart++;
            if (!silent && A.setStartupLoaderI18nProgress) {
              A.setStartupLoaderI18nProgress(
                partIdx + 1,
                i18nStartupSub_(loc, partIdx + 1),
              );
            }
            google.script.run
              .withSuccessHandler(function (chunk) {
                if (chunk && typeof chunk === 'object') {
                  var ck;
                  for (ck in chunk) {
                    if (Object.prototype.hasOwnProperty.call(chunk, ck)) merged[ck] = chunk[ck];
                  }
                }
                loadPart();
              })
              .withFailureHandler(function (err) {
                if (tryNo < 1) {
                  loadOnce_(tryNo + 1);
                  return;
                }
                finishFail(err);
              })
              .getI18nPackPart(loc, partIdx);
          }

          loadPart();
        })
        .withFailureHandler(function (err) {
          if (tryNo < 1) {
            loadOnce_(tryNo + 1);
            return;
          }
          finishFail(err);
        })
        .getI18nPackMeta(loc);
    }

    loadOnce_(attempt);
  }

  /**
   * Valida la revisión en servidor; si cambió, recarga el pack en silencio.
   * @param {'es'|'en'} loc
   */
  function i18nRefreshPackIfStale_(loc) {
    var cached = i18nReadLocalPack_(loc);
    google.script.run
      .withSuccessHandler(function (meta) {
        var revision = meta && meta.revision ? String(meta.revision) : '';
        if (!revision) return;
        if (cached && cached.revision === revision) return;
        if (I18N_RELOADING) return;
        I18N_RELOADING = true;
        i18nFetchPackFromServer_(loc, {
          silent: true,
          attempt: 0,
          onDone: function (merged, rev) {
            i18nWriteLocalPack_(loc, rev || revision, merged);
          },
          onFail: function () {},
        });
      })
      .withFailureHandler(function () {})
      .getI18nPackMeta(loc);
  }

  /**
   * Carga el pack i18n en partes (<60 KB por RPC de google.script.run).
   * Usa localStorage entre recargas; solo 1 RPC liviano si la caché sigue vigente.
   * @param {'es'|'en'} locale
   * @param {function(Object)=} onDone
   * @param {function(*)=} onFail
   * @param {{force?:boolean,silent?:boolean}=} opts
   */
  A.loadClientI18nPack = function (locale, onDone, onFail, opts) {
    var loc = i18nResolveLocale_(locale);
    var options = opts || {};
    var force = !!options.force;

    if (I18N_RELOADING) {
      if (typeof onDone === 'function') {
        A.whenClientI18nReady(onDone, loc);
      }
      return;
    }

    if (!force && !i18nShouldBypassLocalCache_()) {
      var cached = i18nReadLocalPack_(loc);
      if (cached && A.i18nPackLooksValid(cached.pack) && cached.pack._locale === loc) {
        A.applyClientI18n(cached.pack);
        i18nFlushReadyWaiters_();
        if (typeof onDone === 'function') onDone(cached.pack);
        i18nRefreshPackIfStale_(loc);
        return;
      }
    }

    I18N_RELOADING = true;
    var silent = !!options.silent;
    if (!silent && A.showStartupLoader) {
      A.showStartupLoader(
        i18nStartupMessage_('app_startup_i18n', 'Cargando textos…', 'Loading labels…'),
        { variant: 'i18n', subtitle: i18nStartupSub_(loc, 0) },
      );
    }
    if (!silent && A.setStartupLoaderI18nProgress) {
      A.setStartupLoaderI18nProgress(0, i18nStartupSub_(loc, 0));
    }
    i18nClearLoadTimeout_();
    i18nLoadTimeoutId = setTimeout(function () {
      if (!I18N_RELOADING) return;
      I18N_RELOADING = false;
      i18nClearLoadTimeout_();
      if (typeof onFail === 'function') onFail(new Error('i18n_timeout'));
      i18nFlushReadyWaiters_();
    }, I18N_LOAD_TIMEOUT_MS);

    i18nFetchPackFromServer_(loc, {
      silent: silent,
      attempt: 0,
      onDone: function (merged) {
        if (typeof onDone === 'function') onDone(merged);
      },
      onFail: onFail,
    });
  };

  /** Borra la caché local de textos (p. ej. tras ?i18n_refresh=1). */
  A.clearClientI18nCache = function (locale) {
    i18nClearLocalPack_(locale);
  };

  /**
   * Ejecuta callback cuando el pack i18n está completo y aplicado.
   * @param {function()=} onReady
   * @param {'es'|'en'=} locale
   */
  A.whenClientI18nReady = function (onReady, locale) {
    if (typeof onReady !== 'function') return;
    var loc = i18nResolveLocale_(locale || i18nPreferredLocale_());
    var ci = S.get('cachedI18n');
    if (A.i18nPackLooksValid(ci) && ci._locale === loc) {
      onReady();
      i18nRefreshPackIfStale_(loc);
      return;
    }
    I18N_READY_WAITERS.push(onReady);
    if (!I18N_RELOADING) {
      A.loadClientI18nPack(loc);
    }
  };

  /**
   * Garantiza pack i18n válido antes de pintar textos dinámicos.
   * @param {'es'|'en'} locale
   * @param {function()=} onReady
   */
  A.ensureClientI18n = function (locale, onReady) {
    A.whenClientI18nReady(onReady, locale);
  };

  /** @type {Object<string, string>} */
  var SERVER_ERROR_I18N = {
    ERR_DRIVE_ROOT_NOT_CONFIGURED: 'err_drive_root_not_configured',
    ERR_SALESFORCE_SHEET_NOT_CONFIGURED: 'err_salesforce_sheet_not_configured',
    ERR_SCRIPTAPP_SCOPE: 'err_scriptapp_scope',
    ERR_SUPABASE_NOT_CONFIGURED: 'err_supabase_not_configured',
    ERR_SUPABASE_SHEETS_DISABLED: 'err_supabase_sheets_disabled',
    ERR_ROLE_SUPABASE: 'err_role_supabase',
    ERR_KG_LIMITS_INVALID: 'err_kg_limits_invalid',
    ERR_CONTENT_REPAIR_DRIVE_PROJECT_ONLY: 'err_contents_repair_drive_project_only',
    ERR_CONTENT_REPAIR_DRIVE_SUCCESS_CASE_ONLY: 'err_contents_repair_drive_project_only',
    ERR_CONTENT_REEXTRACT_NO_FILE: 'err_contents_reextract_no_file',
    ERR_CONTENT_REEXTRACT_FILE_MISSING: 'err_contents_reextract_file_missing',
    ERR_CONTENT_DUPLICATE_SIMILAR: 'err_content_duplicate_similar',
    ERR_PROPOSAL_RFP_NOT_CATALOG: 'contents_err_proposal_rfp_not_catalog',
    ERR_PROPOSAL_STUDIO_REQUIRED: 'contents_err_proposal_studio_required',
    ERR_PROPOSAL_OFFERING_REQUIRED: 'contents_err_proposal_offering_required',
    ERR_ACCESS_REQUEST_NOT_VISITOR: 'access_request_err_not_visitor',
    ERR_ACCESS_REQUEST_INVALID_ROLE: 'admin_users_err_role',
    ERR_ACCESS_REQUEST_REASON_REQUIRED: 'access_request_err_reason',
    ERR_ACCESS_REQUEST_REASON_TOO_LONG: 'access_request_err_reason_long',
    ERR_ACCESS_REQUEST_ALREADY_PENDING: 'access_request_err_pending',
    ERR_ACCESS_REQUEST_NO_SESSION: 'err_login_session',
    ERR_ACCESS_REQUEST_ID_REQUIRED: 'err_generic',
    ERR_ADMIN_USERS_BULK_NO_EMAILS: 'admin_users_bulk_err_no_emails',
    ERR_ADMIN_USERS_BULK_TOO_MANY: 'admin_users_bulk_err_too_many',
    ERR_CLIENT_ID_INVALID: 'err_client_id_invalid',
    ERR_CHAT_EXPORT_EMPTY: 'err_chat_export_empty',
    ERR_CHAT_EXPORT_PDF: 'err_chat_export_pdf',
    ERR_PDF_NOT_AVAILABLE: 'err_pdf_not_available',
    ERR_PDF_DRIVE: 'err_pdf_drive',
    ERR_ADMIN_AGENT_API_MODEL_INVALID: 'err_admin_agent_api_model_invalid',
    ERR_ADMIN_AGENT_API_STRATEGY_INVALID: 'err_admin_agent_api_strategy_invalid',
  };

  A.extractServerErrorCode = function (err) {
    var raw = err && err.message != null ? String(err.message).trim() : '';
    if (!raw) return '';
    var head = raw.match(/^ERR_[A-Z0-9_]+/);
    if (head) return head[0];
    var idx = raw.indexOf('ERR_');
    if (idx < 0) return '';
    var rest = raw.slice(idx);
    var cut = rest.search(/[\s:]/);
    return cut > 0 ? rest.slice(0, cut) : rest;
  };

  /**
   * Mensaje legible para errores de google.script.run (códigos ERR_* → i18n).
   * @param {*} err
   * @param {string=} fallbackKey
   * @return {string}
   */
  A.serverErrorMessage = function (err, fallbackKey) {
    var raw = err && err.message != null ? String(err.message).trim() : '';
    var code = A.extractServerErrorCode(err);
    if (code) {
      if (code.indexOf('ERR_SUPABASE_HTTP_') === 0) return A.i18n('err_supabase_http');
      if (code.indexOf('ERR_SUPABASE_JSON') === 0) return A.i18n('err_supabase_json');
      var key = SERVER_ERROR_I18N[code];
      if (key) return A.i18n(key);
      var colon = raw.indexOf(': ');
      if (colon > 0 && raw.indexOf(code) === 0) {
        var detailMsg = raw.slice(colon + 2).trim();
        if (detailMsg) return detailMsg;
      }
      return A.i18nFmt('err_server_code', { code: code });
    }
    if (raw) return raw;
    return A.i18n(fallbackKey || 'err_generic');
  };

  /**
   * Registra error en consola, cierra modal opcional, toast y callback de estado.
   * @param {*} err
   * @param {{scope?:string,fallbackKey?:string,hideModal?:boolean,toast?:boolean,setStatus?:function(string,boolean)}} opts
   * @return {string}
   */
  A.reportRpcError = function (err, opts) {
    var o = opts || {};
    var scope = o.scope || 'rpc';
    var raw = err && err.message != null ? String(err.message).trim() : '';
    var msg = A.serverErrorMessage(err, o.fallbackKey);
    if (window.console && console.error) {
      console.error('[Aviators RPC]', scope, raw || err);
    }
    if (o.hideModal !== false && A.hideBlockingModal) A.hideBlockingModal();
    if (o.modal && A.showErrorDialog) {
      A.showErrorDialog({
        title: o.title || A.i18n('error_dialog_title'),
        message: msg,
        detail: raw && raw !== msg ? raw : '',
      });
      if (o.toast === undefined) o.toast = false;
    }
    if (o.toast !== false && A.toast) A.toast.error(msg);
    if (typeof o.setStatus === 'function') o.setStatus(msg, true);
    return msg;
  };

  if (i18nShouldBypassLocalCache_()) {
    i18nClearLocalPack_();
  }
  i18nTryHydrateFromLocalStorage_();
  i18nSanitizeCachedPack_();
})(window.Aviators);
</script>
